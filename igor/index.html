lem.",["I have solved","have I solved","I solved"],1,"После Never в начале — инверсия: have I."],["Not only ___ the match, but he also scored three goals.",["did he play","he played","he did play"],0,"Not only + did + подлежащее."],["Hardly had we sat down ___ the lights went out.",["than","then","when"],2,"Hardly … when."],["No sooner had she finished her speech ___ everyone started clapping.",["than","when","that"],0,"No sooner … than."],["Rarely ___ students get full marks on this test.",["are","do","have"],1,"Rarely + do + подлежащее + глагол (Present Simple)."],["Only after the exam ___ how easy it had been.",["I realised","did I realise","I did realise"],1,"Only after … + инверсия: did I realise."],["Under no circumstances ___ leave the lab without permission.",["you should","you must","should you"],2,"Under no circumstances + should you."],["Seldom ___ such kindness from strangers.",["have I experienced","I have experienced","I experienced"],0,"Seldom в начале — инверсия."],["Not only is she a great singer, but she ___ writes her own songs.",["too","as well as","also"],2,"Not only…, but … also."],["Scarcely ___ the door when the dog ran out.",["I had opened","had I opened","I opened"],1,"Scarcely + had + подлежащее + V3."],["Little ___ that his project would win.",["did he know","he knew","knew he"],0,"Little did he know — он и не подозревал."],["At no time ___ the students allowed to use phones during the test.",["were","they were","did"],0,"At no time + инверсия с be: were the students."],["Never before ___ so many people at our lyceum's concert.",["there had been","had there been","there was"],1,"Never before + had there been."],["Only then ___ understand what the teacher meant.",["I did","I","did I"],2,"Only then + did I."]],"tr":[["Никогда я не был так счастлив.","Never have I been",["Never have I been so happy","Never have I been this happy","Never in my life have I been so happy"]],["Он не только сдал экзамен, но и получил лучший результат.","Not only did he…, but he also",["Not only did he pass the exam, but he also got the best result","Not only did he pass the exam, but he also got the best score","Not only did he pass the exam but he also got the best result","Not only did he pass the exam, but he also got the highest score"]],["Едва я заснул, как зазвонил будильник.","Hardly had I … when",["Hardly had I fallen asleep when the alarm went off","Hardly had I fallen asleep when the alarm rang","Hardly had I fallen asleep when the alarm clock rang","Scarcely had I fallen asleep when the alarm went off"]],["Только тогда я понял свою ошибку.","Only then did I",["Only then did I understand my mistake","Only then did I realise my mistake","Only then did I realize my mistake"]]]},{"t":"Причастные обороты: Having finished…, Feeling tired…","l":"B2","rule":"Причастный оборот сокращает придаточное, если подлежащее одно и то же. V-ing — одновременное действие или причина (Feeling tired, I went to bed). Having + V3 — действие, которое произошло раньше (Having finished the test, I left the room). V3 — пассивное значение (Written in 1840, the book is still popular). Важно: подлежащее главного предложения должно выполнять действие оборота.","ex":[["[Feeling] nervous, Igor took a deep breath before the exam.","Волнуясь, Игорь глубоко вдохнул перед экзаменом."],["[Having finished] his homework, he went out to play football.","Закончив домашнее задание, он пошёл играть в футбол."],["[Built] in 1897, the theatre is a symbol of Odesa.","Построенный в 1897 году, театр — символ Одессы."],["[Not knowing] the way, we used a map app.","Не зная дороги, мы воспользовались приложением с картой."],["The boy [sitting] next to me is from Lviv.","Мальчик, сидящий рядом со мной, из Львова."]],"quiz":[["___ the test, Anna handed in her paper and left.",["Finished","Having finished","Being finished"],1,"Сначала закончила, потом сдала — Having + V3."],["___ in 1991, the company now has offices in ten countries.",["Founding","Having founded","Founded"],2,"Компанию основали (пассив) — V3."],["___ hungry, I made myself a sandwich.",["Feeling","Felt","Having felt"],0,"Причина, одновременное состояние — V-ing."],["Not ___ what to say, he just smiled.",["known","to know","knowing"],2,"Not + V-ing — не зная."],["The girl ___ the red jacket is my cousin.",["wearing","worn","wears"],0,"Активное значение — V-ing."],["___ by millions of people, the video became viral.",["Watching","Watched","Having watched"],1,"Видео смотрели (пассив) — V3."],["___ the email, she realised she had made a mistake.",["Sent","Having sent","Being sent"],1,"Сначала отправила — Having sent."],["The laptops ___ in this lab are quite old.",["used","using","use"],0,"Ноутбуки, которые используются — V3."],["___ along the river, we saw a family of ducks.",["Walked","Having walked","Walking"],2,"Одновременное действие — V-ing."],["___ three times, the student finally passed the driving test.",["Having failed","Failing","Failed"],0,"Провалил раньше — Having + V3."],["___ in simple English, the book is perfect for beginners.",["Writing","Written","Having written"],1,"Книга написана — V3."],["Students ___ to join the trip must sign up by Friday.",["wished","wishing","wish"],1,"Студенты, которые хотят — V-ing."],["___ his keys, Max had to wait outside for his parents.",["Lost","Losing","Having lost"],2,"Потерял раньше, поэтому ждал — Having lost."],["___ from space, the Earth looks blue.",["Seen","Seeing","Having seen"],0,"Землю видят (пассив) — V3."]],"tr":[["Закончив тренировку, мы пошли домой.","Having finished",["Having finished the training, we went home","Having finished training, we went home","Having finished the training session, we went home","Having finished our training, we went home"]],["Чувствуя усталость, она рано легла спать.","Feeling tired",["Feeling tired, she went to bed early"]],["Не зная ответа, я промолчал.","Not knowing",["Not knowing the answer, I said nothing","Not knowing the answer, I kept silent","Not knowing the answer, I stayed silent","Not knowing the answer, I kept quiet"]],["Написанный в 1840 году, «Кобзарь» до сих пор популярен.","Written in",["Written in 1840, Kobzar is still popular","Written in 1840, the Kobzar is still popular"]]]},{"t":"Relative clauses B2: defining и non-defining, whom, whose","l":"B2","rule":"Defining (определительные) нужны, чтобы понять, о ком речь, — без запятых, можно that, а если слово — дополнение, местоимение можно опустить (The book (that) I bought). Non-defining дают дополнительную информацию — с запятыми, нельзя that и нельзя опускать местоимение (My sister, who lives in Kyiv, …). Whom — официальное who в роли дополнения, особенно после предлога (to whom). Whose — чей. Which может относиться ко всему предложению: He passed, which surprised us.","ex":[["My physics teacher, [who] has won many awards, is very kind.","Мой учитель физики, получивший много наград, очень добрый."],["The laptop [(that)] I bought last year is already slow.","Ноутбук, который я купил в прошлом году, уже медленный."],["The scientist [whose] invention changed the world was from Ukraine.","Учёный, чьё изобретение изменило мир, был из Украины."],["The person [to whom] I spoke was very helpful.","Человек, с которым я говорил, очень помог."],["We won the final, [which] made our coach very happy.","Мы выиграли финал, что очень обрадовало тренера."]],"quiz":[["Kyiv, ___ is the capital of Ukraine, has a beautiful metro.",["that","what","which"],2,"Non-defining (с запятыми) — that нельзя."],["The boy ___ bike was stolen called the police.",["who","whose","which"],1,"Чей велосипед — whose."],["The woman to ___ I gave the letter was the director.",["whom","who","that"],0,"После предлога — whom."],["He forgot my birthday, ___ really upset me.",["which","what","that"],0,"Which относится ко всему предложению."],["My grandmother, ___ is 85, still uses a smartphone.",["that","who","whom"],1,"Non-defining, подлежащее — who."],["The film ___ we watched yesterday was boring.",["what","whose","that"],2,"Defining о вещи — that (или which, или без местоимения)."],["This is the lab in ___ the experiment took place.",["that","which","where"],1,"После предлога — which (не that и не where)."],["Taras Shevchenko, ___ poems are known to every Ukrainian, was also a painter.",["who","which","whose"],2,"Чьи стихи — whose."],["The students, ___ had prepared well, all passed.",["who","that","which"],0,"Non-defining о людях — who."],["Is this the phone ___ you were talking about?",["what","who","that"],2,"Defining о вещи — that/which."],["The coach, ___ everyone respects, is leaving the club.",["whom","whose","which"],0,"Дополнение о человеке в non-defining — whom (или who)."],["I have two brothers, both of ___ live in Poland.",["who","whom","them"],1,"Both of whom — после предлога whom."],["We stayed in a hotel ___ windows faced the sea.",["which","whose","where"],1,"Окна отеля — whose."],["Everything ___ he said was true.",["that","what","which of"],0,"После everything — that."]],"tr":[["Мой друг, который живёт во Львове, пишет код.","non-defining, who",["My friend, who lives in Lviv, writes code","My friend, who lives in Lviv, codes","My friend, who lives in Lviv, writes programs"]],["Это девочка, чей брат выиграл олимпиаду.","whose",["This is the girl whose brother won the olympiad","That is the girl whose brother won the olympiad"]],["Он сдал экзамен, что всех удивило.","which",["He passed the exam, which surprised everyone","He passed the exam, which surprised everybody"]],["Человек, которому я написал, не ответил.","whom / who",["The person whom I wrote to did not answer","The person to whom I wrote did not answer","The person who I wrote to did not answer","The person I wrote to did not answer","The person whom I wrote to did not reply","The person to whom I wrote did not reply","The person who I wrote to did not reply","The person I wrote to did not reply"]]]},{"t":"Артикли B2: нулевой артикль, the + прилагательное, уникальные объекты","l":"B2","rule":"Без артикля: общие понятия во множественном числе и неисчисляемые (Science is fun, Dogs are loyal), названия стран без слов republic/kingdom, языки, приёмы пищи, go to school/bed/hospital (по назначению). The — с уникальными объектами (the sun, the internet), реками, морями, горными цепями, странами-союзами (the USA, the UK), музыкальными инструментами (play the guitar). The + прилагательное = группа людей: the rich, the young, the elderly.","ex":[["[Ø] Life is difficult without [the] internet.","Жизнь трудна без интернета."],["[The] elderly often need help with technology.","Пожилые люди часто нуждаются в помощи с технологиями."],["The Dnipro flows into [the] Black Sea.","Днепр впадает в Чёрное море."],["My dad went to [Ø] hospital for an operation.","Папа лёг в больницу на операцию."],["She plays [the] piano, and I play [Ø] chess.","Она играет на пианино, а я — в шахматы."]],"quiz":[["___ Carpathians are the highest mountains in Ukraine.",["A","—","The"],2,"Горные цепи — с the."],["The government should do more to help ___ poor.",["the","a","—"],0,"The + прилагательное — группа людей."],["___ physics is my favourite subject.",["The","—","A"],1,"Школьные предметы — без артикля."],["We usually have ___ dinner at seven.",["a","—","the"],1,"Приёмы пищи в общем — без артикля."],["My friend is studying in ___ United Kingdom.",["—","a","the"],2,"United Kingdom — с the."],["___ water boils at 100 degrees Celsius.",["—","The","A"],0,"Неисчисляемое в общем смысле — без артикля."],["Can you play ___ violin?",["a","—","the"],2,"Музыкальные инструменты — с the."],["The criminal was sent to ___ prison for two years.",["a","—","the"],1,"Prison по назначению — без артикля."],["___ moon goes around the Earth.",["The","A","—"],0,"Уникальный объект — the."],["She speaks ___ Italian fluently.",["—","the","an"],0,"Языки — без артикля."],["___ Danube flows through ten countries.",["A","The","—"],1,"Реки — с the."],["What ___ amazing goal!",["the","—","an"],2,"What + исчисляемое в ед.ч. — a/an."],["Mum went to ___ school to talk to my teacher.",["—","the","a"],1,"Не по назначению (не учиться) — the school."],["I think ___ smartphones make teenagers less active.",["the","a","—"],2,"Общее утверждение во множественном числе — без артикля."]],"tr":[["Молодые люди часто проводят много времени в интернете.","the young, the internet",["The young often spend a lot of time on the internet","Young people often spend a lot of time on the internet","The young often spend much time on the internet"]],["Я играю на гитаре, а мой брат — в баскетбол.","the guitar / basketball",["I play the guitar, and my brother plays basketball","I play the guitar and my brother plays basketball"]],["Солнце — это звезда.","the sun, a star",["The sun is a star","The Sun is a star"]],["Мой дедушка в больнице.","in hospital",["My grandfather is in hospital","My grandfather is in the hospital","My grandpa is in hospital","My grandpa is in the hospital"]]]},{"t":"Герундий после предлогов и фразовых глаголов","l":"B1","rule":"После любого предлога глагол стоит в форме -ing: interested in learning, good at solving, before leaving, without saying. Особое внимание — to как предлог (а не частица): look forward to meeting, be used to getting up, object to doing, when it comes to coding. После фразовых глаголов тоже -ing: give up smoking, carry on working, put off doing.","ex":[["I'm interested [in learning] robotics.","Мне интересно изучать робототехнику."],["She left [without saying] goodbye.","Она ушла, не попрощавшись."],["We're looking forward [to meeting] you.","Мы с нетерпением ждём встречи с тобой."],["Stop [putting off doing] your homework!","Перестань откладывать домашнюю работу!"],["[Instead of watching] TV, let's go for a walk.","Вместо того чтобы смотреть телевизор, давай пойдём гулять."]],"quiz":[["I'm really good at ___ maths problems.",["solving","solve","to solve"],0,"После предлога at — -ing."],["Thank you for ___ me with my project.",["help","to help","helping"],2,"После for — -ing."],["I'm looking forward to ___ the results.",["getting","get","got"],0,"Look forward to — to здесь предлог: -ing."],["He gave up ___ after two months.",["practise","practising","to practise"],1,"После фразового глагола give up — -ing."],["Before ___ the house, check that the windows are closed.",["leave","leaving","to leave"],1,"После before — -ing."],["She's afraid of ___ in public.",["speaking","speak","to speaking"],0,"После of — -ing."],["Max is used to ___ up at 6 am for training.",["get","got","getting"],2,"Be used to + -ing."],["How about ___ to the cinema tonight?",["going","go","to go"],0,"How about + -ing."],["The teacher objected to ___ phones in class.",["use","using","used"],1,"Object to + -ing."],["Carry on ___ — you're doing great!",["run","running","to run"],1,"Carry on + -ing."],["Are you capable of ___ this alone?",["do","to do","doing"],2,"Capable of + -ing."],["Don't put off ___ the dentist.",["seeing","to see","see"],0,"Put off + -ing."],["He apologised for ___ late.",["be","to be","being"],2,"Apologise for + -ing."],["When it comes to ___, Igor is the best in our class.",["program","programming","programmed"],1,"When it comes to + -ing."]],"tr":[["Я с нетерпением жду поездки во Львов.","look forward to + -ing",["I am looking forward to going to Lviv","I look forward to going to Lviv","I am looking forward to travelling to Lviv","I am looking forward to the trip to Lviv","I am looking forward to visiting Lviv","I am looking forward to traveling to Lviv"]],["Он ушёл, ничего не сказав.","without + -ing",["He left without saying anything","He left without saying a word"]],["Она бросила есть сладкое.","give up + -ing",["She gave up eating sweets","She has given up eating sweets"]],["Мне интересно изучать космос.","interested in",["I am interested in studying space","I am interested in learning about space","I am interested in exploring space","I am interested in studying the universe"]]]},{"t":"Would rather, had better, it's time","l":"B2","rule":"Would rather + глагол без to — предпочтение (I'd rather stay at home); сравнение — would rather … than. Had better + глагол без to — настойчивый совет или предупреждение (You'd better hurry, or you'll miss the bus); отрицание — had better not. It's time + to + глагол — пора что-то сделать; It's (high/about) time + подлежащее + Past Simple — давно пора, кто-то опаздывает (It's time you went to bed).","ex":[["I'd rather [walk] than take the bus.","Я лучше пройдусь пешком, чем поеду на автобусе."],["You'd better [not be] late for the exam.","Тебе лучше не опаздывать на экзамен."],["It's time [to go] — the lesson starts in five minutes.","Пора идти — урок начинается через пять минут."],["It's high time you [started] revising for the NMT.","Тебе давно пора начать готовиться к НМТ."],["Would you rather [play] chess or video games?","Ты бы предпочёл играть в шахматы или в видеоигры?"]],"quiz":[["I'd rather ___ at home tonight.",["stay","to stay","staying"],0,"Would rather + глагол без to."],["You'd better ___ your coat — it's freezing.",["take","to take","taking"],0,"Had better + глагол без to."],["It's high time you ___ your room!",["tidy","tidied","will tidy"],1,"It's high time + подлежащее + Past Simple."],["We'd better ___ make noise — the baby is sleeping.",["don't","not to","not"],2,"Отрицание — had better not."],["It's time ___ home, kids.",["going","to go","went"],1,"It's time + to + глагол (без подлежащего)."],["I'd rather walk ___ wait for the bus in the rain.",["then","that","than"],2,"Would rather … than."],["You ___ apologise to her, or she'll be upset.",["had better","would rather","would better"],0,"Совет с предупреждением — had better."],["It's about time the government ___ something about the roads.",["does","will do","did"],2,"It's about time + Past Simple."],["Would you rather ___ physics or chemistry?",["study","to study","studying"],0,"Would rather + инфинитив без to."],["Igor would rather not ___ about the test result.",["to talk","talk","talking"],1,"Would rather not + глагол."],["It's late. You'd better ___ to bed.",["went","go","going"],1,"Had better + глагол без to."],["It's time we ___ a new laptop — this one is so slow.",["bought","buy","will buy"],0,"It's time + we + Past Simple."],["I ___ have pizza than sushi.",["had better","prefer","would rather"],2,"Rather … than — would rather."],["You ___ not touch that wire — it's dangerous!",["had better","would rather","had rather"],0,"Предупреждение — had better not."]],"tr":[["Я бы лучше посмотрел фильм дома.","would rather + V",["I would rather watch a film at home","I would rather watch a movie at home","I would rather watch the film at home"]],["Тебе лучше позвонить маме.","had better",["You had better call your mum","You had better call your mom","You had better call Mum","You had better phone your mum","You had better call your mother"]],["Тебе давно пора начать учить слова.","It is high time + Past",["It is high time you started learning words","It is high time you started learning the words","It is high time you began learning words","It is high time you started to learn words"]],["Пора идти домой.","It is time to",["It is time to go home"]]]},{"t":"Нереальное прошлое: as if, suppose, I'd rather you…","l":"B2","rule":"После некоторых выражений прошедшее время передаёт нереальность в настоящем. As if / as though + Past Simple — как будто (He talks as if he knew everything); + Past Perfect — как будто что-то было раньше (She looked as if she had seen a ghost). Suppose / supposing + Past Simple — а что если (Suppose you won a million?). I'd rather you + Past Simple — я бы предпочёл, чтобы ТЫ… (I'd rather you didn't tell anyone).","ex":[["He acts [as if] he [were] the boss.","Он ведёт себя так, будто он начальник."],["You look [as if] you [had run] a marathon.","Ты выглядишь так, будто пробежал марафон."],["[Suppose] you [found] a wallet in the street — what would you do?","Допустим, ты нашёл кошелёк на улице — что бы ты сделал?"],["I'd rather you [didn't use] my laptop.","Я бы предпочёл, чтобы ты не пользовался моим ноутбуком."],["I'd rather you [had told] me the truth.","Лучше бы ты сказал мне правду."]],"quiz":[["He talks as if he ___ everything about computers.",["will know","knew","has known"],1,"Нереально сейчас — as if + Past Simple."],["I'd rather you ___ the window — it's cold.",["don't open","didn't open","not open"],1,"I'd rather you + Past Simple."],["Suppose you ___ the president. What would you change?",["are","will be","were"],2,"Suppose + Past Simple (were) — воображаемая ситуация."],["She looked as if she ___ for days.",["hadn't slept","doesn't sleep","won't sleep"],0,"Как будто раньше (давно) не спала — Past Perfect."],["I'd rather you ___ me earlier. Now it's too late.",["told","tell","had told"],2,"Сожаление о прошлом — I'd rather you + Past Perfect."],["Why are you looking at me as if I ___ something wrong?",["do","had done","will do"],1,"Как будто я уже сделал — Past Perfect."],["Supposing your team ___ the tournament — would you celebrate?",["won","will win","has won"],0,"Supposing + Past Simple."],["I'd rather we ___ by train. Planes make me nervous.",["went","go","will go"],0,"I'd rather we + Past Simple."],["He spends money as though he ___ a millionaire.",["is being","were","will be"],1,"Нереально — as though + were."],["My parents would rather I ___ to a university in Ukraine.",["go","will go","went"],2,"Would rather + другой человек + Past Simple."],["Don't treat me as if I ___ a little child!",["will be","were","have been"],1,"Нереально — as if + were."],["Suppose you ___ the bus — how would you get home?",["miss","will miss","missed"],2,"Suppose + Past Simple."],["I'd rather you ___ my brother about the party.",["didn't tell","don't tell","won't tell"],0,"I'd rather you + Past Simple."],["She behaves as if nothing ___. But we all know about the argument.",["happens","will happen","had happened"],2,"Как будто ничего не случилось (раньше) — Past Perfect."]],"tr":[["Он ведёт себя так, будто он здесь главный.","as if + were",["He behaves as if he were the boss here","He acts as if he were the boss here","He behaves as if he was the boss here","He acts as if he was the boss here","He behaves as if he were in charge here","He acts as if he were in charge here"]],["Я бы предпочёл, чтобы ты не опаздывал.","I would rather you didn't",["I would rather you were not late","I would rather you did not come late","I would rather you did not arrive late","I would rather you weren't late"]],["Допустим, ты выиграл олимпиаду. Что бы ты почувствовал?","Suppose + Past",["Suppose you won the olympiad. What would you feel","Suppose you won the olympiad. How would you feel","Supposing you won the olympiad. How would you feel","Supposing you won the olympiad. What would you feel"]],["Ты выглядишь так, будто увидел привидение.","as if + had seen",["You look as if you had seen a ghost","You look as though you had seen a ghost","You look like you have seen a ghost","You look as if you have seen a ghost"]]]},{"t":"Эмфаза: What I need is…, It was … that","l":"B2","rule":"Cleft sentences (расщеплённые предложения) выделяют главное. It is/was + выделенная часть + that/who: It was Max who broke the window (именно Макс). What + подлежащее + глагол + is/was: What I need is a break (то, что мне нужно, — отдых). Для действия: What he did was (to) call the police. Также: All I want is…, The thing that… is…, The reason why … is that…","ex":[["[It was] my grandfather [who] taught me chess.","Именно дедушка научил меня шахматам."],["[What I love about] physics [is] the experiments.","Что я люблю в физике — так это эксперименты."],["[It was] in Kharkiv [that] I first saw a robot.","Именно в Харькове я впервые увидел робота."],["[All I want is] a good night's sleep.","Всё, чего я хочу, — это хорошо выспаться."],["[What she did was] send an email to the director.","Что она сделала — отправила письмо директору."]],"quiz":[["It was Anna ___ won the debate, not Ira.",["who","which","what"],0,"It was + человек + who/that."],["___ I need now is a cup of tea.",["That","What","Which"],1,"What I need is… — то, что мне нужно."],["It was in 2022 ___ we moved to Lviv.",["which","that","when it"],1,"It was + время/место + that."],["All I want ___ to pass the NMT.",["is","are","be"],0,"All I want is…"],["What he did ___ call his parents.",["did","has","was"],2,"What he did was + глагол."],["It ___ the noise that woke me up, not the alarm.",["was","were","did"],0,"It was … that (it — всегда was/is)."],["The thing ___ annoys me most is slow internet.",["what","that","who"],1,"The thing that…"],["___ was my sister who found the lost cat.",["She","It","There"],1,"It was … who — выделение."],["What surprised me ___ how easy the test was.",["were","did","was"],2,"What-clause как подлежащее — was."],["The reason why I'm late ___ that the bus broke down.",["is","because","was because"],0,"The reason … is that (не because)."],["It's not the price ___ worries me, it's the quality.",["what","whom","that"],2,"It's not … that…"],["What we should do ___ ask the teacher for help.",["are","is","do"],1,"What we should do is…"],["___ I like about this city is its parks.",["What","Which","That"],0,"What I like about… is…"],["It was only when I got home ___ I noticed my phone was missing.",["that","when","which"],0,"It was only when … that…"]],"tr":[["Именно мой брат научил меня кататься на велосипеде.","It was … who",["It was my brother who taught me to ride a bike","It was my brother that taught me to ride a bike","It was my brother who taught me to ride a bicycle","It was my brother who taught me how to ride a bike"]],["Что мне нужно — так это новый ноутбук.","What I need is",["What I need is a new laptop"]],["Всё, чего я хочу, — это поспать.","All I want is",["All I want is to sleep","All I want is some sleep","All I want is to get some sleep"]],["Именно в Одессе я впервые увидел море.","It was in … that",["It was in Odesa that I first saw the sea","It was in Odesa that I saw the sea for the first time"]]]},{"t":"Связки B2: whereas, nevertheless, in spite of, so as to","l":"B2","rule":"Контраст: whereas / while (тогда как) соединяют два предложения; nevertheless / nonetheless (тем не менее) начинают новое предложение; in spite of / despite + существительное или -ing (in spite of the rain, despite being tired); even though + полное предложение. Цель: in order to / so as to + глагол (отрицание — so as not to, in order not to); so that + подлежащее + can/could. Добавление: moreover, furthermore, in addition. Результат: therefore, as a result, consequently.","ex":[["My brother loves maths, [whereas] I prefer history.","Мой брат любит математику, тогда как я предпочитаю историю."],["The task was hard. [Nevertheless], we solved it.","Задача была трудной. Тем не менее мы её решили."],["[In spite of] the rain, the match continued.","Несмотря на дождь, матч продолжился."],["I left early [so as not to] miss the train.","Я вышел рано, чтобы не опоздать на поезд."],["He trains every day [so that] he can win the championship.","Он тренируется каждый день, чтобы выиграть чемпионат."]],"quiz":[["___ being tired, he finished the race.",["Although","Despite","However"],1,"Despite + -ing."],["The test was difficult. ___, most students passed.",["Whereas","In spite of","Nevertheless"],2,"Начало нового предложения с контрастом — Nevertheless."],["I study in the mornings, ___ my friend prefers the evenings.",["despite","whereas","so as to"],1,"Сравнение двух людей — whereas."],["She whispered so as ___ wake the baby.",["to not do","don't","not to"],2,"So as not to + глагол."],["We left early in order ___ the traffic.",["to avoid","avoiding","avoid"],0,"In order to + глагол."],["In spite ___ the bad weather, we went hiking.",["—","that","of"],2,"In spite of + существительное."],["He saved money so ___ he could buy a new bike.",["that","as","to"],0,"So that + подлежащее + could."],["The app is free. ___, it has no adverts.",["Whereas","Moreover","Despite"],1,"Добавление — Moreover."],["It rained heavily. ___, the match was cancelled.",["Although","As a result","In spite of"],1,"Результат — As a result."],["___ he had trained hard, he didn't win.",["Even though","Despite","In spite of"],0,"Полное предложение после — Even though."],["The tickets were expensive. We bought them ___.",["nevertheless of","despite","anyway"],2,"В конце предложения — anyway."],["She took notes ___ she wouldn't forget anything.",["so that","in order to","so as to"],0,"Подлежащее + would → so that."],["Some people love cities, ___ others prefer the countryside.",["despite","while","therefore"],1,"Контраст двух групп — while."],["Despite ___ the rules, he still made mistakes.",["he knew","knowing","know"],1,"Despite + -ing."]],"tr":[["Несмотря на усталость, он продолжил работать.","Despite / In spite of + -ing",["Despite being tired, he continued working","In spite of being tired, he continued working","Despite being tired, he kept working","In spite of being tired, he kept working","Despite being tired, he continued to work","Despite his tiredness, he continued working","Despite being tired, he carried on working"]],["Я люблю зиму, тогда как моя сестра любит лето.","whereas",["I love winter, whereas my sister loves summer","I like winter, whereas my sister likes summer","I love winter whereas my sister loves summer"]],["Он вышел рано, чтобы не опоздать.","so as not to",["He left early so as not to be late","He left early in order not to be late","He went out early so as not to be late"]],["Было холодно. Тем не менее, мы пошли гулять.","Nevertheless",["It was cold. Nevertheless, we went for a walk","It was cold. Nevertheless we went for a walk","It was cold. Nevertheless, we went out for a walk"]]]},{"t":"Коллокации B2: make, do, take, get","l":"B2","rule":"Некоторые сочетания нужно просто запомнить. Make: make a decision, make progress, make an effort, make sense, make a difference, make a profit. Do: do research, do damage, do your best, do a favour, do harm. Take: take part, take a risk, take advantage of, take responsibility, take into account. Get: get a degree, get rid of, get in touch, get the chance, get on with someone.","ex":[["It's hard to [make a decision] about university.","Трудно принять решение об университете."],["Scientists [are doing research] on new batteries.","Учёные проводят исследования новых батарей."],["I want to [take part] in the robotics competition.","Я хочу принять участие в соревновании по робототехнике."],["We need to [get rid of] old cables.","Нам нужно избавиться от старых кабелей."],["Every small action can [make a difference].","Каждое маленькое действие может что-то изменить."]],"quiz":[["You're ___ great progress with your English!",["doing","taking","making"],2,"Make progress."],["Could you ___ me a favour and close the door?",["do","make","get"],0,"Do someone a favour."],["He decided to ___ a risk and start his own business.",["make","do","take"],2,"Take a risk."],["The storm ___ a lot of damage to the trees.",["made","did","took"],1,"Do damage."],["Your explanation doesn't ___ sense.",["make","do","take"],0,"Make sense."],["We should ___ advantage of the sunny weather.",["take","make","get"],0,"Take advantage of."],["Let's keep in touch. ___ in touch when you arrive.",["Make","Get","Do"],1,"Get in touch."],["She wants to ___ a degree in engineering.",["make","do","get"],2,"Get a degree."],["Just ___ your best — that's all that matters.",["make","do","take"],1,"Do your best."],["You have to ___ responsibility for your mistakes.",["make","get","take"],2,"Take responsibility."],["Our class ___ research on air pollution in our city.",["did","made","got"],0,"Do research."],["I always ___ on well with my classmates.",["make","take","get"],2,"Get on (well) with someone."],["You should ___ an effort to be on time.",["make","do","take"],0,"Make an effort."],["When you plan the trip, ___ the weather into account.",["make","take","do"],1,"Take into account."]],"tr":[["Я хочу принять участие в олимпиаде.","take part in",["I want to take part in the olympiad","I would like to take part in the olympiad"]],["Он принял важное решение.","make a decision",["He made an important decision","He has made an important decision"]],["Нам нужно избавиться от этих старых вещей.","get rid of",["We need to get rid of these old things","We have to get rid of these old things","We need to get rid of this old stuff"]],["Сделай мне одолжение.","do a favour",["Do me a favour","Do me a favor"]]]},{"t":"Словообразование B2: in-/im-/ir-/il-, -ise/-en, -ity, -ment","l":"B2","rule":"Отрицательные приставки: im- перед m/p (impossible, immature), il- перед l (illegal), ir- перед r (irregular), in- (incorrect), mis- — неправильно (misunderstand), over- — слишком (overestimate). Глаголы из прилагательных: -en (wide → widen, short → shorten), -ise/-ize (modern → modernise). Существительные: -ity (possible → possibility), -ment (develop → development), -ance/-ence (important → importance), -ship (friend → friendship).","ex":[["It's [impossible] to finish this in one day.","Невозможно закончить это за один день."],["Parking here is [illegal].","Парковаться здесь незаконно."],["They want to [widen] the road.","Они хотят расширить дорогу."],["Ukraine has a long [history] of scientific [achievement].","У Украины давняя история научных достижений."],["I think you [misunderstood] the question.","Думаю, ты неправильно понял вопрос."]],"quiz":[["It's ___ to copy someone's homework.",["unhonest","dishonest","inhonest"],1,"Honest → dishonest."],["Selling alcohol to teenagers is ___.",["illegal","unlegal","inlegal"],0,"Перед l — il-."],["'Go — went' is an ___ verb.",["unregular","inregular","irregular"],2,"Перед r — ir-."],["Don't be so ___! You're 14, not 4.",["immature","unmature","inmature"],0,"Перед m — im-."],["We need to ___ the trousers — they're too long.",["shortise","shorten","enshort"],1,"Short + -en → shorten."],["The ___ of the new app took two years.",["developity","development","developance"],1,"Develop + -ment."],["There's a ___ that it will rain tomorrow.",["possibleness","possiblement","possibility"],2,"Possible → possibility."],["Their ___ started at kindergarten.",["friendship","friendity","friendment"],0,"Friend + -ship."],["The city decided to ___ the old tram system.",["modernen","modernity","modernise"],2,"Modern + -ise → modernise."],["Sorry, I think I ___ your message.",["disunderstood","misunderstood","ununderstood"],1,"Mis- — неправильно."],["Don't ___ the difficulty of the NMT — it's harder than you think.",["underestimate","misestimate","disestimate"],0,"Under- — недооценивать."],["Education is of great ___ for the future.",["importance","importancy","importment"],0,"Important → importance."],["His answer was ___, so he lost a point.",["uncorrect","incorrect","miscorrect"],1,"Correct → incorrect."],["Exercise can ___ your muscles.",["strongen","strengthise","strengthen"],2,"Strength + -en → strengthen."]],"tr":[["Это невозможно.","im-",["It is impossible","This is impossible","That is impossible"]],["Его ответ был неправильным.","in-",["His answer was incorrect","His answer was wrong"]],["Дружба очень важна для меня.","-ship",["Friendship is very important to me","Friendship is very important for me"]],["Они хотят расширить мост.","-en",["They want to widen the bridge"]]]},{"t":"Предлоги после прилагательных и глаголов (B2)","l":"B2","rule":"Многие прилагательные и глаголы требуют определённого предлога — их нужно учить вместе. Прилагательные: capable of, aware of, proud of, keen on, responsible for, famous for, similar to, different from, satisfied with, addicted to. Глаголы: accuse of, rely on, depend on, insist on, apologise for, succeed in, consist of, approve of, suffer from, congratulate on, prevent from.","ex":[["He was [accused of] cheating in the exam.","Его обвинили в списывании на экзамене."],["You can always [rely on] me.","Ты всегда можешь на меня положиться."],["She is [capable of] solving very hard problems.","Она способна решать очень сложные задачи."],["The team [consists of] eleven players.","Команда состоит из одиннадцати игроков."],["We [congratulated] Igor [on] his victory.","Мы поздравили Игоря с победой."]],"quiz":[["Are you aware ___ the risks?",["about to","of","for"],1,"Aware of."],["My grandad is very proud ___ me.",["for","with","of"],2,"Proud of."],["Everything depends ___ the weather.",["on","of","from"],0,"Depend on."],["She insisted ___ paying for dinner.",["in","for","on"],2,"Insist on."],["He finally succeeded ___ passing the driving test.",["in","on","at"],0,"Succeed in."],["My parents don't approve ___ my new haircut.",["on","of","with"],1,"Approve of."],["Many people suffer ___ allergies in spring.",["of","from","in"],1,"Suffer from."],["The rain prevented us ___ playing outside.",["from","of","to"],0,"Prevent from."],["Igor is keen ___ astronomy.",["in","of","on"],2,"Keen on."],["Who is responsible ___ this mess?",["for","of","about"],0,"Responsible for."],["Your phone is similar ___ mine.",["with","to","as"],1,"Similar to."],["Lviv is famous ___ its coffee and chocolate.",["of","for","with"],1,"Famous for."],["The teacher accused him ___ copying.",["for","in","of"],2,"Accuse of."],["Many teenagers are addicted ___ social media.",["to","on","from"],0,"Addicted to."]],"tr":[["Я горжусь своей командой.","proud of",["I am proud of my team"]],["Ты можешь положиться на меня.","rely on",["You can rely on me","You can count on me"]],["Его обвинили в краже.","accused of",["He was accused of stealing","He was accused of theft"]],["Это зависит от тебя.","depend on",["It depends on you"]]]},{"t":"Итоговое повторение B2 к НМТ","l":"B2","rule":"На НМТ в заданиях Use of English часто проверяют: условные предложения (включая смешанные), wish, пассив, косвенную речь, модальные перфекты, герундий и инфинитив, связки, предлоги после глаголов и словообразование. Алгоритм: прочитай всё предложение, найди сигналы времени (by, since, ago, now), посмотри, что стоит после пропуска (существительное? предложение? -ing?), и исключи явно неверные варианты.","ex":[["If I [had known] about the test, I [would have prepared].","Если бы я знал о тесте, я бы подготовился."],["The museum [is believed to have been built] in the 18th century.","Считается, что музей построили в XVIII веке."],["She [must have forgotten] about our meeting.","Она, наверное, забыла о нашей встрече."],["[Despite feeling] ill, he went to the exam.","Несмотря на плохое самочувствие, он пошёл на экзамен."],["By next June I [will have finished] the lyceum.","К следующему июню я уже окончу лицей."]],"quiz":[["If he ___ harder last year, he would be at a better university now.",["worked","would work","had worked"],2,"Смешанное условное: прошлое → сейчас."],["I wish I ___ that message. Now everyone is angry with me.",["didn't send","hadn't sent","wouldn't send"],1,"Сожаление о прошлом — Past Perfect."],["The new bridge ___ next year.",["will be built","will build","is building"],0,"Мост построят — пассив в будущем."],["She told me she ___ the film the day before.",["had seen","has seen","sees"],0,"Косвенная речь: the day before → Past Perfect."],["You ___ have bought bread — we already have some.",["mustn't","needn't","can't"],1,"Зря купил — needn't have."],["I'm not used to ___ in such a big city.",["live","have lived","living"],2,"Be used to + -ing."],["___ having little time, she finished the project.",["Although","Despite","However"],1,"Despite + -ing."],["Not only ___ the olympiad, but he also got a scholarship.",["he won","won he","did he win"],2,"Инверсия после Not only."],["The man ___ car was stolen called the police.",["whose","who's","which"],0,"Чей — whose."],["It's time you ___ to bed.",["go","going","went"],2,"It's time + подлежащее + Past Simple."],["By the time we arrived, the concert ___.",["had already started","already starts","has already started"],0,"By the time + прошлое — Past Perfect."],["He asked me where I ___.",["do live","lived","did I live"],1,"Косвенный вопрос — прямой порядок слов."],["Igor is very good ___ programming.",["in","at","on"],1,"Good at."],["Her ___ to help others makes her a great volunteer.",["willingness","willing","willingly"],0,"После her — существительное: willingness."]],"tr":[["Если бы я лёг спать раньше, я бы сейчас не был уставшим.","mixed conditional",["If I had gone to bed earlier, I would not be tired now","If I had gone to bed earlier, I would not be tired","If I had gone to sleep earlier, I would not be tired now"]],["Говорят, что этот фильм очень интересный.","is said to be",["This film is said to be very interesting","It is said that this film is very interesting","The film is said to be very interesting","It is said that the film is very interesting","This movie is said to be very interesting"]],["Он, должно быть, оставил телефон дома.","must have left",["He must have left his phone at home","He must have left the phone at home"]],["Никогда я не видел такого большого здания.","Never have I seen",["Never have I seen such a big building","Never have I seen such a large building","Never have I seen such a tall building"]]]},{"t":"Narrative tenses: времена в рассказе о прошлом","l":"B2","rule":"В рассказе о прошлом работают четыре времени. Past Simple — главные события по порядку (I opened the game, chose a map and started). Past Continuous — фон и процесс в момент события (I was streaming when the lights went out). Past Perfect — то, что случилось ДО другого прошлого события (When I logged in, the update had already installed). Past Perfect Continuous — как долго что-то длилось до момента в прошлом (I had been playing for three hours when Mum came in). Типичные ошибки: Present Perfect в рассказе о прошлом (When I came, he has left ✗) и Continuous с глаголами состояния (I was knowing ✗).","ex":[["I [was building] a castle in Minecraft when my brother [switched off] the Wi-Fi.","Я строил замок в Minecraft, когда мой брат выключил Wi-Fi."],["By the time we [arrived], the tournament [had already started].","К тому времени, как мы приехали, турнир уже начался."],["Igor [had been practising] the boss fight for two hours before he finally [beat] it.","Игорь отрабатывал бой с боссом два часа, прежде чем наконец победил."],["The streamer [was chatting] with his viewers while the game [was loading].","Стример общался со зрителями, пока загружалась игра."],["Oleg [was crying] because someone [had deleted] his world.","Олег плакал, потому что кто-то удалил его мир."]],"quiz":[["When I got home, I saw that Oleg ___ my headphones without asking.",["had taken","has taken","is taking"],0,"Он взял их до того, как я пришёл, — Past Perfect."],["I ___ through the city in GTA when the game suddenly crashed.",["was driving","have driven","had been drive"],0,"Процесс, который прервало событие (crashed), — Past Continuous."],["We ___ for an hour when the server finally came back online.",["have been waiting","were waited","had been waiting"],2,"Как долго длилось до момента в прошлом — Past Perfect Continuous."],["She opened the box, ___ the new controller and plugged it in.",["was taking out","had been taking out","took out"],2,"Цепочка последовательных событий — Past Simple."],["I didn't recognise the map because the developers ___ it in the last update.",["were changing","have changed","had changed"],2,"Изменение было раньше, чем я зашёл — Past Perfect; Present Perfect в рассказе о прошлом не подходит."],["At 7 p.m. yesterday I ___ my history essay, so I couldn't join the stream.",["had been write","was writing","have written"],1,"Процесс в конкретный момент прошлого (at 7 p.m. yesterday) — Past Continuous."],["By the time the teacher came back, we ___ the first part of the test.",["were finish","have finished","had finished"],2,"By the time + прошлое → действие завершилось раньше: Past Perfect."],["His eyes were red because he ___ games all night.",["has played","had been playing","was played"],1,"Причина в прошлом, которая длилась долго до момента, — Past Perfect Continuous."],["I ___ the answer, so I raised my hand.",["was knowing","knew","had been knowing"],1,"know — глагол состояния, в Continuous не используется."],["We were watching the final when suddenly the screen ___ black.",["went","had been going","was going"],0,"Короткое внезапное событие на фоне процесса — Past Simple."],["When Oleg got off the bus, he realised he ___ his tablet on the seat.",["has left","had left","was leaving"],1,"Оставил раньше, чем понял, — Past Perfect."],["She was exhausted because she ___ for the NMT since early morning.",["has been studying","had been studying","studies"],1,"Since + рассказ о прошлом → Past Perfect Continuous."],["It ___ heavily, so we decided to stay inside and play Cuphead.",["was raining","has rained","rains"],0,"Фон истории — Past Continuous."],["I ___ Minecraft for years before I tried making my own mods.",["had played","was playing","have played"],0,"Опыт до другого события в прошлом — Past Perfect."]],"tr":[["Я играл в Minecraft, когда позвонил мой друг.","was playing … called",["I was playing Minecraft when my friend called","I was playing Minecraft when my friend phoned","I was playing Minecraft when my friend rang","I was playing Minecraft when my friend called me","I was playing Minecraft when a friend of mine called"]],["Когда мы пришли, фильм уже начался.","had already started",["When we arrived, the film had already started","When we came, the film had already started","When we arrived, the movie had already started","When we came, the movie had already started","When we arrived, the film had started already","When we got there, the film had already started"]],["Он устал, потому что тренировался весь день.","had been training",["He was tired because he had been training all day","He was tired because he had been practising all day","He was tired because he had been practicing all day","He was tired as he had been training all day"]],["Пока Олег спал, я закончил уровень.","While … was sleeping",["While Oleg was sleeping, I finished the level","While Oleg was sleeping, I completed the level","I finished the level while Oleg was sleeping","I completed the level while Oleg was sleeping","While Oleg was asleep, I finished the level","While Oleg was asleep, I completed the level"]]]},{"t":"Будущее: тонкости (will, going to, Present Continuous, be about to, be to)","l":"B2","rule":"will — решение в момент речи, обещание, предложение помощи и прогноз-мнение (I think…, probably). be going to — план, решённый заранее, и прогноз по явным признакам (Look at the clouds — it's going to rain). Present Continuous — договорённость с конкретным временем или местом (I'm meeting Yura at 5). Present Simple — расписания и программы (The train leaves at 8). be about to — «вот-вот»; be to — официальный план или инструкция (All students are to arrive by 8:30). Future Continuous — процесс в момент будущего, Future Perfect — что будет сделано к сроку. Ошибки: will после when/if/as soon as (When I will finish ✗) и «I will meet Yura tomorrow» вместо договорённости.","ex":[["The update [comes out] at 10 a.m. tomorrow — it's in the official schedule.","Обновление выходит завтра в 10 утра — это в официальном расписании."],["I['m meeting] Yura at the gaming club on Saturday.","В субботу я встречаюсь с Максом в игровом клубе."],["Look at the battery — the controller [is going to die].","Посмотри на батарею — контроллер сейчас сядет."],["Hurry up! The stream [is about to start].","Поторопись! Стрим вот-вот начнётся."],["All students [are to arrive] at the testing centre by 8:30.","Все ученики должны прибыть в тестовый центр к 8:30."]],"quiz":[["My train ___ at 7:15 tomorrow, so I need to get up early.",["leaves","is leave","will leaving"],0,"Расписание транспорта — Present Simple."],["— The doorbell is ringing. — OK, I ___ it.",["get","'ll get","am going to get"],1,"Решение в момент речи — will."],["I've already bought the paint. I ___ my room this weekend.",["paint","am going to paint","will paint"],1,"План, подготовленный заранее (краска уже куплена), — be going to."],["My car in GTA is going way too fast. Look out — it ___ into the wall!",["is going to crash","crashes","crash"],0,"Прогноз по явным признакам (видно прямо сейчас) — be going to."],["Don't call me at 8 — I ___ my favourite streamer then.",["am watch","watch","'ll be watching"],2,"Процесс в определённый момент будущего — Future Continuous."],["We ___ dinner with our grandparents on Sunday — Mum arranged it last week.",["will have to","are having","have"],1,"Договорённость (arranged) — Present Continuous."],["By June, I ___ for the NMT for a whole year.",["am preparing","will prepare","will have been preparing"],2,"Как долго будет длиться к моменту в будущем (by June, for a year) — Future Perfect Continuous."],["The winners ___ to receive their prizes at the closing ceremony.",["are","will","going"],0,"be to + глагол — официальный план: are to receive."],["When I ___ the level, I'll show you the secret room.",["am going to finish","will finish","finish"],2,"После when (время) будущее не ставим — Present Simple."],["— This box is too heavy. — Don't worry, I ___ you.",["am helping","help","'ll help"],2,"Спонтанное предложение помощи — will."],["I think the new Minecraft update ___ really popular.",["is","will be","is being"],1,"Прогноз-мнение после I think — will."],["By the time you wake up, I ___ the download.",["finish","am finishing","will have finished"],2,"К определённому моменту в будущем (by the time) — Future Perfect."],["I can't talk now — the exam is ___ start.",["about to","due","going"],0,"is about to start — вот-вот начнётся. is going start / is due start — без to неверно."],["What time ___ the stream start tonight? It's in the schedule.",["is","does","do"],1,"Расписание — Present Simple: What time does … start?"]],"tr":[["Я встречаюсь с друзьями в субботу.","договорённость: Present Continuous",["I am meeting my friends on Saturday","I am meeting friends on Saturday","I am meeting my friends this Saturday","I am meeting friends this Saturday","On Saturday I am meeting my friends","I am seeing my friends on Saturday"]],["Турнир начинается в 10 утра.","расписание: Present Simple",["The tournament starts at 10 am","The tournament starts at 10 a.m.","The tournament starts at 10 in the morning","The tournament begins at 10 am","The tournament begins at 10 a.m.","The tournament begins at 10 in the morning"]],["Фильм вот-вот начнётся.","be about to",["The film is about to start","The film is about to begin","The movie is about to start","The movie is about to begin"]],["Я думаю, ты сдашь НМТ.","I think + will",["I think you will pass the NMT","I think that you will pass the NMT","I think you will pass NMT","I think you are going to pass the NMT","I think you will pass the exam"]]]},{"t":"Будущее в прошлом: was going to, would, was about to, was supposed to","l":"C1","rule":"Когда мы смотрим на будущее «из прошлого», формы сдвигаются назад: will → would, am going to → was going to, am about to → was about to. was/were going to часто значит «собирался, но не сделал»: I was going to call you, but I forgot. was about to — «уже вот-вот собирался»: I was about to quit when I finally beat the boss. was supposed to — «по плану должен был» (и обычно не случилось): The update was supposed to come out yesterday. would — будущее внутри рассказа о прошлом: He knew he would win. Ошибка: смешивать времена — «I will call you, but I forgot» ✗, «I knew he will win» ✗.","ex":[["I [was going to] stream yesterday, but the Internet was down.","Я собирался стримить вчера, но не было интернета."],["I [was about to] give up when I finally beat the last boss in Cuphead.","Я уже собирался сдаться, когда наконец победил последнего босса в Cuphead."],["The new map [was supposed to] come out in May, but it was delayed.","Новая карта должна была выйти в мае, но её отложили."],["Igor knew the NMT [would be] hard, so he started preparing early.","Игорь знал, что НМТ будет трудным, поэтому начал готовиться рано."],["At that moment I had no idea that I [would become] a game designer.","В тот момент я понятия не имел, что стану гейм-дизайнером."]],"quiz":[["I ___ to call you, but my phone died.",["will","am going","was going"],2,"Собирался в прошлом, но не сделал — was going to."],["Last month she told us that the results ___ be ready the following Friday.",["would","are going","will"],0,"Рассказ о прошлом (told, the following Friday) — would."],["The developers ___ to release the patch yesterday, but they didn't.",["are supposed","were supposed","supposed"],1,"По плану должны были (и не сделали) — were supposed to."],["I was ___ to leave when Yura finally came online.",["about","near","almost"],0,"was about to — «уже вот-вот собирался»."],["Oleg promised he ___ tidy his room, but he forgot.",["is going to","will","would"],2,"promised — прошлое, поэтому will → would."],["We ___ going to buy a new console, but then prices went up.",["will","are","were"],2,"Собирались в прошлом — were going to."],["I thought the boss fight ___ easier.",["is","would be","will be"],1,"После thought (прошлое) — would be."],["He didn't know then that this stream ___ change his life.",["will","would","is going to"],1,"Будущее с точки зрения прошлого — would."],["I was going to finish the essay, ___ my brother wanted to play.",["because","so","but"],2,"was going to обычно = «собирался, но…» — нужен but."],["The train ___ to arrive at 6, but it was two hours late.",["was supposed","supposed","is supposed"],0,"По расписанию должен был — was supposed to."],["I ___ about to switch off the PC when the download finished.",["was","would","am"],0,"Прошлое (finished) — was about to."],["Dad said he ___ take us to the gaming expo the following weekend.",["is going","will","would"],2,"said + the following weekend — будущее в прошлом: would."],["— Why didn't you come? — I ___, but I missed the bus.",["was going to","will","would"],0,"Собирался, но не получилось — was going to."],["At that moment I had no idea that I ___ become a moderator of the server a year later.",["will","would","am going to"],1,"had no idea — прошлое, поэтому would."]],"tr":[["Я собирался тебе написать, но забыл.","was going to",["I was going to text you, but I forgot","I was going to write to you, but I forgot","I was going to message you, but I forgot","I was going to write you, but I forgot","I was going to text you but forgot","I was going to write to you but forgot"]],["Обновление должно было выйти вчера.","was supposed to",["The update was supposed to come out yesterday","The update was supposed to be released yesterday","The update was supposed to come yesterday","The update was supposed to be out yesterday"]],["Я знал, что он победит.","would",["I knew he would win","I knew that he would win","I knew he was going to win","I knew that he was going to win"]],["Мы как раз собирались уходить, когда пошёл дождь.","were about to",["We were about to leave when it started to rain","We were about to leave when it started raining","We were just about to leave when it started to rain","We were just about to leave when it started raining","We were about to leave when it began to rain","We were about to go when it started to rain"]]]},{"t":"Вопросы B2+: вопрос к подлежащему, косвенные вопросы, предлог в конце","l":"B2","rule":"Если вопрос задаётся к подлежащему (кто? что? какая команда?), вспомогательный do/does/did НЕ нужен: Who won the match? What happened? Если вопрос к дополнению — нужен: Who did you invite? Косвенные вопросы после Could you tell me…, Do you know…, I wonder… имеют прямой порядок слов и без do: Do you know where the charger is? (не where is the charger ✗). В вопросах «да/нет» внутри косвенного вопроса — if или whether: Can you tell me if the shop is open? В разговорных вопросах предлог уходит в конец: Who are you playing with? What is this button for? Ошибки: Who did break the vase? ✗, Do you know what time does it start? ✗","ex":[["[Who won] the esports final last night?","Кто выиграл финал по киберспорту вчера вечером?"],["[Who did you play] with yesterday?","С кем ты играл вчера?"],["Could you tell me [where the exam room is]?","Не могли бы вы сказать, где экзаменационная аудитория?"],["I wonder [if the update has come out] yet.","Интересно, вышло ли уже обновление."],["[What] are you looking [for]?","Что ты ищешь?"]],"quiz":[["Who ___ the highest score in the class?",["got","did got","did get"],0,"Вопрос к подлежащему (who = кто получил) — без did."],["Who ___ invite to your birthday party?",["you did","did you","you"],1,"Вопрос к дополнению (кого?) — нужен did + подлежащее."],["Do you know where ___?",["is the charger","does the charger","the charger is"],2,"Косвенный вопрос — прямой порядок слов."],["Can you tell me ___ the library opens on Sunday?",["that","if","does"],1,"Косвенный вопрос «да/нет» — if/whether."],["What ___ to your laptop? It won't turn on.",["does happened","happened","did happen"],1,"What — подлежащее, поэтому без did."],["I wonder why the game ___ so slowly.",["is loading","does load","loading"],0,"После I wonder — прямой порядок: подлежащее + сказуемое."],["Which team ___ the tournament last year?",["did won","won","did win"],1,"Вопрос к подлежащему (какая команда) — Past Simple без did."],["Who are you waiting ___?",["at","to","for"],2,"wait for — предлог в конце вопроса."],["Could you explain what this button ___?",["does","do","does it"],0,"Косвенный вопрос — прямой порядок, без лишнего it."],["How many people ___ the stream yesterday?",["did watched","did watch","watched"],2,"How many people — подлежащее, did не нужен."],["Do you remember what time ___?",["the match started","did the match start","started the match"],0,"Косвенный вопрос — прямой порядок без did."],["I'd like to know whether ___ any tickets left.",["there are","are there","is there"],0,"После whether — прямой порядок: there are."],["What kind of music do you like listening ___?",["at","for","to"],2,"listen to — предлог остаётся в конце."],["Whose idea ___ to build a castle on the mountain?",["did it","was it","it was"],1,"Прямой вопрос — обратный порядок: was it."]],"tr":[["Кто сломал мои наушники?","вопрос к подлежащему",["Who broke my headphones","Who has broken my headphones"]],["Ты не знаешь, когда начинается турнир?","Do you know + прямой порядок",["Do you know when the tournament starts","Do you know when the tournament begins","Do you know what time the tournament starts","Do you know what time the tournament begins"]],["С кем ты разговаривал?","предлог в конце",["Who were you talking to","Who were you talking with","Who were you speaking to","Who did you talk to","Who did you speak to","Who did you talk with"]],["Интересно, придёт ли Макс.","I wonder if/whether",["I wonder if Yura will come","I wonder whether Yura will come","I wonder if Yura is coming","I wonder whether Yura is coming"]]]},{"t":"Порядок слов: место наречий (still, already, also, enough, very well)","l":"B2","rule":"Наречия частоты и слова also, even, just, still, already, never ставятся перед основным глаголом, но после to be и после первого вспомогательного: I often play, He is always late, I have never seen. В отрицаниях still стоит перед вспомогательным: I still haven't finished. В конце предложения порядок: как – где – когда (He played brilliantly at the tournament yesterday). Наречие не ставят между глаголом и дополнением: I like Minecraft very much (не I like very much Minecraft ✗). Enough — после прилагательного (fast enough), но перед существительным (enough time). Ошибки: I play always ✗, She speaks very well English ✗.","ex":[["Oleg [always] forgets to save his world.","Олег всегда забывает сохранить свой мир."],["I have [already] finished the first part of the test.","Я уже закончил первую часть теста."],["He played [brilliantly at the tournament last week].","Он блестяще сыграл на турнире на прошлой неделе."],["Igor speaks English [very well].","Игорь очень хорошо говорит по-английски."],["We [still] haven't found any diamonds.","Мы до сих пор не нашли ни одного алмаза."]],"quiz":[["Yura ___ to bed before midnight.",["never go","goes never","never goes"],2,"Never — перед основным глаголом; he → goes."],["She speaks ___.",["fluently English","English fluent","English fluently"],2,"Наречие не ставят между глаголом и дополнением; нужно наречие fluently."],["I ___ seen such good graphics.",["has never","have never","am never"],1,"never — после вспомогательного have."],["He ___ late for the first lesson.",["often is","is oftenly","is often"],2,"Наречие частоты — после to be."],["Igor played ___.",["well in the match yesterday","in the match well yesterday","yesterday well in the match"],0,"Порядок: как – где – когда."],["I ___ like this song.",["much","really","very"],1,"Перед глаголом like — really; very и much так не используются."],["Is your PC fast ___ for this game?",["so much","enough","enough of"],1,"enough — после прилагательного: fast enough."],["We don't have ___ to finish the build today.",["enough of time","enough time","time enough"],1,"enough — перед существительным."],["Have you finished your homework ___?",["still","yet","ever"],1,"yet — в конце вопроса: «уже?»."],["I ___ can't beat this level — it's been two weeks!",["already","yet","still"],2,"still — перед отрицательным вспомогательным: «до сих пор не»."],["Igor plays football. He ___ plays chess.",["also","as well","either"],0,"also — перед глаголом; as well — только в конце, either — в отрицаниях."],["I can ___ hear you — turn on your microphone!",["hardly","hardly not","hard"],0,"hardly = «едва»; hard — «усердно»; hardly уже отрицание."],["He read ___ before the exam.",["the instructions carefully","carefully the instructions","the carefully instructions"],0,"Сначала дополнение, затем наречие образа действия."],["Oleg ___ eats vegetables without complaining.",["seldomly","rare","rarely"],2,"rarely — наречие частоты перед глаголом; seldomly не существует."]],"tr":[["Я никогда не опаздываю на уроки.","never после to be",["I am never late for lessons","I am never late for classes","I am never late for my lessons","I am never late for class","I never come late to lessons","I never come late to class"]],["Он очень хорошо играет в шахматы.","verb + object + very well",["He plays chess very well"]],["Я до сих пор не закончил проект.","still haven't",["I still have not finished the project","I still have not finished my project","I have still not finished the project","I have still not finished my project","I still have not completed the project","I still have not completed my project"]],["У нас недостаточно времени.","enough + noun",["We do not have enough time","We have not got enough time","We have not enough time","There is not enough time"]]]},{"t":"Квантификаторы: few / a few, little / a little, hardly any, plenty of","l":"B2","rule":"a few (с исчисляемыми) и a little (с неисчисляемыми) — «немного, но достаточно», позитив: I have a few friends online. few и little без артикля — «мало, почти нет», негатив: Few players finished the level. hardly any = почти нет (hardly any time). plenty of — «полно, больше чем нужно», с обоими типами. a great deal of / a large amount of — только с неисчисляемыми, a large number of — с исчисляемыми. Ошибки: a little friends ✗, a great deal of players ✗, I have few time ✗ (нужно little), hardly no ✗.","ex":[["[Few] players have finished Cuphead without dying.","Мало кто из игроков прошёл Cuphead, ни разу не погибнув."],["I have [a few] minutes — let's play one quick round.","У меня есть несколько минут — давай сыграем один быстрый раунд."],["There's [hardly any] battery left on my phone.","На телефоне почти не осталось заряда."],["Don't worry, we have [plenty of] time before the exam.","Не волнуйся, у нас полно времени до экзамена."],["The developers spent [a great deal of] money on the graphics.","Разработчики потратили огромные деньги на графику."]],"quiz":[["I can't go out — I have very ___ free time this week.",["little","a few","few"],0,"time — неисчисляемое, смысл «мало» — little."],["Luckily, I had ___ coins left, so I bought a new skin.",["a little","a few","few"],1,"coins — исчисляемое, «хватило» — позитив a few."],["___ people came to the meeting, so it was cancelled.",["Few","Little","A few"],0,"Встречу отменили — «мало, почти никто»: Few."],["Could you add ___ sugar to my tea, please?",["a little","a few","few"],0,"sugar — неисчисляемое, «немного» — a little."],["There were ___ mistakes in your essay — only two!",["plenty of","a great deal of","hardly any"],2,"only two — почти не было: hardly any."],["Don't hurry, we've got ___ time.",["few","a few","plenty of"],2,"Времени полно — plenty of."],["The new update attracted ___ new players.",["a large number of","a great deal of","a little"],0,"players — исчисляемое: a large number of."],["He has ___ experience with streaming, so he needs help.",["a few","few","little"],2,"experience — неисчисляемое, «мало» (нужна помощь) — little."],["She has made ___ progress — her English is much better now.",["a great deal of","a large number of","few"],0,"progress — неисчисляемое: a great deal of."],["There is ___ milk in the fridge. Can you buy some?",["hardly no","any hardly","hardly any"],2,"hardly any — «почти нет»; hardly no — двойное отрицание."],["I know ___ words in Polish — enough to say hello and thank you.",["little","a little","a few"],2,"words — исчисляемое, «достаточно» — a few."],["We had ___ problems with the server, but we fixed them quickly.",["a little","a few","little"],1,"problems — исчисляемое: a few."],["There's ___ point in waiting — the stream has been cancelled.",["few","little","a few"],1,"There's little point — «нет особого смысла»."],["___ of my classmates play Minecraft — about 20 out of 25.",["Few","Most","Little"],1,"20 из 25 — большинство: Most."]],"tr":[["У меня есть немного денег.","a little / a bit of",["I have a little money","I have got a little money","I have a bit of money","I have got etter, much faster. Ослабить — a bit, a little, slightly: slightly cheaper. С very сравнительную степень не используем (very better ✗). С as…as: twice / three times as fast as, just as, nearly as, nowhere near as good as («далеко не такой»). The + сравнительная…, the + сравнительная — «чем…, тем…»: The more you practise, the better you get. by far + превосходная: by far the best. Ошибки: more better ✗, the most fastest ✗, twice more expensive as ✗.","ex":[["The new graphics are [far better than] the old ones.","Новая графика намного лучше старой."],["My laptop is [slightly faster than] yours.","Мой ноутбук немного быстрее твоего."],["This map is [twice as big as] the previous one.","Эта карта в два раза больше предыдущей."],["[The more] you practise, [the better] you play.","Чем больше ты тренируешься, тем лучше играешь."],["Cuphead is [by far the hardest] game I've ever played.","Cuphead — безусловно, самая сложная игра, в которую я когда-либо играл."]],"quiz":[["This level is ___ harder than the first one.",["very","more","much"],2,"Усиление сравнительной степени — much; very и more harder неверны."],["The sequel is ___ as good as the original — it's really disappointing.",["far","much","nowhere near"],2,"nowhere near as … as — «далеко не такой»."],["___ you sleep, the more tired you feel in the morning.",["The least","Less","The less"],2,"Конструкция the …, the … требует the в обеих частях."],["Her score was ___ higher than mine — just two points.",["slightly","far","by far"],0,"Небольшая разница — slightly."],["This is ___ the best stream I've watched this year.",["far more","by far","much"],1,"by far + превосходная степень."],["The new console is ___ expensive as the old one.",["twice as","two times more","twice more"],0,"Кратное сравнение: twice as … as."],["The sooner we start, ___ we'll finish.",["the soonest","sooner","the sooner"],2,"the + сравнительная, the + сравнительная."],["My brother is ___ taller than me now!",["a bit of","a bit","bit"],1,"a bit + сравнительная — «немного»."],["Today's test was ___ easier than yesterday's.",["even","most","very"],0,"even + сравнительная — «ещё»."],["Driving in the new GTA city is ___ more realistic.",["many","a lot","very"],1,"a lot more — «намного более»."],["The bigger the map, ___ it takes to load.",["the longer","the long","longer"],0,"the + сравнительная во второй части."],["My internet is ___ as fast as yours — it's almost the same.",["far","much","nearly"],2,"nearly as … as — «почти такой же»."],["He's ___ player in our team.",["the more experienced","the most experienced","most experienced"],1,"Превосходная степень с the: the most experienced."],["This update is ___ worse than the previous one.",["very","even","more"],1,"even worse — «ещё хуже»; more worse ✗."]],"tr":[["Эта игра намного интереснее той.","much / far",["This game is much more interesting than that one","This game is far more interesting than that one","This game is a lot more interesting than that one","This game is much more interesting than that","This game is far more interesting than that","This game is a lot more interesting than that"]],["Чем больше ты читаешь, тем больше знаешь.","The more…, the more…",["The more you read, the more you know"]],["Эта карта в два раза больше той.","twice as big as",["This map is twice as big as that one","This map is twice as large as that one","This map is twice the size of that one","This map is twice as big as that","This map is twice as large as that"]],["Тест был немного легче, чем я думал.","slightly / a bit",["The test was slightly easier than I thought","The test was a bit easier than I thought","The test was a little easier than I thought","The test was slightly easier than I expected","The test was a bit easier than I expected","The test was a little easier than I expected"]]]},{"t":"Герундий или инфинитив со сменой смысла: regret, mean, go on, need","l":"B2","rule":"Некоторые глаголы меняют смысл в зависимости от формы. regret doing — жалеть о сделанном; e he was afraid ___.",["fall","of falling","to fall"],1,"Боязнь того, что случится само, — afraid of + -ing."],["I'd like ___ a new skin, please.",["buy","to buy","buying"],1,"would like + to do."],["I really like ___ with my friends at weekends.",["playing","play","played"],0,"like + -ing — любить вообще."],["You need ___ more for the exam.",["study","to study","studying"],1,"Тебе нужно (активный смысл) — need to do."],["Did you mean ___ this message to the whole class?",["to send","sending","sent"],0,"Ты намеревался? — mean to do."],["I regret not ___ my game before the crash.",["save","to save","saving"],2,"Сожаление о прошлом — regret (not) + -ing."],["After explaining the rules, the teacher went on ___ us a short test.",["to give","give","giving"],0,"Перешла к следующему действию — go on to do."]],"tr":[["Я жалею, что не учил английский раньше.","regret not + -ing",["I regret not learning English earlier","I regret not studying English earlier","I regret not having learnt English earlier","I regret not having learned English earlier","I regret not having studied English earlier","I regret that I did not learn English earlier"]],["Мой велосипед нужно починить.","needs + -ing",["My bike needs repairing","My bike needs fixing","My bicycle needs repairing","My bicycle needs fixing","My bike needs to be repaired","My bike needs to be fixed"]],["Я не хотел тебя обидеть.","didn't mean to",["I did not mean to offend you","I did not mean to hurt you","I did not mean to upset you","I never meant to hurt you","I never meant to offend you"]],["Он продолжал играть, хотя было поздно.","went on + -ing",["He went on playing although it was late","He went on playing even though it was late","He kept playing although it was late","He kept playing even though it was late","He continued playing although it was late","He continued to play although it was late"]]]},{"t":"Глаголы косвенной речи: accuse of, insist on, advise to, deny, suggest","l":"B2","rule":"Вместо said/told на B2+
