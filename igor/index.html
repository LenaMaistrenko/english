re."],["Do you remember the day ___ we met?",["who","where","when"],2,"О времени — when."],["Kharkiv, ___ is the second largest city in Ukraine, has many universities.",["that","which","where"],1,"После запятой о предмете — which, that нельзя."],["The teacher ___ helped me is very kind.",["who","whose","which"],0,"О человеке — who."],["That's the man ___ car was stolen.",["who","whose","whom"],1,"Чья машина — whose."],["The video ___ Oleg made got 1000 views.",["who","whose","which"],2,"О предмете (видео) — which."],["The city ___ I was born is very green.",["where","which","when"],0,"Место — where (I was born there)."],["My friend Max, ___ lives next door, loves chess.",["that","who","which"],1,"После запятой о человеке — who."],["I need a friend ___ I can trust.",["which","who","where"],1,"О человеке — who."],["This is the book ___ cover I designed.",["whose","which","who"],0,"Чья обложка — whose (можно и о предметах)."],["2020 was the year ___ my brother started school.",["which","when","where"],1,"О времени (год) — when."]],"tr":[["Это девочка, которая выиграла олимпиаду.","who/that",["This is the girl who won the olympiad","This is the girl that won the olympiad","She is the girl who won the olympiad","She is the girl that won the olympiad"]],["Это игра, которую я купил вчера.","which/that или без местоимения",["This is the game which I bought yesterday","This is the game that I bought yesterday","This is the game I bought yesterday"]],["У меня есть друг, чей папа — пилот.","whose",["I have a friend whose dad is a pilot","I have a friend whose father is a pilot","I have got a friend whose dad is a pilot","I have got a friend whose father is a pilot"]],["Это парк, где мы играем в футбол.","where",["This is the park where we play football"]]]},{"t":"Might, may, could: возможно","l":"B1","rule":"Might, may, could + V (инфинитив без to) выражают возможность в настоящем или будущем: «может быть», «возможно». May звучит чуть увереннее, might/could — менее уверенно. Отрицание: might not / may not («возможно, не…»). Важно: couldn't означает «не мог / невозможно», а не «возможно, не». Примеры: It might rain later. He may not come today.","ex":[["Take an umbrella — it [might rain] later.","Возьми зонт — позже может пойти дождь."],["Max [may come] to the match, but he isn't sure.","Макс, возможно, придёт на матч, но он не уверен."],["This type of problem [could be] on the NMT.","Такой тип задачи может быть на НМТ."],["Oleg [might not want] to go — he's tired.","Олег, возможно, не захочет идти — он устал."],["Where's my phone? It [could be] in my bag.","Где мой телефон? Он может быть в рюкзаке."]],"quiz":[["Take a jacket. It ___ get cold in the evening.",["mustn't","needn't","might"],2,"Возможность в будущем — might."],["I'm not sure, but Max ___ be at home.",["can't","may","has to"],1,"Not sure — неуверенное предположение: may."],["He might ___ to the party.",["to come","comes","come"],2,"После might — инфинитив без to."],["I'm not sure. I ___ not go to the cinema tonight.",["don't","might","am"],1,"Возможно, не пойду — might not."],["Where is Oleg? — He ___ be in his room, I'm not sure.",["must","has","could"],2,"Неуверенное предположение — could."],["It ___ snow tomorrow — the forecast isn't clear.",["is","may","does"],1,"Возможность — may + V."],["This answer ___ be correct, but let's check.",["needs","might","mustn't"],1,"Возможно, верно — might be."],["We ___ go to Lviv in summer, but we haven't decided yet.",["might","will","must"],0,"Ещё не решили — только возможность: might."],["She may ___ the answer.",["knowing","know","knows"],1,"После may — инфинитив без to."],["Don't wait for me, I ___ be late.",["may","have","must"],0,"Возможно опоздаю — may be late."],["Our team ___ win the cup this year — we have good players.",["has","could","is"],1,"Возможность — could + V."],["Maybe he's busy. = He ___ busy.",["might","is might","might be"],2,"Might + be + прилагательное."],["Perhaps it will rain. = It ___ rain.",["does","may","is"],1,"Perhaps it will = it may."],["He ___ not like this game, so ask him first.",["doesn't","isn't","may"],2,"Возможно, не понравится — may not like."]],"tr":[["Возможно, завтра пойдёт дождь.","might/may + V",["It might rain tomorrow","It may rain tomorrow","It could rain tomorrow","Tomorrow it might rain","Tomorrow it may rain","Tomorrow it could rain"]],["Олег, может быть, дома.","might be",["Oleg might be at home","Oleg may be at home","Oleg could be at home","Oleg might be home","Oleg may be home","Oleg could be home"]],["Возможно, я не приду на тренировку.","might not",["I might not come to the training","I might not come to training","I may not come to the training","I may not come to training","I might not come to the practice","I might not come to practice","I may not come to the practice","I may not come to practice"]],["Наша команда может выиграть кубок.","could/might + V",["Our team could win the cup","Our team might win the cup","Our team may win the cup","Our team can win the cup"]]]},{"t":"Must / can't: наверняка и не может быть","l":"B1","rule":"Must + V — уверенный вывод «наверняка, должно быть» (почти 100% «да»): He must be tired — he trained all day. Can't + V — уверенный вывод «не может быть» (почти 100% «нет»): That can't be Oleg — he's at school. Для вывода «нет» не используем mustn't! О прошлом: must have + V3 (наверное, сделал), can't have + V3 (не мог сделать).","ex":[["You've been playing for five hours — you [must be] tired.","Ты играешь пять часов — ты, должно быть, устал."],["That [can't be] Max — he's in Poland now.","Это не может быть Макс — он сейчас в Польше."],["Oleg is smiling — he [must have got] a good mark.","Олег улыбается — он, наверное, получил хорошую оценку."],["She [can't have finished] the test already — it started two minutes ago.","Она не могла уже закончить тест — он начался две минуты назад."],["The lights are off. They [must be] asleep.","Свет выключен. Они, должно быть, спят."]],"quiz":[["He has won three olympiads. He ___ be very clever.",["can't","mustn't","must"],2,"Уверенный вывод «да» — must."],["That ___ be true! I saw him five minutes ago.",["can't","should","must"],0,"Уверенный вывод «нет» — can't."],["You haven't eaten all day. You ___ be hungry.",["must","mustn't","can't"],0,"Логичный вывод «наверняка» — must."],["This ___ be Oleg's bag — he has a blue one, and this is red.",["must","can't","mustn't"],1,"Не может быть — can't."],["The ground is wet. It ___ have rained last night.",["can't","mustn't","must"],2,"Вывод о прошлом — must have + V3."],["She ___ have seen the film — it hasn't come out yet.",["should","must","can't"],2,"Невозможно в прошлом — can't have + V3."],["Max isn't answering — it's 2 a.m. He ___ be sleeping.",["can't","mustn't","must"],2,"В 2 ночи — наверняка спит: must."],["That ___ be the teacher — she's on holiday in Spain.",["can't","might","must"],0,"Она в Испании — это точно не она: can't."],["You must ___ joking!",["to be","being","be"],2,"Must + be + V-ing: must be joking."],["He can't have ___ all the pizza — there were ten slices!",["eaten","ate","eat"],0,"Can't have + V3."],["Ira got 200 points on the NMT. She ___ have studied a lot.",["must","can't","mustn't"],0,"Вывод о прошлом «наверняка» — must have."],["The phone is ringing, but nobody answers. They ___ be at home.",["can't","should","must"],0,"Никто не отвечает — их не может быть дома: can't."],["I'm sure he is Italian. = He ___ be Italian.",["must","can't","might"],0,"I'm sure = must."],["I'm sure it isn't Oleg's phone. = It ___ be Oleg's phone.",["can't","must","mustn't"],0,"Уверенное «нет» — can't (не mustn't)."]],"tr":[["Ты, должно быть, устал.","must be",["You must be tired"]],["Это не может быть правдой.","can't be",["That cannot be true","That can not be true","This cannot be true","This can not be true","It cannot be true","It can not be true"]],["Он, должно быть, дома.","must be",["He must be at home","He must be home"]],["Олег, должно быть, забыл о тренировке.","must have + V3",["Oleg must have forgotten about the training","Oleg must have forgotten about the practice","Oleg must have forgotten about training","Oleg must have forgotten about practice"]]]},{"t":"Should have / shouldn't have: сожаление и критика","l":"B1","rule":"Should have + V3 — сожаление или критика о прошлом: «следовало (бы) сделать, но не сделал». Shouldn't have + V3 — «не следовало делать, но сделал». Примеры: I should have revised for the test (я не повторил — жаль). You shouldn't have stayed up so late. Для советов о настоящем и будущем используем should + V.","ex":[["I [should have revised] for the test — I got a bad mark.","Мне следовало повторить материал — я получил плохую оценку."],["You [shouldn't have eaten] so much pizza.","Тебе не стоило есть так много пиццы."],["We [should have left] earlier — now we're late.","Нам следовало выйти раньше — теперь мы опаздываем."],["Oleg [shouldn't have played] games until midnight.","Олегу не следовало играть в игры до полуночи."],["You [should have told] me about the party!","Тебе следовало рассказать мне о вечеринке!"]],"quiz":[["I failed the test. I ___ more.",["shouldn't have studied","should study","should have studied"],2,"Сожаление о прошлом — should have + V3."],["My stomach hurts. I ___ so many sweets.",["should have eaten","should eat","shouldn't have eaten"],2,"Сделал зря — shouldn't have + V3."],["You should have ___ me! I would have helped.",["called","call","calling"],0,"После should have — V3."],["We missed the bus. We ___ earlier.",["should left","shouldn't have left","should have left"],2,"Надо было выйти раньше — should have left."],["He's tired now. He ___ up so late.",["didn't should stay","should have stayed","shouldn't have stayed"],2,"Зря не спал допоздна — shouldn't have stayed."],["You ___ that photo online — now everyone is laughing.",["should have posted","not should post","shouldn't have posted"],2,"Не надо было выкладывать — shouldn't have posted."],["It was a great concert. You ___ with us!",["should came","shouldn't have come","should have come"],2,"Жаль, что не пошёл — should have come."],["I should have ___ my phone — now the battery is dead.",["charged","charge","charging"],0,"Should have + V3: charged."],["Oleg broke the vase. He ___ football in the living room.",["shouldn't have played","should play","should have played"],0,"Зря играл — shouldn't have played."],["You look cold. You ___ a jacket.",["should have worn","should wore","shouldn't have worn"],0,"Надо было надеть — should have worn."],["Sorry, I ___ shouted at you.",["shouldn't have","should have","shouldn't"],0,"Извинение за прошлое — shouldn't have + V3."],["Our team lost because Max was on the bench. The coach ___ him earlier.",["should putting","shouldn't have put","should have put"],2,"Надо было выпустить — should have put."],["I ___ to the doctor yesterday, but I didn't.",["shouldn't have gone","should have gone","should go"],1,"Следовало пойти, но не пошёл — should have gone."],["Mum ___ bought this cake — nobody likes it.",["should have","should","shouldn't have"],2,"Зря купила — shouldn't have bought."]],"tr":[["Мне следовало больше учиться.","should have + V3",["I should have studied more","I should have learned more","I should have learnt more"]],["Тебе не следовало ложиться так поздно.","shouldn't have + V3",["You should not have gone to bed so late","You should not have stayed up so late"]],["Нам следовало выйти раньше.","should have left",["We should have left earlier"]],["Олегу не следовало брать мой ноутбук.","shouldn't have taken",["Oleg should not have taken my laptop"]]]},{"t":"Future Continuous и придаточные времени","l":"B1","rule":"Future Continuous (will be + V-ing) — действие, которое будет в процессе в определённый момент в будущем: At 8 pm tomorrow I will be playing football. В придаточных времени после when, as soon as, before, after, until, by the time будущее выражаем Present Simple, а не will: I will call you when I arrive. Если действие должно завершиться к моменту, можно использовать Present Perfect: I'll go out after I have finished my homework.","ex":[["This time tomorrow I [will be writing] the maths olympiad.","Завтра в это время я буду писать олимпиаду по математике."],["Don't call at 7 — we [will be having] dinner.","Не звони в 7 — мы будем ужинать."],["I'll text you as soon as I [get] the results.","Я напишу тебе, как только получу результаты."],["Oleg will go to bed after he [has brushed] his teeth.","Олег пойдёт спать после того, как почистит зубы."],["At 10 am on Saturday we [will be travelling] to Kyiv.","В субботу в 10 утра мы будем ехать в Киев."]],"quiz":[["This time next week I ___ on the beach.",["lay","will be lying","have lain"],1,"Процесс в момент будущего — will be + V-ing."],["Don't call me at 8 — I ___ my homework.",["did","will be doing","do"],1,"В 8 часов буду в процессе — will be doing."],["I will call you when I ___ home.",["got","get","will get"],1,"После when о будущем — Present Simple."],["We won't start until Oleg ___.",["will arrive","arrived","arrives"],2,"После until — Present Simple."],["At midnight I ___ — please be quiet when you come in.",["slept","sleep","will be sleeping"],2,"В полночь буду в процессе сна — Future Continuous."],["As soon as the lesson ___, we'll go to the canteen.",["will finish","finished","finishes"],2,"После as soon as — Present Simple."],["Tomorrow at 5 pm Max ___ in the final.",["will be playing","has played","played"],0,"Процесс в конкретный момент будущего — will be playing."],["Switch off the light before you ___ the room.",["left","leave","will leave"],1,"После before — Present Simple."],["I'll lend you the book after I ___ it.",["will read","have read","had read"],1,"Завершение к моменту в будущем — Present Perfect после after."],["Will you ___ the laptop this evening? I need it.",["be using","using","use being"],0,"Will you be + V-ing — вежливый вопрос о планах."],["Call me when you ___ ready.",["are","will be","were"],0,"После when — Present Simple: are."],["In ten years, I hope I ___ as a programmer.",["work","will be working","worked"],1,"Процесс в будущем — will be working."],["We'll wait here until the rain ___.",["will stop","stopped","stops"],2,"После until — Present Simple."],["What ___ you be doing at 9 tomorrow?",["do","will","are"],1,"Вопрос в Future Continuous: will you be doing."]],"tr":[["Завтра в шесть я буду играть в футбол.","will be + V-ing",["Tomorrow at six I will be playing football","At six tomorrow I will be playing football","Tomorrow at 6 I will be playing football","At 6 tomorrow I will be playing football","I will be playing football tomorrow at six","I will be playing football at six tomorrow","I will be playing football tomorrow at 6","I will be playing football at 6 tomorrow"]],["Я позвоню тебе, когда приду домой.","when + Present Simple",["I will call you when I come home","I will call you when I get home","I will phone you when I come home","I will phone you when I get home","I will ring you when I come home","I will ring you when I get home"]],["В восемь я буду делать домашнее задание.","will be doing",["At eight I will be doing my homework","At 8 I will be doing my homework","I will be doing my homework at eight","I will be doing my homework at 8"]],["Мы подождём, пока Олег не придёт.","until + Present Simple",["We will wait until Oleg comes","We will wait until Oleg arrives","We will wait till Oleg comes","We will wait till Oleg arrives"]]]},{"t":"Question tags: …, isn't it?","l":"B1","rule":"Разделительный вопрос (question tag) — короткий вопрос в конце предложения: «…, правда? / не так ли?». Правило: утверждение (+) → отрицательный хвостик (−), отрицание (−) → положительный хвостик (+). В хвостике повторяем вспомогательный глагол (be, do/does/did, have, can, will) и местоимение: She is tired, isn't she? You play chess, don't you? Особые случаи: I am…, aren't I? Let's…, shall we? Повелительное: Open the door, will you?","ex":[["You're from Kharkiv, [aren't you]?","Ты из Харькова, правда?"],["Oleg doesn't like broccoli, [does he]?","Олег не любит брокколи, да?"],["We won the match, [didn't we]?","Мы же выиграли матч, правда?"],["You can solve this problem, [can't you]?","Ты ведь можешь решить эту задачу?"],["Let's play FIFA, [shall we]?","Давай поиграем в FIFA, а?"]],"quiz":[["She is your sister, ___?",["isn't she","doesn't she","is she"],0,"Утверждение с is → хвостик isn't she."],["You play the guitar, ___?",["do you","aren't you","don't you"],2,"Present Simple (+) → don't you."],["They didn't come, ___?",["did they","do they","didn't they"],0,"Отрицание → положительный хвостик did they."],["I'm right, ___?",["isn't I","am not I","aren't I"],2,"Особый случай: I am → aren't I."],["Let's go to the cinema, ___?",["will we","shall we","do we"],1,"После Let's — shall we."],["Max can swim, ___?",["doesn't he","can he","can't he"],2,"Can (+) → can't he."],["You haven't seen my headphones, ___?",["haven't you","did you","have you"],2,"Haven't (−) → have you."],["Oleg will help us, ___?",["won't he","doesn't he","isn't he"],0,"Will (+) → won't he."],["It was a great game, ___?",["didn't it","isn't it","wasn't it"],2,"Was (+) → wasn't it."],["Your dad works in IT, ___?",["isn't he","doesn't he","don't he"],1,"Works (Present Simple, he) → doesn't he."],["Nobody called, ___?",["did they","didn't they","did he"],0,"Nobody — уже отрицание, хвостик положительный, местоимение they."],["Close the door, ___?",["will you","do you","are you"],0,"После повелительного — will you."],["There is a test tomorrow, ___?",["isn't there","isn't it","is there"],0,"There is → isn't there."],["He has finished the project, ___?",["didn't he","hasn't he","doesn't he"],1,"Has finished (+) → hasn't he."]],"tr":[["Ты не видел мои наушники, правда?","отрицание → положительный хвостик",["You have not seen my headphones, have you","You haven't seen my headphones, have you","You have not seen my headphones have you","You haven't seen my headphones have you"]],["Олег не любит брокколи, да?","doesn't … does he",["Oleg does not like broccoli, does he","Oleg doesn't like broccoli, does he","Oleg does not like broccoli does he","Oleg doesn't like broccoli does he"]],["Давай поиграем в футбол, хорошо?","Let's … shall we",["Let's play football, shall we","Let us play football, shall we","Let's play football shall we","Let us play football shall we"]],["Ты из Харькова, правда?","are … aren't you",["You are from Kharkiv, aren't you","You are from Kharkiv, are not you","You are from Kharkiv, are you not","You're from Kharkiv, aren't you","You are from Kharkiv aren't you","You are from Kharkiv are not you","You are from Kharkiv are you not","You're from Kharkiv aren't you"]]]},{"t":"So / such, too / enough","l":"B1","rule":"So + прилагательное или наречие: so fast, so interesting. Such + (a/an) + прилагательное + существительное: such a good game, such nice people. Too + прилагательное = «слишком» (часто «настолько, что нельзя»): too difficult to solve. Прилагательное + enough = «достаточно»: old enough to drive; enough + существительное: enough money. Конструкции: so…that, such…that, too…to, …enough to.","ex":[["The test was [so] difficult that nobody finished it.","Контрольная была такой сложной, что никто её не закончил."],["It was [such a] great match!","Это был такой отличный матч!"],["Oleg is [too] young to play this game.","Олег слишком маленький, чтобы играть в эту игру."],["I'm not tall [enough] to reach the top shelf.","Я недостаточно высокий, чтобы достать до верхней полки."],["We don't have [enough] time to finish the project.","У нас недостаточно времени, чтобы закончить проект."]],"quiz":[["The film was ___ boring that I fell asleep.",["too","such","so"],2,"So + прилагательное + that."],["It was ___ interesting book that I read it in one day.",["so","such","such an"],2,"Such + an + прилагательное + существительное (interesting начинается с гласной)."],["This box is ___ heavy for me to carry.",["too","enough","such"],0,"Too + прилагательное + to — слишком."],["He isn't old ___ to drive a car.",["too","enough","so"],1,"Прилагательное + enough."],["We don't have ___ money to buy the tickets.",["so","enough","too"],1,"Enough + существительное."],["They are ___ nice people!",["such","so","such a"],0,"People — множественное число: such без a."],["The water is ___ cold to swim in.",["such","too","enough"],1,"Too cold to swim — слишком холодная."],["Is your English good ___ to watch films without subtitles?",["so","too","enough"],2,"Good enough to — достаточно хороший."],["Max runs ___ fast that nobody can catch him.",["too","so","such"],1,"So + наречие + that."],["It was ___ hot day that we stayed at home.",["so","such","such a"],2,"Such a + прилагательное + существительное в единственном числе."],["The problem was ___ difficult for Oleg to solve.",["such","so","too"],2,"Too + прилагательное + for somebody + to."],["There aren't ___ chairs for everyone.",["enough","too","so"],0,"Enough + существительное."],["I've never seen ___ a beautiful sunset.",["too","so","such"],2,"Such + a + прилагательное + существительное."],["You're speaking ___ quickly — I can't understand you.",["such","too","enough"],1,"Too quickly — слишком быстро."]],"tr":[["Фильм был таким интересным, что я посмотрел его дважды.","so … that",["The film was so interesting that I watched it twice","The movie was so interesting that I watched it twice"]],["Это была такая хорошая игра!","such a + adj + noun",["It was such a good game","It was such a good match","That was such a good game","That was such a good match"]],["Олег слишком маленький, чтобы смотреть этот фильм.","too … to",["Oleg is too young to watch this film","Oleg is too young to watch this movie","Oleg is too little to watch this film","Oleg is too little to watch this movie","Oleg is too small to watch this film","Oleg is too small to watch this movie"]],["У нас недостаточно времени.","enough + noun",["We do not have enough time","We have not got enough time"]]]},{"t":"Фразовые глаголы с up, down, out","l":"B1","rule":"Фразовый глагол = глагол + частица, и значение часто меняется полностью. Up — завершение или движение вверх: give up (бросить, сдаться), look up (найти в словаре), grow up (вырасти), turn up (сделать громче; появиться). Down — уменьшение: turn down (сделать тише; отказать), calm down (успокоиться), write down (записать), break down (сломаться). Out — наружу или до конца: find out (узнать), run out of (закончиться), work out (разобраться; тренироваться), sort out (уладить). Местоимение стоит между глаголом и частицей: look it up, а не look up it.","ex":[["Don't [give up] — you'll solve this problem!","Не сдавайся — ты решишь эту задачу!"],["Please [turn down] the music — I'm studying.","Сделай, пожалуйста, музыку тише — я занимаюсь."],["I [looked up] this word in the dictionary.","Я посмотрел это слово в словаре."],["We [ran out of] snacks during the gaming night.","У нас закончились снеки во время игрового вечера."],["How did you [find out] about the olympiad results?","Как ты узнал о результатах олимпиады?"]],"quiz":[["Never ___ up! You can do it.",["take","look","give"],2,"Give up — сдаваться."],["If you don't know a word, look it ___ in the dictionary.",["down","up","out"],1,"Look up — искать в словаре."],["Please turn ___ the music. It's too loud.",["up","out","down"],2,"Turn down — сделать тише."],["We've run ___ of milk. Can you buy some?",["up","out","down"],1,"Run out of — закончиться."],["I want to find ___ who broke my mug.",["down","up","out"],2,"Find out — узнать."],["Calm ___! It's only a game.",["down","up","out"],0,"Calm down — успокоиться."],["Write ___ the teacher's phone number so you don't forget it.",["away","off","down"],2,"Write down — записать."],["Oleg wants to be a pilot when he grows ___.",["down","out","up"],2,"Grow up — вырасти."],["I can't work ___ this maths problem.",["up","out","down"],1,"Work out — разобраться, решить."],["My laptop broke ___ yesterday, so I couldn't play.",["out","up","down"],2,"Break down — сломаться (о технике)."],["Can you pick ___ my pencil, please? It fell under your desk.",["out","down","up"],2,"Pick up — поднять."],["Max didn't turn ___ for practice yesterday.",["down","out","up"],2,"Turn up — появиться, прийти."],["I need to sort ___ my room before Mum comes.",["out","down","up"],0,"Sort out — привести в порядок."],["This word is new. Look ___.",["it out","it up","up it"],1,"Местоимение ставится между глаголом и частицей: look it up."]],"tr":[["Не сдавайся!","give up",["Do not give up"]],["Сделай музыку тише, пожалуйста.","turn down",["Please turn down the music","Please turn the music down","Turn down the music, please","Turn the music down, please","Turn down the music please","Turn the music down please"]],["Я посмотрел это слово в словаре.","look up",["I looked up this word in the dictionary","I looked this word up in the dictionary","I looked up the word in the dictionary","I looked the word up in the dictionary","I looked it up in the dictionary"]],["У нас закончился хлеб.","run out of",["We have run out of bread","We ran out of bread"]]]},{"t":"Фразовые глаголы с on, off, back","l":"B1","rule":"On — продолжение или включение: go on / carry on (продолжать), put on (надеть), turn/switch on (включить), get on with (ладить с кем-то). Off — отключение или отделение: turn/switch off (выключить), take off (снять одежду; взлететь), put off (отложить), set off (отправиться в путь). Back — возврат: come back (вернуться), give back (вернуть), call back (перезвонить).","ex":[["[Put on] your jacket — it's cold outside.","Надень куртку — на улице холодно."],["Please [switch off] your phones before the exam.","Пожалуйста, выключите телефоны перед экзаменом."],["Can you [give] my charger [back] tomorrow?","Можешь вернуть мою зарядку завтра?"],["I [get on] well with my classmates.","Я хорошо лажу с одноклассниками."],["The match was [put off] because of the snow.","Матч перенесли из-за снега."]],"quiz":[["It's cold. Put ___ your hat.",["on","off","back"],0,"Put on — надеть."],["Take ___ your shoes before you come in.",["on","back","off"],2,"Take off — снять."],["When will you come ___ from the trip?",["back","on","off"],0,"Come back — вернуться."],["Turn ___ the light when you leave the room.",["back","off","on"],1,"Turn off — выключить."],["Can I call you ___ later? I'm on the bus.",["off","back","on"],1,"Call back — перезвонить."],["The plane took ___ at 6 am.",["off","back","on"],0,"Take off — взлететь."],["Go ___! I'm listening.",["off","on","back"],1,"Go on — продолжай."],["Please give me ___ my book when you finish it.",["back","on","off"],0,"Give back — вернуть."],["Don't put ___ your homework until Sunday evening.",["back","on","off"],2,"Put off — откладывать."],["Do you get ___ well with your brother?",["off","on","back"],1,"Get on with — ладить."],["We set ___ early in the morning to catch the train.",["off","back","on"],0,"Set off — отправиться в путь."],["Switch ___ the TV — the match is starting!",["off","on","back"],1,"Switch on — включить."],["Carry ___ working — you're doing great.",["off","on","back"],1,"Carry on — продолжать."],["I lent Max my game, and he still hasn't given it ___.",["off","back","on"],1,"Give back — вернуть."]],"tr":[["Надень куртку!","put on",["Put on your jacket","Put your jacket on"]],["Выключи телефон, пожалуйста.","switch/turn off",["Please switch off your phone","Please turn off your phone","Please switch your phone off","Please turn your phone off","Switch off your phone, please","Turn off your phone, please","Switch your phone off, please","Turn your phone off, please","Switch off your phone please","Turn off your phone please","Switch your phone off please","Turn your phone off please"]],["Я вернусь в пять.","come back",["I will come back at five","I will come back at 5","I will come back at five o'clock","I will be back at five","I will be back at 5","I will be back at five o'clock","I will return at five","I will return at 5","I will return at five o'clock"]],["Перезвони мне позже.","call back",["Call me back later","Phone me back later","Ring me back later"]]]},{"t":"Stop, remember, try, forget + -ing или to","l":"B1","rule":"Некоторые глаголы меняют смысл в зависимости от формы после них. Stop doing — перестать делать; stop to do — остановиться, чтобы сделать. Remember/forget doing — помнить/забыть то, что уже делал (прошлое); remember/forget to do — не забыть / забыть сделать (обязанность). Try to do — пытаться, стараться (трудно); try doing — попробовать как способ, эксперимент. С like, love, hate, start, begin возможны обе формы почти без разницы.","ex":[["Oleg [stopped playing] when Mum came in.","Олег перестал играть, когда вошла мама."],["On the way to school we [stopped to buy] some water.","По дороге в школу мы остановились купить воды."],["[Remember to take] your calculator to the exam!","Не забудь взять калькулятор на экзамен!"],["I [remember visiting] Lviv when I was six.","Я помню, как ездил во Львов, когда мне было шесть."],["I [tried to solve] the problem, but it was too hard.","Я пытался решить задачу, но она была слишком сложной."]],"quiz":[["Stop ___ noise! I'm trying to study.",["making","make","to make"],0,"Stop doing — перестать делать."],["On the way, we stopped ___ a photo of the river, then drove on.",["take","taking","to take"],2,"Остановились, чтобы сфотографировать — stop to do."],["Remember ___ the door when you leave.",["to lock","locking","lock"],0,"Не забудь сделать — remember to do."],["I remember ___ my first goal — I was so happy!",["score","to score","scoring"],2,"Помню то, что уже было, — remember doing."],["Don't forget ___ Grandma on her birthday.",["call","calling","to call"],2,"Не забудь сделать — forget to do."],["I'll never forget ___ the Carpathian mountains for the first time.",["see","to see","seeing"],2,"Никогда не забуду пережитое — forget doing."],["I tried ___ the window, but it was stuck.",["open","opened","to open"],2,"Пытался (не получилось) — try to do."],["If you can't sleep, try ___ some warm milk.",["drinking","drank","drunk"],0,"Попробуй как способ — try doing."],["He stopped ___ games and started doing his homework.",["to play","playing","play"],1,"Перестал играть — stop doing."],["Did you remember ___ the milk? — Oh no, I forgot!",["buying","to buy","buy"],1,"Не забыл ли сделать — remember to do."],["I don't remember ___ this film. Are you sure we watched it?",["to watch","watch","watching"],2,"Помнить о прошлом — remember doing."],["Max is trying ___ his English for the exam.",["improving","to improve","improve"],1,"Старается — try to do."],["The teacher stopped ___ because the bell rang.",["talking","talk","to talk"],0,"Перестал говорить — stop doing."],["Oleg forgot ___ his homework, so he got a bad mark.",["doing","to do","do"],1,"Забыл сделать — forget to do."]],"tr":[["Перестань кричать!","stop + -ing",["Stop shouting","Stop screaming","Stop yelling"]],["Не забудь купить хлеб.","forget + to",["Do not forget to buy bread","Do not forget to buy some bread","Do not forget to buy the bread","Remember to buy bread","Remember to buy some bread","Remember to buy the bread"]],["Я помню, как забил свой первый гол.","remember + -ing",["I remember scoring my first goal"]],["Мы остановились, чтобы купить воды.","stop + to",["We stopped to buy some water","We stopped to buy water"]]]},{"t":"Be used to / get used to / used to","l":"B1","rule":"Be used to + V-ing или существительное — «привык (к чему-то)», это уже привычно: I am used to getting up early. Get used to + V-ing или существительное — «привыкать», процесс: I'm getting used to my new school. Не путать с used to + V — «раньше (делал), а теперь нет»: I used to live in Kharkiv. После be/get used to — всегда -ing или существительное, не инфинитив! В вопросах и отрицаниях с did: Did you use to…? I didn't use to…","ex":[["I [am used to getting] up at 6 for training.","Я привык вставать в 6 на тренировку."],["Oleg [isn't used to] online lessons yet.","Олег ещё не привык к онлайн-урокам."],["It took me a month to [get used to] the new lyceum.","Мне понадобился месяц, чтобы привыкнуть к новому лицею."],["We [used to play] football every evening, but now we don't have time.","Раньше мы играли в футбол каждый вечер, а теперь нет времени."],["You'll soon [get used to] the cold weather.","Ты скоро привыкнешь к холодной погоде."]],"quiz":[["I'm used to ___ up early.",["got","getting","get"],1,"Be used to + V-ing."],["She ___ used to the noise yet.",["didn't","isn't","doesn't"],1,"Be used to — в отрицании isn't."],["Don't worry, you'll soon get used to ___ in a new city.",["live","living","lived"],1,"Get used to + V-ing."],["I ___ play the violin when I was little, but I stopped.",["am used to","used to","get used to"],1,"Раньше делал, теперь нет — used to + V."],["It's hard to ___ used to wearing glasses.",["have","get","do"],1,"Процесс привыкания — get used to."],["Are you used to ___ British English?",["hear","heard","hearing"],2,"Be used to + V-ing."],["Oleg ___ go to bed at 9, but now he stays up until 10.",["is used to","used to","gets used to"],1,"Раньше, а теперь нет — used to + V."],["My dad is used to ___ long hours.",["worked","working","work"],1,"Be used to + V-ing."],["We ___ getting used to our new teacher.",["do","have","are"],2,"Процесс сейчас — are getting used to."],["Max moved to Canada. He ___ used to the cold winters yet.",["hasn't","isn't","doesn't"],1,"Be used to: isn't used to."],["I didn't ___ to like vegetables, but now I love them.",["use","using","used"],0,"После didn't — use to (без d)."],["Did you use to ___ cartoons when you were small?",["watching","watched","watch"],2,"Use to + инфинитив без to."],["Ira can't get used to ___ in the morning.",["ran","running","run"],1,"Get used to + V-ing."],["My grandma is used ___ her smartphone now.",["for","with","to"],2,"Be used to + существительное."]],"tr":[["Я привык рано вставать.","be used to + -ing",["I am used to getting up early","I am used to waking up early"]],["Олег привыкает к новой школе.","get used to",["Oleg is getting used to the new school","Oleg is getting used to his new school"]],["Раньше я играл в футбол каждый день.","used to + V",["I used to play football every day"]],["Ты скоро привыкнешь к этому.","get used to",["You will soon get used to it","You will soon get used to this","You will get used to it soon","You will get used to this soon"]]]},{"t":"Although, however, despite: слова-связки","l":"B1","rule":"Although / though / even though + полное предложение (подлежащее + глагол): Although it was raining, we played. However — «однако», обычно стоит в начале нового предложения и отделяется запятой: It was raining. However, we played. Despite / in spite of + существительное или V-ing (не целое предложение!): Despite the rain, we played. Также полезны: because (+ предложение), because of (+ существительное), so (поэтому), whereas (тогда как).","ex":[["[Although] it was raining, we played football.","Хотя шёл дождь, мы играли в футбол."],["The test was hard. [However], I passed it.","Контрольная была трудной. Однако я её сдал."],["[Despite] the cold weather, Oleg didn't wear a hat.","Несмотря на холодную погоду, Олег не надел шапку."],["[In spite of] being tired, Max finished his project.","Несмотря на усталость, Макс закончил проект."],["I like physics, [whereas] my brother prefers drawing.","Я люблю физику, тогда как мой брат предпочитает рисование."]],"quiz":[["___ it was late, we continued playing.",["Despite","However","Although"],2,"Перед целым предложением — although."],["___ the rain, the match wasn't cancelled.",["However","Although","Despite"],2,"Перед существительным — despite."],["The test was difficult. ___, everyone passed.",["However","Although","Despite"],0,"В начале нового предложения с запятой — however."],["We went out in spite ___ the snow.",["that","of","to"],1,"Устойчиво: in spite of."],["Despite ___ ill, she went to the olympiad.",["be","being","she was"],1,"После despite — V-ing, не предложение."],["___ he trained a lot, he didn't win.",["Even though","Despite","In spite of"],0,"Перед предложением — even though."],["I didn't go to the party ___ I was tired.",["despite","because","although"],1,"Причина — because."],["Oleg is noisy, ___ his friend is very quiet.",["despite","whereas","however"],1,"Противопоставление внутри предложения — whereas."],["She was hungry, ___ she made a sandwich.",["despite","so","although"],1,"Следствие — so."],["In spite of ___, we enjoyed the trip.",["the weather was bad","it was cold","the bad weather"],2,"После in spite of — существительное."],["Max is clever. ___, he sometimes gets bad marks.",["However","Despite","Although"],0,"Начало нового предложения + запятая — however."],["___ having a lot of homework, I watched a film.",["However","Although","Despite"],2,"Перед V-ing — despite."],["The game was cancelled ___ the storm.",["although","because","because of"],2,"Перед существительным — because of."],["I passed the exam, ___ I hadn't studied much.",["even though","despite","in spite of"],0,"Перед предложением — even though."]],"tr":[["Хотя было холодно, мы играли в футбол.","Although + предложение",["Although it was cold, we played football","Though it was cold, we played football","Even though it was cold, we played football","We played football although it was cold","We played football though it was cold","We played football even though it was cold","Although it was cold we played football","Though it was cold we played football","Even though it was cold we played football"]],["Несмотря на дождь, мы пошли гулять.","Despite + существительное",["Despite the rain, we went for a walk","In spite of the rain, we went for a walk","Despite the rain, we went out","In spite of the rain, we went out","We went for a walk despite the rain","We went for a walk in spite of the rain","Despite the rain we went for a walk","In spite of the rain we went for a walk","Despite the rain we went out","In spite of the rain we went out"]],["Тест был трудным. Однако я его сдал.","However,",["The test was difficult. However, I passed it","The test was hard. However, I passed it","The test was difficult. However I passed it","The test was hard. However I passed it"]],["Несмотря на усталость, Макс закончил проект.","Despite + V-ing",["Despite being tired, Max finished the project","Despite being tired, Max finished his project","In spite of being tired, Max finished the project","In spite of being tired, Max finished his project","Despite being tired Max finished the project","Despite being tired Max finished his project","In spite of being tired Max finished the project","In spite of being tired Max finished his project"]]]},{"t":"Both, either, neither, all, none","l":"B1","rule":"Both (оба) — о двух, глагол во множественном числе: Both boys play chess. Either — «любой из двух»: You can take either book. Neither — «ни один из двух», отрицание уже внутри, поэтому глагол без not: Neither answer is correct. Пары: both…and (и…и), either…or (или…или), neither…nor (ни…ни). All — «все» (о трёх и более), none — «ни один» (о трёх и более): None of my friends came. Перед существительным с the/my/these используем of: neither of my friends, all of the students.","ex":[["[Both] my friends play the guitar.","Оба моих друга играют на гитаре."],["[Neither] Max [nor] Ira came to the lesson.","Ни Макс, ни Ира не пришли на урок."],["You can call me [either] today [or] tomorrow.","Можешь позвонить мне либо сегодня, либо завтра."],["[All] the students passed the test.","Все ученики сдали тест."],["[None] of us knew the answer.","Никто из нас не знал ответа."]],"quiz":[["___ my brother and I like football.",["Both","Either","Neither"],0,"Оба (и я, и брат) — both … and."],["___ Oleg nor Max was at home.",["Both","Neither","Either"],1,"Ни…ни — neither … nor."],["You can have ___ tea or coffee.",["either","neither","both"],0,"Или…или — either … or."],["I have two cousins. ___ of them lives in Kyiv — they both live in Lviv.",["Neither","Both","Either"],0,"Ни один из двух — neither."],["___ of the five questions were easy — I couldn't answer any.",["Both","All","None"],2,"Ни один из пяти — none."],["___ the students in our class have smartphones.",["Neither","All","None"],1,"Все (больше двух), без of можно: all the students."],["I don't like either of these games. = I like ___ of them.",["either","neither","both"],1,"Not … either = neither."],["There are two roads. You can take ___ — they both go to the centre.",["none","neither","either"],2,"Любую из двух — either."],["We invited ten friends, but ___ of them came.",["neither","none","no"],1,"Ни один из многих — none of."],["Both Max ___ Ira are in the maths club.",["or","nor","and"],2,"Both … and."],["Either Oleg ___ I will wash the dishes.",["nor","or","and"],1,"Either … or."],["I've read ___ of the Harry Potter books — all seven!",["all","both","none"],0,"О семи книгах — all."],["'Do you want pizza or pasta?' — '___. I'm not hungry.'",["Either","Both","Neither"],2,"Ни то, ни другое — neither."],["He speaks ___ English and German.",["both","either","neither"],0,"И…и — both … and."]],"tr":[["Оба моих друга играют в шахматы.","Both",["Both of my friends play chess","Both my friends play chess"]],["Ни Олег, ни Макс не знали ответа.","Neither … nor",["Neither Oleg nor Max knew the answer"]],["Никто из нас не был готов.","None of us",["None of us was ready","None of us were ready"]],["Ты можешь прийти в субботу или в воскресенье.","either … or",["You can come either on Saturday or on Sunday","You can come on either Saturday or Sunday","You can come either on Saturday or Sunday","You can come on Saturday or on Sunday","You can come on Saturday or Sunday"]]]},{"t":"Something, anyone, nowhere: неопределённые местоимения","l":"B1","rule":"Some- (something, somebody/someone, somewhere) — в утвердительных предложениях, а также в просьбах и предложениях (Would you like something?). Any- (anything, anybody, anywhere) — в вопросах и в отрицаниях с not; в утверждении any- значит «любой»: You can call me anytime. No- (nothing, nobody, nowhere) уже содержат отрицание, поэтому глагол без not: I know nothing = I don't know anything. Every- (everything, everybody, everywhere) — «всё, все, везде». Глагол после них — в единственном числе: Everybody is here.","ex":[["[Somebody] has taken my charger!","Кто-то взял мою зарядку!"],["Is there [anything] in the fridge?","В холодильнике что-нибудь есть?"],["I looked [everywhere], but I couldn't find my keys.","Я искал везде, но не смог найти ключи."],["[Nobody] in our class knew the answer.","Никто в нашем классе не знал ответа."],["Oleg didn't say [anything] at dinner.","Олег ничего не сказал за ужином."]],"quiz":[["There's ___ at the door. Can you open it?",["somebody","anybody","nobody"],0,"Утверждение — some-: somebody."],["I didn't buy ___ in the shop.",["something","nothing","anything"],2,"Отрицание с not — any-: anything."],["___ knows the answer — the question is too hard.",["Somebody","Nobody","Anybody"],1,"Никто не знает — nobody (глагол без not)."],["Is there ___ interesting on TV tonight?",["anything","nothing","everything"],0,"В вопросе — anything."],["I can't find my phone ___.",["anywhere","nowhere","somewhere"],0,"С can't — any-: anywhere (двойного отрицания нет)."],["___ in my class likes the new teacher — she's great.",["Nobody","Everybody","Anybody"],1,"Все — everybody."],["I'm bored. There's ___ to do.",["nothing","something","anything"],0,"Нечего делать — nothing (без not)."],["Would you like ___ to drink?",["nothing","something","nowhere"],1,"В предложении-угощении — something."],["Everybody ___ ready for the trip.",["is","are","be"],0,"После everybody — глагол в единственном числе."],["We went ___ special for my birthday — a water park.",["somewhere","anywhere","nowhere"],0,"Утверждение — somewhere."],["Did ___ call me while I was out?",["nobody","anybody","everybody"],1,"Вопрос — anybody."],["Oleg has ___ to play with — all his friends are on holiday.",["nobody","everybody","anybody"],0,"Не с кем — nobody (глагол has без not)."],["I've looked ___ for my keys — in every room!",["anywhere","everywhere","nowhere"],1,"Во всех комнатах — everywhere."],["She said ___ — she just smiled.",["something","anything","nothing"],2,"Ничего не сказала — nothing (said без not)."]],"tr":[["Кто-то взял мою ручку.","somebody/someone",["Somebody has taken my pen","Somebody took my pen","Someone has taken my pen","Someone took my pen"]],["Я ничего не знаю об этом.","nothing = not anything",["I know nothing about it","I know nothing about this","I do not know anything about it","I do not know anything about this"]],["Есть что-нибудь в холодильнике?","anything",["Is there anything in the fridge"]],["Все готовы?","everybody + is",["Is everybody ready","Is everyone ready"]]]},{"t":"Have something done: мне сделали","l":"B1","rule":"Have/get + предмет + V3 — когда действие для нас выполняет кто-то другой (обычно специалист или за плату): I had my hair cut — меня подстригли (а не я сам подстригся). Формула: have + object + V3, где have меняется по временам: I'm having my bike repaired. We have just had the windows cleaned. I will have my eyes tested. В разговорной речи часто get: I got my phone fixed.","ex":[["I [had my hair cut] yesterday.","Я вчера подстригся (в парикмахерской)."],["Dad [is having his car repaired] this week.","Папе на этой неделе ремонтируют машину."],["We [had our flat painted] last summer.","Прошлым летом нам покрасили квартиру."],["I need to [get my phone screen fixed].","Мне нужно починить экран телефона (в мастерской)."],["Oleg [had his photo taken] for his new student card.","Олега сфотографировали для нового ученического билета."]],"quiz":[["I ___ my hair cut last Saturday.",["did","made","had"],2,"Have something done — had my hair cut."],["We are having our kitchen ___.",["painting","paint","painted"],2,"После объекта — V3: painted."],["Mum had the windows ___ last week.",["cleaning","cleaned","clean"],1,"Have + объект + V3."],["I need to get my bike ___ before the trip.",["repaired","repairing","repair"],0,"Get + объект + V3."],["Where do you usually have your hair ___?",["cuts","cutting","cut"],2,"V3 от cut — cut."],["Max ___ his laptop fixed at the moment.",["had having","is having","has"],1,"At the moment — is having + объект + V3."],["Have you ever had your photo ___ by a professional?",["taken","took","take"],0,"V3 от take — taken."],["She is going to have her ears ___.",["pierce","piercing","pierced"],2,"Have + объект + V3: pierced."],["Our neighbours ___ a new fence built last month.",["had","were","have"],0,"Last month — had + объект + V3."],["I'm going to ___ my eyes tested.",["do","have","make"],1,"Have something done — have my eyes tested."],["Oleg broke his glasses, so he must have them ___.",["repair","repairing","repaired"],2,"Have them + V3."],["We have just had the internet ___.",["installing","install","installed"],2,"Have had + объект + V3."],["Why don't you ___ your jacket cleaned?",["make","do","get"],2,"Get something done."],["Did you cut your hair yourself? — No, I ___ it cut at the barber's.",["had","did","was"],0,"Не сам — had it cut."]],"tr":[["Я подстригся вчера (в парикмахерской).","had + hair + cut",["I had my hair cut yesterday","I got my hair cut yesterday","Yesterday I had my hair cut","Yesterday I got my hair cut"]],["Папе ремонтируют машину (в сервисе).","is having + V3",["Dad is having his car repaired","Dad is having his car fixed","Dad is having the car repaired","Dad is having the car fixed","Dad is getting his car repaired","Dad is getting his car fixed","Dad is getting the car repaired","Dad is getting the car fixed","My dad is having his car repaired","My dad is having his car fixed","My dad is having the car repaired","My dad is having the car fixed","My dad is getting his car repaired","My dad is getting his car fixed","My dad is getting the car repaired","My dad is getting the car fixed"]],["Нам нужно починить телефон (в мастерской).","need to have/get + V3",["We need to have our phone repaired","We need to have our phone fixed","We need to have the phone repaired","We need to have the phone fixed","We need to get our phone repaired","We need to get our phone fixed","We need to get the phone repaired","We need to get the phone fixed"]],["Нам покрасили квартиру прошлым летом.","had + V3",["We had our flat painted last summer","We had our apartment painted last summer","We had the flat painted last summer","We had the apartment painted last summer","We got our flat painted last summer","We got our apartment painted last summer","We got the flat painted last summer","We got the apartment painted last summer","Last summer we had our flat painted","Last summer we had our apartment painted","Last summer we had the flat painted","Last summer we had the apartment painted","Last summer we got our flat painted","Last summer we got our apartment painted","Last summer we got the flat painted","Last summer we got the apartment painted"]]]},{"t":"Make или do, say или tell","l":"B1","rule":"Do — работа, обязанности, деятельность: do homework, do a test, do the washing-up, do sport, do your best, do somebody a favour. Make — создание чего-то нового или результат: make a mistake, make a decision, make friends, make noise, make money, make progress, make a cake. Say something (to somebody): say hello, say sorry, say goodbye. Tell somebody something: tell me, tell the truth, tell a lie, tell a story, tell a joke.","ex":[["I [do] my homework right after school.","Я делаю домашку сразу после школы."],["Don't worry if you [make] a mistake — just try again.","Не переживай, если ошибёшься — просто попробуй снова."],["Oleg [made] a lot of noise during my online lesson.","Олег очень шумел во время моего онлайн-урока."],["Max always [tells] funny jokes.","Макс всегда рассказывает смешные шутки."],["She [said] goodbye and left.","Она попрощалась и ушла."]],"quiz":[["I always ___ my homework in the evening.",["do","tell","make"],0,"Homework — do."],["Everyone ___ mistakes sometimes.",["says","does","makes"],2,"Mistake — make."],["Can you ___ me a favour?",["tell","make","do"],2,"Do somebody a favour."],["Please ___ me the truth.",["say","speak","tell"],2,"Tell the truth; tell + кому."],["He ___ that he was busy.",["told","spoke","said"],2,"Без дополнения-человека — said."],["We need to ___ a decision quickly.",["tell","do","make"],2,"Make a decision."],["Don't ___ so much noise — Oleg is sleeping.",["say","make","do"],1,"Make noise."],["Grandpa ___ us a story about his childhood.",["said","made","told"],2,"Tell somebody a story."],["How do you ___ 'thank you' in Japanese?",["speak","say","tell"],1,"Say + слово/фраза."],["Max ___ a lot of progress in English this year.",["told","made","did"],1,"Make progress."],["It's easy to ___ friends at summer camp.",["do","make","tell"],1,"Make friends."],["I try to ___ some exercise every morning.",["make","tell","do"],2,"Do exercise."],["Oleg never ___ lies.",["tells","makes","says"],0,"Tell lies."],["Just ___ your best in the olympiad!",["make","do","tell"],1,"Do your best."]],"tr":[["Я делаю домашнее задание каждый вечер.","do homework",["I do my homework every evening","I do homework every evening","Every evening I do my homework","Every evening I do homework"]],["Все делают ошибки.","make mistakes",["Everybody makes mistakes","Everyone makes mistakes"]],["Скажи мне правду.","tell the truth",["Tell me the truth"]],["Олег сказал «привет» и убежал.","say hello",["Oleg said hello and ran away","Oleg said hello and ran off","Oleg said hi and ran away","Oleg said hi and ran off"]]]},{"t":"Словообразование: un-, dis-, -ful, -less, -ness, -tion","l":"B1","rule":"Словообразование — частое задание НМТ. Отрицательные приставки: un- (unhappy), in-/im-/il-/ir- (incorrect, impossible, illegal, irregular), dis- (dislike, disagree), mis- (misunderstand — «неправильно»). Суффиксы существительных: -tion/-sion (information, decision), -ment (development), -ness (happiness), -ity (activity), -er/-or/-ist (teacher, actor, scientist). Суффиксы прилагательных: -ful (useful — «полный»), -less (useless — «без»), -able (comfortable), -ous (famous), -al (natural), -ive (creative). Наречия: прилагательное + -ly (quick → quickly).","ex":[["This answer is [incorrect] — check it again.","Этот ответ неверный — проверь ещё раз."],["The internet is very [useful] for studying.","Интернет очень полезен для учёбы."],["Her [kindness] surprised everyone.","Её доброта всех удивила."],["We made a [decision] to start a YouTube channel.","Мы приняли решение завести YouTube-канал."],["My old headphones are [useless] — they don't work.","Мои старые наушники бесполезны — они не работают."]],"quiz":[["It's ___ to solve this problem in one minute.",["unpossible","dispossible","impossible"],2,"Перед p используется приставка im-: impossible."],["Be ___ when you cross the road.",["caring","careless","careful"],2,"-ful — «с осторожностью»: careful."],["The broken charger is ___ — throw it away.",["usement","useless","useful"],1,"-less — «без пользы»: useless."],["We need more ___ about the trip.",["informative","inform","information"],2,"Нужно существительное — information (-tion)."],["Oleg was very ___ when he lost the game.",["dishappy","inhappy","unhappy"],2,"Happy → unhappy."],["I ___ with you — I think you're wrong.",["disagree","unagree","misagree"],0,"Agree → disagree."],["Her ___ made everyone smile.",["kind","kindness","kindly"],1,"Нужно существительное — kindness (-ness)."],["This sofa is very ___.",["comfort","comfortable","comfortly"],1,"Прилагательное с -able: comfortable."],["Leonardo da Vinci was a ___ artist.",["famous","fame","famously"],0,"Прилагательное с -ous: famous."],["Sorry, I ___ the question. Can you repeat it?",["ununderstood","disunderstood","misunderstood"],2,"Mis- — «неправильно»: misunderstood."],["'Go' is an ___ verb.",["inregular","irregular","unregular"],1,"Перед r используется ir-: irregular."],["Marie Curie was a great ___.",["scientist","scientific","science"],0,"Человек — суффикс -ist: scientist."],["He speaks English ___.",["fluently","fluent","fluency"],0,"Как говорит? — наречие с -ly: fluently."],["Football is the most popular after-school ___ in our lyceum.",["activity","active","actively"],0,"Нужно существительное — activity (-ity)."]],"tr":[["Это невозможно!","im- + possible",["It is impossible","This is impossible","That is impossible"]],["Интернет очень полезен.","-ful",["The internet is very useful"]],["Я не согласен с тобой.","dis-",["I disagree with you","I do not agree with you"]],["Её доброта удивила всех.","-ness",["Her kindness surprised everybody","Her kindness surprised everyone"]]]},{"t":"Сравнение наречий и the more…, the better","l":"B1","rule":"Наречия сравниваются как прилагательные: короткие — с -er/-est (fast – faster – the fastest, hard – harder – the hardest), наречия на -ly — с more/most (quickly – more quickly – most quickly). Исключения: well – better – best, badly – worse – worst, far – farther/further, little – less, much – more. Конструкция «чем…, тем…»: The + сравнительная степень…, the + сравнительная степень: The more you practise, the better you play.","ex":[["Max runs [faster than] anyone in our class.","Макс бегает быстрее всех в нашем классе."],["Could you speak [more slowly], please?","Не могли бы вы говорить медленнее?"],["Oleg plays chess [better than] me now!","Олег теперь играет в шахматы лучше меня!"],["[The more] you read, [the more] words you know.","Чем больше ты читаешь, тем больше слов знаешь."],["[The earlier] we leave, [the sooner] we'll arrive.","Чем раньше выйдем, тем скорее приедем."]],"quiz":[["Max runs ___ than me.",["faster","more fast","fast"],0,"Короткое наречие — -er: faster."],["Please speak ___. I can't understand you.",["more slow","slowlier","more slowly"],2,"Наречие на -ly — more slowly."],["Ira sings ___ than her sister.",["better","more well","gooder"],0,"Well → better (исключение)."],["The more you pr
