s!",["should came","shouldn't have come","should have come"],2,"Жаль, что не пошёл — should have come."],["I should have ___ my phone — now the battery is dead.",["charged","charge","charging"],0,"Should have + V3: charged."],["Oleg broke the vase. He ___ football in the living room.",["shouldn't have played","should play","should have played"],0,"Зря играл — shouldn't have played."],["You look cold. You ___ a jacket.",["should have worn","should wore","shouldn't have worn"],0,"Надо было надеть — should have worn."],["Sorry, I ___ shouted at you.",["shouldn't have","should have","shouldn't"],0,"Извинение за прошлое — shouldn't have + V3."],["Our team lost because Max was on the bench. The coach ___ him earlier.",["should putting","shouldn't have put","should have put"],2,"Надо было выпустить — should have put."],["I ___ to the doctor yesterday, but I didn't.",["shouldn't have gone","should have gone","should go"],1,"Следовало пойти, но не пошёл — should have gone."],["Mum ___ bought this cake — nobody likes it.",["should have","should","shouldn't have"],2,"Зря купила — shouldn't have bought."]],"tr":[["Мне следовало больше учиться.","should have + V3",["I should have studied more","I should have learned more","I should have learnt more"]],["Тебе не следовало ложиться так поздно.","shouldn't have + V3",["You should not have gone to bed so late","You should not have stayed up so late"]],["Нам следовало выйти раньше.","should have left",["We should have left earlier"]],["Олегу не следовало брать мой ноутбук.","shouldn't have taken",["Oleg should not have taken my laptop"]]]},{"t":"Future Continuous и придаточные времени","l":"B1","rule":"Future Continuous (will be + V-ing) — действие, которое будет в процессе в определённый момент в будущем: At 8 pm tomorrow I will be playing football. В придаточных времени после when, as soon as, before, after, until, by the time будущее выражаем Present Simple, а не will: I will call you when I arrive. Если действие должно завершиться к моменту, можно использовать Present Perfect: I'll go out after I have finished my homework.","ex":[["This time tomorrow I [will be writing] the maths olympiad.","Завтра в это время я буду писать олимпиаду по математике."],["Don't call at 7 — we [will be having] dinner.","Не звони в 7 — мы будем ужинать."],["I'll text you as soon as I [get] the results.","Я напишу тебе, как только получу результаты."],["Oleg will go to bed after he [has brushed] his teeth.","Олег пойдёт спать после того, как почистит зубы."],["At 10 am on Saturday we [will be travelling] to Kyiv.","В субботу в 10 утра мы будем ехать в Киев."]],"quiz":[["This time next week I ___ on the beach.",["lay","will be lying","have lain"],1,"Процесс в момент будущего — will be + V-ing."],["Don't call me at 8 — I ___ my homework.",["did","will be doing","do"],1,"В 8 часов буду в процессе — will be doing."],["I will call you when I ___ home.",["got","get","will get"],1,"После when о будущем — Present Simple."],["We won't start until Oleg ___.",["will arrive","arrived","arrives"],2,"После until — Present Simple."],["At midnight I ___ — please be quiet when you come in.",["slept","sleep","will be sleeping"],2,"В полночь буду в процессе сна — Future Continuous."],["As soon as the lesson ___, we'll go to the canteen.",["will finish","finished","finishes"],2,"После as soon as — Present Simple."],["Tomorrow at 5 pm Max ___ in the final.",["will be playing","has played","played"],0,"Процесс в конкретный момент будущего — will be playing."],["Switch off the light before you ___ the room.",["left","leave","will leave"],1,"После before — Present Simple."],["I'll lend you the book after I ___ it.",["will read","have read","had read"],1,"Завершение к моменту в будущем — Present Perfect после after."],["Will you ___ the laptop this evening? I need it.",["be using","using","use being"],0,"Will you be + V-ing — вежливый вопрос о планах."],["Call me when you ___ ready.",["are","will be","were"],0,"После when — Present Simple: are."],["In ten years, I hope I ___ as a programmer.",["work","will be working","worked"],1,"Процесс в будущем — will be working."],["We'll wait here until the rain ___.",["will stop","stopped","stops"],2,"После until — Present Simple."],["What ___ you be doing at 9 tomorrow?",["do","will","are"],1,"Вопрос в Future Continuous: will you be doing."]],"tr":[["Завтра в шесть я буду играть в футбол.","will be + V-ing",["Tomorrow at six I will be playing football","At six tomorrow I will be playing football","Tomorrow at 6 I will be playing football","At 6 tomorrow I will be playing football","I will be playing football tomorrow at six","I will be playing football at six tomorrow","I will be playing football tomorrow at 6","I will be playing football at 6 tomorrow"]],["Я позвоню тебе, когда приду домой.","when + Present Simple",["I will call you when I come home","I will call you when I get home","I will phone you when I come home","I will phone you when I get home","I will ring you when I come home","I will ring you when I get home"]],["В восемь я буду делать домашнее задание.","will be doing",["At eight I will be doing my homework","At 8 I will be doing my homework","I will be doing my homework at eight","I will be doing my homework at 8"]],["Мы подождём, пока Олег не придёт.","until + Present Simple",["We will wait until Oleg comes","We will wait until Oleg arrives","We will wait till Oleg comes","We will wait till Oleg arrives"]]]},{"t":"Question tags: …, isn't it?","l":"B1","rule":"Разделительный вопрос (question tag) — короткий вопрос в конце предложения: «…, правда? / не так ли?». Правило: утверждение (+) → отрицательный хвостик (−), отрицание (−) → положительный хвостик (+). В хвостике повторяем вспомогательный глагол (be, do/does/did, have, can, will) и местоимение: She is tired, isn't she? You play chess, don't you? Особые случаи: I am…, aren't I? Let's…, shall we? Повелительное: Open the door, will you?","ex":[["You're from Kharkiv, [aren't you]?","Ты из Харькова, правда?"],["Oleg doesn't like broccoli, [does he]?","Олег не любит брокколи, да?"],["We won the match, [didn't we]?","Мы же выиграли матч, правда?"],["You can solve this problem, [can't you]?","Ты ведь можешь решить эту задачу?"],["Let's play FIFA, [shall we]?","Давай поиграем в FIFA, а?"]],"quiz":[["She is your sister, ___?",["isn't she","doesn't she","is she"],0,"Утверждение с is → хвостик isn't she."],["You play the guitar, ___?",["do you","aren't you","don't you"],2,"Present Simple (+) → don't you."],["They didn't come, ___?",["did they","do they","didn't they"],0,"Отрицание → положительный хвостик did they."],["I'm right, ___?",["isn't I","am not I","aren't I"],2,"Особый случай: I am → aren't I."],["Let's go to the cinema, ___?",["will we","shall we","do we"],1,"После Let's — shall we."],["Max can swim, ___?",["doesn't he","can he","can't he"],2,"Can (+) → can't he."],["You haven't seen my headphones, ___?",["haven't you","did you","have you"],2,"Haven't (−) → have you."],["Oleg will help us, ___?",["won't he","doesn't he","isn't he"],0,"Will (+) → won't he."],["It was a great game, ___?",["didn't it","isn't it","wasn't it"],2,"Was (+) → wasn't it."],["Your dad works in IT, ___?",["isn't he","doesn't he","don't he"],1,"Works (Present Simple, he) → doesn't he."],["Nobody called, ___?",["did they","didn't they","did he"],0,"Nobody — уже отрицание, хвостик положительный, местоимение they."],["Close the door, ___?",["will you","do you","are you"],0,"После повелительного — will you."],["There is a test tomorrow, ___?",["isn't there","isn't it","is there"],0,"There is → isn't there."],["He has finished the project, ___?",["didn't he","hasn't he","doesn't he"],1,"Has finished (+) → hasn't he."]],"tr":[["Ты не видел мои наушники, правда?","отрицание → положительный хвостик",["You have not seen my headphones, have you","You haven't seen my headphones, have you","You have not seen my headphones have you","You haven't seen my headphones have you"]],["Олег не любит брокколи, да?","doesn't … does he",["Oleg does not like broccoli, does he","Oleg doesn't like broccoli, does he","Oleg does not like broccoli does he","Oleg doesn't like broccoli does he"]],["Давай поиграем в футбол, хорошо?","Let's … shall we",["Let's play football, shall we","Let us play football, shall we","Let's play football shall we","Let us play football shall we"]],["Ты из Харькова, правда?","are … aren't you",["You are from Kharkiv, aren't you","You are from Kharkiv, are not you","You are from Kharkiv, are you not","You're from Kharkiv, aren't you","You are from Kharkiv aren't you","You are from Kharkiv are not you","You are from Kharkiv are you not","You're from Kharkiv aren't you"]]]},{"t":"So / such, too / enough","l":"B1","rule":"So + прилагательное или наречие: so fast, so interesting. Such + (a/an) + прилагательное + существительное: such a good game, such nice people. Too + прилагательное = «слишком» (часто «настолько, что нельзя»): too difficult to solve. Прилагательное + enough = «достаточно»: old enough to drive; enough + существительное: enough money. Конструкции: so…that, such…that, too…to, …enough to.","ex":[["The test was [so] difficult that nobody finished it.","Контрольная была такой сложной, что никто её не закончил."],["It was [such a] great match!","Это был такой отличный матч!"],["Oleg is [too] young to play this game.","Олег слишком маленький, чтобы играть в эту игру."],["I'm not tall [enough] to reach the top shelf.","Я недостаточно высокий, чтобы достать до верхней полки."],["We don't have [enough] time to finish the project.","У нас недостаточно времени, чтобы закончить проект."]],"quiz":[["The film was ___ boring that I fell asleep.",["too","such","so"],2,"So + прилагательное + that."],["It was ___ interesting book that I read it in one day.",["so","such","such an"],2,"Such + an + прилагательное + существительное (interesting начинается с гласной)."],["This box is ___ heavy for me to carry.",["too","enough","such"],0,"Too + прилагательное + to — слишком."],["He isn't old ___ to drive a car.",["too","enough","so"],1,"Прилагательное + enough."],["We don't have ___ money to buy the tickets.",["so","enough","too"],1,"Enough + существительное."],["They are ___ nice people!",["such","so","such a"],0,"People — множественное число: such без a."],["The water is ___ cold to swim in.",["such","too","enough"],1,"Too cold to swim — слишком холодная."],["Is your English good ___ to watch films without subtitles?",["so","too","enough"],2,"Good enough to — достаточно хороший."],["Max runs ___ fast that nobody can catch him.",["too","so","such"],1,"So + наречие + that."],["It was ___ hot day that we stayed at home.",["so","such","such a"],2,"Such a + прилагательное + существительное в единственном числе."],["The problem was ___ difficult for Oleg to solve.",["such","so","too"],2,"Too + прилагательное + for somebody + to."],["There aren't ___ chairs for everyone.",["enough","too","so"],0,"Enough + существительное."],["I've never seen ___ a beautiful sunset.",["too","so","such"],2,"Such + a + прилагательное + существительное."],["You're speaking ___ quickly — I can't understand you.",["such","too","enough"],1,"Too quickly — слишком быстро."]],"tr":[["Фильм был таким интересным, что я посмотрел его дважды.","so … that",["The film was so interesting that I watched it twice","The movie was so interesting that I watched it twice"]],["Это была такая хорошая игра!","such a + adj + noun",["It was such a good game","It was such a good match","That was such a good game","That was such a good match"]],["Олег слишком маленький, чтобы смотреть этот фильм.","too … to",["Oleg is too young to watch this film","Oleg is too young to watch this movie","Oleg is too little to watch this film","Oleg is too little to watch this movie","Oleg is too small to watch this film","Oleg is too small to watch this movie"]],["У нас недостаточно времени.","enough + noun",["We do not have enough time","We have not got enough time"]]]},{"t":"Фразовые глаголы с up, down, out","l":"B1","rule":"Фразовый глагол = глагол + частица, и значение часто меняется полностью. Up — завершение или движение вверх: give up (бросить, сдаться), look up (найти в словаре), grow up (вырасти), turn up (сделать громче; появиться). Down — уменьшение: turn down (сделать тише; отказать), calm down (успокоиться), write down (записать), break down (сломаться). Out — наружу или до конца: find out (узнать), run out of (закончиться), work out (разобраться; тренироваться), sort out (уладить). Местоимение стоит между глаголом и частицей: look it up, а не look up it.","ex":[["Don't [give up] — you'll solve this problem!","Не сдавайся — ты решишь эту задачу!"],["Please [turn down] the music — I'm studying.","Сделай, пожалуйста, музыку тише — я занимаюсь."],["I [looked up] this word in the dictionary.","Я посмотрел это слово в словаре."],["We [ran out of] snacks during the gaming night.","У нас закончились снеки во время игрового вечера."],["How did you [find out] about the olympiad results?","Как ты узнал о результатах олимпиады?"]],"quiz":[["Never ___ up! You can do it.",["take","look","give"],2,"Give up — сдаваться."],["If you don't know a word, look it ___ in the dictionary.",["down","up","out"],1,"Look up — искать в словаре."],["Please turn ___ the music. It's too loud.",["up","out","down"],2,"Turn down — сделать тише."],["We've run ___ of milk. Can you buy some?",["up","out","down"],1,"Run out of — закончиться."],["I want to find ___ who broke my mug.",["down","up","out"],2,"Find out — узнать."],["Calm ___! It's only a game.",["down","up","out"],0,"Calm down — успокоиться."],["Write ___ the teacher's phone number so you don't forget it.",["away","off","down"],2,"Write down — записать."],["Oleg wants to be a pilot when he grows ___.",["down","out","up"],2,"Grow up — вырасти."],["I can't work ___ this maths problem.",["up","out","down"],1,"Work out — разобраться, решить."],["My laptop broke ___ yesterday, so I couldn't play.",["out","up","down"],2,"Break down — сломаться (о технике)."],["Can you pick ___ my pencil, please? It fell under your desk.",["out","down","up"],2,"Pick up — поднять."],["Max didn't turn ___ for practice yesterday.",["down","out","up"],2,"Turn up — появиться, прийти."],["I need to sort ___ my room before Mum comes.",["out","down","up"],0,"Sort out — привести в порядок."],["This word is new. Look ___.",["it out","it up","up it"],1,"Местоимение ставится между глаголом и частицей: look it up."]],"tr":[["Не сдавайся!","give up",["Do not give up"]],["Сделай музыку тише, пожалуйста.","turn down",["Please turn down the music","Please turn the music down","Turn down the music, please","Turn the music down, please","Turn down the music please","Turn the music down please"]],["Я посмотрел это слово в словаре.","look up",["I looked up this word in the dictionary","I looked this word up in the dictionary","I looked up the word in the dictionary","I looked the word up in the dictionary","I looked it up in the dictionary"]],["У нас закончился хлеб.","run out of",["We have run out of bread","We ran out of bread"]]]},{"t":"Фразовые глаголы с on, off, back","l":"B1","rule":"On — продолжение или включение: go on / carry on (продолжать), put on (надеть), turn/switch on (включить), get on with (ладить с кем-то). Off — отключение или отделение: turn/switch off (выключить), take off (снять одежду; взлететь), put off (отложить), set off (отправиться в путь). Back — возврат: come back (вернуться), give back (вернуть), call back (перезвонить).","ex":[["[Put on] your jacket — it's cold outside.","Надень куртку — на улице холодно."],["Please [switch off] your phones before the exam.","Пожалуйста, выключите телефоны перед экзаменом."],["Can you [give] my charger [back] tomorrow?","Можешь вернуть мою зарядку завтра?"],["I [get on] well with my classmates.","Я хорошо лажу с одноклассниками."],["The match was [put off] because of the snow.","Матч перенесли из-за снега."]],"quiz":[["It's cold. Put ___ your hat.",["on","off","back"],0,"Put on — надеть."],["Take ___ your shoes before you come in.",["on","back","off"],2,"Take off — снять."],["When will you come ___ from the trip?",["back","on","off"],0,"Come back — вернуться."],["Turn ___ the light when you leave the room.",["back","off","on"],1,"Turn off — выключить."],["Can I call you ___ later? I'm on the bus.",["off","back","on"],1,"Call back — перезвонить."],["The plane took ___ at 6 am.",["off","back","on"],0,"Take off — взлететь."],["Go ___! I'm listening.",["off","on","back"],1,"Go on — продолжай."],["Please give me ___ my book when you finish it.",["back","on","off"],0,"Give back — вернуть."],["Don't put ___ your homework until Sunday evening.",["back","on","off"],2,"Put off — откладывать."],["Do you get ___ well with your brother?",["off","on","back"],1,"Get on with — ладить."],["We set ___ early in the morning to catch the train.",["off","back","on"],0,"Set off — отправиться в путь."],["Switch ___ the TV — the match is starting!",["off","on","back"],1,"Switch on — включить."],["Carry ___ working — you're doing great.",["off","on","back"],1,"Carry on — продолжать."],["I lent Max my game, and he still hasn't given it ___.",["off","back","on"],1,"Give back — вернуть."]],"tr":[["Надень куртку!","put on",["Put on your jacket","Put your jacket on"]],["Выключи телефон, пожалуйста.","switch/turn off",["Please switch off your phone","Please turn off your phone","Please switch your phone off","Please turn your phone off","Switch off your phone, please","Turn off your phone, please","Switch your phone off, please","Turn your phone off, please","Switch off your phone please","Turn off your phone please","Switch your phone off please","Turn your phone off please"]],["Я вернусь в пять.","come back",["I will come back at five","I will come back at 5","I will come back at five o'clock","I will be back at five","I will be back at 5","I will be back at five o'clock","I will return at five","I will return at 5","I will return at five o'clock"]],["Перезвони мне позже.","call back",["Call me back later","Phone me back later","Ring me back later"]]]},{"t":"Stop, remember, try, forget + -ing или to","l":"B1","rule":"Некоторые глаголы меняют смысл в зависимости от формы после них. Stop doing — перестать делать; stop to do — остановиться, чтобы сделать. Remember/forget doing — помнить/забыть то, что уже делал (прошлое); remember/forget to do — не забыть / забыть сделать (обязанность). Try to do — пытаться, стараться (трудно); try doing — попробовать как способ, эксперимент. С like, love, hate, start, begin возможны обе формы почти без разницы.","ex":[["Oleg [stopped playing] when Mum came in.","Олег перестал играть, когда вошла мама."],["On the way to school we [stopped to buy] some water.","По дороге в школу мы остановились купить воды."],["[Remember to take] your calculator to the exam!","Не забудь взять калькулятор на экзамен!"],["I [remember visiting] Lviv when I was six.","Я помню, как ездил во Львов, когда мне было шесть."],["I [tried to solve] the problem, but it was too hard.","Я пытался решить задачу, но она была слишком сложной."]],"quiz":[["Stop ___ noise! I'm trying to study.",["making","make","to make"],0,"Stop doing — перестать делать."],["On the way, we stopped ___ a photo of the river, then drove on.",["take","taking","to take"],2,"Остановились, чтобы сфотографировать — stop to do."],["Remember ___ the door when you leave.",["to lock","locking","lock"],0,"Не забудь сделать — remember to do."],["I remember ___ my first goal — I was so happy!",["score","to score","scoring"],2,"Помню то, что уже было, — remember doing."],["Don't forget ___ Grandma on her birthday.",["call","calling","to call"],2,"Не забудь сделать — forget to do."],["I'll never forget ___ the Carpathian mountains for the first time.",["see","to see","seeing"],2,"Никогда не забуду пережитое — forget doing."],["I tried ___ the window, but it was stuck.",["open","opened","to open"],2,"Пытался (не получилось) — try to do."],["If you can't sleep, try ___ some warm milk.",["drinking","drank","drunk"],0,"Попробуй как способ — try doing."],["He stopped ___ games and started doing his homework.",["to play","playing","play"],1,"Перестал играть — stop doing."],["Did you remember ___ the milk? — Oh no, I forgot!",["buying","to buy","buy"],1,"Не забыл ли сделать — remember to do."],["I don't remember ___ this film. Are you sure we watched it?",["to watch","watch","watching"],2,"Помнить о прошлом — remember doing."],["Max is trying ___ his English for the exam.",["improving","to improve","improve"],1,"Старается — try to do."],["The teacher stopped ___ because the bell rang.",["talking","talk","to talk"],0,"Перестал говорить — stop doing."],["Oleg forgot ___ his homework, so he got a bad mark.",["doing","to do","do"],1,"Забыл сделать — forget to do."]],"tr":[["Перестань кричать!","stop + -ing",["Stop shouting","Stop screaming","Stop yelling"]],["Не забудь купить хлеб.","forget + to",["Do not forget to buy bread","Do not forget to buy some bread","Do not forget to buy the bread","Remember to buy bread","Remember to buy some bread","Remember to buy the bread"]],["Я помню, как забил свой первый гол.","remember + -ing",["I remember scoring my first goal"]],["Мы остановились, чтобы купить воды.","stop + to",["We stopped to buy some water","We stopped to buy water"]]]},{"t":"Be used to / get used to / used to","l":"B1","rule":"Be used to + V-ing или существительное — «привык (к чему-то)», это уже привычно: I am used to getting up early. Get used to + V-ing или существительное — «привыкать», процесс: I'm getting used to my new school. Не путать с used to + V — «раньше (делал), а теперь нет»: I used to live in Kharkiv. После be/get used to — всегда -ing или существительное, не инфинитив! В вопросах и отрицаниях с did: Did you use to…? I didn't use to…","ex":[["I [am used to getting] up at 6 for training.","Я привык вставать в 6 на тренировку."],["Oleg [isn't used to] online lessons yet.","Олег ещё не привык к онлайн-урокам."],["It took me a month to [get used to] the new lyceum.","Мне понадобился месяц, чтобы привыкнуть к новому лицею."],["We [used to play] football every evening, but now we don't have time.","Раньше мы играли в футбол каждый вечер, а теперь нет времени."],["You'll soon [get used to] the cold weather.","Ты скоро привыкнешь к холодной погоде."]],"quiz":[["I'm used to ___ up early.",["got","getting","get"],1,"Be used to + V-ing."],["She ___ used to the noise yet.",["didn't","isn't","doesn't"],1,"Be used to — в отрицании isn't."],["Don't worry, you'll soon get used to ___ in a new city.",["live","living","lived"],1,"Get used to + V-ing."],["I ___ play the violin when I was little, but I stopped.",["am used to","used to","get used to"],1,"Раньше делал, теперь нет — used to + V."],["It's hard to ___ used to wearing glasses.",["have","get","do"],1,"Процесс привыкания — get used to."],["Are you used to ___ British English?",["hear","heard","hearing"],2,"Be used to + V-ing."],["Oleg ___ go to bed at 9, but now he stays up until 10.",["is used to","used to","gets used to"],1,"Раньше, а теперь нет — used to + V."],["My dad is used to ___ long hours.",["worked","working","work"],1,"Be used to + V-ing."],["We ___ getting used to our new teacher.",["do","have","are"],2,"Процесс сейчас — are getting used to."],["Max moved to Canada. He ___ used to the cold winters yet.",["hasn't","isn't","doesn't"],1,"Be used to: isn't used to."],["I didn't ___ to like vegetables, but now I love them.",["use","using","used"],0,"После didn't — use to (без d)."],["Did you use to ___ cartoons when you were small?",["watching","watched","watch"],2,"Use to + инфинитив без to."],["Ira can't get used to ___ in the morning.",["ran","running","run"],1,"Get used to + V-ing."],["My grandma is used ___ her smartphone now.",["for","with","to"],2,"Be used to + существительное."]],"tr":[["Я привык рано вставать.","be used to + -ing",["I am used to getting up early","I am used to waking up early"]],["Олег привыкает к новой школе.","get used to",["Oleg is getting used to the new school","Oleg is getting used to his new school"]],["Раньше я играл в футбол каждый день.","used to + V",["I used to play football every day"]],["Ты скоро привыкнешь к этому.","get used to",["You will soon get used to it","You will soon get used to this","You will get used to it soon","You will get used to this soon"]]]},{"t":"Although, however, despite: слова-связки","l":"B1","rule":"Although / though / even though + полное предложение (подлежащее + глагол): Although it was raining, we played. However — «однако», обычно стоит в начале нового предложения и отделяется запятой: It was raining. However, we played. Despite / in spite of + существительное или V-ing (не целое предложение!): Despite the rain, we played. Также полезны: because (+ предложение), because of (+ существительное), so (поэтому), whereas (тогда как).","ex":[["[Although] it was raining, we played football.","Хотя шёл дождь, мы играли в футбол."],["The test was hard. [However], I passed it.","Контрольная была трудной. Однако я её сдал."],["[Despite] the cold weather, Oleg didn't wear a hat.","Несмотря на холодную погоду, Олег не надел шапку."],["[In spite of] being tired, Max finished his project.","Несмотря на усталость, Макс закончил проект."],["I like physics, [whereas] my brother prefers drawing.","Я люблю физику, тогда как мой брат предпочитает рисование."]],"quiz":[["___ it was late, we continued playing.",["Despite","However","Although"],2,"Перед целым предложением — although."],["___ the rain, the match wasn't cancelled.",["However","Although","Despite"],2,"Перед существительным — despite."],["The test was difficult. ___, everyone passed.",["However","Although","Despite"],0,"В начале нового предложения с запятой — however."],["We went out in spite ___ the snow.",["that","of","to"],1,"Устойчиво: in spite of."],["Despite ___ ill, she went to the olympiad.",["be","being","she was"],1,"После despite — V-ing, не предложение."],["___ he trained a lot, he didn't win.",["Even though","Despite","In spite of"],0,"Перед предложением — even though."],["I didn't go to the party ___ I was tired.",["despite","because","although"],1,"Причина — because."],["Oleg is noisy, ___ his friend is very quiet.",["despite","whereas","however"],1,"Противопоставление внутри предложения — whereas."],["She was hungry, ___ she made a sandwich.",["despite","so","although"],1,"Следствие — so."],["In spite of ___, we enjoyed the trip.",["the weather was bad","it was cold","the bad weather"],2,"После in spite of — существительное."],["Max is clever. ___, he sometimes gets bad marks.",["However","Despite","Although"],0,"Начало нового предложения + запятая — however."],["___ having a lot of homework, I watched a film.",["However","Although","Despite"],2,"Перед V-ing — despite."],["The game was cancelled ___ the storm.",["although","because","because of"],2,"Перед существительным — because of."],["I passed the exam, ___ I hadn't studied much.",["even though","despite","in spite of"],0,"Перед предложением — even though."]],"tr":[["Хотя было холодно, мы играли в футбол.","Although + предложение",["Although it was cold, we played football","Though it was cold, we played football","Even though it was cold, we played football","We played football although it was cold","We played football though it was cold","We played football even though it was cold","Although it was cold we played football","Though it was cold we played football","Even though it was cold we played football"]],["Несмотря на дождь, мы пошли гулять.","Despite + существительное",["Despite the rain, we went for a walk","In spite of the rain, we went for a walk","Despite the rain, we went out","In spite of the rain, we went out","We went for a walk despite the rain","We went for a walk in spite of the rain","Despite the rain we went for a walk","In spite of the rain we went for a walk","Despite the rain we went out","In spite of the rain we went out"]],["Тест был трудным. Однако я его сдал.","However,",["The test was difficult. However, I passed it","The test was hard. However, I passed it","The test was difficult. However I passed it","The test was hard. However I passed it"]],["Несмотря на усталость, Макс закончил проект.","Despite + V-ing",["Despite being tired, Max finished the project","Despite being tired, Max finished his project","In spite of being tired, Max finished the project","In spite of being tired, Max finished his project","Despite being tired Max finished the project","Despite being tired Max finished his project","In spite of being tired Max finished the project","In spite of being tired Max finished his project"]]]},{"t":"Both, either, neither, all, none","l":"B1","rule":"Both (оба) — о двух, глагол во множественном числе: Both boys play chess. Either — «любой из двух»: You can take either book. Neither — «ни один из двух», отрицание уже внутри, поэтому глагол без not: Neither answer is correct. Пары: both…and (и…и), either…or (или…или), neither…nor (ни…ни). All — «все» (о трёх и более), none — «ни один» (о трёх и более): None of my friends came. Перед существительным с the/my/these используем of: neither of my friends, all of the students.","ex":[["[Both] my friends play the guitar.","Оба моих друга играют на гитаре."],["[Neither] Max [nor] Ira came to the lesson.","Ни Макс, ни Ира не пришли на урок."],["You can call me [either] today [or] tomorrow.","Можешь позвонить мне либо сегодня, либо завтра."],["[All] the students passed the test.","Все ученики сдали тест."],["[None] of us knew the answer.","Никто из нас не знал ответа."]],"quiz":[["___ my brother and I like football.",["Both","Either","Neither"],0,"Оба (и я, и брат) — both … and."],["___ Oleg nor Max was at home.",["Both","Neither","Either"],1,"Ни…ни — neither … nor."],["You can have ___ tea or coffee.",["either","neither","both"],0,"Или…или — either … or."],["I have two cousins. ___ of them lives in Kyiv — they both live in Lviv.",["Neither","Both","Either"],0,"Ни один из двух — neither."],["___ of the five questions were easy — I couldn't answer any.",["Both","All","None"],2,"Ни один из пяти — none."],["___ the students in our class have smartphones.",["Neither","All","None"],1,"Все (больше двух), без of можно: all the students."],["I don't like either of these games. = I like ___ of them.",["either","neither","both"],1,"Not … either = neither."],["There are two roads. You can take ___ — they both go to the centre.",["none","neither","either"],2,"Любую из двух — either."],["We invited ten friends, but ___ of them came.",["neither","none","no"],1,"Ни один из многих — none of."],["Both Max ___ Ira are in the maths club.",["or","nor","and"],2,"Both … and."],["Either Oleg ___ I will wash the dishes.",["nor","or","and"],1,"Either … or."],["I've read ___ of the Harry Potter books — all seven!",["all","both","none"],0,"О семи книгах — all."],["'Do you want pizza or pasta?' — '___. I'm not hungry.'",["Either","Both","Neither"],2,"Ни то, ни другое — neither."],["He speaks ___ English and German.",["both","either","neither"],0,"И…и — both … and."]],"tr":[["Оба моих друга играют в шахматы.","Both",["Both of my friends play chess","Both my friends play chess"]],["Ни Олег, ни Макс не знали ответа.","Neither … nor",["Neither Oleg nor Max knew the answer"]],["Никто из нас не был готов.","None of us",["None of us was ready","None of us were ready"]],["Ты можешь прийти в субботу или в воскресенье.","either … or",["You can come either on Saturday or on Sunday","You can come on either Saturday or Sunday","You can come either on Saturday or Sunday","You can come on Saturday or on Sunday","You can come on Saturday or Sunday"]]]},{"t":"Something, anyone, nowhere: неопределённые местоимения","l":"B1","rule":"Some- (something, somebody/someone, somewhere) — в утвердительных предложениях, а также в просьбах и предложениях (Would you like something?). Any- (anything, anybody, anywhere) — в вопросах и в отрицаниях с not; в утверждении any- значит «любой»: You can call me anytime. No- (nothing, nobody, nowhere) уже содержат отрицание, поэтому глагол без not: I know nothing = I don't know anything. Every- (everything, everybody, everywhere) — «всё, все, везде». Глагол после них — в единственном числе: Everybody is here.","ex":[["[Somebody] has taken my charger!","Кто-то взял мою зарядку!"],["Is there [anything] in the fridge?","В холодильнике что-нибудь есть?"],["I looked [everywhere], but I couldn't find my keys.","Я искал везде, но не смог найти ключи."],["[Nobody] in our class knew the answer.","Никто в нашем классе не знал ответа."],["Oleg didn't say [anything] at dinner.","Олег ничего не сказал за ужином."]],"quiz":[["There's ___ at the door. Can you open it?",["somebody","anybody","nobody"],0,"Утверждение — some-: somebody."],["I didn't buy ___ in the shop.",["something","nothing","anything"],2,"Отрицание с not — any-: anything."],["___ knows the answer — the question is too hard.",["Somebody","Nobody","Anybody"],1,"Никто не знает — nobody (глагол без not)."],["Is there ___ interesting on TV tonight?",["anything","nothing","everything"],0,"В вопросе — anything."],["I can't find my phone ___.",["anywhere","nowhere","somewhere"],0,"С can't — any-: anywhere (двойного отрицания нет)."],["___ in my class likes the new teacher — she's great.",["Nobody","Everybody","Anybody"],1,"Все — everybody."],["I'm bored. There's ___ to do.",["nothing","something","anything"],0,"Нечего делать — nothing (без not)."],["Would you like ___ to drink?",["nothing","something","nowhere"],1,"В предложении-угощении — something."],["Everybody ___ ready for the trip.",["is","are","be"],0,"После everybody — глагол в единственном числе."],["We went ___ special for my birthday — a water park.",["somewhere","anywhere","nowhere"],0,"Утверждение — somewhere."],["Did ___ call me while I was out?",["nobody","anybody","everybody"],1,"Вопрос — anybody."],["Oleg has ___ to play with — all his friends are on holiday.",["nobody","everybody","anybody"],0,"Не с кем — nobody (глагол has без not)."],["I've looked ___ for my keys — in every room!",["anywhere","everywhere","nowhere"],1,"Во всех комнатах — everywhere."],["She said ___ — she just smiled.",["something","anything","nothing"],2,"Ничего не сказала — nothing (said без not)."]],"tr":[["Кто-то взял мою ручку.","somebody/someone",["Somebody has taken my pen","Somebody took my pen","Someone has taken my pen","Someone took my pen"]],["Я ничего не знаю об этом.","nothing = not anything",["I know nothing about it","I know nothing about this","I do not know anything about it","I do not know anything about this"]],["Есть что-нибудь в холодильнике?","anything",["Is there anything in the fridge"]],["Все готовы?","everybody + is",["Is everybody ready","Is everyone ready"]]]},{"t":"Have something done: мне сделали","l":"B1","rule":"Have/get + предмет + V3 — когда действие для нас выполняет кто-то другой (обычно специалист или за плату): I had my hair cut — меня подстригли (а не я сам подстригся). Формула: have + object + V3, где have меняется по временам: I'm having my bike repaired. We have just had the windows cleaned. I will have my eyes tested. В разговорной речи часто get: I got my phone fixed.","ex":[["I [had my hair cut] yesterday.","Я вчера подстригся (в парикмахерской)."],["Dad [is having his car repaired] this week.","Папе на этой неделе ремонтируют машину."],["We [had our flat painted] last summer.","Прошлым летом нам покрасили квартиру."],["I need to [get my phone screen fixed].","Мне нужно починить экран телефона (в мастерской)."],["Oleg [had his photo taken] for his new student card.","Олега сфотографировали для нового ученического билета."]],"quiz":[["I ___ my hair cut last Saturday.",["did","made","had"],2,"Have something done — had my hair cut."],["We are having our kitchen ___.",["painting","paint","painted"],2,"После объекта — V3: painted."],["Mum had the windows ___ last week.",["cleaning","cleaned","clean"],1,"Have + объект + V3."],["I need to get my bike ___ before the trip.",["repaired","repairing","repair"],0,"Get + объект + V3."],["Where do you usually have your hair ___?",["cuts","cutting","cut"],2,"V3 от cut — cut."],["Max ___ his laptop fixed at the moment.",["had having","is having","has"],1,"At the moment — is having + объект + V3."],["Have you ever had your photo ___ by a professional?",["taken","took","take"],0,"V3 от take — taken."],["She is going to have her ears ___.",["pierce","piercing","pierced"],2,"Have + объект + V3: pierced."],["Our neighbours ___ a new fence built last month.",["had","were","have"],0,"Last month — had + объект + V3."],["I'm going to ___ my eyes tested.",["do","have","make"],1,"Have something done — have my eyes tested."],["Oleg broke his glasses, so he must have them ___.",["repair","repairing","repaired"],2,"Have them + V3."],["We have just had the internet ___.",["installing","install","installed"],2,"Have had + объект + V3."],["Why don't you ___ your jacket cleaned?",["make","do","get"],2,"Get something done."],["Did you cut your hair yourself? — No, I ___ it cut at the barber's.",["had","did","was"],0,"Не сам — had it cut."]],"tr":[["Я подстригся вчера (в парикмахерской).","had + hair + cut",["I had my hair cut yesterday","I got my hair cut yesterday","Yesterday I had my hair cut","Yesterday I got my hair cut"]],["Папе ремонтируют машину (в сервисе).","is having + V3",["Dad is having his car repaired","Dad is having his car fixed","Dad is having the car repaired","Dad is having the car fixed","Dad is getting his car repaired","Dad is getting his car fixed","Dad is getting the car repaired","Dad is getting the car fixed","My dad is having his car repaired","My dad is having his car fixed","My dad is having the car repaired","My dad is having the car fixed","My dad is getting his car repaired","My dad is getting his car fixed","My dad is getting the car repaired","My dad is getting the car fixed"]],["Нам нужно починить телефон (в мастерской).","need to have/get + V3",["We need to have our phone repaired","We need to have our phone fixed","We need to have the phone repaired","We need to have the phone fixed","We need to get our phone repaired","We need to get our phone fixed","We need to get the phone repaired","We need to get the phone fixed"]],["Нам покрасили квартиру прошлым летом.","had + V3",["We had our flat painted last summer","We had our apartment painted last summer","We had the flat painted last summer","We had the apartment painted last summer","We got our flat painted last summer","We got our apartment painted last summer","We got the flat painted last summer","We got the apartment painted last summer","Last summer we had our flat painted","Last summer we had our apartment painted","Last summer we had the flat painted","Last summer we had the apartment painted","Last summer we got our flat painted","Last summer we got our apartment painted","Last summer we got the flat painted","Last summer we got the apartment painted"]]]},{"t":"Make или do, say или tell","l":"B1","rule":"Do — работа, обязанности, деятельность: do homework, do a test, do the washing-up, do sport, do your best, do somebody a favour. Make — создание чего-то нового или результат: make a mistake, make a decision, make friends, make noise, make money, make progress, make a cake. Say something (to somebody): say hello, say sorry, say goodbye. Tell somebody something: tell me, tell the truth, tell a lie, tell a story, tell a joke.","ex":[["I [do] my homework right after school.","Я делаю домашку сразу после школы."],["Don't worry if you [make] a mistake — just try again.","Не переживай, если ошибёшься — просто попробуй снова."],["Oleg [made] a lot of noise during my online lesson.","Олег очень шумел во время моего онлайн-урока."],["Max always [tells] funny jokes.","Макс всегда рассказывает смешные шутки."],["She [said] goodbye and left.","Она попрощалась и ушла."]],"quiz":[["I always ___ my homework in the evening.",["do","tell","make"],0,"Homework — do."],["Everyone ___ mistakes sometimes.",["says","does","makes"],2,"Mistake — make."],["Can you ___ me a favour?",["tell","make","do"],2,"Do somebody a favour."],["Please ___ me the truth.",["say","speak","tell"],2,"Tell the truth; tell + кому."],["He ___ that he was busy.",["told","spoke","said"],2,"Без дополнения-человека — said."],["We need to ___ a decision quickly.",["tell","do","make"],2,"Make a decision."],["Don't ___ so much noise — Oleg is sleeping.",["say","make","do"],1,"Make noise."],["Grandpa ___ us a story about his childhood.",["said","made","told"],2,"Tell somebody a story."],["How do you ___ 'thank you' in Japanese?",["speak","say","tell"],1,"Say + слово/фраза."],["Max ___ a lot of progress in English this year.",["told","made","did"],1,"Make progress."],["It's easy to ___ friends at summer camp.",["do","make","tell"],1,"Make friends."],["I try to ___ some exercise every morning.",["make","tell","do"],2,"Do exercise."],["Oleg never ___ lies.",["tells","makes","says"],0,"Tell lies."],["Just ___ your best in the olympiad!",["make","do","tell"],1,"Do your best."]],"tr":[["Я делаю домашнее задание каждый вечер.","do homework",["I do my homework every evening","I do homework every evening","Every evening I do my homework","Every evening I do homework"]],["Все делают ошибки.","make mistakes",["Everybody makes mistakes","Everyone makes mistakes"]],["Скажи мне правду.","tell the truth",["Tell me the truth"]],["Олег сказал «привет» и убежал.","say hello",["Oleg said hello and ran away","Oleg said hello and ran off","Oleg said hi and ran away","Oleg said hi and ran off"]]]},{"t":"Словообразование: un-, dis-, -ful, -less, -ness, -tion","l":"B1","rule":"Словообразование — частое задание НМТ. Отрицательные приставки: un- (unhappy), in-/im-/il-/ir- (incorrect, impossible, illegal, irregular), dis- (dislike, disagree), mis- (misunderstand — «неправильно»). Суффиксы существительных: -tion/-sion (information, decision), -ment (development), -ness (happiness), -ity (activity), -er/-or/-ist (teacher, actor, scientist). Суффиксы прилагательных: -ful (useful — «полный»), -less (useless — «без»), -able (comfortable), -ous (famous), -al (natural), -ive (creative). Наречия: прилагательное + -ly (quick → quickly).","ex":[["This answer is [incorrect] — check it again.","Этот ответ неверный — проверь ещё раз."],["The internet is very [useful] for studying.","Интернет очень полезен для учёбы."],["Her [kindness] surprised everyone.","Её доброта всех удивила."],["We made a [decision] to start a YouTube channel.","Мы приняли решение завести YouTube-канал."],["My old headphones are [useless] — they don't work.","Мои старые наушники бесполезны — они не работают."]],"quiz":[["It's ___ to solve this problem in one minute.",["unpossible","dispossible","impossible"],2,"Перед p используется приставка im-: impossible."],["Be ___ when you cross the road.",["caring","careless","careful"],2,"-ful — «с осторожностью»: careful."],["The broken charger is ___ — throw it away.",["usement","useless","useful"],1,"-less — «без пользы»: useless."],["We need more ___ about the trip.",["informative","inform","information"],2,"Нужно существительное — information (-tion)."],["Oleg was very ___ when he lost the game.",["dishappy","inhappy","unhappy"],2,"Happy → unhappy."],["I ___ with you — I think you're wrong.",["disagree","unagree","misagree"],0,"Agree → disagree."],["Her ___ made everyone smile.",["kind","kindness","kindly"],1,"Нужно существительное — kindness (-ness)."],["This sofa is very ___.",["comfort","comfortable","comfortly"],1,"Прилагательное с -able: comfortable."],["Leonardo da Vinci was a ___ artist.",["famous","fame","famously"],0,"Прилагательное с -ous: famous."],["Sorry, I ___ the question. Can you repeat it?",["ununderstood","disunderstood","misunderstood"],2,"Mis- — «неправильно»: misunderstood."],["'Go' is an ___ verb.",["inregular","irregular","unregular"],1,"Перед r используется ir-: irregular."],["Marie Curie was a great ___.",["scientist","scientific","science"],0,"Человек — суффикс -ist: scientist."],["He speaks English ___.",["fluently","fluent","fluency"],0,"Как говорит? — наречие с -ly: fluently."],["Football is the most popular after-school ___ in our lyceum.",["activity","active","actively"],0,"Нужно существительное — activity (-ity)."]],"tr":[["Это невозможно!","im- + possible",["It is impossible","This is impossible","That is impossible"]],["Интернет очень полезен.","-ful",["The internet is very useful"]],["Я не согласен с тобой.","dis-",["I disagree with you","I do not agree with you"]],["Её доброта удивила всех.","-ness",["Her kindness surprised everybody","Her kindness surprised everyone"]]]},{"t":"Сравнение наречий и the more…, the better","l":"B1","rule":"Наречия сравниваются как прилагательные: короткие — с -er/-est (fast – faster – the fastest, hard – harder – the hardest), наречия на -ly — с more/most (quickly – more quickly – most quickly). Исключения: well – better – best, badly – worse – worst, far – farther/further, little – less, much – more. Конструкция «чем…, тем…»: The + сравнительная степень…, the + сравнительная степень: The more you practise, the better you play.","ex":[["Max runs [faster than] anyone in our class.","Макс бегает быстрее всех в нашем классе."],["Could you speak [more slowly], please?","Не могли бы вы говорить медленнее?"],["Oleg plays chess [better than] me now!","Олег теперь играет в шахматы лучше меня!"],["[The more] you read, [the more] words you know.","Чем больше ты читаешь, тем больше слов знаешь."],["[The earlier] we leave, [the sooner] we'll arrive.","Чем раньше выйдем, тем скорее приедем."]],"quiz":[["Max runs ___ than me.",["faster","more fast","fast"],0,"Короткое наречие — -er: faster."],["Please speak ___. I can't understand you.",["more slow","slowlier","more slowly"],2,"Наречие на -ly — more slowly."],["Ira sings ___ than her sister.",["better","more well","gooder"],0,"Well → better (исключение)."],["The more you practise, ___ you get.",["the better","better","the best"],0,"The more…, the better…"],["He did the test ___ than I expected.",["badder","worst","worse"],2,"Badly → worse (исключение)."],["Who lives ___ from the lyceum?",["farer","the most far","the farthest"],2,"Far → the farthest."],["___ we start, the sooner we finish.",["The earlier","Earlier","Early"],0,"Конструкция the + сравнительная степень."],["She drives ___ carefully than her husband.",["much","more","most"],1,"Carefully → more carefully than."],["Oleg works ___ in our family — he's always busy with Lego!",["the most hard","the hardest","hardest of"],1,"Hard → the hardest."],["The ___ you sleep, the more tired you feel.",["little","fewer","less"],2,"Little → less."],["Could you come a bit ___ tomorrow?",["earliest","earlier","more early"],1,"Early → earlier."],["The harder you train, ___ you become.",["the stronger","stronger","the strongest"],0,"The harder…, the stronger…"],["My brother eats ___ quickly of all of us.",["the more","the most","most"],1,"Превосходная степень: the most quickly."],["This time I answered ___ than last time.",["more confidently","confidentlier","more confident"],0,"Наречие на -ly — more confidently."]],"tr":[["Говори, пожалуйста, медленнее.","more slowly",["Please speak more slowly","Please speak slower","Speak more slowly, please","Speak slower, please","Speak more slowly please","Speak slower please"]],["Чем больше ты читаешь, тем больше знаешь.","The more…, the more…",["The more you read, the more you know","The more you read the more you know"]],["Макс бегает быстрее всех в классе.","the fastest",["Max runs the fastest in the class","Max runs the fastest in our class","Max runs the fastest in his class","Max runs fastest in the class","Max runs fastest in our class","Max runs fastest in his class"]],["Олег играет в шахматы лучше, чем я.","better than",["Oleg plays chess better than me","Oleg plays chess better than I do","Oleg plays chess better than I"]]]},{"t":"Повторение времён к НМТ","l":"B1","rule":"Выбираем время по сигнальным словам. Present Simple — always, usually, every day; Present Continuous — now, at the moment, Look!; Past Simple — yesterday, ago, last year, in 2020; Past Continuous — while, at 5 pm yesterday; Present Perfect — already, yet, just, ever, never, since/for (результат к настоящему); Past Perfect — by the time, before (раньше другого прошлого); Future Simple — tomorrow, next week, I think; be going to — планы и прогнозы по очевидным признакам.","ex":[["Oleg usually [gets up] at 7.","Олег обычно встаёт в 7."],["Look! Max [is running] towards the goal!","Смотри! Макс бежит к воротам!"],["I [have already finished] my project.","Я уже закончил свой проект."],["While I [was doing] my homework, the lights went out.","Пока я делал домашку, выключили свет."],["Look at those clouds — it [is going to rain].","Посмотри на те тучи — сейчас пойдёт дождь."]],"quiz":[["Look! Oleg ___ on the wall!",["drew","draws","is drawing"],2,"Look! — действие сейчас: Present Continuous."],["I ___ my homework yet.",["don't finish","wasn't finishing","haven't finished"],2,"Yet в отрицании — Present Perfect."],["We ___ to Lviv two years ago.",["went","go","have gone"],0,"Ago — Past Simple."],["While I ___ a shower, my phone rang.",["was taking","take","have taken"],0,"While + длительное действие в прошлом — Past Continuous."],["Max ___ in Kharkiv since 2015.",["lives","is living","has lived"],2,"Since — Present Perfect."],["By the time I got to the lyceum, the bell ___.",["has already rung","already rang","had already rung"],2,"By the time + прошлое — Past Perfect."],["I think our team ___ the next match.",["will win","wins","is winning"],0,"I think + будущее — Future Simple."],["Ira usually ___ English after school.",["is practising","practises","practise"],1,"Usually — Present Simple, she → -s."],["Have you ever ___ to London?",["go","went","been"],2,"Have you ever + V3: been."],["Look at the sky! It ___ rain.",["goes to","rains","is going to"],2,"Прогноз по видимым признакам — be going to."],["At 8 pm yesterday I ___ a film.",["have watched","was watching","am watching"],1,"Конкретный момент в прошлом — Past Continuous."],["Oleg ___ his first tooth last week.",["has lost","lost","loses"],1,"Last week — Past Simple."],["My dad ___ in this company for ten years, and he still works there.",["has worked","works","worked"],0,"For + до сих пор — Present Perfect."],["The first lesson ___ at 8:30 every day.",["starting","starts","is start"],1,"Every day, расписание — Present Simple."]],"tr":[["Я уже сделал домашнее задание.","Present Perfect + already",["I have already done my homework","I have already finished my homework"]],["Вчера в пять я играл в футбол.","Past Continuous",["Yesterday at five I was playing football","At five yesterday I was playing football","Yesterday at 5 I was playing football","At 5 yesterday I was playing football","I was playing football yesterday at five","I was playing football at five yesterday","I was playing football yesterday at 5","I was playing football at 5 yesterday"]],["Олег обычно встаёт в семь.","Present Simple + usually",["Oleg usually gets up at seven","Oleg usually gets up at 7","Oleg usually gets up at seven o'clock","Oleg usually wakes up at seven","Oleg usually wakes up at 7","Oleg usually wakes up at seven o'clock"]],["Смотри, сейчас пойдёт дождь!","be going to",["Look, it is going to rain","Look it is going to rain"]]]},{"t":"Mixed Conditionals: прошлое и настоящее вместе","l":"B2","rule":"Смешанные условные предложения соединяют разное время в условии и результате. Прошлое условие → результат сейчас: If + Past Perfect, would + глагол (If I had slept more, I wouldn't be tired now). Постоянное условие (черта характера, факт) → результат в прошлом: If + Past Simple, would have + V3 (If I were braver, I would have entered the contest). Подсказки — now, today, tonight, yesterday, last year.","ex":[["If I [had gone] to bed earlier, I [wouldn't be] so tired now.","Если бы я лёг спать раньше, я бы сейчас не был таким уставшим."],["If Igor [hadn't missed] the bus, he [would be] in class now.","Если бы Игорь не опоздал на автобус, он бы сейчас был на уроке."],["If I [were] better at chemistry, I [would have passed] yesterday's test.","Если бы я лучше знал химию, я бы сдал вчерашний тест."],["If she [spoke] German, she [would have understood] the guide in Berlin.","Если бы она говорила по-немецки, она бы поняла экскурсовода в Берлине."],["If we [had bought] the tickets last month, we [would be] at the concert tonight.","Если бы мы купили билеты в прошлом месяце, мы бы сегодня вечером были на концерте."]],"quiz":[["If I had saved my file, I ___ my project now.",["would have had","had","would have"],2,"Прошлое условие → результат сейчас (now): would + глагол."],["I'm not brave. If I ___ braver, I would have asked her to dance at the party.",["were","am","will be"],0,"Постоянная черта (сейчас тоже) → If + Past Simple (were), результат в прошлом."],["If you had listened to the coach, you ___ injured now.",["won't be","wouldn't be","wouldn't have been now"],1,"Now — результат в настоящем: wouldn't be."],["If I ___ the tutorial yesterday, I would know how to use the app now.",["watched","had watched","would watch"],1,"Условие в прошлом (yesterday) — Past Perfect."],["Max isn't very organised. If he were more organised, he ___ the deadline last week.",["wouldn't miss","didn't miss","wouldn't have missed"],2,"Результат в прошлом (last week) — would have + V3."],["I don't speak Polish. If I ___ Polish, I would have understood the film yesterday.",["spoke","speak","will speak"],0,"Факт, верный и сейчас → If + Past Simple."],["She refused the job. If she had accepted it, she ___ in Warsaw now.",["will work","would have worked","would be working"],2,"Now — результат сейчас: would be + -ing (или would + V)."],["If I ___ my phone at home, I could call my mum now.",["didn't leave","hadn't left","wouldn't leave"],1,"Ошибка в прошлом → Past Perfect, результат сейчас — could."],["He ___ the final last year if he weren't so lazy.",["would have reached","would reach","will reach"],0,"Last year — результат в прошлом: would have + V3."],["If our team ___ the semi-final, we would be playing in the final today.",["had won","won","would win"],0,"Полуфинал уже прошёл — Past Perfect."],["I'm afraid of heights. If I weren't, I ___ the climbing wall on our school trip.",["would try","would have tried","had tried"],1,"Поездка уже была — would have + V3."],["If Igor hadn't joined the robotics club, he ___ his best friend today.",["doesn't know","won't know","wouldn't know"],2,"Today — результат сейчас: wouldn't + глагол."],["If it hadn't rained all night, the pitch ___ so wet now.",["won't be","wouldn't be","hadn't been"],1,"Now — would + be."],["If I ___ allergic to cats, I would have adopted that kitten last week.",["am not","won't be","weren't"],2,"Аллергия — постоянный факт: If + Past Simple (weren't)."]],"tr":[["Если бы я выучил формулы вчера, я бы сейчас решил эту задачу.","If + Past Perfect, would + V",["If I had learnt the formulas yesterday, I would solve this problem now","If I had learned the formulas yesterday, I would solve this problem now","If I had learnt the formulas yesterday, I could solve this problem now","If I had learned the formulas yesterday, I could solve this problem now"]],["Если бы он не потерял ключи, он был бы сейчас дома.","hadn't lost, would be",["If he had not lost his keys, he would be at home now","If he had not lost his keys, he would be home now","If he had not lost the keys, he would be at home now","If he had not lost the keys, he would be home now"]],["Если бы я был выше, меня бы взяли в баскетбольную команду в прошлом году.","If I were, would have been taken / chosen",["If I were taller, I would have been taken into the basketball team last year","If I were taller, I would have been chosen for the basketball team last year","If I were taller, they would have taken me into the basketball team last year","If I was taller, I would have been chosen for the basketball team last year","If I were taller, I would have got into the basketball team last year","If I were taller, I would have been accepted into the basketball team last year"]],["Если бы мы купили билеты, мы бы сейчас были в Одессе.","had bought, would be",["If we had bought the tickets, we would be in Odesa now","If we had bought tickets, we would be in Odesa now","If we had bought the tickets, we would now be in Odesa"]]]},{"t":"I wish + would и I wish + Past Perfect","l":"B2","rule":"I wish + Past Perfect — сожаление о прошлом (I wish I had studied more — жаль, что я не учился больше). I wish + somebody would — раздражение или желание, чтобы КТО-ТО ДРУГОЙ изменил поведение (I wish you would stop talking). С I/we would после wish обычно не используют: правильно I wish I could. If only звучит сильнее, чем I wish.","ex":[["I wish I [had started] revising earlier.","Жаль, что я не начал повторять раньше."],["I wish my brother [would stop] taking my charger.","Хоть бы брат перестал брать мою зарядку."],["If only we [hadn't lost] that match!","Если бы только мы не проиграли тот матч!"],["I wish it [would stop] raining — we want to play football.","Хоть бы дождь прекратился — мы хотим поиграть в футбол."],["She wishes she [hadn't said] that to her friend.","Она жалеет, что сказала это подруге."]],"quiz":[["I failed the test. I wish I ___ harder.",["had studied","studied","would study"],0,"Сожаление о прошлом — Past Perfect."],["I wish you ___ interrupting me all the time!",["stopped","had stopped","would stop"],2,"Раздражение поведением другого — wish + would."],["If only I ___ that video online. Everyone saw it.",["hadn't posted","didn't post","wouldn't post"],0,"Сожаление о прошлом — If only + Past Perfect."],["I wish the neighbours ___ so much noise at night.",["hadn't made","wouldn't make","don't make"],1,"Жалоба на повторяющееся поведение других — wouldn't."],["She wishes she ___ to the olympiad last year.",["went","had gone","would go"],1,"Last year — Past Perfect."],["I wish I ___ speak Japanese — I love anime.",["could","would","had"],0,"Умение сейчас — I wish I could (не I would)."],["I wish it ___ snowing! The roads are terrible.",["stopped","has stopped","would stop"],2,"Желание, чтобы ситуация изменилась — would stop."],["Do you wish you ___ a different lyceum?",["had chosen","chose","would choose"],0,"Выбор уже сделан в прошлом — had chosen."],["My dad wishes I ___ less time on my phone.",["had spent","would spend","will spend"],1,"Желание, чтобы другой изменил привычку — would."],["I wish I ___ my umbrella. I'm completely wet.",["brought","had brought","would bring"],1,"Ошибка уже совершена — Past Perfect."],["If only the bus ___ — we've been waiting for 30 minutes!",["had come","comes","would come"],2,"Нетерпение, ждём изменения — would come."],["He wishes he ___ his grandfather's advice back then.",["had followed","followed","would follow"],0,"Back then — прошлое: had followed."],["I wish my sister ___ my clothes without asking.",["hadn't borrowed","doesn't borrow","wouldn't borrow"],2,"Раздражающая привычка другого — wouldn't."],["We wish we ___ the start of the film. It was the best part.",["didn't miss","hadn't missed","wouldn't miss"],1,"Сожаление о прошлом — hadn't + V3."]],"tr":[["Жаль, что я не пошёл на тренировку вчера.","I wish + had",["I wish I had gone to training yesterday","I wish I had gone to the training yesterday","I wish I had gone to practice yesterday","I wish I had gone to the training session yesterday"]],["Хоть бы ты перестал опаздывать!","I wish you would",["I wish you would stop being late","I wish you would stop coming late","If only you would stop being late"]],["Если бы только я не забыл свой пароль!","If only + hadn't",["If only I had not forgotten my password","If only I hadn't forgotten my password"]],["Она жалеет, что не выучила английский раньше.","wishes she had",["She wishes she had learnt English earlier","She wishes she had learned English earlier","She wishes she had learnt English before","She wishes she had learned English before"]]]},{"t":"Пассив с глаголами мнения: It is said / He is believed to","l":"B2","rule":"Чтобы передать общее мнение, используют две конструкции. 1) It is said / believed / thought / reported + that + предложение (It is said that the lake is very deep). 2) Подлежащее + is said / believed + to + глагол (The lake is said to be very deep). Если речь о прошлом событии — to have + V3 (He is believed to have left the country); если о процессе сейчас — to be + -ing.","ex":[["It [is said] that this castle is 800 years old.","Говорят, что этому замку 800 лет."],["The castle [is said to be] 800 years old.","Говорят, что замку 800 лет."],["Kharkiv [is known to have] more than 40 universities.","Известно, что в Харькове более 40 университетов."],["The inventor [is believed to have built] the first model in his garage.","Считается, что изобретатель построил первую модель в своём гараже."],["The new phone [is reported to be selling] very well.","Сообщают, что новый телефон отлично продаётся."]],"quiz":[["It ___ that the new stadium will open in May.",["is expected","expects","is expecting"],0,"It is expected that… — пассив глагола мнения."],["The ancient city is believed ___ by an earthquake.",["to have been destroyed","to destroy","to be destroying"],0,"Событие в прошлом + пассив — to have been + V3."],["The singer is said ___ a new album at the moment.",["to record","to be recording","to have recorded"],1,"At the moment — процесс сейчас: to be + -ing."],["Einstein is known ___ the violin.",["to has played","playing","to have played"],2,"Прошлое действие умершего человека — to have + V3."],["It ___ that the hacker was only 16 years old.",["reported","was reported","was reporting"],1,"It was reported that… — пассив."],["The bridge is thought ___ the oldest in Ukraine.",["being","be","to be"],2,"Состояние сейчас — to be."],["Ten students ___ to have qualified for the final round.",["are said","say","are saying"],0,"Подлежащее + are said + to have…"],["The thief is believed ___ the country last night.",["to leave","leaving","to have left"],2,"Last night — прошлое: to have + V3."],["It is ___ that dolphins can recognise themselves in a mirror.",["known","knowing","knew"],0,"It is known that…"],["The company ___ to be developing a new robot.",["rumours","is rumoured","is rumouring"],1,"Пассив: is rumoured to be developing."],["Chocolate is said ___ good for your brain.",["be","to be","that it is"],1,"После is said — to + глагол."],["The ship is reported ___ near the coast two days ago.",["to have sunk","to sink","sinking"],0,"Two days ago — to have + V3."],["It ___ that the new tablet will cost more than 1,000 dollars.",["thinks","is thinking","is thought"],2,"It is thought that…"],["These paintings ___ to have been painted by a teenager.",["are believed","believe","have believed"],0,"Пассив глагола мнения: are believed to…"]],"tr":[["Говорят, что этот учитель очень строгий.","It is said that / He is said to be",["It is said that this teacher is very strict","This teacher is said to be very strict"]],["Считается, что пирамиды построили 4500 лет назад.","are believed to have been built",["The pyramids are believed to have been built 4500 years ago","It is believed that the pyramids were built 4500 years ago","The pyramids are believed to have been built 4,500 years ago","It is believed that the pyramids were built 4,500 years ago"]],["Известно, что кошки много спят.","Cats are known to",["Cats are known to sleep a lot","It is known that cats sleep a lot"]],["Сообщают, что команда готовится к турниру.","is reported to be preparing",["The team is reported to be preparing for the tournament","It is reported that the team is preparing for the tournament"]]]},{"t":"Каузатив: have/get something done, get someone to do, get + прилагательное","l":"B1","rule":"Have/get + предмет + V3 — нам что-то делают другие (I had my phone repaired). Get + человек + to + глагол — уговорить кого-то сделать (I got my brother to help me); have + человек + глагол без to — поручить (The teacher had us rewrite the essay). Get + прилагательное = становиться: get tired, get angry, get ready, get lost, get bored.","ex":[["I [got my bike fixed] at the shop near school.","Мне починили велосипед в мастерской возле школы."],["We [are having our flat painted] next week.","На следующей неделе нам покрасят квартиру."],["I finally [got my dad to buy] me new headphones.","Я наконец уговорил папу купить мне новые наушники."],["The coach [had us run] five laps.","Тренер заставил нас пробежать пять кругов."],["It's [getting dark] — let's go home.","Темнеет — пойдём домой."]],"quiz":[["I need to ___ my eyes tested before I get glasses.",["make","have","do"],1,"Have something done — проверить зрение (сделают другие)."],["We had our roof ___ after the storm.",["repair","repaired","repairing"],1,"Have + предмет + V3."],["I'll get my brother ___ me with the maths homework.",["help","helped","to help"],2,"Get + человек + to + глагол."],["The teacher had us ___ the experiment again.",["do","to do","done"],0,"Have + человек + глагол без to."],["Don't ___ angry — it was just a joke!",["make","have","get"],2,"Get + прилагательное — становиться."],["She is having her hair ___ right now.",["to cut","cut","cutting"],1,"V3 от cut — cut."],["Where did you ___ your phone screen replaced?",["get","make","let"],0,"Get something done — тебе заменили экран."],["Can you close the window? I'm getting ___.",["cold","coldly","coldness"],0,"Get + прилагательное: get cold — замерзать."],["Hurry up and get ___! The taxi is here.",["readily","ready","readiness"],1,"Get ready — собраться, приготовиться."],["Mum finally got me ___ my room.",["tidy","tidied","to tidy"],2,"Get + человек + to + глагол."],["I'm going to have my bike ___ before the race.",["check","checked","to check"],1,"Have + предмет + V3."],["My little brother always ___ bored on long car journeys.",["makes","does","gets"],2,"Get bored — начинать скучать."],["Our school had a famous scientist ___ a lecture last week.",["give","given","to give"],0,"Have + человек + глагол без to."],["I've just had my photo ___ for my new passport.",["take","took","taken"],2,"Have + предмет + V3 (taken)."]],"tr":[["Мне вчера починили ноутбук.","had/got my laptop repaired",["I had my laptop repaired yesterday","I got my laptop repaired yesterday","I had my laptop fixed yesterday","I got my laptop fixed yesterday","Yesterday I had my laptop repaired","Yesterday I got my laptop fixed"]],["Я уговорил друга пойти со мной на олимпиаду.","got my friend to go",["I got my friend to go to the olympiad with me","I got my friend to come to the olympiad with me"]],["Становится холодно, надень куртку.","It is getting cold",["It is getting cold, put on your jacket","It is getting cold, put your jacket on","It is getting cold, put on a jacket","It's getting cold, put on your jacket"]],["Тренер заставил нас повторить упражнение.","had us repeat",["The coach had us repeat the exercise","The coach made us repeat the exercise","The coach got us to repeat the exercise"]]]},{"t":"Модальные перфекты: must have, can't have, might have, needn't have","l":"B2","rule":"Модальный глагол + have + V3 — выводы и оценка прошлого. Must have done — наверняка сделал; can't/couldn't have done — не может быть, чтобы сделал; might/may/could have done — возможно, сделал. Needn't have done — сделал, но это было не нужно (а didn't need to do — не делал, потому что не нужно было).","ex":[["The streets are wet. It [must have rained] at night.","Улицы мокрые. Ночью, должно быть, шёл дождь."],["He [can't have finished] the test so quickly — it's very long.","Не может быть, что он так быстро закончил тест — он очень длинный."],["She isn't answering. She [might have gone] to bed.","Она не отвечает. Возможно, она уже легла спать."],["You [needn't have bought] milk — we have plenty.","Не нужно было покупать молоко — у нас его много."],["I [could have won], but I made a silly mistake.","Я мог бы выиграть, но сделал глупую ошибку."]],"quiz":[["Oleg's eyes are red. He ___ crying.",["must have been","can't have been","needn't have been"],0,"Явные признаки — уверенный вывод: must have been."],["She ___ seen me — she was looking the other way.",["must have","can't have","needn't have"],1,"Логически невозможно — can't have."],["I'm not sure where my keys are. I ___ left them at school.",["must have","might have","can't have"],1,"Неуверенное предположение — might have."],["You ___ brought food — the party had plenty of pizza.",["needn't have","mustn't have","can't have"],0,"Сделал, но было не нужно — needn't have."],["The window is broken and there's a ball inside. Someone ___ been playing football.",["needn't have","can't have","must have"],2,"Очевидный вывод — must have."],["He ___ written this essay himself — it's full of words he doesn't know.",["can't have","must have","should have"],0,"Не может быть — can't have."],["We ___ taken a taxi. It's only a five-minute walk!",["mustn't have","needn't have","can't have"],1,"Взяли такси зря — needn't have."],["Why didn't you call me? I ___ helped you.",["must have","could have","can't have"],1,"Была возможность, но не использовали — could have."],["The light is off. They ___ gone out.",["can't have","needn't have","must have"],2,"Логичный вывод — must have."],["Anna got 200 points on the NMT? She ___ worked really hard.",["must have","can't have","needn't have"],0,"Уверенный вывод о прошлом — must have."],["Max ___ taken your charger — he was in Lviv all week.",["must have","needn't have","couldn't have"],2,"Невозможно (был в другом городе) — couldn't have."],["I'm not sure, but the parcel ___ been delivered to the wrong address.",["must have","may have","can't have"],1,"Неуверенно — may have."],["I didn't need to wake up early, so I ___ until ten.",["slept","needn't have slept","must have slept"],0,"Не нужно было, поэтому и не делал — просто Past Simple (didn't need to → slept)."],["Don't worry about the tickets — you ___ bought them, the event was free.",["needn't have","mustn't have","couldn't have"],0,"Купил, но не нужно было — needn't have."]],"tr":[["Он, должно быть, забыл о встрече.","must have forgotten",["He must have forgotten about the meeting","He must have forgotten the meeting"]],["Не может быть, что она это сказала.","can't have said",["She can not have said that","She cannot have said that","She could not have said that","She cannot have said it","She could not have said it"]],["Возможно, они опоздали на поезд.","might have missed",["They might have missed the train","They may have missed the train","They could have missed the train"]],["Тебе не нужно было ждать меня.","needn't have waited",["You need not have waited for me","You needn't have waited for me","You did not need to wait for me"]]]},{"t":"Future Perfect и Future Perfect Continuous","l":"B2","rule":"Future Perfect (will have + V3) — действие будет завершено к определённому моменту в будущем: By June I will have finished school. Future Perfect Continuous (will have been + -ing) — сколько времени действие будет длиться к моменту в будущем: By May I will have been studying English for eight years. Сигналы: by, by the time, by then, for … by.","ex":[["By 2030 I [will have graduated] from university.","К 2030 году я уже окончу университет."],["By the time you arrive, we [will have eaten] all the pizza.","К тому времени, как ты придёшь, мы уже съедим всю пиццу."],["Next month I [will have been learning] Python for two years.","В следующем месяце будет два года, как я учу Python."],["[Will] you [have finished] the report by Friday?","Ты закончишь отчёт к пятнице?"],["By 6 pm the players [will have been training] for four hours.","К 6 вечера игроки будут тренироваться уже четыре часа."]],"quiz":[["By the end of this year, I ___ 30 books.",["will read","will have read","am reading"],1,"By the end of — завершённость к моменту: Future Perfect."],["By July, my parents ___ in this flat for ten years.",["will live","are living","will have been living"],2,"Длительность к моменту в будущем — Future Perfect Continuous."],["Call me at nine. I ___ my homework by then.",["will do","will have done","do"],1,"By then — Future Perfect."],["By the time we get to the cinema, the film ___.",["starts","has started","will have started"],2,"By the time + будущее — Future Perfect."],["In September, Igor ___ at this lyceum for three years.",["will have been studying","will study","studies"],0,"For three years + момент в будущем — Future Perfect Continuous."],["Don't worry, the paint ___ by tomorrow morning.",["dries","has dried","will have dried"],2,"Завершится к утру — Future Perfect."],["By the time she retires, she ___ for 40 years.",["will have been teaching","will teach","teaches"],0,"Сколько лет к моменту — Future Perfect Continuous."],["___ you have finished the game by dinner?",["Do","Will","Have"],1,"Вопрос Future Perfect — Will + подлежащее + have + V3."],["By 2040, scientists ___ a cure for many diseases.",["will have been finding","will have found","found"],1,"Результат к моменту — Future Perfect (find — не длительность)."],["By 10 o'clock, we ___ for six hours without a break.",["will have been driving","will drive","drove"],0,"For six hours — длительность к 10 часам."],["I won't have finished the project ___ Monday.",["until","since","by"],2,"Срок завершения — by."],["Next year my grandparents ___ married for 50 years.",["will have been","will be being","are"],0,"Be не используется в Continuous: will have been married."],["By the time the guests arrive, Mum ___ the cake.",["bakes","will have baked","baked"],1,"By the time + Present Simple → Future Perfect."],["He ___ the marathon by the time we wake up — he started at 5 am.",["finishes","will have finished","will be finishing for"],1,"Завершённость к моменту — Future Perfect."]],"tr":[["К пятнице я закончу эссе.","will have finished",["By Friday I will have finished the essay","By Friday I will have finished my essay","I will have finished the essay by Friday","I will have finished my essay by Friday"]],["К лету я буду ходить в бассейн уже год.","will have been going",["By summer I will have been going to the swimming pool for a year","By the summer I will have been going to the pool for a year","By summer I will have been going to the pool for a year","By the summer I will have been going to the swimming pool for a year"]],["Когда ты вернёшься, мы уже уберём квартиру.","By the time you come back",["By the time you come back, we will have cleaned the flat","By the time you come back, we will have tidied the flat","By the time you return, we will have cleaned the flat","By the time you come back, we will have cleaned the apartment"]],["К 2030 году я стану инженером.","will have become",["By 2030 I will have become an engineer"]]]},{"t":"Past Perfect Continuous: как долго до того момента","l":"B1","rule":"Past Perfect Continuous (had been + -ing) показывает, как долго длилось действие до определённого момента в прошлом, или объясняет видимый результат в прошлом: She was tired because she had been running. Используется с for, since, how long, all day. С глаголами состояния (know, have, believe) берём Past Perfect: I had known him for years.","ex":[["We [had been waiting] for an hour when the bus finally came.","Мы ждали уже час, когда наконец пришёл автобус."],["His hands were dirty because he [had been fixing] his bike.","У него были грязные руки, потому что он чинил велосипед."],["How long [had] you [been playing] chess before you won your first tournament?","Сколько ты играл в шахматы, прежде чем выиграл первый турнир?"],["It [had been snowing] all night, so the school was closed.","Всю ночь шёл снег, поэтому школу закрыли."],["I [had known] Max for five years before we became best friends.","Я знал Макса пять лет, прежде чем мы стали лучшими друзьями."]],"quiz":[["The ground was wet. It ___ all night.",["has been raining","was rained","had been raining"],2,"Причина видимого результата в прошлом — Past Perfect Continuous."],["She ___ for two hours when her laptop crashed.",["had been typing","has been typing","is typing"],0,"Длительность до момента в прошлом."],["I ___ him for ages before he moved to Canada.",["had been knowing","was knowing","had known"],2,"Know — глагол состояния: Past Perfect."],["How long ___ you been learning English before you went to the camp?",["have","had","did"],1,"Вопрос Past Perfect Continuous — had."],["Igor was out of breath because he ___.",["had been running","has been running","runs"],0,"Результат в прошлом (одышка) — had been + -ing."],["We ___ the problem for an hour before the teacher gave us a hint.",["had been solving","have solved","are solving"],0,"For an hour до момента в прошлом."],["They were angry because they ___ in the queue since 8 am.",["have stood","had been standing","were stood"],1,"Since + прошлое — had been + -ing."],["When I came home, my brother ___ games all day, and his eyes were red.",["has played","plays","had been playing"],2,"All day до момента в прошлом."],["The phone battery was empty because I ___ videos all evening.",["have been watching","had been watching","watch"],1,"Причина в прошлом — had been watching."],["She ___ the car for years before it finally broke down.",["had been having","has had","had had"],2,"Have (иметь) — состояние: Past Perfect."],["By the time the coach arrived, we ___ for twenty minutes.",["had been warming up","have been warming up","warm up"],0,"By the time + прошлое + for…"],["The kids were dirty because they ___ in the garden.",["have been playing","play","had been playing"],2,"Видимый результат в прошлом."],["He failed the exam although he ___ for months.",["had been preparing","has been preparing","prepares"],0,"Длительная подготовка до экзамена в прошлом."],["I was nervous because I ___ on a stage before.",["had never been being","had never been","have never been"],1,"Опыт до момента в прошлом, be — Past Perfect."]],"tr":[["Мы играли в футбол два часа, когда начался дождь.","had been playing … when",["We had been playing football for two hours when it started to rain","We had been playing football for two hours when it started raining","We had been playing football for two hours when it began to rain","We had been playing football for two hours when the rain started"]],["Она устала, потому что работала весь день.","had been working",["She was tired because she had been working all day"]],["Как долго ты ждал, прежде чем он пришёл?","How long had you been waiting",["How long had you been waiting before he came","How long had you been waiting before he arrived"]],["Я знал её три года, прежде чем мы начали встречаться.","had known",["I had known her for three years before we started dating","I had known her for three years before we started going out","I had known her for three years before we began dating"]]]},{"t":"Инверсия: Never have I…, Not only…, Hardly…when","l":"B2","rule":"Инверсия — обратный порядок слов (как в вопросе) после отрицательных наречий в начале предложения; звучит эмоционально и официально. Never / Rarely / Seldom have I seen…; Not only did he win, but he also…; Hardly / Scarcely had I sat down when…; No sooner had we left than…; Only then did I understand…; Under no circumstances should you… После hardly — when, после no sooner — than.","ex":[["[Never have I seen] such a beautiful sunset.","Никогда я не видел такого красивого заката."],["[Not only did she win] the olympiad, but she also set a record.","Она не только выиграла олимпиаду, но и установила рекорд."],["[Hardly had we started] the game when it began to rain.","Едва мы начали игру, как пошёл дождь."],["[No sooner had I arrived] than my phone rang.","Не успел я прийти, как зазвонил телефон."],["[Under no circumstances should you] share your password.","Ни при каких обстоятельствах не сообщай свой пароль."]],"quiz":[["Never ___ such a difficult physics prob
