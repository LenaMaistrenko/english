arth","Robots should live on Mars instead of people","Mars is too close to the Sun","The journey is too short to be useful"],0]]},{"t":"The Rise of Esports","l":"B1","text":"Twenty years ago, few people would have believed that playing video games could become a real career. Today, esports, or competitive video gaming, is a global industry worth more than a billion dollars. Major tournaments fill huge arenas, and millions of fans watch them online. Ukrainian teams and players have been among the most successful in the world, especially in games like Counter-Strike and Dota 2. Being a professional gamer is much harder than it looks. Top players train for eight to ten hours a day, study their opponents' tactics and work with coaches, psychologists and even nutritionists. Quick reactions and teamwork are essential, but so is the ability to stay calm under pressure. However, esports careers are often short. Many players retire before the age of thirty because their reaction times become slower. That is why experts advise young gamers not to give up their education. Some universities now offer esports scholarships and courses in game design, event management and streaming. So if you love gaming, there are many possible careers — but only a few people will become champions.","g":[["competitive","соревновательный"],["industry","отрасль, индустрия"],["arenas","арены"],["tactics","тактика"],["nutritionists","диетологи"],["under pressure","под давлением"],["retire","уходить на пенсию, завершать карьеру"]],"q":[["What is esports?",["competitive video gaming","a new Olympic sport","a type of fitness training","a game design course"],0],["How long do top players train every day?",["eight to ten hours","two to three hours","all day and night","only at weekends"],0],["Why do many players retire before thirty?",["Their reactions become slower","They lose interest in games","They earn too little","Tournaments do not allow older players"],0],["What do experts advise young gamers?",["Not to give up their education","To stop playing video games","To become psychologists","To train for twenty hours a day"],0]]},{"t":"Can We Trust What We See Online?","l":"B2","text":"A few years ago, a photo or video was usually considered strong evidence that something had really happened. Today, thanks to artificial intelligence, this is no longer true. With free apps, anyone can create a deepfake — a fake video in which a real person appears to say or do things they never said or did. Some deepfakes are harmless jokes, such as famous actors appearing in films they never made. Others, however, are created to spread misinformation, damage someone's reputation or trick people into sending money. Researchers are developing tools that can detect fake videos by noticing tiny details, for example unnatural blinking or strange shadows. But as the technology improves, deepfakes are becoming harder to recognise. So how can ordinary users protect themselves? First, check the source: was the video posted by a reliable news organisation or by an unknown account? Second, look for the same story on other websites. Third, pay attention to your emotions. Fake content is often designed to make us angry or shocked so that we share it without thinking. Taking a few seconds to stop and think is one of the best defences against online lies.","g":[["evidence","доказательство"],["harmless","безобидный"],["reputation","репутация"],["detect","обнаруживать"],["blinking","моргание"],["reliable","надёжный"],["defences","средства защиты"]],"q":[["What is a deepfake?",["a fake video showing a real person","a very old photo","a type of computer virus","a video game character"],0],["How can tools detect fake videos?",["by noticing tiny unnatural details","by checking the video's length","by asking the person in the video","by measuring the sound volume"],0],["Why is fake content often designed to make us angry?",["So that we share it without thinking","So that we stop using the internet","So that we check the source","So that we buy new phones"],0],["What is the main advice of the text?",["Stop and think before trusting or sharing content","Never watch videos online","Only use free apps","Trust all photos you see"],0]]},{"t":"A Summer of Volunteering","l":"B1","text":"Last summer, instead of spending three months at home with my laptop, I joined a volunteer group in my town. At first I wasn't sure it was a good idea. I'm quite reserved, and I worried that I wouldn't know what to do. But it turned out to be one of the best decisions I've ever made. Our group helped to repair a damaged school building so that children could return to their classrooms in September. We painted walls, carried furniture and cleaned the yard. The work was hard, especially in the heat, but everyone supported each other. There were students, retired teachers and even a couple of IT specialists who worked remotely in the evenings. I learnt a lot of practical skills — I can now use a drill and mix paint properly. But more importantly, I became more confident. I had to talk to new people every day and sometimes even organise smaller groups of younger volunteers. On the first of September, we watched the children enter the renovated school. Seeing their happy faces made me feel incredibly proud. I'm definitely going to volunteer again next summer.","g":[["reserved","сдержанный, замкнутый"],["turned out","оказалось"],["furniture","мебель"],["remotely","удалённо"],["drill","дрель"],["renovated","отремонтированный"],["incredibly","невероятно"]],"q":[["Why was the writer unsure about volunteering at first?",["He is quite reserved","He had no free time","His parents did not allow it","He did not like children"],0],["What did the volunteer group do?",["They repaired a school building","They built a new hospital","They taught children IT","They organised a summer camp"],0],["What practical skill did the writer learn?",["using a drill","programming","cooking","driving"],0],["How did the writer feel on the first of September?",["very proud","disappointed","bored","nervous"],0]]},{"t":"The Power of Habits","l":"B2","text":"Have you ever wondered why it is so difficult to start going to the gym regularly, but so easy to check your phone fifty times a day? The answer lies in how habits work. Scientists describe every habit as a loop with three parts: a cue, a routine and a reward. The cue is a trigger, such as a notification sound. The routine is the action itself, for example picking up your phone. The reward is the pleasant feeling you get, like seeing a new message. Because the brain loves rewards, it repeats the loop until the behaviour becomes automatic. The good news is that we can use the same loop to build useful habits. If you want to read more, choose a clear cue: read for ten minutes right after dinner every day. Make the routine small and easy at first, so you don't lose motivation. Then give yourself a reward, like ticking a box in a habit tracker. Breaking bad habits works the other way around: remove the cue. Many students leave their phones in another room while studying. Research suggests it takes, on average, about two months for a new habit to become automatic, so patience is essential.","g":[["regularly","регулярно"],["loop","петля, цикл"],["cue","сигнал, подсказка"],["trigger","спусковой крючок, триггер"],["automatic","автоматический"],["tracker","трекер"],["on average","в среднем"]],"q":[["What are the three parts of a habit loop?",["cue, routine and reward","goal, plan and result","phone, message and sound","start, middle and end"],0],["In the text, a notification sound is an example of",["a cue","a reward","a routine","a bad habit"],0],["How can you break a bad habit, according to the text?",["Remove the cue","Make the routine longer","Give yourself more rewards","Repeat the loop more often"],0],["How long does it take on average for a new habit to become automatic?",["about two months","about two days","about a week","about a year"],0]]},{"t":"From Zhytomyr to Space: Serhii Korolov","l":"B1","text":"When the first artificial satellite, Sputnik, was launched in 1957, the whole world was amazed. Few people knew that the main designer behind it was born in Zhytomyr, Ukraine. Serhii Korolov was born in 1907. As a teenager in Odesa, he became fascinated by aircraft and built his first glider. Later he studied in Kyiv and Moscow and became an expert in rocket engines. His life was not easy. In 1938 he was arrested on false charges and spent several years in prison camps, where his health was seriously damaged. After his release, he returned to work and soon became the chief designer of the space programme. Under his leadership, engineers launched the first satellite, sent the first animals into orbit and, in 1961, sent the first human, Yurii Gagarin, into space. For many years, his name was kept secret, and he was known only as the Chief Designer. Korolov died in 1966, before he could see people land on the Moon. Today, a museum in his home town of Zhytomyr tells the story of this brilliant engineer and the early years of space exploration.","g":[["artificial","искусственный"],["fascinated","очарованный, увлечённый"],["glider","планер"],["charges","обвинения"],["release","освобождение"],["leadership","руководство"],["exploration","исследование, освоение"]],"q":[["Where was Serhii Korolov born?",["in Zhytomyr","in Odesa","in Moscow","in Kyiv"],0],["What did he build as a teenager?",["a glider","a satellite","a rocket engine","a car"],0],["Why was his name kept secret for many years?",["He was known only as the Chief Designer","He did not want to be famous","He worked abroad","He changed his name"],0],["What did Korolov NOT see during his life?",["people landing on the Moon","the launch of Sputnik","Gagarin's flight","animals sent into orbit"],0]]},{"t":"Should Schools Have a Four-Day Week?","l":"B2","text":"In several countries, some schools have experimented with a four-day week. Students attend lessons from Monday to Thursday, but each school day is slightly longer. The idea has become a popular topic of discussion among students, parents and teachers. Supporters claim that a three-day weekend gives teenagers more time to rest, pursue hobbies and spend time with their families. They also point out that schools can save money on heating, electricity and transport. In some places, teachers' attendance improved, as staff felt less exhausted. Moreover, some students reported feeling more motivated on their shorter week. However, critics are not convinced. Longer school days can be tiring, especially for younger children, who may find it hard to concentrate in the afternoon. Working parents often have problems finding someone to look after their children on Fridays. In addition, some studies have suggested that students in four-day schools may learn slightly less in subjects like maths. So is a four-day week a good idea? The answer probably depends on the local situation. What works well in a small village school might not be suitable for a large city lyceum. Perhaps the most important thing is not the number of days, but how well the time is used.","g":[["slightly","слегка, немного"],["claim","утверждать"],["pursue","заниматься, преследовать (цель)"],["staff","персонал"],["convinced","убеждённый"],["suitable","подходящий"]],"q":[["How is the school week organised in four-day schools?",["Four slightly longer days","Four shorter days","Five days with a free afternoon","Three days of lessons"],0],["Which advantage do supporters mention?",["Schools save money on heating and transport","Students learn much more maths","Parents have more free Fridays at work","Lessons become shorter"],0],["What problem do working parents have?",["Finding someone to look after children on Fridays","Paying for longer lessons","Driving children to school four times","Helping with homework on Mondays"],0],["What is the writer's conclusion?",["How well the time is used matters most","All schools should switch to four days","Four-day weeks are always a bad idea","Village schools should close on Fridays"],0]]},{"t":"Happy Accidents in Science","l":"B2","text":"We often imagine scientific discoveries as the result of careful planning. In reality, some of the most important breakthroughs happened by accident. In 1928, the Scottish scientist Alexander Fleming returned from holiday and noticed that mould had grown on one of his dishes of bacteria. Around the mould, the bacteria had died. Instead of throwing the dish away, Fleming investigated further and discovered penicillin, the first antibiotic, which has since saved millions of lives. Another example is the microwave oven. In the 1940s, the engineer Percy Spencer was working on radar equipment when he realised that a chocolate bar in his pocket had melted. He began experimenting with popcorn and eggs, and soon the first microwave oven was invented. Even X-rays were discovered by chance, when Wilhelm Röntgen noticed a strange glow in his laboratory in 1895. However, these discoveries were not simply luck. Each of these scientists was curious and observant enough to notice something unusual and ask why it had happened. As Louis Pasteur once said, chance favours the prepared mind. In other words, accidents only become discoveries when someone is ready to understand them.","g":[["breakthroughs","прорывы"],["mould","плесень"],["investigated","исследовал"],["melted","растаял"],["by chance","случайно"],["observant","наблюдательный"],["favours","благоприятствует"]],"q":[["What did Fleming notice when he returned from holiday?",["Bacteria had died around some mould","His laboratory was flooded","His chocolate had melted","A strange glow in the room"],0],["How was the microwave oven discovered?",["A chocolate bar melted near radar equipment","Fleming experimented with popcorn","Röntgen heated eggs with X-rays","An engineer planned it for years"],0],["Which discovery is NOT mentioned in the text?",["electricity","penicillin","X-rays","the microwave oven"],0],["What does the phrase 'chance favours the prepared mind' mean here?",["Only people ready to understand can turn accidents into discoveries","Scientists should plan every experiment carefully","Lucky people never need to study","Accidents are always dangerous in laboratories"],0]]},{"t":"How an Indie Game Is Born","l":"B2","text":"Many of the most popular games of the last decade were not made by huge companies, but by tiny indie teams. Cuphead, for example, was started by two brothers who loved old cartoons from the 1930s. So how does a small team turn an idea into a finished game? Everything starts with a prototype — a rough version that tests whether the main idea is fun. At this stage, the graphics are often just coloured boxes. If the prototype feels boring, developers throw it away and try something else. This may sound wasteful, but it saves months of work later. Next comes production, the longest stage. Artists create characters and backgrounds, programmers write code and musicians compose the soundtrack. In the case of Cuphead, every frame was drawn by hand, which is one reason why the game took several years to finish. Then the team asks real players to test the game. Playtesters often find problems the developers never noticed, such as a level that is too difficult or a menu that is confusing. Finally, the game is released — but the work doesn't stop. Developers keep fixing bugs and listening to feedback. As one indie designer put it, 'A game is never finished, it's just released.'","g":[["rough version","черновая версия"],["wasteful","расточительный"],["production","производство"],["compose","сочинять (музыку)"],["frame","кадр"],["confusing","запутанный"],["notice","замечать"]],"q":[["What is the main purpose of a prototype?",["To check if the main idea is fun","To show the final graphics to players","To advertise the game","To fix bugs before release"],0],["Why did Cuphead take several years to make?",["Every frame was drawn by hand","The brothers had no programmers","Its first prototype was thrown away","Playtesters found too many bugs"],0],["According to the text, playtesters are useful because they",["notice problems that developers missed","write code for free","compose the music","decide the release date"],0],["What does the quotation at the end suggest?",["Developers keep improving a game after its release","Indie games are never released","Games should be unfinished on purpose","Designers don't like their own games"],0]]},{"t":"The Secret World of Speedrunners","l":"B2","text":"Imagine finishing a game that normally takes twenty hours in just thirty minutes. This is what speedrunners do. Speedrunning is the hobby of completing a video game as fast as possible, and it has grown into a worldwide community with its own rules, records and charity events. Speedrunners spend hundreds of hours on a single game. They study every level, plan the fastest route and practise difficult moves until they become automatic. Some runners use glitches — mistakes in the game's code — that let them skip whole sections. Because of this, there are usually different categories: in some, glitches are allowed, while in others, players must finish the game 'the normal way'. To make sure that nobody cheats, runners record their attempts and send the videos to moderators, who check every second before a record appears on the leaderboard. A new world record may be only a few hundredths of a second faster than the old one. Perhaps the most surprising thing about speedrunning is how generous the community is. Experienced runners often share their routes and tricks with beginners, even though this means someone might beat their record. Twice a year, a famous charity marathon brings runners together to raise money for good causes — millions of dollars so far.","g":[["complete","завершать, проходить"],["automatic","автоматический"],["section","часть, участок"],["cheat","жульничать"],["hundredth","сотая (доля)"],["generous","щедрый"],["raise money","собирать деньги"]],"q":[["What is the main idea of the text?",["Speedrunning is a serious hobby with a supportive community","Speedrunners usually cheat to set records","Glitches make games impossible to finish","Speedrunning is popular in only one country"],0],["Why are there different categories in speedrunning?",["Some allow glitches and others do not","Some games are longer than others","Beginners and experts compete separately","Moderators cannot check every run"],0],["What is the role of moderators?",["They check runs before records are accepted","They plan routes for beginners","They organise the charity marathon","They fix glitches in games"],0],["What can be inferred about experienced runners?",["They value the community more than keeping their records","They are afraid of beginners","They never use glitches","They try to stop new records"],0]]},{"t":"Minecraft in the Classroom","l":"B2","text":"When most parents see their children playing Minecraft, they probably think it is a waste of time. However, thousands of teachers around the world disagree. They use a special education version of the game to teach subjects from history to chemistry. How does it work? In a history lesson, students might rebuild an ancient Egyptian pyramid or a medieval castle. To do this, they need to research what the building really looked like, measure it and plan their work as a team. In chemistry, pupils can combine virtual elements to create compounds, which is much safer than doing some experiments in a real laboratory. Even maths becomes more practical when you have to calculate how many blocks you need to build a wall. Teachers say that the game's biggest advantage is motivation. Students who are usually quiet in class often become leaders when they are building something together. They also learn to solve problems on their own instead of waiting for the teacher to give them the answer. Of course, Minecraft cannot replace books and traditional lessons. Critics warn that some students may simply play instead of learning. That is why teachers usually give clear tasks and time limits. Used wisely, the game can turn a normal lesson into an adventure.","g":[["waste of time","пустая трата времени"],["ancient","древний"],["medieval","средневековый"],["combine","соединять"],["virtual","виртуальный"],["replace","заменять"],["wisely","разумно"]],"q":[["What is the writer's main point?",["Minecraft can be a useful teaching tool if it is used carefully","Minecraft should replace traditional lessons","Parents are right that games are a waste of time","Only history teachers use Minecraft"],0],["Why can chemistry in Minecraft be useful?",["Some experiments are safer in a virtual world","Real laboratories are too expensive","Students don't need to learn the elements","The game gives students the answers"],0],["According to teachers, what happens to some quiet students?",["They take the lead in group work","They stop coming to lessons","They prefer to work alone","They quickly get bored"],0],["Why do teachers give clear tasks and time limits?",["To stop students from just playing","Because the game is very short","To make lessons more difficult","Because parents ask them to"],0]]},{"t":"Cuphead: A Cartoon from the Past","l":"B2","text":"At first sight, Cuphead looks like a cartoon from the 1930s that somehow became a video game. Its characters have rubber-hose arms, big round eyes and wide smiles, just like the animated films of that time. This style is not an accident: the developers wanted to bring the charm of early animation to a modern audience. To achieve this look, the artists used the same methods as cartoonists almost a hundred years ago. Every animation was drawn by hand on paper, then inked and coloured. Backgrounds were painted with watercolours. The team says the game contains around fifty thousand hand-drawn frames — an enormous amount of work for a small studio. The music was treated with the same care. Instead of using computer-generated sounds, the composer wrote about three hours of jazz and big-band music, which was recorded by live musicians. The result is a game that sounds as old-fashioned as it looks. However, Cuphead is famous not only for its art but also for its difficulty. Many players fail a single level dozens of times. Surprisingly, this has become part of its appeal: beating a tough level feels like a real achievement. The game shows that an old-fashioned style and modern game design can work perfectly together.","g":[["at first sight","на первый взгляд"],["charm","очарование"],["inked","обведённый тушью"],["watercolours","акварель"],["enormous","огромный"],["old-fashioned","старомодный"],["tough","трудный"]],"q":[["Why does Cuphead look like an old cartoon?",["The developers deliberately copied the style of 1930s animation","The game was actually made in the 1930s","It was the cheapest way to make a game","Modern computers cannot draw cartoons"],0],["What is true about the game's music?",["It was played by real musicians","It was created by a computer","It lasts less than an hour","It was taken from old cartoons"],0],["How has the game's difficulty affected players, according to the text?",["It makes winning more satisfying","It makes most of them stop playing","It is seen as the game's biggest problem","It means only professionals can play"],0],["The word 'appeal' in the text is closest in meaning to",["attraction","problem","price","danger"],0]]},{"t":"How Designers Build a Game City","l":"B2","text":"Driving through the streets of a modern open-world game, you might forget that the city is not real. The traffic lights change, people cross the road and the sun sets behind skyscrapers. Yet every street was planned by a team of designers, and building such a world can take years. Designers often start by visiting real places. For the GTA series, the team took hundreds of thousands of photos of real American cities, studying everything from shop signs to the shape of street lamps. They did not copy the cities exactly, though. A real city would be far too big and, to be honest, too boring to drive around. Instead, designers create a compressed version: the most interesting districts are kept, and the empty spaces between them are removed. A good game city must also be easy to navigate. Designers place landmarks — a tall tower, a bridge, a mountain — so players always know roughly where they are. Roads are designed to be fun to drive on, with long curves and interesting views. Finally, the city must feel alive. Thousands of computer-controlled drivers and pedestrians follow simple rules, but together they create the impression of a busy real place. When it all works, players feel they are exploring a living world rather than a computer program.","g":[["compressed","сжатый"],["remove","убирать"],["navigate","ориентироваться"],["roughly","примерно"],["curve","изгиб, поворот (дороги)"],["impression","впечатление"],["rather than","а не, вместо"]],"q":[["Why don't designers copy real cities exactly?",["A real city would be too large and dull to play in","It is not allowed by law","They don't have enough photos","Players prefer imaginary landscapes"],0],["What is the purpose of landmarks in a game city?",["To help players find their way","To make the game harder","To hide the empty spaces","To show advertisements"],0],["What makes a game city feel alive?",["Many characters following simple rules","Realistic weather alone","Photos of real streets","Long loading screens"],0],["What does the text say about the designers' research?",["They photographed real streets in great detail","They used only maps from the internet","They asked players to send photos","They never visited real cities"],0]]},{"t":"Why We Remember Game Music","l":"B2","text":"Ask any gamer to hum the music from their favourite game, and they will probably do it immediately. Game music is surprisingly memorable, and there are good reasons for this. In the early days, game consoles could only play a few simple sounds at the same time. Composers had very little memory to work with, so their melodies had to be short and catchy. Because these short tunes repeated again and again while people played, they became fixed in players' minds. Today's technology has no such limits. Modern games can have full orchestral soundtracks, and some are performed live in concert halls around the world. Yet good game music still has a special job: it must support the action without distracting the player. Many modern games use 'adaptive' music, which changes depending on what is happening. When you are calmly exploring, the music is soft; when danger appears, it becomes faster and louder. Minecraft took a different approach. Its quiet, gentle piano pieces play only from time to time, leaving long periods of silence. The composer wanted the music to feel like a pleasant surprise rather than constant background noise. Psychologists add that we remember music better when it is connected to strong emotions — and games are full of moments of joy, tension and triumph.","g":[["hum","напевать (без слов)"],["memorable","запоминающийся"],["fixed","закреплённый"],["distract","отвлекать"],["calmly","спокойно"],["constant","постоянный"],["triumph","триумф, победа"]],"q":[["Why was early game music short and simple?",["Consoles had very limited memory","Composers lacked talent","Players disliked long songs","Orchestras were too expensive"],0],["What is 'adaptive' music?",["Music that changes with the situation in the game","Music played by a live orchestra","Music without a melody","Music that players compose themselves"],0],["Why does Minecraft have long periods of silence?",["So that the music feels like a pleasant surprise","Because there was no money for more music","To make the game more frightening","Because most players turn the music off"],0],["According to psychologists, why is game music easy to remember?",["It is linked to strong emotions","It is always played by orchestras","It is very loud","It is simpler than film music"],0]]},{"t":"Streaming: Dream Job or Hard Work?","l":"B2","text":"Ask a group of teenagers what job they would like to do, and some will answer: 'I want to be a streamer.' It looks like the perfect job — you play games, chat with fans and earn money from home. But the reality is more complicated. Successful streamers usually go live for six to eight hours a day, often six days a week. During that time, they must stay energetic and entertaining, even when they feel tired or the game is going badly. When the stream ends, the work continues: they edit clips for other platforms, answer messages and plan future content. The financial side is also uncertain. Most streamers earn money from subscriptions, donations and sponsors, and their income can change dramatically from month to month. Only a tiny percentage of people who start streaming ever earn enough to live on. Many experienced streamers also talk openly about burnout. Being online all the time makes it difficult to rest, and negative comments can affect their mental health. This does not mean that streaming is a bad hobby. It can teach useful skills: public speaking, video editing, marketing and managing a community. The best advice, many streamers say, is to stream because you enjoy it — and to keep studying at the same time.","g":[["complicated","сложный"],["entertaining","интересный, развлекающий"],["financial","финансовый"],["uncertain","неопределённый, нестабильный"],["dramatically","резко, значительно"],["openly","открыто"],["affect","влиять"]],"q":[["What is the writer's attitude to streaming as a career?",["Realistic: it can be rewarding but is harder than it looks","Completely negative","Enthusiastic: it is the perfect job","Uninterested"],0],["What happens after a stream ends?",["Streamers keep working on other tasks","Streamers go straight to sleep","Moderators do all the remaining work","Streamers stop thinking about their channel"],0],["Why is the financial side described as uncertain?",["Income can vary a lot from month to month","Streamers are not allowed to earn money","Sponsors pay only once a year","Donations are always small"],0],["What do many streamers recommend?",["Streaming for fun while continuing your education","Leaving school to stream full-time","Refusing all sponsors","Streaming only at weekends"],0]]},{"t":"Is Esports a Real Sport?","l":"B2","text":"Every year, millions of people watch esports tournaments, and top players earn more than many traditional athletes. Some universities even offer esports scholarships. Still, one question causes heated arguments: should esports be called a sport? Those who say 'yes' point out that professional gamers train as hard as other athletes. They practise for up to ten hours a day, study their opponents' tactics and work with coaches and psychologists. Their reaction times are extremely fast, and the pressure of playing in front of huge crowds is enormous. Moreover, many teams now include physical exercise in their daily routine, because a healthy body helps the mind stay sharp. Opponents argue that sport must involve serious physical effort. Sitting in a chair and moving a mouse, they say, is not comparable to running a marathon or playing football. They also note that games belong to companies, which can change the rules or stop supporting a game at any moment — something that could never happen to chess or tennis. The debate is far from over. The International Olympic Committee has shown interest in esports, but it prefers games that are based on real sports. Whatever the answer, it is clear that esports demand skill, dedication and teamwork — qualities we usually admire in any athlete.","g":[["heated","горячий, жаркий (о споре)"],["reaction time","время реакции"],["sharp","ясный, острый (об уме)"],["comparable","сравнимый"],["note","отмечать"],["far from over","далеко не окончен"],["admire","восхищаться"]],"q":[["What is the text mainly about?",["Arguments for and against calling esports a sport","How to become a professional gamer","The history of the Olympic Games","Why esports players earn so much"],0],["Why do many esports teams do physical exercise?",["Physical fitness helps players think clearly","The Olympic Committee requires it","Their fans expect it","It replaces gaming practice"],0],["Which argument against esports is mentioned?",["Companies own the games and control the rules","Esports players don't train","Nobody watches esports","Games are too easy"],0],["What can be inferred from the last sentence?",["The writer respects esports players whatever the debate decides","The writer thinks esports should be banned","The writer is sure esports will join the Olympics","The writer has never watched esports"],0]]},{"t":"Why Games Keep Changing","l":"B2","text":"Years ago, when you bought a game, it stayed exactly the same forever. Today, most popular games change constantly. A game you play this month might look and feel different next month. Why? The first reason is bugs. Modern games contain millions of lines of code, and it is impossible to find every mistake before release. Once millions of people start playing, they quickly discover problems, and developers release patches to fix them. The second reason is balance. In online games, players soon find the strongest strategy and everyone starts using it, which makes the game boring. Developers then make small changes — a character becomes slightly slower, an item becomes cheaper — to keep the game fair and varied. The third reason is business. Many games are now 'live services': they are free or cheap to start, but companies want players to keep coming back. Regular updates add new maps, seasonal events and challenges, giving players a reason to return. Minecraft, for instance, has received major free updates for more than a decade, adding new biomes, creatures and blocks. Not everyone loves this system. Some players complain that their favourite tactics stop working after an update, or that games are released unfinished because developers know they can fix them later. Still, updates mean that a good game can stay alive for many years.","g":[["constantly","постоянно"],["discover","обнаруживать"],["slightly","немного, слегка"],["varied","разнообразный"],["seasonal","сезонный"],["decade","десятилетие"],["complain","жаловаться"]],"q":[["What is the main idea of the text?",["Games are updated for several different reasons","Updates always make games worse","Minecraft is the only game that gets updates","Old games were better than modern ones"],0],["Why do developers change the balance of online games?",["To stop one strategy from dominating","To make the game more expensive","To remove bugs from the code","To make the game shorter"],0],["What is the business purpose of regular updates?",["To make players come back","To save money on developers","To reduce the size of the game","To stop players from buying other games"],0],["Which criticism of updates is mentioned?",["Some games are released before they are ready","Updates cost players too much","Updates delete players' progress","Updates come too rarely"],0]]},{"t":"The Disappearing Glaciers","l":"B2","text":"High in the mountains of Europe, Asia and South America, glaciers have existed for thousands of years. These slow rivers of ice are not just beautiful; they are also vital sources of fresh water. In summer, melting glaciers feed rivers that millions of people use for drinking, farming and producing electricity. Unfortunately, glaciers around the world are shrinking at record speed. Scientists have calculated that Swiss glaciers lost around ten per cent of their remaining ice in just two years, 2022 and 2023. Some smaller glaciers have already disappeared completely. In Iceland, people even held a funeral for a glacier called Okjökull, placing a memorial plaque where the ice used to be. The main cause is rising global temperatures. Warmer summers melt more ice than winter snow can replace. There is also a dangerous feedback loop: white ice reflects sunlight, but when it melts, darker rock and water absorb more heat, which leads to even faster melting. The consequences go far beyond the mountains. In the short term, rapid melting can cause floods. In the long term, when the ice is gone, rivers may become much smaller in summer, causing water shortages. Scientists say that cutting greenhouse gas emissions now could still save many of the world's glaciers.","g":[["vital","жизненно важный"],["shrink","уменьшаться, сокращаться"],["remaining","оставшийся"],["funeral","похороны"],["plaque","памятная табличка"],["reflect","отражать"],["shortage","нехватка"]],"q":[["Why are glaciers important for people?",["They provide fresh water for rivers","They protect cities from storms","They are used to build roads","They make winters warmer"],0],["What happened to Okjökull?",["It melted away and was remembered at a ceremony","It became a popular ski resort","It grew bigger","It was moved to a museum"],0],["What is the 'feedback loop' described in the text?",["Melting reveals dark surfaces that absorb heat and speed up melting","Snow falls faster when it is warm","Rivers return water to the glaciers","Scientists measure the ice every year"],0],["What may happen in the long term when glaciers disappear?",["Water shortages in summer","More floods every year","Colder summers","Bigger rivers"],0]]},{"t":"Our Invisible Helpers","l":"B2","text":"When we hear the word 'bacteria', most of us think of illness. We wash our hands, clean our kitchens and take antibiotics to get rid of them. However, the vast majority of bacteria are harmless, and many are absolutely essential for our health. Your body contains roughly as many bacterial cells as human cells. Most of them live in your gut, where they form a community called the microbiome. These tiny organisms help you digest food, produce certain vitamins and train your immune system to recognise real dangers. Recent research even suggests that gut bacteria may influence our mood and how we react to stress. A healthy microbiome is a diverse one. Scientists have found that people who eat a wide range of plant foods — vegetables, fruit, beans and whole grains — have a richer variety of bacteria than people who eat mostly processed food. Fermented foods, such as yoghurt and sauerkraut, can also help. Antibiotics save millions of lives, but they kill good bacteria as well as bad ones. That is why doctors warn against taking them for viral infections such as colds and flu, where they do not work anyway. Overusing antibiotics also helps dangerous bacteria become resistant, which is one of the biggest health threats of our century.","g":[["get rid of","избавиться от"],["harmless","безвредный"],["gut","кишечник"],["recognise","распознавать"],["processed food","промышленно переработанная еда"],["fermented","квашеный, ферментированный"],["resistant","устойчивый"]],"q":[["What is the main message of the text?",["Most bacteria are helpful and important for our health","All bacteria should be destroyed","Antibiotics should never be used","The microbiome affects only digestion"],0],["What does the text say about gut bacteria and mood?",["Research suggests there may be a connection","There is definitely no connection","Bacteria always make people stressed","Our mood controls the microbiome"],0],["How can people keep their microbiome diverse?",["By eating many different plant foods","By taking antibiotics regularly","By eating more processed food","By washing their hands more often"],0],["Why shouldn't people take antibiotics for a cold?",["They don't work against viruses and they harm good bacteria","They make colds last longer","They are too expensive","They cause flu"],0]]},{"t":"Learning to Drive in a Virtual World","l":"B2","text":"Driving games have come a long way since the simple racing games of the 1980s. Today's driving simulators are so realistic that driving schools and even professional racing teams use them for training. Can a game really teach you to drive? Supporters say that simulators have several clear advantages. A learner can practise dangerous situations — such as driving on ice or in heavy rain — without any real risk. Mistakes cost nothing, and the same situation can be repeated as many times as necessary. Simulators also save fuel and reduce pollution, since the car never leaves the classroom. Several well-known racing drivers started their careers in simulator competitions. However, experts point out important limits. In a simulator, you cannot feel the car moving under you, and you know that a crash has no real consequences. This can make learners overconfident. Real driving also involves unpredictable people: a child running after a ball, a cyclist who suddenly turns. Even the best software cannot fully copy the variety of real life. Open-world games, of course, are not designed as training tools — in a game, you can drive through a city at 200 kilometres per hour without any penalty. Most instructors agree that simulators are a useful first step, but they should never replace real lessons with a qualified instructor.","g":[["come a long way","пройти большой путь (развития)"],["supporter","сторонник"],["learner","ученик (водитель)"],["overconfident","излишне самоуверенный"],["unpredictable","непредсказуемый"],["penalty","штраф, наказание"],["qualified","квалифицированный"]],"q":[["What is one advantage of driving simulators?",["Learners can practise dangerous situations safely","They give learners a driving licence","They are better than real lessons","They teach learners to drive fast"],0],["Why can simulators make learners overconfident?",["Mistakes in a simulator have no real consequences","The software is too difficult","Instructors are too strict","The lessons are too short"],0],["What does the example of a child running after a ball show?",["Real roads are less predictable than simulations","Simulators often include children","Children should learn to drive early","Drivers prefer quiet roads"],0],["What do most instructors conclude?",["Simulators are helpful but not enough on their own","Simulators should replace real lessons","Open-world games are good training","Simulators are completely useless"],0]]},{"t":"Two Summers on the Black Sea","l":"B2","text":"Last year and the year before, our class went on a school trip to the Black Sea coast of Bulgaria. Both times my classmate Yura came too, and so did his little brother Zhenya, who is the same age as my brother Oleg. The journey was long, so by the time we arrived, we were exhausted but far too excited to sleep. The first trip was a bit of a disaster at first. On the second day I got so sunburnt that I had to stay in the shade for the rest of the week, and Yura and I got completely lost in the old town while we were looking for a shop with cheap souvenirs. We had to ask the locals for directions in a mixture of English, Russian and sign language, and, surprisingly, it worked. The second trip went much more smoothly. We had learnt our lessons: plenty of sunscreen, a map on the phone and no swimming after dark. Our teacher let us explore in small groups, which made us feel almost like adults. Yura, who is the best swimmer in our class, taught Zhenya and me to dive from the pier. Looking back, I think those trips taught me more than any geography lesson. I realised that you can make yourself understood almost anywhere if you are not afraid to try, and that English is incredibly useful when nobody around speaks your language.","g":[["exhausted","вымотанный, без сил"],["sunburnt","обгоревший на солнце"],["shade","тень"],["locals","местные жители"],["smoothly","гладко, без проблем"],["pier","пирс"],["make yourself understood","суметь объясниться"]],"q":[["Why was the first trip \"a bit of a disaster\" at first?",["The writer got sunburnt, and he and Yura got lost","The teacher got lost in the old town","It rained for the whole week","Zhenya lost his phone and money"],0],["How did the boys find their way back?",["They asked local people, using a mix of languages and gestures","They used a map on the phone","The teacher came to find them","They followed other tourists"],0],["What does \"We had learnt our lessons\" mean in the text?",["They knew what to do differently after their mistakes","They had studied hard at school","They had passed all their exams","They had taken English lessons before the trip"],0],["What is the writer's main conclusion?",["Trying to communicate matters more than speaking perfectly","Geography lessons are useless","School trips should only go to the sea","It is better to travel without a teacher"],0]]},{"t":"Jobs That Don't Exist Yet","l":"B2","text":"Experts often say that many of today's teenagers will work in jobs that do not exist yet. This may sound strange, but history supports the idea. Twenty years ago, nobody worked as an app developer, a social media manager or a drone pilot. Today, these are ordinary professions. So which new jobs might appear in the next twenty years? Some predictions are connected with technology. As artificial intelligence becomes more powerful, companies may need 'AI trainers' who teach systems to behave correctly, and ethics specialists who make sure machines make fair decisions. Virtual worlds may need architects who design buildings that exist only online. Other jobs will be linked to the environment. Engineers will be needed to build cities that can survive heatwaves and floods, and specialists will help farmers grow food with less water. Since people are living longer, there will also be a growing demand for health workers who help elderly people stay active. If nobody knows exactly what the future jobs will be, how can students prepare? Most experts give the same answer: focus on skills, not specific job titles. The ability to learn quickly, think critically, communicate and work in a team will be useful in any profession. In other words, the most important skill of the future may be learning how to learn.","g":[["prediction","прогноз"],["behave","вести себя"],["ethics","этика"],["survive","выдерживать, выживать"],["elderly","пожилой"],["demand","спрос"],["job title","название должности"]],"q":[["Why does the writer mention app developers and drone pilots?",["To show that new professions can appear quickly","To recommend these jobs to students","To prove that technology is dangerous","To explain how drones work"],0],["What would an ethics specialist do, according to the text?",["Make sure AI makes fair decisions","Train sports teams","Design virtual buildings","Help farmers save water"],0],["Why will more health workers be needed?",["People are living longer","Cities are getting hotter","AI will replace doctors","Young people are less healthy"],0],["What advice do experts give students?",["Develop general skills such as learning and communicating","Choose a specific future job now","Study only technology","Avoid working in teams"],0]]},{"t":"The Four-Minute Mile","l":"B2","text":"For many years, people believed that running a mile (about 1.6 kilometres) in less than four minutes was impossible. Some even warned that the human body might be seriously damaged by such an effort. Then, on 6 May 1954, a British medical student named Roger Bannister proved them wrong. Bannister was not a full-time athlete. He trained for less than an hour a day because he was busy studying medicine. Instead of training longer, he trained smarter, using interval training — short, fast runs with rest in between — which was a fairly new method at the time. On the day of the race, the weather was cold and windy, and Bannister almost decided not to run. In the end, with the help of two friends who set the pace, he crossed the finish line in 3 minutes 59.4 seconds. The most interesting part of the story happened afterwards. Just 46 days later, an Australian runner, John Landy, broke Bannister's record. Within a few years, many other athletes had also run a mile in under four minutes. Their bodies had not suddenly changed. What had changed was their belief. Once they had seen that it was possible, the barrier was no longer in their minds. Today, the 'four-minute mile' is often used as an example of how our beliefs can limit or support what we achieve.","g":[["effort","усилие"],["full-time","профессиональный, на полный день"],["interval training","интервальная тренировка"],["fairly","довольно"],["set the pace","задавать темп"],["barrier","барьер"],["belief","убеждение, вера"]],"q":[["What did many people believe before 1954?",["A four-minute mile was beyond human ability","Bannister would win easily","Interval training was dangerous","Medical students could not run"],0],["How was Bannister different from many athletes?",["He trained for a short time because he was studying","He trained for ten hours a day","He ran without anyone's help","He was a professional coach"],0],["What role did Bannister's two friends play?",["They helped him keep a fast pace","They broke the record before him","They measured the track","They persuaded him to study medicine"],0],["What is the main lesson of the story?",["Beliefs can affect what people are able to achieve","Cold weather helps runners","Only doctors should run","Records are never broken twice"],0]]},{"t":"Why Do We Forget?","l":"B2","text":"You spend an evening learning new English words, and a week later half of them have disappeared from your memory. Annoying? Yes. Unusual? Not at all. In the 1880s, the German psychologist Hermann Ebbinghaus discovered what is now called the 'forgetting curve'. He tested himself on lists of nonsense syllables and found that we forget most new information within the first few days — unless we review it. The good news is that every time we review information, the curve becomes flatter, meaning that we forget more slowly. This is the idea behind spaced repetition: instead of studying something many times in one evening, you review it after one day, then three days, then a week, then a month. Many language-learning apps use this method, and research shows that it is far more effective than cramming the night before a test. Another powerful technique is active recall. Rereading your notes feels productive, but it is mostly passive. Testing yourself — closing the book and trying to remember the answer — forces your brain to work harder, and this effort makes memories stronger. Sleep matters too. During deep sleep, the brain sorts the day's information and moves important memories into long-term storage. So staying up all night before an exam may actually make you remember less, not more.","g":[["annoying","раздражающий"],["nonsense syllables","бессмысленные слоги"],["review","повторять (материал)"],["flatter","более пологий"],["cramming","зубрёжка в последний момент"],["recall","припоминание"],["long-term","долговременный"]],"q":[["What did Ebbinghaus discover?",["We forget most new information quickly unless we review it","Nonsense words are easier to remember","Memory improves with age","Forgetting is a sign of illness"],0],["What is spaced repetition?",["Reviewing material at increasing intervals","Studying everything in one evening","Reading your notes many times in a row","Learning only before an exam"],0],["Why is active recall more effective than rereading?",["It makes the brain work harder","It takes less time","It requires no effort","It can be done while sleeping"],0],["What does the writer suggest about studying all night before an exam?",["It may reduce how much you remember","It is the best strategy","It helps the brain sort information","It has no effect on memory"],0]]},{"t":"The Power of a Like","l":"B2","text":"It takes less than a second to press the 'like' button, but this tiny action may have a big effect on the teenage brain. In one well-known study, researchers at a university in California showed teenagers photos in a fake social network while scanning their brains. When the teenagers saw that their photos had received many likes, the part of the brain connected with reward became especially active — the same area that responds to chocolate or winning money. The study also found that teenagers were more likely to like a photo if it already had many likes, even when the photo was quite ordinary. In other words, the number of likes influenced their own opinion. This is a powerful form of peer pressure that happens silently, on a screen. Because likes feel rewarding, some people start posting not because they want to share something, but because they want approval. When a post gets fewer reactions than expected, they may feel disappointed or even question their own value. Some platforms have experimented with hiding the number of likes to reduce this pressure. Psychologists suggest a few simple habits: notice how you feel after using social media, turn off notifications for likes, and remember that a number on a screen does not measure who you are.","g":[["scan","сканировать"],["reward","награда, вознаграждение"],["respond","реагировать"],["ordinary","обычный"],["approval","одобрение"],["disappointed","разочарованный"],["value","ценность"]],"q":[["What happened in the teenagers' brains when their photos got many likes?",["The reward area became more active","They felt bored","The brain stopped responding","They wanted to delete the photos"],0],["What else did the study find?",["Teens tended to like photos that already had many likes","Teens preferred photos with few likes","Likes had no effect on their opinions","Teens realised the network was fake"],0],["Why does the writer call likes a form of peer pressure?",["Other people's reactions silently shape our opinions","Friends force each other to post","Teachers check students' social media","Likes cost money"],0],["Which piece of advice is given in the text?",["Turn off notifications for likes","Never use social media","Post more often to get more likes","Follow only famous people"],0]]},{"t":"Grandma's Recipe Book","l":"B2","text":"In many families, the most valuable book in the house is not a novel or an encyclopaedia, but an old notebook full of handwritten recipes. These notebooks are often passed down from grandmothers to grandchildren, and they contain much more than instructions for cooking. Food historians say that family recipes are an important part of our cultural heritage. A recipe can tell us what ingredients people could find in a particular region, which dishes were cooked for celebrations and how families managed during difficult times. Notes in the margins — 'add less sugar', 'Oleg's favourite' — reveal personal stories that no history book contains. Unfortunately, many of these recipes are disappearing. Young people often prefer to find recipes online, and older relatives rarely write down dishes they cook 'by eye', without measuring anything. When they are gone, their recipes may be lost forever. That is why some schools and museums have started projects to collect family recipes. Students interview their grandparents, cook the dishes together and record the process in photos and videos. The results are published in community cookbooks. Participants say these projects are not only about food. Cooking side by side gives different generations a chance to talk, share memories and understand each other better — and that might be the most valuable ingredient of all.","g":[["handwritten","рукописный"],["particular","определённый, конкретный"],["margins","поля (страницы)"],["reveal","раскрывать"],["relatives","родственники"],["by eye","на глаз"],["side by side","бок о бок, рядом"]],"q":[["Why do food historians value family recipes?",["They show how people lived in the past","They are always healthier","They are written by famous chefs","They are easy to cook"],0],["Why are many family recipes in danger of disappearing?",["Older people often cook without written instructions","Recipe books are too expensive","Schools have stopped teaching cooking","The ingredients are no longer available"],0],["What do students do in the school projects?",["Interview their grandparents and cook with them","Write recipes for restaurants","Compete in cooking contests","Buy old cookbooks"],0],["What is 'the most valuable ingredient' mentioned at the end?",["The connection between generations","Sugar","A secret spice","Fresh vegetables"],0]]},{"t":"Teaching My Little Brother to Code","l":"B2","text":"Last autumn my younger brother Oleg, who is ten, asked me a question that surprised me: 'How do people make games?' He had been playing Minecraft for years, but he had never thought about what happens behind the screen. I decided to show him. At first, I made a mistake. I opened a real programming language and started explaining variables and functions. After ten minutes, Oleg was yawning. I realised I had to change my approach. The next day, I showed him a visual programming tool where you build code from coloured blocks, a bit like building in Minecraft. Instead of explaining theory, I gave him a goal: make a cat run across the screen and jump when you press a key. This time he was completely focused. When the cat finally jumped, he shouted so loudly that Mum came in to see what had happened. Over the next few months, Oleg made a simple maze game, then a quiz about animals for his class. He learned to find bugs on his own — or at least to ask me only after trying for five minutes. Teaching him taught me something too. To explain an idea simply, you need to understand it really well. And I discovered that patience is a skill, just like coding.","g":[["behind the screen","за экраном, «изнутри»"],["yawn","зевать"],["realise","понимать, осознавать"],["visual","визуальный"],["maze","лабиринт"],["on his own","самостоятельно"],["discover","обнаруживать, открывать для себя"]],"q":[["Why did the writer's first lesson fail?",["It was too theoretical for
