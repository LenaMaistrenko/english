s support team. It's also a good idea to (4)___ on two-factor authentication. Remember: if an offer sounds too good to be true, it (5)___ is.","gaps":[["because of","because","despite","although"],["log","get","put","go"],["even","still","yet","already"],["turn","put","get","take"],["probably","probable","probability","probe"]]},{"t":"Applying for a Summer Coding Camp","l":"B2","text":"Dear Sir or Madam, I am writing to apply (1)___ a place at your summer coding camp. I am fifteen years old and I study at a physics and mathematics lyceum. I (2)___ programming for two years, mainly in Python, and I have already created two simple games. I am particularly interested (3)___ game development, and I believe your course would help me (4)___ my skills. I would be grateful if you could tell me whether accommodation is included in the price. I look forward to (5)___ from you. Yours faithfully, Igor","gaps":[["for","to","on","at"],["have been learning","am learning","learn","was learning"],["in","on","at","for"],["improve","improving","improved","improvement"],["hearing","hear","heard","be hearing"]]}],"tname":{"tenses":{"ps":["Present Simple",1,"Привычки, факты, расписание: V / V-s"],"pc":["Present Continuous",2,"Сейчас, временно, договорённости: am/is/are + V-ing"],"pas":["Past Simple",3,"Законченное в прошлом: V2 / V-ed, did"],"pac":["Past Continuous",4,"Процесс в прошлом: was/were + V-ing"],"pp":["Present Perfect",7,"Опыт и результат: have/has + V3"],"fs":["Future Simple (will)",10,"Прогноз, решение сейчас, обещание: will + V"],"gt":["be going to",10,"План, видимые признаки: am/is/are going to + V"],"ppc":["Present Perfect Continuous",16,"Как долго до сих пор: have/has been + V-ing"],"pap":["Past Perfect",16,"Раньше другого прошлого: had + V3"],"fc":["Future Continuous",23,"Процесс в момент в будущем: will be + V-ing"],"fp":["Future Perfect",33,"Будет завершено к сроку: will have + V3"],"fpc":["Future Perfect Continuous",33,"Сколько будет длиться к моменту: will have been + V-ing"],"papc":["Past Perfect Continuous",34,"Как долго до момента в прошлом: had been + V-ing"]},"items":[["Igor [trains] three times a week.","ps","three times a week — регулярно → Present Simple."],["The lesson [starts] at 8:30.","ps","Расписание → Present Simple (даже о завтра)."],["I [don't understand] this rule.","ps","understand — глагол состояния, не бывает в Continuous → Present Simple."],["The Earth [goes] round the Sun.","ps","Факт → Present Simple."],["How often [do] you [play] computer games?","ps","How often + do → Present Simple."],["I [am revising] for the NMT this month.","pc","Временное действие в этот период → Present Continuous."],["Listen! Someone [is knocking] at the door.","pc","Listen! — прямо сейчас → Present Continuous."],["We [are meeting] our friends at six tonight.","pc","Договорённость с конкретным временем → Present Continuous."],["Why [are] you [smiling]?","pc","are + V-ing → Present Continuous."],["My brother [is] always [taking] my charger!","pc","always + Continuous — раздражение → Present Continuous."],["We [moved] to a new city in 2023.","pas","in 2023 — конкретное время в прошлом → Past Simple."],["I [didn't do] my homework yesterday.","pas","didn't + V, yesterday → Past Simple."],["When [did] you [start] learning English?","pas","When + did → Past Simple."],["She [won] the competition last year.","pas","won (V2 от win), last year → Past Simple."],["He [got] up, [had] breakfast and [left].","pas","Цепочка действий → Past Simple."],["At nine last night I [was doing] my homework.","pac","Конкретный момент в прошлом + was V-ing → Past Continuous."],["While I [was walking] home, it started to snow.","pac","while + длинный процесс → Past Continuous."],["They [were watching] a film when the lights went out.","pac","Длинное действие прервано коротким → Past Continuous."],["What [were] you [doing] at 7 pm?","pac","were + V-ing → Past Continuous."],["I [have] already [done] my project.","pp","already + have V3 → Present Perfect."],["[Have] you ever [tried] sushi?","pp","ever — опыт → Present Perfect."],["She [hasn't replied] yet.","pp","yet + hasn't V3 → Present Perfect."],["We [have had] this dog since 2020.","pp","since + have (состояние) → Present Perfect."],["I [have lost] my phone — I can't call you.","pp","Результат важен сейчас → Present Perfect."],["I think our team [will win].","fs","I think + will — прогноз-мнение → Future Simple."],["It's cold. I [will close] the window.","fs","Решение в момент речи → will."],["I promise I [will be] careful.","fs","Обещание → will."],["I [am going to study] IT at university.","gt","Заранее решённый план → be going to."],["Look at that car! It [is going to crash]!","gt","Видимые признаки → be going to."],["We [are going to paint] my room this weekend.","gt","План → be going to."],["I [have been waiting] for the bus for twenty minutes.","ppc","have been V-ing + for — длится до сих пор → Present Perfect Continuous."],["How long [have] you [been learning] English?","ppc","How long + have been V-ing → Present Perfect Continuous."],["He's red because he [has been running].","ppc","Видимый результат процесса → Present Perfect Continuous."],["It [has been snowing] since morning.","ppc","since + has been V-ing → Present Perfect Continuous."],["When I arrived, the film [had] already [started].","pap","Раньше другого действия в прошлом → Past Perfect."],["I [had never seen] snow before that winter.","pap","never … before that (до момента в прошлом) → Past Perfect."],["She said she [had lost] her keys.","pap","Косвенная речь, сдвиг назад → Past Perfect."],["After we [had eaten], we went for a walk.","pap","After + had V3 — сначала одно, потом другое → Past Perfect."],["This time tomorrow I [will be writing] the test.","fc","This time tomorrow + will be V-ing → Future Continuous."],["Don't call me at 8 — I [will be training].","fc","Процесс в момент в будущем → Future Continuous."],["[Will] you [be using] the laptop tonight?","fc","Вежливый вопрос о планах → Future Continuous."],["By June I [will have finished] school.","fp","By June + will have V3 → Future Perfect."],["By the time you come, I [will have cleaned] my room.","fp","By the time + будущее, завершено → Future Perfect."],["By 2030 scientists [will have found] a cure.","fp","By 2030 + will have V3 → Future Perfect."],["By May I [will have been studying] for the NMT for a year.","fpc","will have been V-ing + for → Future Perfect Continuous."],["At 6 pm we [will have been playing] for three hours.","fpc","Длительность к моменту в будущем → Future Perfect Continuous."],["We [had been playing] for an hour when it started to rain.","papc","had been V-ing + for — длилось до момента в прошлом → Past Perfect Continuous."],["His eyes were red because he [had been gaming] all night.","papc","Результат долгого процесса в прошлом → Past Perfect Continuous."],["She [had been waiting] for ages before the bus came.","papc","had been V-ing → Past Perfect Continuous."],["When I [finish] school, I'll travel.","ps","После when о будущем — Present Simple, не will."],["If it [rains], the match will be cancelled.","ps","If + Present Simple (First Conditional)."],["I [lived] in Italy for a year, then we moved.","pas","Период закончился → Past Simple, а не Present Perfect."],["I [have lived] in this town for two years.","pp","Живу до сих пор, have lived → Present Perfect."]],"theory":{"ps":{"use":"Что бывает обычно, всегда, каждый день; факты; расписание.","f":["+ I / you / we / they play · he / she / it play**s**","− I don't play · he doesn't play","? Do you play? · Does he play?"],"m":"always, usually, often, sometimes, never, every day, on Mondays","ex":[["I [play] football every Saturday.","Я играю в футбол каждую субботу."],["Igor [reads] a lot.","Игорь много читает."],["[Does] Oleg [like] Minecraft?","Олегу нравится Minecraft?"]],"tip":"С he / she / it добавляй -s: he plays, she watches. После does — без -s: Does he play?"},"pc":{"use":"Что происходит прямо сейчас или в этот период.","f":["+ I am playing · he is playing · they are playing","− I'm not playing · he isn't playing","? Are you playing? · Is he playing?"],"m":"now, right now, at the moment, Look!, Listen!, today, this week","ex":[["Look! The dog [is running].","Смотри! Собака бежит."],["I [am building] a house in Minecraft now.","Я сейчас строю дом в Minecraft."],["What [are] you [doing]?","Что ты делаешь?"]],"tip":"Не бывает без am / is / are: не «I playing», а I am playing. Глаголы like, know, want обычно без -ing."},"pas":{"use":"Что было и закончилось в прошлом (вчера, в прошлом году).","f":["+ I played · I went (неправильные — 2-я форма)","− I didn't play / didn't go","? Did you play? · Did you go?"],"m":"yesterday, last week, last year, ago, in 2020, when I was little","ex":[["We [watched] a film yesterday.","Мы вчера смотрели фильм."],["Oleg [went] to the park.","Олег ходил в парк."],["[Did] you [finish] the level?","Ты прошёл уровень?"]],"tip":"После did / didn't глагол снова простой: Did you go? (не went). was / were — прошедшее от to be."},"pac":{"use":"Что происходило в какой-то момент в прошлом (был в процессе).","f":["+ I / he was playing · we / they were playing","− I wasn't playing · they weren't playing","? Were you playing? · Was he playing?"],"m":"at 5 o'clock yesterday, while, when (и тут что-то случилось)","ex":[["I [was sleeping] at ten last night.","Вчера в десять я спал."],["We [were playing] when Dad came home.","Мы играли, когда пришёл папа."],["While Igor [was cooking], I [was cleaning].","Пока Игорь готовил, я убирал."]],"tip":"Длинное действие — was/were + -ing, короткое, которое его прервало, — Past Simple: I was playing when the phone rang."},"pp":{"use":"Опыт («когда-нибудь») и результат сейчас (уже, только что, ещё не).","f":["+ I have played · he has played (3-я форма)","− I haven't played · he hasn't played","? Have you ever played? · Has he finished?"],"m":"ever, never, already, just, yet, so far, for, since","ex":[["I [have] never [been] to London.","Я никогда не был в Лондоне."],["Igor [has] just [finished] his homework.","Игорь только что сделал уроки."],["[Have] you ever [beaten] this boss?","Ты когда-нибудь побеждал этого босса?"]],"tip":"Если есть точное время в прошлом (yesterday, last week, ago) — это Past Simple, а не Present Perfect."},"fs":{"use":"Будущее: прогноз, обещание, решение прямо сейчас.","f":["+ I will help (I'll help)","− I won't help (= will not)","? Will you help me?"],"m":"tomorrow, next week, I think…, maybe, probably, I promise","ex":[["I [will help] you, Mum!","Я помогу тебе, мама!"],["I think it [will be] sunny.","Думаю, будет солнечно."],["It's cold. I['ll close] the window.","Холодно. Я закрою окно."]],"tip":"После when / if / as soon as о будущем — НЕ will: When I get home, I'll call you."},"gt":{"use":"План, который уже решён; будущее, которое видно по признакам.","f":["+ I am going to buy · he is going to play","− I'm not going to buy","? Are you going to buy…?"],"m":"tomorrow, next summer, Look!, (уже решил)","ex":[["I [am going to visit] Grandma tomorrow.","Завтра я поеду к бабушке."],["Look at the clouds! It [is going to rain].","Смотри на тучи! Сейчас пойдёт дождь."],["What [are] you [going to do] on Saturday?","Что ты собираешься делать в субботу?"]],"tip":"Решил заранее — going to. Решил прямо сейчас — will."},"ppc":{"use":"Как долго что-то длится до сих пор; видимый результат долгого процесса.","f":["+ I have been waiting · he has been running","− I haven't been waiting","? How long have you been waiting?"],"m":"for (two hours), since (morning), How long…?, all day","ex":[["I [have been waiting] for an hour.","Я жду уже час."],["It [has been raining] since morning.","Дождь идёт с утра."],["He's tired — he [has been playing] all day.","Он устал — он играл весь день."]],"tip":"С know, like, have (иметь) — обычный Present Perfect: I have known him for years."},"pap":{"use":"Что случилось РАНЬШЕ другого действия в прошлом.","f":["+ I had finished (had + 3-я форма)","− I hadn't finished","? Had you finished?"],"m":"before, after, by the time, already (в прошлом), when (= к тому моменту)","ex":[["When I arrived, the film [had] already [started].","Когда я пришёл, фильм уже начался."],["I [had never seen] snow before.","Я раньше никогда не видел снег."],["She said she [had lost] her keys.","Она сказала, что потеряла ключи."]],"tip":"Сначала было одно (had + V3), потом другое (Past Simple)."},"fc":{"use":"Что будет происходить в определённый момент в будущем.","f":["+ I will be playing","− I won't be playing","? Will you be playing?"],"m":"this time tomorrow, at 8 pm tomorrow, all evening","ex":[["This time tomorrow I [will be flying] to Rome.","Завтра в это время я буду лететь в Рим."],["Don't call at 8 — I [will be training].","Не звони в 8 — у меня будет тренировка."]],"tip":"Похоже на Past Continuous, только в будущем."},"fp":{"use":"Что будет уже сделано к определённому моменту в будущем.","f":["+ I will have finished","− I won't have finished","? Will you have finished?"],"m":"by Friday, by the time…, by 2030","ex":[["I [will have finished] the project by Friday.","К пятнице я закончу проект."],["By June I [will have finished] school.","К июню я окончу школу."]],"tip":"Главный маркер — by (к какому-то времени)."},"fpc":{"use":"Сколько что-то будет длиться к моменту в будущем.","f":["+ I will have been studying","− I won't have been studying","? How long will you have been studying?"],"m":"by (June) … for (two years)","ex":[["By May I [will have been studying] for the NMT for a year.","К маю я буду готовиться к НМТ уже год."]],"tip":"by + for вместе — почти всегда это время."},"papc":{"use":"Как долго что-то длилось до момента в прошлом.","f":["+ I had been waiting","− I hadn't been waiting","? How long had you been waiting?"],"m":"for (an hour) when…, before, by the time","ex":[["We [had been playing] for an hour when it started to rain.","Мы играли уже час, когда начался дождь."],["His eyes were red — he [had been gaming] all night.","Глаза были красные — он играл всю ночь."]],"tip":"Это Present Perfect Continuous, только «сдвинутый» в прошлое."}}},"stories":[{"t":"Before We Were Born: Alf and Dashka","l":"B1","text":"Long before Oleg and I appeared, our parents already had a little family of their own: a Dalmatian called Alf and a white cat called Dashka. Mum still smiles every time she talks about them. Alf adored walks. As soon as somebody touched his lead, he would run to the door and wait there, shaking with excitement. He also had a rather snobbish view of the world: as far as he was concerned, only Dalmatians counted as real dogs. Other dogs could bark at him as much as they liked, but he simply ignored them, as if they were pigeons. One winter morning Alf saw something interesting and pulled the lead so hard that Mum lost her balance and landed in a huge icy puddle. She was wearing a long sheepskin coat, which was soaked in seconds. Most people would have gone straight home, but the walk had only just begun, so Mum got up, laughed and carried on. Dashka was the complete opposite. She was afraid of everybody, so she lived in a separate room and hardly ever came out. She seemed like a perfectly quiet, well-behaved cat, until the day Mum looked under the chest of drawers and discovered a whole bucketful of poo. Dashka, it turned out, had been running her own secret toilet there for a long time.","g":[["lead","поводок"],["snobbish","высокомерный, с гонором"],["as far as he was concerned","по его мнению"],["lost her balance","потеряла равновесие"],["sheepskin coat","дублёнка"],["soaked","промокший насквозь"],["carried on","продолжила"]],"q":[["How did Alf react to other dogs?",["He ignored them because they were not Dalmatians","He barked at them loudly","He was afraid of them","He always played with them"],0],["Why didn't Mum go home after falling into the puddle?",["The walk had only just started","Alf ran away","Her coat stayed dry","It was a warm summer day"],0],["What does \"the complete opposite\" tell us about Dashka?",["She was shy and quiet, unlike energetic Alf","She loved walks even more than Alf","She was also a Dalmatian","She was a very big cat"],0],["Why did nobody notice Dashka's secret toilet for a long time?",["It was hidden under furniture in her own room","Alf kept cleaning it","Dashka lived outside","Mum noticed it at once"],0]]},{"t":"Growing Up with Football in Kharkiv","l":"B1","text":"I was born in Kharkiv, the second largest city in Ukraine, and for me it has always been a football city. Kharkiv is home to FC Metalist, and its main stadium, also called Metalist, is one of the biggest in the country. It was renovated for Euro 2012, when international matches were played there. However, my own first football memories are connected with a smaller stadium, Serp i Molot. When Oleg and I were little, Mum used to take us there to watch matches. I must have been about six. I remember the noise more than the games: drums, songs and thousands of people clapping at the same time. Oleg was so small that he spent most of the match sitting on Mum's knees and eating buns, which is a family joke now. I, on the other hand, tried to follow every move and asked Mum endless questions about the rules. Why is that goal offside? Why did the referee show a yellow card? Mum didn't always know the answers, so we learned the rules together. Looking back, I think those afternoons were the reason I fell in love with football. If I hadn't gone to those matches, I probably wouldn't support a team so passionately today.","g":[["renovated","реконструирован"],["memories","воспоминания"],["used to take","раньше водила"],["clapping","хлопающих"],["offside","офсайд, вне игры"],["referee","судья"],["passionately","страстно"]],"q":[["Why was the Metalist stadium renovated?",["For Euro 2012","For a concert","Because it was too small for the club","For the Olympic Games"],0],["What does Igor remember most about the matches?",["The noise and atmosphere","The final scores","The players' names","The weather"],0],["Why did Igor and his mum learn the rules together?",["Mum didn't always know the answers","Igor's coach asked them to","Oleg wanted to play","They watched a TV programme"],0],["What can we infer about Igor today?",["He is still a keen football fan","He has stopped watching football","He plays for Metalist","He prefers basketball"],0]]},{"t":"A Winter Week in Berlin","l":"B1","text":"Just before the covid pandemic, in the winter of 2019, our family flew from Kharkiv to Berlin for a week. I was eight, and it was the first time I had ever been abroad. Oleg was only about four, so he hardly remembers anything, but I still have quite clear pictures in my head. Berlin is the capital of Germany and one of the largest cities in Europe. What surprised me first was how organised everything was: the trains arrived exactly on time, and people waited for the green light even when there were no cars. The city was decorated for Christmas, and the Christmas markets were the highlight of the trip. They smelled of cinnamon, roasted nuts and hot chocolate. We also saw the Brandenburg Gate, which has become a symbol of a united Germany, and a piece of the Berlin Wall that once divided the city into two parts. I didn't fully understand the history at the time, but I remember touching the cold concrete and thinking it was strange that a wall could separate families. It was freezing, and Oleg complained about his tired legs, so Mum carried him most of the time. If we went back now, I would definitely visit more museums.","g":[["abroad","за границей"],["organised","организованный"],["decorated","украшен"],["highlight","самое яркое событие"],["cinnamon","корица"],["divided","разделяла"],["concrete","бетон"]],"q":[["How old was Igor during the trip?",["Eight","Four","Twelve","Fifteen"],0],["What surprised Igor first in Berlin?",["How organised everything was","How warm the weather was","How small the city was","How many cars there were"],0],["What was once divided by the Berlin Wall?",["The city of Berlin","Germany and Poland","Two Christmas markets","The river"],0],["What does the last sentence suggest?",["Igor is now more interested in history","Igor didn't enjoy the trip at all","Igor wants to live in Berlin","Igor has already been back to Berlin"],0]]},{"t":"Sea and Mountains in Kemer","l":"B1","text":"In 2021 Mum, Dad, Oleg and I spent a holiday in Kemer, a resort town on the Mediterranean coast of Turkey. Kemer is located between the sea and the Taurus Mountains, so from our hotel balcony we could see both at the same time: blue water in front and green, rocky peaks behind. Our hotel was \"all inclusive\", which means that all meals and drinks are included in the price. At first this seemed amazing to me. I could take pizza, chips and three desserts without asking anyone! After a few days, though, I realised that I actually preferred fresh fruit, especially the sweet Turkish watermelon. The beach was covered with small pebbles rather than sand, and they got so hot by midday that we had to wear special shoes. The water, however, was incredibly clear; I could see fish swimming around my feet. In the evenings the hotel organised animation: shows, quizzes and dance competitions. I was a bit too shy to dance, but Oleg wasn't. He joined every competition and once even won a prize. Dad joked that Oleg should become a professional dancer. That holiday was the last time all four of us travelled abroad together, so the photos from Kemer are very special to me.","g":[["resort town","курортный город"],["coast","побережье"],["peaks","вершины"],["included in the price","включено в стоимость"],["pebbles","галька"],["incredibly","невероятно"],["shy","застенчивый"]],"q":[["Where is Kemer located?",["Between the sea and the Taurus Mountains","In the centre of Turkey","On a small island","Near a big lake"],0],["What does \"all inclusive\" mean in the text?",["Meals and drinks are included in the price","Every room has a sea view","Children stay for free","Excursions are free"],0],["Why did they need special shoes on the beach?",["The pebbles got very hot","The water was cold","There were sharp shells","The sand was wet"],0],["What can we infer about Oleg from the text?",["He is more outgoing than Igor","He didn't like the animation","He was afraid of the sea","He is a professional dancer"],0]]},{"t":"Living in Pisa","l":"B2","text":"In spring 2022 Mum, Oleg and I lived in Pisa, Italy, for three months. Before that, I had only seen the famous Leaning Tower in pictures, so it felt unreal to walk past it on my way to the shops. The tower was built as the bell tower of the cathedral, and it started to lean while it was still being constructed in the 12th century, because the ground underneath is too soft. Engineers have worked on it for centuries, and it has been made more stable, but it still leans by about four degrees. Of course, we took the classic tourist photo of \"holding\" the tower. Oleg tried about twenty times until his hands were in exactly the right place. Living somewhere is very different from visiting as a tourist. We had to buy food in Italian supermarkets, read signs and talk to neighbours. I picked up a lot of useful phrases, like \"Quanto costa?\" (How much is it?) and \"Posso avere…\" (Can I have…). I noticed that Italians speak with their hands, and soon I caught myself doing the same. The food was fantastic, of course. I had always thought I knew what pizza was, but real Italian pizza, thin and slightly burnt at the edges, changed my mind. And the gelato was so good that we had to set a rule: only one scoop a day.","g":[["unreal","нереально"],["cathedral","собор"],["lean","наклоняться"],["underneath","под ним"],["stable","устойчивый"],["picked up","выучил, подхватил"],["scoop","шарик (мороженого)"]],"q":[["Why does the Leaning Tower lean?",["The ground underneath is too soft","It was built that way on purpose","An earthquake damaged it","The bells are too heavy"],0],["According to Igor, how is living somewhere different from visiting?",["You have to deal with everyday life in the local language","You can see more sights","It is always cheaper","You don't need to speak to anyone"],0],["What did Igor notice about how Italians speak?",["They use their hands a lot","They speak very quietly","They speak very slowly","They always speak English"],0],["Why did the family set a rule about gelato?",["It was so good that they would eat too much","It was too expensive","Oleg was allergic","The shop closed early"],0]]},{"t":"Sofiyivka: A Love Story in a Park","l":"B2","text":"In the summer of 2022 we came back to Ukraine and lived in Uman for a while. The town is small, but it has one of the most beautiful landscape parks in Europe — Sofiyivka. The park was created at the end of the 18th century by Count Stanisław Potocki as a gift for his wife, Sofia, which is why it bears her name. It is said that thousands of workers spent years moving rocks, digging ponds and planting trees to make it look like a scene from ancient Greek myths. While we lived in Uman, we walked there almost every weekend, and I never got tired of it. There are lakes with swans, waterfalls, stone grottoes and narrow paths that suddenly open onto amazing views. My favourite part was the underground river. You sit in a boat, and it carries you through a dark stone tunnel. Inside, it is cool even on the hottest day, and every sound echoes. Oleg held Mum's hand all the time, although he later claimed he hadn't been scared at all. I also liked the Grotto of Thetis, where water drips from the stones and the air is fresh. If I ever had to give somebody a gift that would last for centuries, I would probably choose a book, not a park — it's a lot cheaper!","g":[["landscape parks","ландшафтные парки"],["bears her name","носит её имя"],["digging ponds","копая пруды"],["ancient","древний"],["grottoes","гроты"],["echoes","отдаётся эхом"],["claimed","утверждал"]],"q":[["Who created Sofiyivka Park?",["Count Potocki","Sofia herself","The town of Uman","Greek architects"],0],["What was the park designed to look like?",["A scene from ancient Greek myths","An Italian city","A French palace garden","A forest in winter"],0],["Why is the underground river cool even on hot days?",["It is inside a stone tunnel","There is air conditioning","It flows from the mountains","It is only open at night"],0],["What can we infer about Oleg in the tunnel?",["He was probably a little scared","He was bored","He wanted to swim","He was asleep"],0]]},{"t":"From City Boy to Village Life","l":"B1","text":"In 2023 we moved to a village near Poltava. Having grown up in a big city like Kharkiv, I wasn't sure I would like it. I was used to shopping centres, buses and crowds, and the village seemed incredibly quiet. For the first few weeks, I was woken up every morning by a rooster, and I could hardly believe that there was only one small shop. However, I gradually started to notice the advantages. The air is much cleaner, the sky at night is full of stars, and you can see the sunset from almost any window. I've learned to do things I had never done before: I've chopped wood, picked cherries and even helped a neighbour find her lost goat. Our cat Murka adapted faster than anyone. In Kharkiv she lived in a flat, but here she spends whole days in the garden hunting butterflies, although she has never caught one. Oleg made friends immediately, of course; he rides his bike around the village with a group of local kids. For me it took longer, but now I go to Poltava regularly, so I don't feel isolated. I still miss Kharkiv sometimes, but I've realised that a place doesn't have to be big to be interesting.","g":[["crowds","толпы"],["gradually","постепенно"],["advantages","преимущества"],["chopped wood","колол дрова"],["adapted","приспособилась"],["immediately","сразу же"],["isolated","изолированный, оторванный"]],"q":[["How did Igor feel about the move at first?",["He wasn't sure he would like it","He was very excited","He was angry","He didn't care"],0],["Which of these has Igor NOT done in the village?",["Caught a butterfly","Chopped wood","Picked cherries","Helped find a goat"],0],["Why doesn't Igor feel isolated?",["He goes to Poltava regularly","He plays online all day","He has a lot of neighbours","He rides his bike with Oleg"],0],["What is the main idea of the last sentence?",["A small place can also be interesting","Big cities are boring","Igor wants to move back","Villages are better than cities"],0]]},{"t":"A Museum of Old Computers","l":"B1","text":"One of the most unusual places I've visited in Poltava is a computer museum. I had expected a boring room with a few dusty machines, but it turned out to be one of the most interesting museums I've ever been to. The collection includes computers that were produced decades ago, some of them in the Soviet Union, and many of them still work. The oldest machines are enormous. It's hard to believe that a computer the size of a wardrobe was less powerful than the phone in my pocket. There were also home computers from the 1980s and 1990s, which were connected to ordinary TVs. Programs and games were stored on cassette tapes, and loading a single game could take several minutes, accompanied by a terrible screeching sound. The guide said that people used to type in programs by hand from magazines. Imagine copying hundreds of lines of code just to play a simple game! Visitors are allowed to try some of the machines. Oleg and I played an ancient tennis game where the ball was just a square. Surprisingly, it was quite addictive, and Oleg beat me twice. Mum recognised a computer she had used at school and told us stories about it. After the visit I appreciated my laptop much more.","g":[["dusty","пыльный"],["turned out","оказалось"],["enormous","огромный"],["powerful","мощный"],["stored","хранились"],["accompanied by","сопровождаемый"],["addictive","затягивающий"]],"q":[["What did Igor expect before the visit?",["A boring room with dusty machines","A big interactive science centre","A shop selling new laptops","A museum of phones"],0],["How were programs stored on 1980s home computers?",["On cassette tapes","On USB flash drives","In the cloud","On DVDs"],0],["Why does Igor mention the phone in his pocket?",["To show how much more powerful modern devices are","To say that he took photos","Because phones were in the museum","Because his phone stopped working"],0],["What can we infer from the last sentence?",["Igor now values modern technology more","Igor wants to buy an old computer","Igor's laptop is broken","Igor didn't enjoy the museum"],0]]},{"t":"A Saturday in Poltava","l":"B1","text":"Since we moved to a village near Poltava, Saturday trips to the city have become a family tradition. Poltava is not as big as Kharkiv, but it is green, calm and full of history. Our route is usually the same. We start in Peremoha Park, where we walk along the shady paths, watch people walking their dogs and sometimes buy cotton candy from a little kiosk. Then we head to the pedestrian street in the centre. On warm days it is full of street musicians, artists and families, and you can walk in the middle of the road without worrying about cars. The highlight of every trip, though, is lunch. Poltava is considered the capital of halushky — dumplings made from dough and boiled in soup or served with sour cream and fried onions. The city is so proud of this dish that it has a monument to halushky: a huge bowl with a giant spoon. Tourists often take photos pretending to eat from it, and Oleg has done this at least five times. There is a café we always go to, where the halushky are soft and the portions are enormous. I usually order them with mushrooms. If you have never tried halushky, Poltava is definitely the place to do it.","g":[["family tradition","семейная традиция"],["shady paths","тенистые дорожки"],["head to","направляться в"],["without worrying","не беспокоясь"],["dumplings","клёцки"],["proud of","гордится"],["portions","порции"]],"q":[["Where do the family's Saturday trips usually start?",["In Peremoha Park","At the halushky monument","In a café","On the pedestrian street"],0],["What does the monument to halushky look like?",["A huge bowl with a giant spoon","A woman cooking","A big plate of soup","A statue of a chef"],0],["How does Igor usually order halushky?",["With mushrooms","With fried fish","With cherries","With cheese"],0],["Why does Igor mention that Oleg took photos at the monument five times?",["To show that Oleg loves this place","To complain about Oleg","Because the photos were bad","Because it was Oleg's job"],0]]},{"t":"Opishnia, the Capital of Pottery","l":"B2","text":"Not far from Poltava lies the small town of Opishnia, which is known as the pottery capital of Ukraine. Our school class went there on an excursion, and I have to admit that it was more interesting than I had expected. Potters have worked in Opishnia for centuries because the local clay is of extremely good quality. Opishnia ceramics are famous for their bright patterns and for clay toys shaped like animals — lions, rams, horses and even fantastic creatures. Today the town is home to the National Museum of Ukrainian Pottery, which has a huge collection of pots, jugs, tiles and sculptures. Some of the pots are so big that a person could hide inside. After the museum we visited a workshop where a local master demonstrated the potter's wheel. He made it look effortless: in a couple of minutes a lump of wet clay turned into an elegant jug. Then we were given a chance to try. It was much harder than it looked. The clay kept wobbling, and my first pot collapsed into a shapeless mess. Everybody laughed, including me. My second attempt was better, although it looked more like an ashtray than a vase. The master told us that it takes years of practice to become a real potter. Now I understand why handmade ceramics are so expensive.","g":[["admit","признать"],["quality","качество"],["patterns","узоры"],["demonstrated","продемонстрировал"],["effortless","лёгкий, без усилий"],["wobbling","шататься"],["collapsed","развалился"]],"q":[["Why have potters worked in Opishnia for centuries?",["The local clay is of very good quality","The government told them to","There were no other jobs","It is close to the sea"],0],["What are Opishnia clay toys usually shaped like?",["Animals and fantastic creatures","Cars and planes","Famous people","Houses"],0],["What happened to Igor's first pot?",["It collapsed","It was sold","It broke in the oven","He gave it to Oleg"],0],["What did Igor understand after the visit?",["Why handmade ceramics are expensive","How to become a potter in a week","Why the museum is so small","That pottery is easy"],0]]},{"t":"A Week on the Dnipro","l":"B1","text":"Last summer we spent a week in Dnipro, a large city in central Ukraine named after the river it stands on. The Dnipro is the longest river in Ukraine and the fourth longest in Europe, and in the city it is so wide that it looks almost like a lake. What impressed me most was the embankment. It is said to be one of the longest in Europe, stretching for many kilometres along the river. We walked there every evening, and there was always something going on: people jogging, cycling and roller skating, children playing near fountains, and fishermen patiently waiting for a bite. Oleg and I rented electric scooters, which was a great way to cover long distances. Mum stayed behind with a book on a bench, probably enjoying the rare peace and quiet. The city is connected by several bridges, and I tried to remember their names, although I kept mixing them up. One evening we took a short boat trip. From the water, the city looked completely different, and the sunset turned the whole river pink and gold. If I had to describe Dnipro in one word, I'd say \"spacious\" — everything there, from the river to the streets, seems wider than anywhere else.","g":[["named after","назван в честь"],["impressed","впечатлило"],["stretching","простирающаяся"],["patiently","терпеливо"],["cover long distances","преодолевать большие расстояния"],["mixing them up","путал их"],["spacious","просторный"]],"q":[["Why does the river look almost like a lake in the city?",["It is extremely wide","It has no current","It is surrounded by hills","There are no bridges"],0],["What impressed Igor most about Dnipro?",["The embankment","The shopping centres","The museums","The weather"],0],["Why does Igor think Mum stayed on the bench?",["She was enjoying some rare peace and quiet","She was ill","She didn't like scooters","She was waiting for a friend"],0],["Which word does Igor use to describe Dnipro?",["Spacious","Crowded","Noisy","Ancient"],0]]},{"t":"Two Days in Kyiv","l":"B2","text":"Although Kyiv is the capital of Ukraine, I had never properly explored it until our recent trip with Mum and Oleg. We only had two days, so we tried to see as much as possible. Our first adventure was the metro. Arsenalna, one of the stations in Kyiv, is considered the deepest underground station in the world — over 100 metres underground. The escalator ride takes several minutes, and Oleg counted every second. Then we walked along Khreshchatyk, the main street of the city. It is surprisingly wide, and at weekends it is closed to traffic, so it becomes a huge pedestrian zone. On the second day we visited the Kyiv Pechersk Lavra, a monastery that was founded almost a thousand years ago and is now a UNESCO World Heritage Site. Its golden domes are visible from far away, and underneath it there are narrow caves where monks used to live. The caves were dark and quiet, and we had to walk with candles. Afterwards we climbed one of the hills above the Dnipro. Kyiv is built on hills, and the view of the river, the bridges and the green islands is breathtaking. By the end of the second day my feet hurt, but I'd already started planning my next visit.","g":[["properly explored","как следует исследовал"],["is considered","считается"],["closed to traffic","закрыта для транспорта"],["founded","основан"],["World Heritage Site","объект Всемирного наследия"],["monks","монахи"],["breathtaking","захватывающий дух"]],"q":[["What is special about Arsenalna station?",["It is considered the deepest in the world","It is the oldest in Europe","It has no escalator","It is above the ground"],0],["What happens to Khreshchatyk at weekends?",["It is closed to traffic","It is used for markets only","It becomes a car park","Its shops are closed"],0],["Why did they walk with candles in the Lavra?",["The caves were dark","It was a religious holiday","The electricity was off","It was night"],0],["What does the last sentence suggest?",["Igor enjoyed Kyiv and wants to return","Igor was disappointed","Igor never wants to walk again","Igor lives in Kyiv now"],0]]},{"t":"How a Parrot Turned into a Guinea Pig","l":"B1","text":"Some family decisions are made very carefully. Ours, it seems, are made at the last minute. A few years ago we went to the bird market in Kharkiv with a clear plan: to buy a parrot. Oleg had been dreaming about a bird that could repeat words, and I had already chosen a name for it. However, the parrots turned out to be incredibly noisy, and after ten minutes of screeching we started to have doubts. Then Oleg noticed a small brown-and-white guinea pig sitting quietly in a cage, and that was the end of the parrot plan. We named him Arnoldets, although he was usually called Arnie. Arnie may have been small, but he was surprisingly well-travelled. He moved with us to a village near Poltava, and he even came with us to Dnipro and Kyiv, sitting in a travel box and squeaking whenever the car stopped. At some point we decided he must be lonely, so we bought him a companion, assuming it was another boy. A few weeks later we discovered our mistake in the most obvious way possible: three tiny babies appeared in the cage. We couldn't keep five guinea pigs, so the mother and her babies went to a kind family who had been looking for pets. Arnie stayed with us and seemed perfectly happy to have his cage back.","g":[["at the last minute","в последний момент"],["had been dreaming","давно мечтал"],["doubts","сомнения"],["well-travelled","много путешествовавший"],["companion","компаньон, друг"],["assuming","предполагая"],["obvious","очевидный"]],"q":[["Why did the family change their minds about the parrot?",["The parrots were too noisy","Parrots were too expensive","Mum was allergic to birds","The market had no parrots"],0],["Where did Arnie travel with the family?",["To the village, Dnipro and Kyiv","To Italy and Turkey","Only to Poltava","To Bulgaria"],0],["What was the mistake the family made?",["They thought the companion was a boy","They bought a rabbit instead","They forgot to feed Arnie","They gave Arnie away"],0],["How did Arnie probably feel when the others left?",["Quite happy to have his space back","Very lonely and sad","Angry with the family","Afraid of the cage"],0]]},{"t":"Learning Bulgarian on the Beach","l":"B1","text":"Our class has been to the Black Sea coast of Bulgaria twice, and both times my classmate Yura and his younger brother Zhenya came too. Everybody remembers the beach, the waves and the ice cream, but what I remember most is the language. Bulgarian uses the Cyrillic alphabet, just like Ukrainian, so at first I thought I would understand everything. In fact, it was a bit more complicated. Many words are similar: \"вода\" means water and \"хляб\" is bread. But some words are confusing. Yura and I couldn't stop laughing when we discovered that Bulgarians nod their heads to say \"no\" and shake them to say \"yes\" — the opposite of what we do. Once Yura asked a shop assistant if they had cold juice. She shook her head, so he turned to leave, but she was actually saying \"yes\" and was already taking a bottle out of the fridge! After that, we decided to listen to words and ignore head movements. Zhenya, who was the youngest in the group, learned the phrase \"благодаря\" (thank you) and said it to everyone, even to the seagulls. By the end of the second trip, Yura and I could order food and ask for directions in simple Bulgarian. I realised that learning a language is much easier when you actually need it.","g":[["classmate","одноклассник"],["alphabet","алфавит"],["complicated","сложный"],["confusing","сбивающий с толку"],["nod their heads","кивают головой"],["the opposite","противоположность"],["ignore","игнорировать"]],"q":[["Why did Igor think he would understand Bulgarian easily?",["It uses the Cyrillic alphabet","He had studied it at school","Yura spoke it fluently","Everyone in Bulgaria speaks Ukrainian"],0],["What is unusual about Bulgarian head movements?",["A nod means \"no\" and a shake means \"yes\"","They never move their heads","A nod means \"thank you\"","They wave instead of nodding"],0],["Why did Yura turn to leave the shop?",["He thought the shop assistant said \"no\"","The juice was too expensive","The shop was closing","Zhenya called him"],0],["What is the main lesson Igor learned?",["A language is easier to learn when you really need it","Bulgarian is impossible to learn","Head movements are more important than words","Seagulls understand Bulgarian"],0]]},{"t":"Lusha, Klusha and the Battle for the Water Bottle","l":"B1","text":"This summer our guinea pig Arnie died. He had lived with us for years, travelled with us across Ukraine and become a real member of the family, so we were all very sad. For a while nobody wanted to talk about getting another pet; the empty cage in the corner was a quiet reminder of him. Eventually Mum suggested that a new guinea pig wouldn't replace Arnie, but it might bring some life back into the house. This time we decided to get two, so that they would never be lonely. Their names are Lusha and Klusha, and it is hard to imagine two more different characters. Klusha is fearless. She explores every corner of the cage, climbs on top of her house and runs to greet anyone who comes into the room. Lusha, on the other hand, is extremely timid. She spends most of the day inside her little wooden house, and if you so much as look at her, she freezes. Yet there is one thing they both care about passionately: the water bottle. Although it is big enough for both of them, they fight over it constantly, pushing each other away and tugging at the spout until the bottle falls out of its holder. Then they stare at the puddle as if somebody else had done it. I suspect Arnie would have found them ridiculous.","g":[["reminder","напоминание"],["replace","заменить"],["fearless","бесстрашная"],["timid","робкая"],["freezes","замирает"],["tugging at the spout","дёргая за носик"],["ridiculous","нелепый, смешной"]],"q":[["Why did the family decide to get two guinea pigs?",["So that they would never be lonely","Because Arnie had two friends","Because the shop had a special offer","Because Oleg and Igor wanted one each"],0],["How is Klusha different from Lusha?",["She is brave and curious","She is shy and quiet","She never drinks water","She sleeps all day"],0],["What happens when they fight over the bottle?",["It falls out of its holder","It breaks into pieces","Lusha wins every time","Mum takes it away"],0],["What does the phrase \"as if somebody else had done it\" suggest?",["The guinea pigs look innocent, which is funny","Murka knocked the bottle down","Igor spilled the water","The bottle was broken already"],0]]}],"cfg":{"name":"Игорь","key":"igor-","mode":"teen","weeks":60,"emoji":false,"rate":0.9,"hello":"Привет, Игорь!","sub":"300 уроков: A2 → B1 → B2 → B2+. 15 минут в день: грамматика, слова, перевод и задания как на НМТ. Правильные ответы = звёзды ⭐"}};
/* ---------- помощники ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const hl = s => esc(s).replace(/\[([^\]]+)\]/g, "<mark>$1</mark>");
const plain = s => String(s).replace(/[\[\]]/g, "");
const canSpeak = typeof window !== "undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function browserSpeak(t) { if (!canSpeak) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(t)); u.lang = "en-US"; u.rate = DATA.cfg.rate || .85; speechSynthesis.speak(u); } catch (e) {} }
let TTS = null, TTS_OFF = false;
function speak(t) {
  const text = plain(t).trim(); if (!text) return;
  if (TTS && !TTS_OFF) { TTS.speak(text.slice(0, 2000), { language: "en", rate: DATA.cfg.rate || .85, voice: DATA.cfg.voice || "airy" }).catch(e => { if (e && e.code === "not_granted") TTS_OFF = true; else if (e && (e.code === "unavailable" || e.code === "upstream_error")) browserSpeak(text); }); return; }
  browserSpeak(text);
}
const sayBtn = t => (canSpeak || TTS) ? `<button type="button" class="say" data-say="${esc(plain(t))}" aria-label="Послушать">🔊</button>` : "";
if (typeof document !== "undefined") document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });
const store = {
  get(k, d) { try { const v = localStorage.getItem(DATA.cfg.key + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(DATA.cfg.key + k, JSON.stringify(v)); } catch (e) {} },
};
function rng32(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sshuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function trBase(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'")
    .replace(/\bcan't\b/g, "cannot").replace(/\bcan not\b/g, "cannot").replace(/\bwon't\b/g, "will not").replace(/\bshan't\b/g, "shall not")
    .replace(/n't\b/g, " not").replace(/'m\b/g, " am").replace(/'re\b/g, " are").replace(/'ve\b/g, " have").replace(/'ll\b/g, " will")

    const sayItems = C.mode === "kid" ? (L.words && L.words.length ? L.words : L.match.slice(0, 3)).map(w => w[0]) : tps.slice(0, 1).flatMap(tp => tp.ex.slice(0, 2).map(e => plain(e[0])));
    if (sayItems.length) s.push(H("Скажи вслух 🎤") + `<div class="stack" id="g-say"></div>`);
    if (L.quiz && L.quiz.length) s.push(H("Тест") + `<div class="stack" id="g-quiz">${quizHtml(L.quiz, "q", L.n * 31)}</div>`);
    if (L.build && L.build.length) s.push(H("Собери предложение") + `<div class="stack" id="g-build"></div>`);
    if (L.tr && L.tr.length) s.push(H("Переведи на английский") + `<div class="stack" id="g-tr"></div>`);
    if (L.read) s.push(H(C.mode === "kid" ? "Читаем историю" : "Чтение (как на НМТ)") + `<div class="stack" id="g-read">${readHtml(L.read, L, "r")}</div>`);
    if (L.cloze) s.push(H("Use of English (как на НМТ)") + `<p class="muted small">Выбери правильное слово для каждого пропуска.</p><div class="stack" id="g-cloze">${clozeHtml(L.cloze, L)}</div>`);
    if (L.old && L.old.length || L.tn || L.spell && L.spell.length) s.push(`<div class="card" style="text-align:center"><b>💪 Ещё задания — повторяем пройденное</b></div>`);
    if (L.old && L.old.length) s.push(H("Повторяем прошлые недели") + `<div class="stack" id="g-old">${quizHtml(L.old, "o", L.n * 43)}</div>`);
    if (L.tn) s.push(H("⏱ Какое это время?") + `<p class="muted small">Глагол выделен. Выбери время.</p><div class="stack" id="g-tn">${quizHtml(L.tn, "tq", L.n * 59)}</div>`);
    if (L.spell && L.spell.length) s.push(H("Напиши слово по-английски ✍️") + `<div class="stack" id="g-spell"></div>`);
    if (L.build2 && L.build2.length) s.push(H("Собери ещё предложения") + `<div class="stack" id="g-build2"></div>`);
    if (L.tr2 && L.tr2.length) s.push(H("Переведи ещё") + `<div class="stack" id="g-tr2"></div>`);
    s.push(`<div class="card finish"><div class="big">${done[L.n] ? "✅" : "🏁"}</div><b>${done[L.n] ? "Этот урок уже пройден" : "Всё сделал? Молодец!"}</b>
      <button type="button" class="btn" id="fin">${done[L.n] ? "К следующему уроку →" : "Урок пройден ✓ (+5 ⭐)"}</button>${cur > 1 ? `<button type="button" class="btn ghost" id="prev">← предыдущий урок</button>` : ""}</div>`);
    $("lesson").innerHTML = s.join("");
    if (L.listen) listenGame($("g-listen"), L.listen, L.topics[0].words, L.n * 17);
    if (L.match && L.match.length) matchGame($("g-match"), L.match.map(w => C.mode === "kid" ? [w[0], w[1], w[2]] : [w[0], w[1]]), L.n * 13);
    bindQuiz($("lesson"));
    if (sayItems.length) sayGame($("g-say"), sayItems);
    if (L.read) rdBind(L.read);
    if (L.build && L.build.length) buildGame($("g-build"), L.build, L.n * 19);
    if (L.tr && L.tr.length) trGame($("g-tr"), L.tr);
    if (L.spell && L.spell.length) spellGame($("g-spell"), L.spell);
    if (L.build2 && L.build2.length) buildGame($("g-build2"), L.build2, L.n * 23);
    if (L.tr2 && L.tr2.length) trGame($("g-tr2"), L.tr2);
    if (L.cloze) $("g-cloze").querySelectorAll(".q").forEach(qe => qe.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      const g = $("cz-" + qe.dataset.gap); if (g) g.textContent = L.cloze.gaps[+qe.dataset.gap - 1][0];
    })));
    $("fin").onclick = () => { if (!done[L.n]) { done[L.n] = 1; store.set("done", done); addStar(5); } if (cur < buildLessons().length) { cur++; store.set("cur", cur); } header(); show(); $("lesson").scrollIntoView({ block: "start" }); };
    const p = $("prev"); if (p) p.onclick = () => { cur--; store.set("cur", cur); header(); show(); $("lesson").scrollIntoView({ block: "start" }); };
  }
  /* --- тренажёр «Какое это время?» (вне уроков; времена открываются по мере прохождения) --- */
  let tnRound = 0;
  function tnShow() {
    const box = $("tn"), TN = DATA.tname; if (!TN) return;
    const wk = Math.max(1, Math.ceil(Math.max(cur, ...Object.keys(done).map(Number), 1) / 5));
    const open = Object.keys(TN.tenses).filter(k => TN.tenses[k][1] <= wk);
    const pool = TN.items.filter(it => open.includes(it[1]));
    if (open.length < 2) {
      const next = Object.values(TN.tenses).map(t => t[1]).sort((a, b) => a - b)[1];
      box.innerHTML = `<div class="card"><b>⏱ Какое это время?</b><p class="muted small" style="margin:6px 0 0">Тренажёр откроется, когда ты пройдёшь два времени — примерно с недели ${next}. Пока учи уроки!</p></div>`; return;
    }
    const rnd = rng32(Date.now() % 1e9), nOpt = C.mode === "kid" ? 3 : 4;
    const qs = sshuffle(pool, rnd).slice(0, 6).map(([q, k, why]) => {
      const others = sshuffle(open.filter(x => x !== k), rnd).slice(0, nOpt - 1);
      return [q, [TN.tenses[k][0], ...others.map(x => TN.tenses[x][0])], 0, why];
    });
    tnRound++;
    box.innerHTML = `<div class="card rule"><b>⏱ Какое это время?</b><span>Глагол выделен. Выбери время — после ответа будет подсказка.</span>
      <div class="exl">${open.map(k => `<div><span>•</span><div><b style="display:inline;font-size:1rem">${esc(TN.tenses[k][0])}</b> — <span class="tr">${esc(TN.tenses[k][2])}</span></div></div>`).join("")}</div></div>
      ${quizHtml(qs, "tn" + tnRound, tnRound * 101)}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="tn-more">Ещё 6 вопросов</button><button type="button" class="btn ghost" id="tn-close">Закрыть</button></div>`;
    bindQuiz(box);
    $("tn-more").onclick = () => { tnShow(); box.scrollIntoView({ block: "start" }); };
    $("tn-close").onclick = () => { box.hidden = true; };
  }
  /* --- справочник «Теория: времена» --- */
  function thShow() {
    const box = $("th"), TN = DATA.tname; if (!TN || !TN.theory) return;
    const wk = Math.max(1, Math.ceil(Math.max(cur, ...Object.keys(done).map(Number), 1) / 5));
    const keys = Object.keys(TN.tenses).sort((a, b) => TN.tenses[a][1] - TN.tenses[b][1]);
    const fmt = t => esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    box.innerHTML = `<div class="card rule"><b>📘 Теория: времена</b><span>Нажми на время, чтобы открыть правило. Новые времена появляются, когда ты доходишь до них в уроках.</span></div>` +
      keys.map(k => {
        const [name, w] = TN.tenses[k], th = TN.theory[k];
        if (w > wk) return `<div class="card muted small">🔒 <b>${esc(name)}</b> — откроется на неделе ${w}</div>`;
        return `<details class="card"><summary>${esc(name)} <span class="muted small" style="font-weight:600">— ${esc(th.use)}</span></summary>
          <div class="stack" style="margin-top:10px">
            <div class="res">${th.f.map(x => `<div style="font-weight:700">${fmt(x)}</div>`).join("")}</div>
            <div class="small"><b>Слова-подсказки:</b> <span class="muted">${esc(th.m)}</span></div>
            <div class="exl">${th.ex.map(([en, ru]) => `<div>${sayBtn(en)}<div><div>${hl(en)}</div><div class="tr">${esc(ru)}</div></div></div>`).join("")}</div>
            <div class="small">💡 ${esc(th.tip)}</div></div></details>`;
      }).join("") + `<div><button type="button" class="btn ghost" id="th-close">Закрыть</button></div>`;
    $("th-close").onclick = () => { box.hidden = true; };
  }
  $("th-open").onclick = () => { const b = $("th"); b.hidden = !b.hidden; if (!b.hidden) { thShow(); b.scrollIntoView({ block: "start" }); } };
  if (!DATA.tname || !DATA.tname.theory) $("th-open").hidden = true;
  $("tn-open").onclick = () => { const b = $("tn"); b.hidden = !b.hidden; if (!b.hidden) { tnShow(); b.scrollIntoView({ block: "start" }); } };
  if (!DATA.tname) $("tn-open").hidden = true;
  /* --- «Истории про нас»: личные тексты вне уроков --- */
  const ST = DATA.stories || [], stDone = store.get("stories", {});
  function stList() {
    $("st").innerHTML = `<div class="card stack"><b>📖 Истории про нас</b><span class="small muted">${C.mode === "kid" ? "Истории про тебя, Игоря и ваши поездки. Прочитай, ответь на вопросы, прочитай вслух и перескажи!" : "Тексты про твои места и поездки. Читай, отвечай, читай вслух и пересказывай."}</span>
      <div class="stack">${ST.map((r, i) => `<button type="button" class="btn ghost" data-st="${i}" style="text-align:left">${stDone[r.t] ? "✅" : "📄"} ${esc(r.t)} <span class="small muted">${esc(r.l)}</span></button>`).join("")}</div></div>`;
    $("st").querySelectorAll("[data-st]").forEach(b => b.onclick = () => stOpen(+b.dataset.st));
  }
  function stOpen(i) {
    const r = ST[i]; if (typeof LIVE !== "undefined" && LIVE) LIVE.stop(); $("st").hidden = true;
    $("lesson").innerHTML = `<h1 style="margin-top:28px">📖 ${esc(r.t)}</h1><p class="muted">История ${i + 1} из ${ST.length} · ${esc(r.l)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button type="button" class="btn ghost" data-stback>← К уроку ${cur}</button></div>
      <div class="stack" id="g-read">${readHtml(r, { n: 900 + i }, "s" + i)}</div>
      <div class="card finish"><div class="big">${stDone[r.t] ? "✅" : "📖"}</div><b>${stDone[r.t] ? "Эту историю ты уже прочитал" : "Прочитал и пересказал? Молодец!"}</b>
        <button type="button" class="btn" data-stfin>${stDone[r.t] ? (i + 1 < ST.length ? "Следующая история →" : "К уроку →") : "Готово ✓ (+5 ⭐)"}</button>
        <button type="button" class="btn ghost" data-stback>← К уроку ${cur}</button></div>`;
    bindQuiz($("lesson")); rdBind(r);
    $("lesson").querySelectorAll("[data-stback]").forEach(b => b.onclick = () => { show(); $("lesson").scrollIntoView({ block: "start" }); });
    $("lesson").querySelector("[data-stfin]").onclick = () => {
      if (!stDone[r.t]) { stDone[r.t] = 1; store.set("stories", stDone); addStar(5); stList(); stOpen(i); return; }
      if (i + 1 < ST.length) stOpen(i + 1); else show();
      $("lesson").scrollIntoView({ block: "start" });
    };
    $("lesson").scrollIntoView({ block: "start" });
  }
  $("st-open").onclick = () => { const b = $("st"); b.hidden = !b.hidden; if (!b.hidden) { stList(); b.scrollIntoView({ block: "start" }); } };
  if (!ST.length) $("st-open").hidden = true;
  header(); show();
  $("report").onclick = sendReport;
  (async () => { try { if (window.claude && window.claude.use) { const [t, d, smp] = await Promise.all([window.claude.use("tts"), window.claude.use("dictation"), window.claude.use("sample")]); if (t) TTS = t; if (d) DICT = d; if (smp) SAMPLE = smp; if (t || d) show(); } } catch (e) {} })();
}
</script>
</body>
</html>
