herwise","I see your point of view but I think differently","I understand your point of view but I think differently"]]]},{"t":"Цель и результат: in order to, so that, so…that, as a result","l":"B2","rule":"Цель: to / in order to / so as to + глагол (I practise in order to win). Отрицание цели: in order not to / so as not to (не *to not). so that + подлежащее + can/could/will/would: I save money so that I can buy a console. Результат: so + прилагательное + that (so hard that), such (a) + существительное + that (such a hard level that), а между предложениями — so, therefore, as a result. Типичные ошибки: *for to win, *for win → to win; *so that to buy → so that I can buy. А for ставим перед существительным: for fun, for the NMT.","ex":[["I practise every day [in order to] get into the top 100.","Я тренируюсь каждый день, чтобы попасть в топ-100."],["I saved my game [so that] I wouldn't lose my progress.","Я сохранил игру, чтобы не потерять прогресс."],["The level was [so] hard [that] I nearly gave up.","Уровень был таким сложным, что я чуть не сдался."],["It was [such a] beautiful map [that] we explored it for hours.","Это была такая красивая карта, что мы исследовали её часами."],["The servers crashed. [As a result], the tournament was postponed.","Серверы упали. В результате турнир перенесли."]],"quiz":[["I wear headphones ___ my brother can sleep.",["in order to","so as to","so that"],2,"Дальше подлежащее + can → so that."],["Igor studies hard ___ pass the NMT.",["so that","for","in order to"],2,"Дальше глагол без подлежащего → in order to."],["Speak quietly so as ___ wake Oleg.",["to not","not to","don't"],1,"so as not to — чтобы не."],["The boss was ___ strong that nobody could beat him.",["such","such a","so"],2,"so + прилагательное + that."],["It was ___ an exciting final that we shouted all evening.",["very","so","such"],2,"such + a/an + прилагательное + существительное."],["I went to the shop ___ a new mouse.",["to buy","for buy","for to buy"],0,"Цель с глаголом → to buy."],["We left early ___ we wouldn't miss the bus.",["so that","in order to","so as"],0,"Дальше подлежащее we → so that."],["The Wi-Fi stopped working. ___, we couldn't finish the stream.",["As a result","In order to","So that"],0,"Результат между предложениями → As a result."],["She saved money so that she ___ buy a new laptop.",["could","can to","would can"],0,"so that + could + глагол."],["He trains every day ___ fun, not for prizes.",["to","for","so"],1,"Перед существительным → for (for fun)."],["It rained heavily; ___, the match was cancelled.",["so that","therefore","in order"],1,"therefore — поэтому (результат)."],["The graphics were ___ realistic that I thought it was a video.",["such","so","such a"],1,"so + прилагательное (realistic) + that."],["I write new words on cards so as ___ forget them.",["to not","not to","not"],1,"so as not to + глагол."],["Turn off notifications ___ you can focus.",["so as","in order","so that"],2,"Дальше you can → so that."]],"tr":[["Я учу английский, чтобы сдать НМТ.","in order to / to",["I learn English to pass the NMT","I am learning English to pass the NMT","I learn English in order to pass the NMT","I am learning English in order to pass the NMT","I study English to pass the NMT","I study English in order to pass the NMT"]],["Уровень был такой сложный, что я сдался.","so … that",["The level was so hard that I gave up","The level was so difficult that I gave up","It was such a hard level that I gave up","It was such a difficult level that I gave up","The level was so hard I gave up","The level was so difficult I gave up"]],["Я сохранил игру, чтобы не потерять прогресс.","so that / so as not to",["I saved the game so that I would not lose my progress","I saved the game so as not to lose my progress","I saved the game in order not to lose my progress","I saved the game so that I did not lose my progress","I saved the game not to lose my progress","I saved my game so as not to lose my progress"]],["Интернет пропал. В результате мы проиграли.","As a result",["The internet went down. As a result, we lost","The internet stopped working. As a result, we lost","The internet disappeared. As a result, we lost","The internet went off. As a result, we lost","The internet was gone. As a result, we lost"]]]},{"t":"Контраст: whereas, while, on the other hand, on the contrary, unlike","l":"C1","rule":"whereas и while соединяют два противоположных факта в одном предложении: I love Cuphead, whereas Oleg prefers Minecraft. On the other hand — «с другой стороны»: вторая сторона того же вопроса (плюс и минус). On the contrary — «наоборот»: отрицает только что сказанное (It isn't boring. On the contrary, it's exciting). Unlike + существительное или местоимение — «в отличие от» (Unlike me, Oleg…). Instead of + -ing — «вместо того чтобы». Типичные ошибки: путать on the contrary и on the other hand; *unlike to me; *instead of play.","ex":[["I prefer racing games, [whereas] my brother loves building games.","Я предпочитаю гонки, а мой брат любит игры-стройки."],["Online lessons save time. [On the other hand], they can be boring.","Онлайн-уроки экономят время. С другой стороны, они бывают скучными."],["The game isn't easy. [On the contrary], it's one of the hardest I've played.","Игра не лёгкая. Наоборот, это одна из самых сложных, в которые я играл."],["[Unlike] Cuphead, Minecraft has no fixed ending.","В отличие от Cuphead, у Minecraft нет определённого конца."],["[Instead of] playing all night, I went to bed early before the NMT.","Вместо того чтобы играть всю ночь, я рано лёг спать перед НМТ."]],"quiz":[["Igor is good at maths, ___ his friend is better at languages.",["unlike","on the contrary","whereas"],2,"Два противоположных факта в одном предложении → whereas."],["The test wasn't difficult. ___, it was really easy.",["On the other hand","On the contrary","Whereas"],1,"Отрицаем сказанное («не сложный — наоборот, лёгкий») → On the contrary."],["Living in a big city is exciting. ___, it can be very noisy.",["Unlike","On the other hand","On the contrary"],1,"Плюс и минус одного вопроса → On the other hand."],["___ my brother, I don't like scary stories.",["Whereas","Unlike","While"],1,"Перед существительным → Unlike."],["___ of studying, he watched streams all evening.",["Instead","Despite","Unlike"],0,"Instead of + -ing — вместо того чтобы."],["___ some people love esports, others think it's a waste of time.",["While","Unlike","Instead"],0,"While + предложение — тогда как."],["Cuphead is 2D, ___ GTA has a huge 3D open world.",["unlike","whereas","on the contrary"],1,"Противопоставление двух фактов → whereas."],["I'm not tired. ___, I'm full of energy!",["On the other hand","On the contrary","Whereas"],1,"«Не устал — наоборот…» → On the contrary."],["___ most games, this one has no tutorial.",["Whereas","While","Unlike"],2,"Перед существительным → Unlike."],["Let's play outside instead of ___ at home.",["sitting","to sit","sit"],0,"После instead of — герундий."],["Laptops are portable. ___, desktop PCs are usually more powerful.",["Unlike","On the other hand","On the contrary"],1,"Две стороны выбора → On the other hand."],["Oleg reads slowly, ___ Igor reads very fast.",["unlike","instead","while"],2,"while + предложение — тогда как."],["___ his old phone, the new one has a great camera.",["Unlike","While","Whereas"],0,"Перед существительным → Unlike."],["Many people think gamers are lazy. ___, top esports players train eight hours a day.",["Whereas","On the contrary","Unlike this"],1,"Опровергаем мнение → On the contrary."]],"tr":[["Я люблю гонки, а мой брат любит Minecraft.","whereas / while",["I love racing games whereas my brother loves Minecraft","I love racing games while my brother loves Minecraft","I love racing whereas my brother loves Minecraft","I love racing while my brother loves Minecraft","I like racing games whereas my brother likes Minecraft","I like racing games while my brother likes Minecraft"]],["В отличие от меня, Олег рано встаёт.","Unlike",["Unlike me, Oleg gets up early","Unlike me, Oleg wakes up early","Oleg gets up early, unlike me","Oleg wakes up early, unlike me"]],["Вместо того чтобы играть, я учил формулы.","Instead of + -ing",["Instead of playing, I learned formulas","Instead of playing, I learnt formulas","Instead of playing, I studied formulas","Instead of playing, I learned the formulas","Instead of playing, I studied the formulas","Instead of playing, I was learning formulas"]],["Это не скучно. Наоборот, это очень интересно.","On the contrary",["It is not boring. On the contrary, it is very interesting","This is not boring. On the contrary, it is very interesting","It is not boring. On the contrary, it is really interesting","It isn't boring. On the contrary, it's very interesting"]]]},{"t":"Придаточные времени: повторение (as soon as, until, by the time, once)","l":"B2","rule":"После when, as soon as, until/till, before, after, once (как только), the moment (в тот момент, когда) и by the time (к тому времени, как) будущее время НЕ ставится: I'll call you when I get home (не *when I will get). Если важно, что действие закончится, можно Present Perfect: You can play once you've finished your homework. By the time в прошлом часто требует Past Perfect: By the time we arrived, the stream had ended. While — для длительного действия (While I was driving around the map…). Ловушка: «пока не» = until без отрицания: Wait until I come (не *until I don't come).","ex":[["I'll text you [as soon as] the update [is] ready.","Я напишу тебе, как только обновление будет готово."],["You can play [once] you [have finished] your homework.","Можешь играть, как только закончишь домашку."],["[By the time] we logged in, the server [had crashed].","К тому времени, как мы зашли, сервер уже упал."],["Wait here [until] I [come] back.","Подожди здесь, пока я не вернусь."],["[The moment] I saw the score, I knew we had won.","В тот момент, когда я увидел счёт, я понял, что мы победили."]],"quiz":[["I'll call you when I ___ home.",["will get","got","get"],2,"После when — Present Simple, не will."],["Don't start the game until Ilya ___.",["will arrive","doesn't arrive","arrives"],2,"until без отрицания + Present Simple."],["By the time we arrived, the film ___.",["has started","starts","had started"],2,"By the time + прошлое → Past Perfect."],["As soon as I ___ my homework, I'll join you online.",["will finish","have finished","had finished"],1,"Законченное действие в будущем → Present Perfect, не will."],["Oleg will be asleep by the time we ___ back.",["get","got","will get"],0,"После by the time о будущем — Present Simple."],["___ I was driving around the city map, I found a hidden beach.",["Until","By the time","While"],2,"Длительное действие (was driving) → While."],["We'll start the stream once everyone ___ ready.",["will be","is","was"],1,"После once — Present Simple."],["The moment the boss ___, I pressed pause.",["has appeared","appears","appeared"],2,"Рассказ о прошлом → Past Simple."],["I won't go to bed until I ___ this level.",["don't beat","will beat","beat"],2,"until + Present Simple, без отрицания."],["Before you ___ the test, read all the questions.",["start","will start","started"],0,"После before — Present Simple."],["By the time the NMT starts, I ___ all the topics.",["revise","have revised","will have revised"],2,"К моменту в будущем → Future Perfect."],["After he ___ the game, he wrote a review.",["will finish","has finished","had finished"],2,"Раньше другого действия в прошлом → Past Perfect."],["Wait ___ the download is complete.",["by the time","while","until"],2,"Ждать, пока не… → until."],["I'll tell you everything when we ___.",["will meet","met","meet"],2,"После when — Present Simple."]],"tr":[["Я позвоню тебе, когда приду домой.","when + Present Simple",["I will call you when I get home","I will call you when I come home","I will phone you when I get home","I will call you when I get back home"]],["Подожди, пока я не закончу.","until без not",["Wait until I finish","Wait till I finish","Wait until I have finished","Wait till I have finished"]],["Как только выйдет обновление, я его скачаю.","as soon as + Present Simple",["As soon as the update comes out, I will download it","As soon as the update is released, I will download it","As soon as the update is out, I will download it","I will download the update as soon as it comes out","I will download the update as soon as it is released"]],["Когда мы пришли, стрим уже закончился.","Past Perfect",["When we arrived, the stream had already ended","When we came, the stream had already ended","When we arrived, the stream had already finished","When we came, the stream had already finished","By the time we arrived, the stream had ended","By the time we arrived, the stream had finished"]]]},{"t":"Описание графиков и тенденций: rise sharply, fall by, reach a peak","l":"B2","rule":"Рост: rise, increase, grow, go up; падение: fall, drop, decrease, go down; без изменений: remain stable, stay the same; максимум: reach a peak. Как изменилось: sharply / dramatically (резко), significantly (значительно), steadily (постепенно), slightly (немного). То же можно сказать существительным: a sharp rise in…, a slight drop in… Предлоги: rose BY 20% (на сколько), rose TO 500 (до какого уровня), FROM 300 TO 500. Типичные ошибки: *rose on 20%, *increase of the number (правильно increase in), *prices raised (правильно prices rose).","ex":[["The number of Minecraft players [rose sharply] in 2020.","Число игроков в Minecraft резко выросло в 2020 году."],["Sales of game consoles [fell by] 10% last year.","Продажи консолей упали на 10% в прошлом году."],["The number of viewers [grew steadily from] 1,000 [to] 5,000.","Число зрителей постепенно выросло с 1000 до 5000."],["Prices [remained stable] for six months.","Цены оставались стабильными полгода."],["Downloads [reached a peak] in December.","Количество скачиваний достигло пика в декабре."]],"quiz":[["The number of viewers increased ___ 30%.",["with","by","on"],1,"На сколько → by."],["Sales rose from 200 ___ 500.",["till","until","to"],2,"from … to …"],["There was a sharp rise ___ the number of players.",["of","in","on"],1,"a rise in — рост чего-то."],["Prices ___ the same throughout the year.",["remained","raised","rose"],0,"remain the same — оставаться неизменным."],["The number of downloads reached a ___ in July.",["mountain","peak","roof"],1,"reach a peak — достичь пика."],["The graph shows a ___ decrease of only 1%.",["sharp","dramatic","slight"],2,"Всего 1% → slight (небольшой)."],["Interest in the game ___ steadily over five years.",["grew","grow","growth"],0,"Нужен глагол в прошедшем: grew."],["Then the number of users ___ dramatically, from 10,000 to 2,000.",["dropped","grew","raised"],0,"С 10 000 до 2 000 — падение: dropped."],["The company ___ its prices by 5% last month.",["rose","risen","raised"],2,"Компания подняла цены (что-то) → raised."],["There was a ___ fall in sales — they halved in a month.",["dramatic","small","slight"],0,"Упали вдвое за месяц → dramatic (резкое)."],["The chart ___ how many hours teenagers play games.",["talks","shows","speaks"],1,"The chart shows… — график показывает."],["The number of players went ___ in winter and down in summer.",["up","over","on"],0,"go up — расти."],["Sales increased ___ — a little every month.",["suddenly","steadily","sharply"],1,"Понемногу каждый месяц → steadily."],["In 2025 there was a slight ___ in the number of streamers.",["drop","dropping","dropped"],0,"После a slight нужно существительное: drop."]],"tr":[["Количество игроков резко выросло.","rise sharply",["The number of players rose sharply","The number of players increased sharply","The number of players grew sharply","The number of players rose dramatically","The number of players increased dramatically","The number of players went up sharply"]],["Продажи упали на 10 процентов.","fall by",["Sales fell by 10 percent","Sales dropped by 10 percent","Sales decreased by 10 percent","Sales fell by 10 per cent","Sales dropped by 10 per cent","Sales went down by 10 percent"]],["Цены оставались стабильными.","remain stable",["Prices remained stable","The prices remained stable","Prices stayed stable","Prices remained the same","Prices stayed the same"]],["Количество зрителей достигло пика в декабре.","reach a peak",["The number of viewers reached a peak in December","The number of viewers peaked in December","The number of viewers reached its peak in December"]]]},{"t":"Эссе-мнение: структура и слова-связки","l":"B2","rule":"Эссе-мнение строится так: вступление (тема + твоё мнение), два абзаца с аргументами и примерами, вывод. Начать аргумент: Firstly / To begin with; добавить: Moreover, Furthermore, In addition, What is more; пример: For example, For instance, such as; противопоставить: However, On the other hand; вывод: To sum up, In conclusion, All things considered. Типичные ошибки: *At first вместо Firstly (at first — «сначала, вначале» по времени), *Besides of вместо Besides, *In the end of вместо In conclusion. Не пиши I think в каждом предложении — чередуй с I believe, In my view.","ex":[["[To begin with], video games can improve reaction speed.","Начнём с того, что видеоигры могут улучшить скорость реакции."],["[Moreover], many games teach teamwork.","Более того, многие игры учат работать в команде."],["Some games, [such as] Minecraft, develop creativity.","Некоторые игры, например Minecraft, развивают творчество."],["[However], playing for too long can harm your eyes.","Однако слишком долгая игра может вредить глазам."],["[To sum up], games are useful if you play in moderation.","Подводя итог, игры полезны, если играть в меру."]],"quiz":[["___, games can help you learn English. Secondly, they improve logic.",["Firstly","At first","Before all"],0,"Во-первых → Firstly. At first — «сначала, вначале»."],["Games are fun. ___, they can be educational.",["Instead","Moreover","However"],1,"Добавляем аргумент → Moreover."],["Many teens love platform games, ___ Cuphead.",["like as","for example of","such as"],2,"Пример внутри предложения → such as."],["Online learning is convenient. ___, it can be lonely.",["Moreover","Furthermore","However"],2,"Противопоставление → However."],["___, I believe that homework should be limited.",["In the end of","In conclusion","At last"],1,"Вывод эссе → In conclusion."],["My brother, ___, learned to read English thanks to a game.",["for instance","moreover","such as"],0,"Пример, вставленный в предложение → for instance."],["___ being fun, games can develop logic.",["Besides of","Besides","Moreover"],1,"Besides + -ing (без of). Moreover не ставится перед -ing."],["___ to this, streaming can be a real job.",["Furthermore","In addition","Moreover"],1,"In addition to this — кроме этого (с to)."],["It is often ___ that video games are a waste of time.",["argued","argue","arguing"],0,"It is often argued that… — часто утверждают, что…"],["___ things considered, I think esports deserves respect.",["All","Every","Each"],0,"All things considered — учитывая всё."],["There are several reasons ___ teenagers love games.",["because","why","what"],1,"reasons why — причины, по которым."],["Some people believe phones should be banned at school. ___, others think they help students learn.",["On the other hand","For example","Furthermore"],0,"Другая точка зрения → On the other hand."],["Games are relaxing. ___ is more, they help you make friends.",["That","Which","What"],2,"What is more — более того."],["Firstly, games are fun. ___, they are social. Finally, they teach skills.",["Second time","Twice","Secondly"],2,"Во-вторых → Secondly."]],"tr":[["Во-первых, игры развивают логику.","Firstly",["Firstly, games develop logic","First of all, games develop logic","To begin with, games develop logic","Firstly, games develop logical thinking","Firstly, video games develop logic","First, games develop logic"]],["Более того, они учат работать в команде.","Moreover",["Moreover, they teach teamwork","Moreover, they teach you to work in a team","Moreover, they teach us to work in a team","Furthermore, they teach teamwork","What is more, they teach teamwork","Moreover, they teach you teamwork"]],["Например, Minecraft развивает творчество.","For example / For instance",["For example, Minecraft develops creativity","For instance, Minecraft develops creativity"]],["Подводя итог, я считаю, что игры полезны.","To sum up",["To sum up, I believe that games are useful","To sum up, I think that games are useful","To sum up, I believe games are useful","To sum up, I think games are useful","In conclusion, I believe that games are useful","In conclusion, I think that games are useful"]]]},{"t":"Неформальное письмо: email другу","l":"B2","rule":"В неформальном письме другу начинаем с Hi Ilya, / Hey Ilya, / Dear Ilya, а дальше — Thanks for your email! / It was great to hear from you / Sorry I haven't written for ages. В основной части помогают Guess what! / You won't believe… / By the way (кстати) / Anyway (ну ладно, вернёмся к делу). Закончить можно так: Write back soon / Can't wait to see you / Let me know… / Take care / Best wishes. Стиль живой: сокращения (I'm, can't), фразовые глаголы, восклицания. Ошибки: формальные Dear Sir и Yours faithfully другу не пишут; «жду ответа» — Looking forward to hearing from you (с -ing!).","ex":[["[Thanks for your email] — it was great to hear from you!","Спасибо за письмо — было здорово получить от тебя весточку!"],["[Guess what]? I finally beat the last boss in Cuphead!","Угадай что? Я наконец победил последнего босса в Cuphead!"],["[By the way], are you coming to the tournament?","Кстати, ты придёшь на турнир?"],["[Anyway], I have to go — Mum's calling me.","Ну ладно, мне пора — мама зовёт."],["[Looking forward to hearing] from you!","Жду твоего ответа!"]],"quiz":[["Thanks ___ your email!",["about","on","for"],2,"Thanks for — спасибо за."],["It was great to hear ___ you.",["about","of","from"],2,"hear from someone — получить весточку от кого-то."] review) на игру, фильм или приложение","l":"B2","rule":"В отзыве обычно четыре части: что это (Cuphead is a platform game created by…), о чём (сюжет пересказывают в Present Simple: The story is about…, It is set in…), плюсы и минусы (What I liked most was…, The graphics are stunning, The only drawback is…) и рекомендация (I'd highly recommend it to…, It's worth playing / worth a try). Типичные ошибки: *worth to play → worth playing (после worth — -ing), *recommend me this game → recommend this game to me, пересказ сюжета в прошедшем времени. Оценка: I'd give it eight out of ten.","ex":[["The game [is set in] a huge city with beaches and mountains.","Действие игры происходит в огромном городе с пляжами и горами."],["[What I liked most was] the hand-drawn graphics.","Больше всего мне понравилась рисованная графика."],["[The only drawback is] that the game is very short.","Единственный недостаток — игра очень короткая."],["It's definitely [worth playing].","В неё определённо стоит поиграть."],["[I'd highly recommend it to] anyone who loves building.","Очень советую её всем, кто любит строить."]],"quiz":[["The game is ___ playing — buy it!",["value","worth","worthy"],1,"be worth + -ing — стоит делать."],["I'd highly recommend this app ___ students.",["to","at","by"],0,"recommend something to someone."],["The story is set ___ the 1930s.",["in","on","at"],0,"set in + период/место."],["The only ___ is that the game has no multiplayer.",["drawback","downgrade","backdraw"],0,"drawback — недостаток."],["The graphics are absolutely ___!",["stun","stunning","stunned"],1,"-ing описывает впечатление от вещи: stunning — потрясающий."],["It's ___ a try if you like puzzles.",["worthy","worth","cost"],1,"worth a try — стоит попробовать."],["What I liked most ___ the soundtrack.",["were","did","was"],2,"What I liked most was… (единственное число)."],["The film is ___ a boy who builds a robot.",["on","about","of"],1,"be about — быть о чём-то."],["Cuphead is a platform game ___ by Studi ."],["disadvantage","недостаток","The main [disadvantage] of e-books is that they tire your eyes."],["benefit","польза; приносить пользу","Regular exercise has many [benefits]."],["drawback","недостаток, минус","The only [drawback] of this phone is its short battery life."],["pros and cons","плюсы и минусы","Let's discuss the [pros and cons] of school uniforms."],["justify","обосновывать, оправдывать","Can you [justify] your answer with an example?"],["counter-argument","контраргумент","A good essay also considers [counter-arguments]."],["controversial","спорный","Banning homework is a [controversial] idea."],["debate","дебаты; обсуждать","We had a lively [debate] about esports in class."],["reasonable","разумный","That sounds like a [reasonable] solution."],["assumption","предположение, допущение","Don't make [assumptions] about people based on their hobbies."],["obvious","очевидный","It's [obvious] that he hasn't read the book."],["admit","признавать","I have to [admit] that your idea is better."],["outweigh","перевешивать","The benefits of the project [outweigh] the costs."],["statement","утверждение","Do you agree with the following [statement]?"]]}],"reads":[{"t":"My New Lyceum","l":"A2","text":"Last September I started at a new lyceum in my town. At first I was nervous because I didn't know anyone. On the first day, a boy called Andrii sat next to me in the maths lesson. He showed me where the canteen was and introduced me to his friends. Now we are best friends. My lyceum is bigger than my old school. There are three computer rooms, a science lab and a large sports hall. Lessons start at half past eight and usually finish at three. My favourite subjects are physics and computer science, but I find history quite difficult because there are so many dates to remember. Our teachers are strict but fair. If you work hard, they always help you. I think moving to a new school was a good decision.","g":[["nervous","волновался, нервничал"],["canteen","школьная столовая"],["introduced","познакомил, представил"],["lab","лаборатория"],["strict","строгие"],["fair","справедливые"],["decision","решение"]],"q":[["What is the text mainly about?",["The writer's experience at a new lyceum","How to make friends online","Why history is the best subject","The writer's old school"],0],["Who helped the writer on the first day?",["Andrii","a teacher","his brother","the headmaster"],0],["Why does the writer find history difficult?",["There are many dates to remember","The teacher is very strict","The lessons are too long","He doesn't like reading"],0],["The word 'fair' in the text is closest in meaning to",["treating people equally and correctly","very beautiful","light in colour","easy and simple"],0]]},{"t":"A Day Without My Phone","l":"A2","text":"Last week our class teacher gave us an unusual challenge: spend one whole day without a phone. I thought it would be easy, but it wasn't. In the morning I woke up late because my alarm is on my phone. At breakfast I wanted to check the football results, but I couldn't. On the way to school I felt strange without music in my ears. However, the afternoon was better. Instead of watching videos, I played basketball with my neighbour and read half of a science fiction book. In the evening I even talked to my parents for an hour. By the end of the day I realised that I use my phone too much. Now I leave it in another room when I do my homework.","g":[["challenge","задание, вызов"],["alarm","будильник"],["results","результаты"],["However","однако"],["Instead of","вместо (того чтобы)"],["realised","понял, осознал"]],"q":[["Why did the writer wake up late?",["His alarm is on his phone","He went to bed very late","He was ill","His parents forgot to wake him"],0],["What did he do in the afternoon?",["He played basketball and read a book","He watched videos","He listened to music","He did homework with friends"],0],["Which is TRUE according to the text?",["The morning was harder than the afternoon","The writer found the challenge very easy","The teacher took the writer's phone","He did not talk to his parents"],0],["What did the writer change after the challenge?",["He leaves his phone in another room during homework","He stopped using his phone completely","He bought a new alarm clock","He reads books every evening"],0]]},{"t":"Football in the Park","l":"A2","text":"Every Saturday morning my friends and I meet in the park to play football. There are about ten of us, and we split into two teams. We don't have a real pitch, so we use our jackets as goalposts. Last Saturday was special. A man was watching our game for a long time. After the match he came up to us and said that he was a coach at a local youth club. He invited three of us, including me, to a training session on Tuesday. I was so excited that I could not sleep on Monday night. The training was much harder than our games in the park. We ran a lot and practised passing for an hour. The coach said I need to improve my fitness, but he wants me to come again next week.","g":[["split into","разделиться на"],["pitch","футбольное поле"],["goalposts","штанги ворот"],["coach","тренер"],["invited","пригласил"],["improve","улучшить"],["fitness","физическая форма"]],"q":[["What do the boys use as goalposts?",["their jackets","their bags","two trees","plastic bottles"],0],["Who was the man watching the game?",["a coach at a local youth club","a park worker","the father of one of the boys","a famous footballer"],0],["How did the writer feel before the training?",["very excited","bored","angry","calm and relaxed"],0],["What does the writer need to improve, according to the coach?",["his fitness","his passing","his shooting","his English"],0]]},{"t":"A Weekend in Lviv","l":"A2","text":"Last spring our class went on a school trip to Lviv. We travelled by train, and the journey took about seven hours. Lviv is one of the most beautiful cities in Ukraine. Its old town is full of narrow streets, old churches and small coffee shops. On the first day, our guide took us to Market Square, where we saw the famous town hall. Some of us climbed to the top of its tower. The view was amazing! In the evening we visited a chocolate workshop and watched how sweets are made. On the second day it rained, so we went to a museum instead of walking around the city. I bought a magnet for my mum and some chocolate for my little brother. I would love to go back to Lviv one day.","g":[["journey","поездка, путешествие"],["narrow","узкие"],["guide","экскурсовод"],["town hall","ратуша"],["tower","башня"],["view","вид"],["workshop","мастерская"]],"q":[["How did the class travel to Lviv?",["by train","by bus","by plane","by car"],0],["What did they do on the first evening?",["They visited a chocolate workshop","They climbed the tower","They went to a museum","They bought magnets"],0],["Why did they go to a museum on the second day?",["Because it was raining","Because the guide was ill","Because the old town was closed","Because they were tired"],0],["What did the writer buy for his brother?",["some chocolate","a magnet","a book","a toy"],0]]},{"t":"My YouTube Channel","l":"A2","text":"Two years ago I started a YouTube channel about video games. At first only my friends watched it, and I had just twelve subscribers. I recorded my videos on an old laptop, and the sound quality was terrible. My cousin, who studies film at university, gave me some useful advice. He told me to plan every video before recording and to keep it short. He also lent me a microphone. Slowly, my channel grew. Now I have more than two thousand subscribers. I upload one video every week, usually on Friday evening. It is not easy to find time because I also have a lot of homework. Sometimes people leave rude comments, but I try to ignore them. My parents agree that I can continue as long as my marks stay good.","g":[["subscribers","подписчики"],["recorded","записывал"],["advice","совет"],["lent","одолжил"],["upload","выкладываю, загружаю"],["rude","грубые"],["ignore","игнорировать"]],"q":[["How many subscribers did he have at first?",["twelve","two thousand","two hundred","twenty"],0],["How did his cousin help him?",["He gave advice and lent him a microphone","He bought him a new laptop","He recorded videos with him","He answered rude comments"],0],["When does he usually upload videos?",["on Friday evening","every day","on Sunday morning","twice a week"],0],["What condition do his parents give?",["His marks must stay good","He must stop after one year","He can upload videos only in summer","He must not read comments"],0]]},{"t":"At the Animal Shelter","l":"A2","text":"Last summer I spent two weeks volunteering at an animal shelter near my home. The shelter looks after about forty dogs and twenty cats that have no owners. My job was to feed the animals, clean their cages and take the dogs for walks. The work was harder than I expected. I had to get up at seven every morning, and cleaning the cages was not pleasant at all. However, I loved spending time with the animals. One small dog, Bublyk, was very shy at first. He was afraid of people and hid in the corner of his cage. After a few days he started to wag his tail when he saw me. By the end of my second week, a young family adopted him. I felt a little sad, but mostly I was happy for him.","g":[["volunteering","волонтёрство, работа волонтёром"],["shelter","приют"],["owners","хозяева"],["cages","клетки, вольеры"],["pleasant","приятный"],["shy","застенчивый, пугливый"],["adopted","взяла к себе (приютила)"]],"q":[["Which was NOT part of the writer's job?",["taking cats to the vet","feeding the animals","cleaning the cages","walking the dogs"],0],["Why did Bublyk hide at first?",["He was afraid of people","He was ill","He was hungry","He didn't like other dogs"],0],["What happened at the end of the second week?",["A family adopted Bublyk","The shelter closed","The writer adopted a cat","Bublyk ran away"],0],["How did the writer feel at the end?",["a little sad but mostly happy","very angry","bored","only sad"],0]]},{"t":"The Science Fair","l":"A2","text":"Every year our lyceum organises a science fair, and this year I decided to take part with my friend Maks. Our project was a small machine that waters plants automatically. We used a cheap microcontroller, a sensor that measures how wet the soil is, and a little water pump. When the soil becomes too dry, the sensor sends a signal and the pump switches on. Building it took us almost a month. The most difficult part was writing the program, because our first version watered the plant every five minutes and almost killed it with too much water! On the day of the fair, many students and teachers came to our table and asked questions. We didn't win first prize, but the judges gave us a special award for the most useful idea.","g":[["take part","принять участие"],["automatically","автоматически"],["sensor","датчик"],["soil","почва, земля"],["pump","насос"],["judges","судьи, жюри"],["award","награда"]],"q":[["What did the machine do?",["It watered plants automatically","It measured air temperature","It cleaned the classroom","It fed pets"],0],["What was the most difficult part of the project?",["writing the program","buying the pump","finding a partner","building the box"],0],["What was wrong with the first version?",["It watered the plant too often","It never switched on","It was too expensive","The sensor broke"],0],["Which is TRUE according to the text?",["They received a special award","They won first prize","They built the machine in one day","Nobody was interested in their project"],0]]},{"t":"Learning to Cook","l":"A2","text":"Until last year I couldn't cook anything except instant noodles. Then my mum started working late twice a week, and I had to make dinner for myself and my younger brother. At first I was worried. My first attempt, a simple omelette, was a disaster: I added too much salt and burnt the bottom. My brother refused to eat it. So I started watching cooking videos online and following easy recipes step by step. I learned how to cook pasta, make soup and even bake banana bread. Now my brother says my pasta is better than Mum's, although I think he only says that to get extra dessert. Cooking has taught me to be patient and organised. I also understand now how much work my parents do every day.","g":[["except","кроме"],["attempt","попытка"],["disaster","катастрофа, полный провал"],["refused","отказался"],["recipes","рецепты"],["step by step","шаг за шагом"],["patient","терпеливый"]],"q":[["Why did the writer start cooking?",["His mum began working late twice a week","He wanted to become a chef","His school had cooking classes","His brother asked him to"],0],["What went wrong with the omelette?",["It was too salty and burnt","It was too sweet","It was not cooked at all","It was too small"],0],["How did he learn to cook?",["by watching videos and following recipes","by taking lessons at school","from his grandmother","from his brother"],0],["The word 'patient' in the text means",["able to wait calmly without getting angry","ill and in hospital","very fast","easily angry"],0]]},{"t":"Gaming: Good or Bad?","l":"A2","text":"Many adults think that video games are a waste of time, but I don't completely agree. I play games for about an hour a day, usually in the evening after my homework. Some games, especially strategy games, make me think carefully and plan ahead. Online team games teach me to communicate and cooperate with other players. I have also improved my English, because most of the players on my server speak it. Of course, games have disadvantages too. If you play for too long, you can get headaches, sleep badly and forget about real friends. Last winter I played until midnight almost every day, and my marks at school got worse. Since then I have had a simple rule: no games after ten o'clock and never before my homework is done.","g":[["waste of time","пустая трата времени"],["plan ahead","планировать наперёд"],["cooperate","сотрудничать, действовать сообща"],["disadvantages","недостатки"],["headaches","головные боли"],["got worse","ухудшились"],["rule","правило"]],"q":[["What is the writer's opinion about games?",["They have both advantages and disadvantages","They are a complete waste of time","They are only good for adults","They are bad for everyone"],0],["How have games helped his English?",["Most players on his server speak English","He plays games in English lessons","His teacher recommended games","He reads game magazines"],0],["What happened last winter?",["His marks got worse","He stopped playing games","He won a tournament","He made new friends at school"],0],["What is his rule now?",["No games after ten and not before homework","No games at weekends","Only one game a week","Play only with real friends"],0]]},{"t":"My First Part-Time Job","l":"A2","text":"This summer I got my first part-time job. My uncle has a small café near the river, and he needed help because many tourists come in July and August. I worked four hours a day, five days a week. My main tasks were washing dishes, cleaning tables and sometimes taking orders. In the beginning I made a lot of mistakes. Once I brought a customer tea instead of coffee, and another time I dropped a whole tray of glasses. Luckily, my uncle was patient with me. Gradually I became faster and more confident, and I even learned to talk politely to foreign tourists in English. With the money I earned, I bought new headphones and saved the rest for a laptop. The job was tiring, but I'm proud of myself.","g":[["part-time job","подработка, работа на неполный день"],["dishes","посуда"],["orders","заказы"],["customer","клиент, посетитель"],["tray","поднос"],["confident","уверенный"],["earned","заработал"]],"q":[["Why did the uncle need help?",["Many tourists come in summer","He was ill","He opened a second café","His waiter left"],0],["How many hours a day did the writer work?",["four","five","eight","two"],0],["Which mistake did the writer make?",["He brought tea instead of coffee","He forgot to lock the café","He gave the wrong change","He broke the coffee machine"],0],["What did he do with the money?",["He bought headphones and saved the rest","He bought a laptop at once","He gave it all to his uncle","He spent it all on games"],0]]},{"t":"Marie Curie","l":"A2","text":"Marie Curie was born in Warsaw in 1867. At that time, women in Poland were not allowed to study at university, so she moved to Paris, where she studied physics and mathematics. She was very poor and often had little to eat, but she worked extremely hard. In Paris she met Pierre Curie, a scientist, and they married in 1895. Together they studied radioactivity and discovered two new elements, polonium and radium. In 1903 Marie became the first woman to win a Nobel Prize. Eight years later she won a second Nobel Prize, this time in chemistry. She is still the only person to win Nobel Prizes in two different sciences. Unfortunately, nobody knew then how dangerous radiation was, and her long work with it damaged her health.","g":[["allowed","разрешено"],["poor","бедная"],["married","поженились"],["discovered","открыли"],["elements","элементы"],["chemistry","химия"],["damaged","подорвала, повредила"]],"q":[["Why did Marie Curie move to Paris?",["Women couldn't study at university in Poland","She wanted to meet Pierre","Her family lived there","She got a job there"],0],["What did Marie and Pierre discover?",["polonium and radium","electricity","X-rays","oxygen"],0],["When did she win her second Nobel Prize?",["in 1911","in 1903","in 1895","in 1867"],0],["Which is TRUE according to the text?",["She won Nobel Prizes in two different sciences","She was born in Paris","She was rich as a student","She knew that radiation was dangerous"],0]]},{"t":"A Friend Far Away","l":"A2","text":"Last year my best friend Dmytro moved to Canada with his family. We had known each other since we were six, so it was hard to say goodbye. At first I thought our friendship would end. There is a seven-hour time difference between Ukraine and Canada, so when I come home from school, he is still having breakfast. But we found a solution. Every Sunday at five in the afternoon, my time, we play an online game together and talk on a video call. He tells me about his new school, where students can choose many of their subjects. I tell him news about our old classmates. Dmytro's English is now much better than mine, so he sometimes helps me with my homework. Next summer he is going to visit Ukraine, and I can't wait to see him.","g":[["friendship","дружба"],["time difference","разница во времени"],["solution","решение (проблемы)"],["video call","видеозвонок"],["classmates","одноклассники"],["can't wait","не могу дождаться"]],"q":[["What is the main idea of the text?",["Two friends keep in touch across a long distance","Why Dmytro's family moved to Canada","Differences between schools in Ukraine and Canada","How to learn English quickly"],0],["When do the friends talk?",["every Sunday afternoon","every morning","after school every day","only in summer"],0],["What is Dmytro usually doing when the writer comes home from school?",["having breakfast","sleeping","sitting in lessons","playing football"],0],["How does Dmytro help the writer?",["with his English homework","with football training","with physics","with money"],0]]},{"t":"The Man Who Built the Helicopter","l":"B1","text":"Igor Sikorsky was born in Kyiv in 1889. As a child, he read the novels of Jules Verne and dreamed about flying machines. While he was a student at the Kyiv Polytechnic Institute, he tried to build a helicopter, but the engines of that time were too weak, and his machines could not lift off. Instead of giving up, he turned to aeroplanes. In 1913 he built one of the first four-engine aircraft in the world. A few years later he emigrated to the United States, where he started his own company with very little money. For years he struggled, but he never forgot his childhood dream. Finally, in 1939, his VS-300 helicopter took off successfully. It became the model for most modern helicopters. Today, Sikorsky helicopters are used to rescue people, put out fires and carry patients to hospitals.","g":[["novels","романы"],["engines","двигатели"],["lift off","оторваться от земли, взлететь"],["giving up","сдаваться"],["emigrated","эмигрировал"],["struggled","боролся с трудностями"],["rescue","спасать"]],"q":[["Why did Sikorsky's first helicopters fail?",["The engines were too weak","He had no money","The government stopped him","He was too young to fly"],0],["What did he do after his first failures?",["He built aeroplanes instead","He stopped working on flying machines","He moved to France","He started writing novels"],0],["The phrase 'giving up' is closest in meaning to",["stopping trying","taking off","continuing","building"],0],["Which is TRUE according to the text?",["His VS-300 helicopter flew successfully in 1939","He was born in the United States","He built his first helicopter in 1913","His company was rich from the start"],0]]},{"t":"Plastic in the Ocean","l":"B1","text":"Every year, millions of tonnes of plastic end up in the world's oceans. Much of it comes from things we use only once, such as bottles, bags and straws. Plastic does not disappear; instead, it slowly breaks into tiny pieces called microplastics. Sea animals often mistake these pieces for food. Turtles, for example, sometimes eat plastic bags because they look like jellyfish. Scientists have even found microplastics in fish that people eat. The problem may seem too big for one person to solve, but small actions add up. In our class, we decided to stop buying bottled water and to bring reusable bottles instead. We also organised a clean-up day by the river and collected forty bags of rubbish in three hours. If every school did something similar, the difference would be enormous.","g":[["end up","оказываются, попадают"],["disappear","исчезать"],["tiny","крошечные"],["add up","складываются, накапливаются"],["reusable","многоразовые"],["rubbish","мусор"],["enormous","огромная"]],"q":[["What are microplastics?",["tiny pieces of broken plastic","a new type of bottle","small sea animals","plastic bags"],0],["Why do turtles sometimes eat plastic bags?",["The bags look like jellyfish","The turtles are very hungry","The bags taste good","The bags are colourful"],0],["The word 'enormous' in the text means",["very big","very small","dangerous","unnecessary"],0],["What did the writer's class do?",["They organised a clean-up and used reusable bottles","They built a recycling factory","They wrote to the government","They stopped eating fish"],0]]},{"t":"My First Olympiad","l":"B1","text":"In October I took part in the regional physics olympiad for the first time. My teacher suggested it after I solved a difficult problem that nobody else in the class could solve. Preparing was hard work. For two months I stayed after lessons twice a week, and my teacher gave me problems from previous years. Some of them took me more than an hour. I also watched online lectures by university professors and kept a notebook of useful formulas. On the day of the olympiad, I was so nervous that my hands were shaking. There were five problems and four hours to solve them. I managed to solve three completely and part of the fourth. When the results came out, I had taken fifth place out of sixty participants. It wasn't a prize, but it gave me the confidence to try again next year.","g":[["regional","областная"],["suggested","предложил"],["previous","предыдущих"],["formulas","формулы"],["managed to","сумел, смог"],["participants","участники"],["confidence","уверенность"]],"q":[["Why did the teacher suggest the olympiad?",["The writer solved a problem nobody else could","The writer asked to take part","His parents wanted it","He had the best marks in all subjects"],0],["How many problems did he solve completely?",["three","four","five","two"],0],["What place did he take?",["fifth","first","third","sixtieth"],0],["How did the result make him feel?",["confident enough to try again","disappointed and ready to give up","angry with his teacher","bored with physics"],0]]},{"t":"Kharkiv, a City of Students","l":"B1","text":"Kharkiv, in the north-east of Ukraine, is the country's second-largest city. It is often called a city of students because it has dozens of universities and colleges. Kharkiv University, founded in 1804, is one of the oldest in Eastern Europe, and several Nobel Prize winners studied or worked there. The city is also famous for Freedom Square, one of the largest city squares in Europe, and for Gorky Park, where families come to relax at weekends. Kharkiv has a strong engineering tradition: tractors, planes and turbines have been designed and produced here for many years. In 1932, physicists in Kharkiv were among the first in the world to split the atomic nucleus. Today the city is known for its IT companies and its energetic young people, who love music, sport and new ideas.","g":[["north-east","северо-восток"],["dozens","десятки"],["founded","основан"],["square","площадь"],["relax","отдыхать"],["designed","разрабатывались, проектировались"],["energetic","энергичные"]],"q":[["Why is Kharkiv called a city of students?",["It has dozens of universities and colleges","Students built the city","It has the largest school in Europe","Most people there are under twenty"],0],["When was Kharkiv University founded?",["in 1804","in 1932","in 1904","in 1832"],0],["Which of these is NOT mentioned in the text?",["a famous football stadium","Freedom Square","Gorky Park","IT companies"],0],["The word 'dozens' in the text means",["many","very few","exactly two","none"],0]]},{"t":"How Social Media Changes Us","l":"B1","text":"Most teenagers today spend several hours a day on social media. Platforms like Instagram and TikTok help us stay in touch with friends, follow our hobbies and discover new music. However, psychologists warn that they can also affect our mood. When we constantly see photos of other people's perfect holidays and perfect bodies, we start to compare ourselves with them and may feel that our own lives are boring. Another problem is that apps are designed to keep us scrolling. Every new like gives the brain a small reward, so it becomes difficult to stop. Experts recommend a few simple habits: turn off notifications, don't use your phone in bed, and follow accounts that teach you something useful. Social media is a tool, and like any tool, it can be used well or badly.","g":[["stay in touch","поддерживать связь"],["warn","предупреждают"],["affect","влиять"],["mood","настроение"],["compare","сравнивать"],["reward","награда, поощрение"],["notifications","уведомления"]],"q":[["What is the main idea of the text?",["Social media has both benefits and risks","Teenagers should delete all apps","Instagram is better than TikTok","Psychologists use social media a lot"],0],["Why can social media make us feel our lives are boring?",["We compare ourselves with other people's perfect photos","Apps show only sad news","Friends stop talking to us","We have no time for hobbies"],0],["Why is it difficult to stop scrolling?",["Every like gives the brain a small reward","The phone battery lasts a long time","Videos are very long","Notifications are turned off"],0],["Which of these do experts recommend?",["turning off notifications","using your phone in bed","following as many accounts as possible","posting every day"],0]]},{"t":"English Camp in the Mountains","l":"B1","text":"Last July I spent three weeks at an English language camp in the Carpathian Mountains. There were about eighty teenagers from different parts of Ukraine and a few volunteer teachers from Britain and Canada. The main rule of the camp was simple: speak only English, even during meals. For the first few days this was really tiring, and I often had to use gestures when I didn't know a word. Lessons took place in the mornings, but they were very different from school. Instead of grammar exercises, we did projects, debates and even made a short film. In the afternoons we went hiking, swam in a cold mountain lake or played volleyball. By the end of the camp I noticed that I had started thinking in English. I also made friends from Odesa, Dnipro and Chernivtsi, and we still chat every day.","g":[["camp","лагерь"],["gestures","жесты"],["took place","проходили"],["debates","дебаты"],["hiking","пешие походы"],["noticed","заметил"],["chat","общаемся, переписываемся"]],"q":[["What was the main rule of the camp?",["Speak only English","Don't use phones","Go to bed early","Do grammar exercises every day"],0],["Why were the first days tiring?",["Speaking only English was difficult","The lessons were too long","The weather was very hot","He had to walk a lot"],0],["How were the lessons different from school?",["They included projects, debates and a film","They took place in the evening","They were only about grammar","They were taught in Ukrainian"],0],["What change did the writer notice by the end?",["He had started thinking in English","He had forgotten some Ukrainian words","He wanted to become a teacher","He had stopped using his phone"],0]]},{"t":"Who Invented the Internet?","l":"B1","text":"Many people believe the internet was invented by one person, but in fact it was developed by many scientists over several decades. In the late 1960s, the US government funded a project called ARPANET, which connected computers at a few universities. Its aim was to allow researchers to share information quickly. In the 1970s, Vint Cerf and Bob Kahn created a set of rules, called TCP/IP, that let different networks communicate with each other. This is why they are often called the fathers of the internet. However, the internet only became popular with ordinary people in the 1990s, after the British scientist Tim Berners-Lee invented the World Wide Web. He created a system of web pages connected by links and decided not to patent it, so anyone could use it for free.","g":[["invented","изобретён"],["decades","десятилетия"],["funded","финансировало"],["aim","цель"],["researchers","исследователи"],["ordinary","обычные"],["patent","запатентовать"]],"q":[["What is the main idea of the text?",["The internet was created by many people step by step","Tim Berners-Lee invented the internet alone","ARPANET was a failure","The internet is free because of the government"],0],["What was the aim of ARPANET?",["to help researchers share information quickly","to sell computers","to create video games","to connect people's homes"],0],["Why are Cerf and Kahn called the fathers of the internet?",["They created rules that let networks communicate","They funded ARPANET","They invented the World Wide Web","They built the first computer"],0],["What did Tim Berners-Lee decide?",["not to patent the Web","to sell the Web","to work for the government","to close ARPANET"],0]]},{"t":"Odesa by the Sea","l":"B1","text":"Odesa is a large port city on the Black Sea coast in the south of Ukraine. It was founded in 1794 and quickly grew into an important trading centre. People from many countries, including Greeks, Italians, Jews and French, settled there, and this mixture of cultures gave Odesa its unique character. People from Odesa are famous for their sense of humour; the city even holds a humour festival every year on the first of April. One of Odesa's best-known symbols is the Potemkin Stairs, a giant staircase with 192 steps leading down towards the sea. The Odesa Opera House, built at the end of the nineteenth century, is considered one of the most beautiful theatres in Europe. In summer, thousands of tourists come to enjoy the beaches, the warm sea and the city's lively atmosphere.","g":[["coast","побережье"],["trading","торговый"],["settled","поселились"],["unique","уникальный"],["sense of humour","чувство юмора"],["staircase","лестница"],["lively","оживлённая"]],"q":[["Which is TRUE according to the text?",["People from many countries settled in Odesa","Odesa was founded in 1894","The Potemkin Stairs have 92 steps","The Opera House was built in the twentieth century"],0],["What happens in Odesa on the first of April?",["a humour festival","a music festival","a sea festival","the Opera House's birthday"],0],["The word 'settled' in the text means",["came to live permanently","visited for a short time","sailed away","argued"],0],["What gave Odesa its unique character?",["the mixture of cultures","the warm sea","the Opera House","the beaches"],0]]},{"t":"Should Homework Be Banned?","l":"B1","text":"In some countries, schools have reduced or even stopped giving homework to younger students. Supporters of this idea argue that children already spend six or seven hours at school and need time to rest, play sports and be with their families. They also point out that homework can be unfair, because some students have quiet rooms and helpful parents, while others don't. On the other hand, many teachers believe that homework is necessary. Practising at home helps students remember new material and develop independence. In my opinion, the answer is somewhere in the middle. Homework should be short and meaningful, not just copying exercises from a textbook. For example, our physics teacher sometimes asks us to film a simple experiment at home, which is both useful and fun. Quality is more important than quantity.","g":[["reduced","сократили"],["Supporters","сторонники"],["argue","утверждают"],["unfair","несправедливой"],["independence","самостоятельность"],["meaningful","осмысленным"],["quantity","количество"]],"q":[["Why can homework be unfair, according to its critics?",["Some students have better conditions at home","Teachers give too much of it","It is always too difficult","Parents do it for their children"],0],["What do many teachers believe?",["Homework helps students remember new material","Homework should be banned","Students should study at night","Textbooks are useless"],0],["What is the writer's opinion?",["Homework should be short and meaningful","Homework should be banned completely","Students need more homework","Only physics needs homework"],0],["The word 'quantity' in the text means",["amount","quality","speed","difficulty"],0]]},{"t":"Electric Cars","l":"B1","text":"Electric cars are becoming more common on the roads of Ukraine and the rest of the world. Unlike traditional cars, they don't burn petrol or diesel, so they don't produce exhaust fumes in the city. This makes the air cleaner and the streets quieter. Electric cars are also cheaper to run, because charging a battery costs less than filling a tank. However, they still have some disadvantages. They are usually more expensive to buy, and in some areas there are not enough charging stations. Long journeys need careful planning, as charging can take from twenty minutes to several hours. Critics also note that producing batteries requires rare metals and a lot of energy. Engineers are working hard to make batteries cheaper, lighter and easier to recycle. Many experts predict that in twenty years most new cars will be electric.","g":[["Unlike","в отличие от"],["petrol","бензин"],["exhaust fumes","выхлопные газы"],["tank","бак"],["rare","редкие"],["recycle","перерабатывать"],["predict","прогнозируют"]],"q":[["Why do electric cars make city air cleaner?",["They don't produce exhaust fumes","They are quieter","They are smaller","They use rare metals"],0],["Which disadvantage is mentioned in the text?",["They are more expensive to buy","They are very noisy","They are slow","They can't travel long distances at all"],0],["What are engineers trying to do?",["make batteries cheaper, lighter and easier to recycle","build more petrol stations","make cars faster","find new rare metals"],0],["What do many experts predict?",["Most new cars will be electric in twenty years","Electric cars will disappear","Petrol will become cheaper","Batteries will not change"],0]]},{"t":"Leonardo: Artist and Engineer","l":"B1","text":"Most people know Leonardo da Vinci as the painter of the Mona Lisa, but he was much more than an artist. Born in Italy in 1452, Leonardo was curious about everything around him. He filled thousands of notebook pages with drawings and ideas about anatomy, water, light and machines. He designed a flying machine with wings like a bat, a diving suit and even a mechanical knight that could move its arms. Interestingly, he wrote most of his notes in mirror writing, from right to left. Many of his inventions were never built, because the technology of his time was not advanced enough. Centuries later, engineers built models from his drawings and discovered that several of them actually worked. Leonardo shows that art and science are not opposites but can support each other.","g":[["curious","любознательный"],["anatomy","анатомия"],["wings","крылья"],["diving suit","водолазный костюм"],["mirror writing","зеркальное письмо"],["advanced","развитой, передовой"],["opposites","противоположности"]],"q":[["What is the main idea of the text?",["Leonardo was both an artist and an inventor","The Mona Lisa is the most famous painting","Leonardo built hundreds of machines","Mirror writing was popular in Italy"],0],["Why were many of his inventions never built?",["The technology of his time was not advanced enough","He didn't have enough money","He lost his notebooks","Nobody was interested in them"],0],["How did Leonardo write most of his notes?",["from right to left","in a secret number code","only in Latin","only with pictures"],0],["What did engineers discover centuries later?",["Several of his designs actually worked","None of his designs worked","He had copied other inventors","His notebooks were fake"],0]]},{"t":"A First Aid Course","l":"B1","text":"Last month our lyceum invited a paramedic to teach a basic first aid course to students in years nine and ten. At first some of my classmates thought it would be boring, but in the end everyone agreed it was one of the most useful lessons of the year. We learned what to do if someone faints, how to treat minor burns and cuts, and how to help a person who is choking. The most important part of the course was learning CPR, which helps keep a person alive when their heart stops. We practised on special dummies, pressing hard and fast on the chest about a hundred times per minute. The paramedic explained that in an emergency the first few minutes are critical, and that a calm person who knows what to do can save a life. At the end, each of us received a certificate.","g":[["paramedic","фельдшер, парамедик"],["faints","теряет сознание"],["minor","незначительные, лёгкие"],["choking","подавился, задыхается"],["dummies","манекены"],["emergency","экстренная ситуация"],["certificate","сертификат"]],"q":[["What did some students think at first?",["The course would be boring","It would be dangerous","It would be too difficult","It would be too short"],0],["Which of these is NOT mentioned in the text?",["how to treat a broken leg","what to do if someone faints","how to treat burns","how to help a choking person"],0],["How fast should you press on the chest during CPR?",["about a hundred times per minute","about ten times per minute","as slowly as possible","once every few seconds"],0],["The word 'critical' in the text means",["extremely important","dangerous","boring","unkind"],0]]},{"t":"Why Teenagers Need Sleep","l":"B1","text":"Teenagers are often told that they are lazy because they find it hard to get up in the morning. However, scientists say this is not about laziness. During adolescence, the body's internal clock changes, and the brain starts producing the sleep hormone melatonin later in the evening. As a result, many teenagers don't feel sleepy until eleven or even midnight. At the same time, they need eight to ten hours of sleep a night. When school starts early, many students simply don't get enough rest. Lack of sleep affects concentration, memory and mood, and it can even make people more likely to get ill. Some schools in the USA have moved the start of lessons to half past eight or later, and they have reported better attendance and results. Meanwhile, experts advise teenagers to avoid screens for an hour before bed.","g":[["lazy","ленивые"],["adolescence","подростковый возраст"],["internal clock","внутренние (биологические) часы"],["Lack of","нехватка"],["concentration","концентрация внимания"],["attendance","посещаемость"],["avoid","избегать"]],"q":[["According to scientists, why do teenagers find it hard to get up early?",["Their internal clock changes","They are lazy","They play games all night","They eat too late"],0],["How much sleep do teenagers need?",["eight to ten hours","about six hours","five to seven hours","twelve hours"],0],["What happened in schools that started lessons later?",["Attendance and results improved","Students slept in class","Teachers complained","Nothing changed"],0],["Which is TRUE according to the text?",["Lack of sleep can affect memory","Melatonin is produced in the morning","Screens help teenagers fall asleep","Teenagers need less sleep than adults"],0]]},{"t":"A Ukrainian in Space","l":"B1","text":"In November 1997, Leonid Kadenyuk became the first astronaut of independent Ukraine. He flew into space on board the American Space Shuttle Columbia as part of an international crew of six. Kadenyuk was born in 1951 in a small village in the Chernivtsi region. From childhood he dreamed of flying, and after school he became a pilot and later a test pilot. He trained for many years before he got his chance to go into space. During the mission, which lasted about sixteen days, he carried out biological experiments, studying how plants grow in zero gravity. The results helped scientists understand how to grow food on long space journeys. After returning to Earth, Kadenyuk worked in the Ukrainian parliament and spoke to students across the country, encouraging them to study science. Today schools and streets in Ukraine are named after him.","g":[["crew","экипаж"],["region","область"],["test pilot","лётчик-испытатель"],["carried out","проводил"],["zero gravity","невесомость"],["parliament","парламент"],["encouraging","вдохновляя, побуждая"]],"q":[["Which is TRUE according to the text?",["Kadenyuk flew on an American shuttle","He was the only person on board","He was born in Kyiv","He flew into space in 2007"],0],["What did he study in space?",["how plants grow in zero gravity","distant stars","how people sleep","the weather on Earth"],0],["Why were his experiments important?",["They helped scientists understand how to grow food in space","They found water on the Moon","They made shuttles faster","They proved that plants can't grow in space"],0],["What did he do after returning to Earth?",["He worked in parliament and spoke to students","He became a teacher in his village","He flew into space again","He started writing novels"],0]]},{"t":"Learning to Code","l":"B1","text":"When I was twelve, I wrote my first program: a simple game in Scratch where a cat chased a mouse. Since then programming has become my main hobby. Last year I moved to Python, a language that is popular because its code is easy to read. I learned mostly from free online courses, and whenever I got stuck, I searched for answers on forums. At first I tried to memorise every command, but I soon realised that real programmers constantly look things up. What matters more is learning to break a big problem into small steps. My biggest project so far is a Telegram bot for my class that reminds everyone about homework deadlines and tests. Around twenty classmates use it every day. Of course, it still has bugs, and fixing them sometimes takes longer than writing new features. Next year I would like to try developing a mobile app.","g":[["memorise","запомнить, выучить наизусть"],["got stuck","застревал, не знал, что делать дальше"],["forums","форумы"],["look things up","искать информацию, справляться"],["deadlines","сроки сдачи"],["bugs","ошибки в программе, баги"],["features","функции"]],"q":[["Why is Python popular, according to the text?",["Its code is easy to read","It is the newest language","It is only for games","It was created by Telegram"],0],["What did the writer soon realise?",["Real programmers often look things up","He had to memorise every command","Forums are useless","Scratch is better than Python"],0],["What does his Telegram bot do?",["It reminds classmates about deadlines and tests","It plays games","It translates texts","It finds bugs in other programs"],0],["The phrase 'got stuck' in the text means",["could not continue","got bored","finished quickly","got angry"],0]]},{"t":"The Real Cost of Fast Fashion","l":"B1","text":"Clothes have never been cheaper than they are today. Big brands release new collections almost every week, and many young people buy T-shirts or jeans that they wear only a few times. This trend is called fast fashion, and it has a hidden cost for the planet. Producing a single cotton T-shirt can require around 2,700 litres of water, which is enough for one person to drink for over two years. Factories also release chemicals into rivers, and millions of tonnes of clothes end up in landfills every year. What can teenagers do? First, buy less and choose better quality. Second, give old clothes a second life by swapping them with friends, selling them online or donating them to charity. Finally, learn to repair simple things, like a missing button. Being fashionable doesn't have to harm the environment.","g":[["release","выпускают"],["hidden","скрытая"],["cotton","хлопковая"],["landfills","свалки"],["swapping","обмениваясь"],["donating","отдавая, жертвуя"],["repair","чинить"]],"q":[["What is fast fashion?",["buying cheap clothes often and wearing them only a few times","making clothes by hand","clothes for sport","expensive designer clothes"],0],["How much water can one cotton T-shirt need?",["around 2,700 litres","around 270 litres","around 27 litres","around 27,000 litres"],0],["Which of these is NOT suggested in the text?",["buying new clothes every week","swapping clothes with friends","repairing clothes","choosing better quality"],0],["What is the main idea of the text?",["Fast fashion harms the environment, but we can change our habits","Teenagers should stop wearing jeans","Cotton is the best material","Big brands help the planet"],0]]},{"t":"Artificial Intelligence at School","l":"B1","text":"Artificial intelligence, or AI, has quickly become part of students' lives. Chatbots can explain a difficult topic, check grammar or suggest ideas for an essay in seconds. Used wisely, they can be like a patient private tutor who is available at any time. However, AI also creates new challenges for schools. Some students simply copy answers without trying to understand them, which means they don't actually learn anything. Moreover, chatbots sometimes make mistakes or invent facts that sound convincing, so users need to check information carefully. Many teachers are now changing how they assess students: instead of writing essays at home, students might discuss their ideas aloud in class or explain how they solved a problem. In my view, banning AI is unrealistic. Schools should instead teach us how to use it responsibly and think critically.","g":[["wisely","разумно, мудро"],["tutor","репетитор"],["Moreover","более того"],["convincing","убедительно"],["assess","оценивать"],["aloud","вслух"],["responsibly","ответственно"]],"q":[["What is the main idea of the text?",["AI can help students but must be used responsibly","AI should be banned in all schools","Chatbots never make mistakes","Teachers don't like technology"],0],["Which problem with AI is mentioned?",["Some students copy answers without understanding them","AI is too expensive","Chatbots work too slowly","AI works only in English"],0],["How are teachers changing the way they assess students?",["Students discuss ideas aloud and explain their solutions","Students write more essays at home","Teachers use AI to give marks","Exams are cancelled"],0],["The word 'convincing' in the text means",["making you believe something is true","very boring","difficult to understand","funny"],0]]},{"t":"How to Prepare for the NMT","l":"B1","text":"For Ukrainian school leavers, the National Multi-Subject Test, or NMT, is one of the most important exams of their lives. Its results decide which university they can enter. Many students start preparing a year in advance, but experienced teachers say the key is not how many hours you study but how you study. First, find out exactly what the test includes and practise with real tasks from previous years under time limits. Second, analyse your mistakes instead of just checking the score. If you keep making the same error with prepositions, for example, make a list and review it regularly. Third, don't forget about rest. Studying late every night leads to tiredness and poor concentration. Finally, read in English every day, even for fifteen minutes. Regular reading improves vocabulary and grammar almost without effort.","g":[["school leavers","выпускники школ"],["in advance","заранее"],["experienced","опытные"],["time limits","ограничение по времени"],["analyse","анализируйте"],["regularly","регулярно"],["effort","усилие"]],"q":[["According to experienced teachers, what is the key to preparation?",["how you study, not only how many hours","studying late every night","buying as many books as possible","starting one month before the test"],0],["What should you do with your mistakes?",["analyse them and review them regularly","ignore them","only check your score","ask friends to correct them"],0],["Why shouldn't you study late every night?",["It leads to tiredness and poor concentration","The internet is slow at night","Teachers don't allow it","The exam starts early in the morning"],0],["What does the writer say about reading in English?",["It improves vocabulary and grammar","It is a waste of time","It should only be done at weekends","It must last at least two hours"],0]]},{"t":"The Science of Procrastination","l":"B2","text":"Almost everyone has done it: you have an important essay to write, but suddenly tidying your desk or watching just one more video seems much more urgent. This habit of delaying tasks is called procrastination, and scientists say it is not simply a sign of laziness. According to psychologists, procrastination is mainly about emotions. When a task makes us feel bored, anxious or unsure, our brain looks for a quick way to feel better. Scrolling through a phone gives an instant reward, while the reward for finishing an essay comes much later. The problem is that delaying the task usually makes the stress worse. The deadline gets closer, and the work seems even bigger than before. So what can you do? Experts recommend breaking a large task into small steps. Instead of thinking about the whole essay, promise yourself to write just the first paragraph. Another useful trick is the two-minute rule: if something takes less than two minutes, do it immediately. Finally, be kind to yourself. Research shows that students who forgive themselves for procrastinating are less likely to do it again next time.","g":[["urgent","срочный"],["delaying","откладывание"],["laziness","лень"],["instant","мгновенный"],["reward","награда"],["immediately","немедленно"],["forgive","прощать"]],"q":[["According to the text, procrastination is mainly connected with",["emotions","laziness","lack of intelligence","bad teachers"],0],["Why do people choose to scroll through their phones?",["It gives a quick reward","It helps them write essays","Their teachers recommend it","It reduces the deadline"],0],["What does the two-minute rule say?",["Do short tasks at once","Take a break every two minutes","Write for two minutes a day","Check your phone every two minutes"],0],["Students who forgive themselves for procrastinating",["procrastinate less in the future","get lower marks","never meet deadlines","feel more stressed"],0]]},{"t":"Smart Farming in Ukraine","l":"B1","text":"Ukraine is often called the breadbasket of Europe because it produces huge amounts of wheat, corn and sunflower oil. Today, many Ukrainian farmers are using modern technology to make their work more efficient. On large farms, drones fly over the fields and take detailed photos. A computer program then analyses the pictures and shows which plants are healthy and which need more water or fertiliser. This means farmers can use chemicals only where they are really needed, which saves money and protects the environment. Some tractors can now drive themselves using GPS. They move in perfectly straight lines and work even at night. Sensors in the soil measure temperature and humidity and send the data to the farmer's smartphone. Young people are an important part of this change. Many agricultural universities have added courses in programming and data analysis, and students do internships on high-tech farms. Of course, technology is expensive, and small farms cannot always afford it. However, experts believe that smart farming will help Ukraine feed millions of people around the world while using fewer resources.","g":[["breadbasket","житница"],["wheat","пшеница"],["fertiliser","удобрение"],["humidity","влажность"],["agricultural","сельскохозяйственный"],["resources","ресурсы"]],"q":[["Why is Ukraine called the breadbasket of Europe?",["It produces a lot of grain and oil","It has many bakeries","It imports a lot of bread","It has the largest farms in the world"],0],["What do drones do on farms?",["They take photos of the fields","They plant seeds","They drive tractors","They sell crops"],0],["What do soil sensors measure?",["temperature and humidity","the price of wheat","the speed of tractors","the number of plants"],0],["What problem with smart farming is mentioned?",["It is too expensive for some small farms","It does not work at night","It damages the soil","Young people are not interested"],0]]},{"t":"Life on Mars: Dream or Reality?","l":"B2","text":"For decades, people have dreamed of living on Mars. Today, space companies and agencies are seriously planning missions that could take humans to the Red Planet within the next twenty years. But how realistic is this dream? The first challenge is the journey itself. With current technology, a flight to Mars takes about seven months. During this time, astronauts would be exposed to dangerous cosmic radiation and would lose muscle and bone mass because of zero gravity. Once they arrived, the conditions would be extremely harsh. The average temperature on Mars is about minus sixty degrees Celsius, the atmosphere is mostly carbon dioxide, and there is no liquid water on the surface. Settlers would have to grow food in special greenhouses and produce oxygen from ice found under the ground. Despite these difficulties, many scientists believe a base on Mars is possible. Robots could be sent first to build shelters and prepare equipment. Supporters argue that exploring Mars would lead to new technologies that could also help us on Earth. Critics, on the other hand, say the money would be better spent on solving problems on our own planet.","g":[["decades","десятилетия"],["exposed","подвергаться (воздействию)"],["harsh","суровый"],["surface","поверхность"],["Settlers","поселенцы"],["shelters","укрытия"]],"q":[["How long does a flight to Mars take with current technology?",["about seven months","about seven weeks","about two years","about twenty years"],0],["Which problem for astronauts during the flight is mentioned?",["losing muscle and bone mass","lack of food","too much gravity","boredom"],0],["How could settlers get oxygen?",["by producing it from underground ice","by bringing it from Earth every month","by breathing the Martian air","from liquid water on the surface"],0],["What do critics think?",["The money should be used to solve problems on E
