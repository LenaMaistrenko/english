gging.",["must","can't","mustn't"],0,"Логичный вывод о процессе сейчас — must be + -ing."],["You must have ___ the joke — everyone was laughing.",["heard","hear","hearing"],0,"must have + V3 (heard)."],["She ___ have forgotten about the match — she talked about it all week.",["can't","must","mustn't"],0,"Не может быть, что забыла — can't have."]],"tr":[["Он, должно быть, дома.","must be",["He must be at home","He must be home"]],["Не может быть, что она это сказала.","can't have + V3",["She cannot have said that","She could not have said that","She cannot have said it","She could not have said it"]],["Возможно, они сейчас играют.","might be + -ing",["They might be playing now","They may be playing now","They could be playing now","They might be playing at the moment","They may be playing at the moment","They could be playing at the moment"]],["Ты, должно быть, долго ждал.","must have (been)",["You must have been waiting for a long time","You must have been waiting a long time","You must have been waiting for long","You must have waited for a long time","You must have waited a long time","You must have waited for long"]]]},{"t":"Пассив C1: to be done, to have been done, being done","l":"C1","rule":"Пассив бывает не только в обычных временах. После глаголов, которые требуют to (want, hope, expect, deserve), — пассивный инфинитив: I want to be chosen. Если действие было раньше — перфектный пассивный инфинитив: The game is said to have been made in two years. После глаголов с -ing (hate, avoid, remember, can't stand) и после предлогов — пассивный герундий: I hate being interrupted, afraid of being kicked from the server. Having been + V3 — пассив, который случился раньше главного действия: Having been warned, we saved our worlds. Ошибки: I hate interrupting (если перебивают меня) ✗, The bridge is believed to be built 200 years ago ✗ (нужно to have been built).","ex":[["Every streamer wants [to be noticed].","Каждый стример хочет, чтобы его заметили."],["I hate [being told] what to do while I'm playing.","Терпеть не могу, когда мне говорят, что делать, пока я играю."],["The first version of the game is believed [to have been made] by just one person.","Считается, что первую версию игры сделал всего один человек."],["Oleg was upset about [not being invited] to the party.","Олег расстроился, что его не пригласили на вечеринку."],["[Having been warned] about the update, we saved our worlds.","Так как нас предупредили об обновлении, мы сохранили свои миры."]],"quiz":[["I'd love ___ for the school esports team.",["to be chosen","to choose","being chose"],0,"Меня выберут (пассив) после would love — to be + V3."],["Nobody likes ___ in front of the whole class.",["criticising","being criticised","to criticise"],1,"Критикуют нас — пассивный герундий being + V3."],["The bridge is thought ___ about 200 years ago.",["to have built","to be built","to have been built"],2,"Действие в прошлом + пассив — to have been + V3."],["He avoided ___ by keeping his camera off.",["recognising","being recognised","to be recognised"],1,"avoid + -ing; его узнают — being + V3."],["The results are expected ___ next week.",["to be published","to have been published","being published"],0,"Будущее (next week) — простой пассивный инфинитив."],["___ the rules twice, the players had no excuse.",["Having told","Being telling","Having been told"],2,"Им сказали (пассив) раньше — Having been + V3."],["My homework needs ___ by tomorrow.",["to finish","be finished","to be finished"],2,"need + пассивный инфинитив: to be finished."],["I remember ___ to the zoo when I was three.",["to be taken","being taken","taking"],1,"remember + -ing (о прошлом); меня водили — being taken."],["The players are reported ___ for the final for months.",["to have been training","to train","to be trained"],0,"Длилось долго до сейчас — to have been + -ing."],["The map seems ___ since my last visit — everything looks different.",["being changed","to be changed","to have been changed"],2,"Изменили раньше (since) — to have been + V3."],["She was proud of ___ to speak at the conference.",["being asked","to be asked","asking"],0,"После предлога of — герундий; её попросили — being asked."],["The old servers are going ___ next year.",["being replaced","to replace","to be replaced"],2,"Серверы заменят (пассив) — be going to be + V3."],["This game deserves ___ by more people.",["being play","to be played","to play"],1,"deserve + to; в игру играют — to be played."],["Oleg can't stand ___ 'little brother'.",["being called","to be call","calling"],0,"can't stand + -ing; его называют — being called."]],"tr":[["Я не люблю, когда меня перебивают.","being + V3",["I do not like being interrupted","I hate being interrupted","I do not like to be interrupted","I dislike being interrupted"]],["Она надеется, что её выберут.","hope to be + V3",["She hopes to be chosen","She hopes to be selected","She hopes that she will be chosen","She hopes she will be chosen","She hopes she will be selected"]],["Говорят, что игру создали за год.","is said to have been",["The game is said to have been created in a year","The game is said to have been made in a year","The game is said to have been developed in a year","The game is said to have been created in one year","The game is said to have been made in one year","The game is said to have been developed in one year"]],["Олег боится, что его накажут.","afraid of being + V3",["Oleg is afraid of being punished"]]]},{"t":"Условия без if: unless, provided, as long as, in case, otherwise, but for","l":"B2","rule":"unless = if … not: You won't pass unless you study. provided / providing (that), as long as, on condition that — «при условии, что»: You can play as long as you finish your homework. После них, как и после if, будущее не ставим: provided you finish (не will finish ✗). in case — «на случай, если» (это НЕ if!): Take a charger in case your phone dies. otherwise — «иначе»: Save the game, otherwise you'll lose progress. but for + существительное = «если бы не»: But for your help, I would have failed. Ошибки: unless + not (двойное отрицание), in case вместо if, will после provided.","ex":[["You won't get 190 points [unless] you practise every day.","Ты не наберёшь 190 баллов, если не будешь заниматься каждый день."],["You can stream tonight [as long as] you finish your essay first.","Ты можешь стримить сегодня, при условии что сначала допишешь эссе."],["Take a power bank [in case] your phone dies.","Возьми пауэрбанк на случай, если телефон разрядится."],["Save your world now, [otherwise] you'll lose everything.","Сохрани мир сейчас, иначе всё потеряешь."],["[But for] the lag, we would have won the match.","Если бы не лаги, мы бы выиграли матч."]],"quiz":[["You'll fail the test ___ you start revising now.",["if","unless","provided"],1,"Провалишь, если НЕ начнёшь — unless."],["You can borrow my headphones ___ you give them back tomorrow.",["provided","otherwise","unless"],0,"Условие «при условии, что» — provided."],["Take an umbrella ___ it rains.",["unless","in case","provided"],1,"«На случай, если» — in case."],["Hurry up, ___ we'll miss the start of the stream.",["otherwise","unless","in case"],0,"«Иначе» — otherwise."],["___ my teacher's help, I wouldn't have passed the exam.",["Unless","Provided","But for"],2,"But for + существительное — «если бы не»."],["You can join our team as long as you ___ to practise.",["agree","would agree","will agree"],0,"После as long as — Present Simple вместо будущего."],["Don't call me ___ it's really important.",["if","provided","unless"],2,"Не звони, если это НЕ важно — unless."],["I'll write down the code ___ I forget it.",["provided","unless","in case"],2,"Запишу на случай, если забуду — in case."],["___ that everybody agrees, the tournament will start at noon.",["Provided","Otherwise","Unless"],0,"Provided that — «при условии, что»."],["Unless you ___ your password, nobody can log into your account.",["won't share","share","don't share"],1,"unless уже содержит not; будущее не ставим."],["We'd better leave now; ___, we'll be late for the NMT.",["in case","otherwise","unless"],1,"«Иначе» в начале части — otherwise."],["But for the rain, we ___ the picnic.",["would have enjoyed","will enjoy","enjoyed"],0,"But for = «если бы не» (о прошлом) — would have + V3."],["You can use my PC on ___ that you don't install anything.",["provided","case","condition"],2,"Устойчивое on condition that."],["I'll lend you my console ___ you take care of it.",["otherwise","as long as","unless"],1,"«Если только / при условии» — as long as."]],"tr":[["Ты не сдашь, если не будешь учиться.","unless",["You will not pass unless you study","You will not pass unless you learn","You will not pass the exam unless you study","You will not pass if you do not study","You will not pass the test unless you study"]],["Возьми воду на случай, если захочешь пить.","in case",["Take some water in case you get thirsty","Take water in case you get thirsty","Take some water in case you are thirsty","Take water in case you are thirsty","Take some water in case you feel thirsty","Take water in case you feel thirsty"]],["Ты можешь играть, при условии что сделаешь уроки.","as long as / provided",["You can play as long as you do your homework","You can play provided you do your homework","You can play provided that you do your homework","You can play providing you do your homework","You can play as long as you have done your homework","You can play on condition that you do your homework"]],["Если бы не ты, я бы проиграл.","But for",["But for you, I would have lost","If it had not been for you, I would have lost","If it was not for you, I would have lost","If it were not for you, I would have lost","Without you, I would have lost"]]]},{"t":"Инверсия в условных: Should you…, Were I…, Had I known…","l":"C1","rule":"В официальном стиле if можно убрать и поставить глагол вперёд. First Conditional: Should you need help, call us (= If you need help). Second: Were I you, I'd revise more (= If I were you); Were he to win… (= If he won). Third: Had I known, I would have come (= If I had known). Отрицание — not после подлежащего: Had I not saved the game… (не Hadn't I ✗). Вторая часть предложения остаётся обычной. Ошибки: Did I know… ✗, Would I have known… ✗, Was I you… ✗ (только Were).","ex":[["[Should you have] any problems with the app, contact support.","Если у вас возникнут проблемы с приложением, обратитесь в поддержку."],["[Were I] you, I would update the drivers.","На твоём месте я бы обновил драйверы."],["[Had I known] about the tournament, I would have signed up.","Если бы я знал о турнире, я бы записался."],["[Had we not saved] the game, we would have lost two hours of progress.","Если бы мы не сохранили игру, мы бы потеряли два часа прогресса."],["[Were the servers to crash], the final would be postponed.","Если бы серверы упали, финал перенесли бы."]],"quiz":[["___ I known the password, I would have logged in.",["Did","Had","Would"],1,"Третий тип без if — Had + подлежащее + V3."],["___ you need any help, just send me a message.",["Would","Should","Did"],1,"Первый тип без if — Should + подлежащее + глагол."],["___ I you, I would start preparing for the NMT now.",["Was","Were","Am"],1,"Were I you = If I were you; Was в инверсии не используется."],["Had she ___ the bus, she would have arrived on time.",["not missed","missed not","didn't miss"],0,"Отрицание в инверсии: Had she not + V3."],["Should the game ___, restart your computer.",["freezes","froze","freeze"],2,"После Should — базовая форма глагола."],["Were he ___ harder, he would get better marks.",["working","to work","worked"],1,"Were + подлежащее + to do — гипотеза."],["___ the weather been better, we would have played outside.",["Were","Has","Had"],2,"Had + подлежащее + been — третий тип."],["Had I listened to my brother, I ___ into that trap.",["wouldn't have fallen","won't fall","didn't fall"],0,"Результат в прошлом — would have + V3."],["Should you ___ any bugs, please report them.",["find","found","to find"],0,"Should + базовая форма."],["___ we to lose this match, we would be out of the tournament.",["Were","Should","Had"],0,"Were + подлежащее + to do."],["___ not studied, I would have failed.",["I had","Hadn't I","Had I"],2,"Had I not + V3; Hadn't I в инверсии неверно."],["Were Oleg older, he ___ play this game.",["will","can","could"],2,"Второй тип — could/would в результате."],["Should anyone call, ___ them I'm busy.",["would tell","told","tell"],2,"Первый тип, вторая часть — повелительное наклонение."],["Had they ___ the update earlier, the bug wouldn't have spread.",["release","released","releasing"],1,"Had + V3."]],"tr":[["На твоём месте я бы не волновался.","Were I you",["Were I you, I would not worry","Were I you, I would not be worried","If I were you, I would not worry","If I were you, I would not be worried"]],["Если бы я знал, я бы тебе сказал.","Had I known",["Had I known, I would have told you","If I had known, I would have told you"]],["Если у вас возникнут вопросы, звоните мне.","Should you have",["Should you have any questions, call me","Should you have any questions, phone me","Should you have any questions, give me a call","Should you have questions, call me","If you have any questions, call me"]],["Если бы мы не тренировались, мы бы проиграли.","Had we not",["Had we not trained, we would have lost","Had we not practised, we would have lost","Had we not practiced, we would have lost","If we had not trained, we would have lost","If we had not practised, we would have lost","If we had not practiced, we would have lost"]]]},{"t":"Инверсия C1: Little did I know, Only when, Not until, Under no circumstances","l":"C1","rule":"После отрицательных и ограничительных выражений в начале предложения идёт порядок как в вопросе (вспомогательный глагол + подлежащее). Little did I know… — «я и не подозревал». Only when / Only after / Only then / Only by — инверсия во ВТОРОЙ части: Only when I lost did I understand. Not until … — «только когда»: Not until midnight did he log off. Under no circumstances / On no account / At no time — «ни в коем случае, никогда». So + прилагательное + be + подлежащее + that: So hard was the level that… Ошибки: Little I knew ✗, Only when I lost I understood ✗, инверсия в обеих частях ✗.","ex":[["[Little did I know] that this small stream would get 10,000 views.","Я и не подозревал, что этот маленький стрим наберёт 10 000 просмотров."],["[Only when] the update came out [did we realise] how big the new map was.","Только когда вышло обновление, мы поняли, насколько большая новая карта."],["[Not until] midnight [did Oleg fall] asleep.","Олег уснул только в полночь."],["[Under no circumstances should you share] your password.","Ни в коем случае нельзя никому сообщать свой пароль."],["[So difficult was] the last boss [that] I nearly gave up.","Последний босс был настолько сложным, что я почти сдался."]],"quiz":[["Little ___ that Yura was planning a surprise party.",["I knew","knew I","did I know"],2,"Little + did + подлежащее + глагол."],["Only after I had finished my homework ___ allowed to play.",["I was","was I","did I"],1,"Only after — инверсия во второй части: was I allowed."],["Not until the results came ___ how well I had done.",["did I understand","I understood","understood I"],0,"Not until … did + подлежащее + глагол."],["Under no circumstances ___ leave the exam room before the end.",["should students","students should","students do"],0,"Under no circumstances + should + подлежащее."],["So fast ___ that nobody could catch up with him in the race.",["the car was","did the car","was the car"],2,"So + прилагательное + was + подлежащее."],["At no time ___ the players break the rules.",["did","have","were"],0,"At no time + did + подлежащее + глагол."],["Only then ___ realise that I had forgotten to save.",["I did","I","did I"],2,"Only then + did + подлежащее."],["On no account ___ the door to strangers.",["open you","you should open","should you open"],2,"On no account + should you + глагол."],["Little ___ Oleg suspect that his brother had hidden the remote.",["was","did","had"],1,"Little did + подлежащее + базовая форма."],["Not until the next day ___ the developers fix the bug.",["were","did","had"],1,"Not until … did + глагол."],["Only when you practise every day ___ become a pro player.",["will you","you will","you"],0,"Инверсия во второй части: will you."],["So popular ___ the game that the servers crashed.",["did","was","had"],1,"So + прилагательное + was."],["Only by working hard ___ your goals.",["can you achieve","you can achieve","achieve you"],0,"Only by … — инверсия: can you."],["Rarely ___ such beautiful graphics in a free game.",["I saw","I have seen","have I seen"],2,"Rarely в начале — инверсия: have I seen."]],"tr":[["Я и не подозревал, что он мой сосед.","Little did I know",["Little did I know that he was my neighbour","Little did I know he was my neighbour","Little did I know that he was my neighbor","Little did I know he was my neighbor"]],["Только тогда я понял правду.","Only then did I…",["Only then did I understand the truth","Only then did I realise the truth","Only then did I realize the truth","Only then did I see the truth"]],["Ни в коем случае не открывай эту дверь.","Under no circumstances should you",["Under no circumstances should you open this door","On no account should you open this door","Under no circumstances should you open that door","On no account should you open that door","Under no circumstances open this door","On no account open this door"]],["Он лёг спать только после полуночи.","Not until … did",["Not until after midnight did he go to bed","Not until midnight did he go to bed","Only after midnight did he go to bed","He did not go to bed until after midnight","He did not go to bed until midnight"]]]},{"t":"Эмфаза C1: All I want is…, The reason why…, усилительное do/did","l":"C1","rule":"Мы уже знаем What I need is… и It was … that. На C1 добавляются похожие конструкции: All I want is… («всё, что мне нужно»), The thing (that) I like is…, The reason (why) I… is that…, The place where…, The person who…, The last thing I want is… После All/What … did ставим глагол без to: All we did was watch videos. Чтобы усилить глагол в утвердительном предложении, ставим do/does/did + базовую форму: I do like this game! She did call you. Ошибки: I did called ✗, All I want is to sleeping ✗, The reason is because… (лучше The reason is that…).","ex":[["[All I want] for my birthday [is] a new keyboard.","Всё, что я хочу на день рождения, — новая клавиатура."],["[The thing I love] about Minecraft [is] the freedom.","Что я люблю в Minecraft — это свободу."],["[The reason why] I'm tired [is that] I studied till midnight.","Я устал, потому что учился до полуночи."],["I [do] understand the rule — I just made a silly mistake.","Я действительно понимаю правило — просто сделал глупую ошибку."],["Oleg [did] tidy his room — I saw it myself!","Олег действительно убрал комнату — я сам видел!"]],"quiz":[["All I need now ___ a good night's sleep.",["is","be","are"],0,"All I need — единственное число: is."],["I ___ like Cuphead, but it makes me so angry sometimes!",["do","does","am"],0,"Усилительное do + базовая форма (I do like)."],["She did ___ you yesterday — check your missed calls.",["calling","call","called"],1,"После усилительного did — базовая форма."],["The reason I'm late is ___ my bus broke down.",["that","why","because of"],0,"The reason … is that + предложение."],["It was Oleg ___ deleted my save file!",["which","who","what"],1,"It was + человек + who/that."],["What I like about this game ___ the soundtrack.",["are","it is","is"],2,"What-конструкция + is."],["All we did ___ watch videos all evening.",["were","did","was"],2,"All we did was + глагол без to."],["The place ___ we usually meet is the park near school.",["what","which","where"],2,"The place where…"],["He ___ work hard for the NMT, but he still felt nervous.",["does","did","was"],1,"Усилительное did в прошлом + базовая форма."],["It wasn't until the second round ___ our team started to play well.",["that","when","then"],0,"It wasn't until … that…"],["The last thing I want ___ to lose my progress.",["is","are","it is"],0,"The last thing I want is…"],["What Oleg did was ___ my headphones without asking.",["took","taken","take"],2,"What … did was + базовая форма."],["The person ___ taught me to code was my uncle.",["which","who","whose"],1,"О человеке — who."],["I ___ tell you to save the game! You didn't listen.",["was","did","do"],1,"Прошлое + усиление — did + базовая форма."]],"tr":[["Всё, что мне нужно, — это время.","All I need is",["All I need is time","All I need is some time","All I need is more time"]],["Я действительно люблю эту игру!","do + глагол",["I do love this game","I really do love this game","I do like this game","I really do like this game","I really love this game","I really like this game"]],["Именно Макс выиграл турнир.","It was … who",["It was Yura who won the tournament","It was Yura that won the tournament","It was Yura who won the competition","It was Yura that won the competition"]],["Причина, по которой я учу английский, — это игры.","The reason why … is",["The reason why I learn English is games","The reason I learn English is games","The reason why I am learning English is games","The reason I am learning English is games","The reason why I study English is games","The reason I study English is games"]]]},{"t":"Причастные обороты C1: Built in…, Having been…, with + -ing","l":"C1","rule":"Причастный оборот заменяет придаточное. V3 — пассивное значение: Released in 2011, Minecraft is still popular (= which was released). Having been + V3 — пассив, который случился раньше: Having been invited, Oleg felt happy. With + существительное + -ing / V3 / наречие — сопутствующая ситуация: With the exam coming, I study every day; with his headphones on. Not ставится перед причастием: Not knowing the answer, I guessed. Главное правило: подлежащее оборота и главного предложения должно совпадать: Walking home, I saw a cat (шёл я). «Висячее причастие» — ошибка: Walking home, a cat followed me ✗ (кот не шёл домой).","ex":[["[Released in 2011], Minecraft is still one of the most popular games.","Выпущенная в 2011 году, Minecraft до сих пор одна из самых популярных игр."],["[Having been chosen] as team captain, Igor felt proud.","Когда его выбрали капитаном команды, Игорь почувствовал гордость."],["[With the NMT coming] up, I can't play as much as before.","Так как приближается НМТ, я не могу играть столько, сколько раньше."],["[Not knowing] the answer, I tried to guess logically.","Не зная ответа, я попытался логически угадать."],["[Driving] through the virtual city, I noticed how detailed the graphics were.","Проезжая по виртуальному городу, я заметил, насколько детальная графика."]],"quiz":[["___ in just two years, the game became a huge hit.",["Developing","Having developed","Developed"],2,"Игру разработали (пассив) — V3."],["___ the answer, I left the question blank.",["Knowing not","Not known","Not knowing"],2,"Not ставится перед причастием."],["___ twice, Oleg finally started tidying his room.",["Telling","Having been told","Having told"],1,"Ему сказали (пассив) раньше — Having been + V3."],["With everyone ___, the stream started on time.",["helping","helped","to help"],0,"with + существительное + -ing (все помогали)."],["___ by millions of fans, the streamer decided to continue.",["Supporting","Supported","Having supported"],1,"Его поддерживают — пассив: V3."],["Walking home from school, ___.",["a lost wallet was lying on the road","I found a lost wallet","a lost wallet was found by me"],1,"Подлежащее должно совпадать: шёл я — I found."],["___ all my homework, I joined my friends online.",["Having been finished","Having finished","Finished"],1,"Я закончил (актив) раньше — Having + V3."],["With his headphones ___, Igor didn't hear Mum calling.",["putting on","to put on","on"],2,"with + существительное + наречие: with his headphones on."],["The players ___ for the final will get new jerseys.",["chosen","choosing","chose"],0,"Игроков выбрали — V3: players chosen."],["___ the instructions carefully, we built the robot in an hour.",["Having read","Read","Having been read"],0,"Мы прочитали (актив) раньше — Having read."],["___ from the top of the mountain, the city map looks tiny.",["Seen","Seeing","Having seen"],0,"Карту видят (пассив) — Seen."],["Anyone ___ to join the team should talk to the coach.",["having wanted","wanted","wanting"],2,"Тот, кто хочет (актив) — -ing."],["With the battery ___ low, I had to stop recording.",["ran","running","to run"],1,"with + существительное + -ing."],["___ the bus, Oleg had to walk to school.",["Having been missed","Missed","Having missed"],2,"Олег опоздал (актив) раньше — Having + V3."]],"tr":[["Не зная дороги, мы использовали карту.","Not knowing",["Not knowing the way, we used a map","Not knowing the way, we used the map","Not knowing the road, we used a map","Not knowing the road, we used the map"]],["Закончив уроки, я пошёл гулять.","Having finished",["Having finished my homework, I went for a walk","Having finished my homework, I went out","Having done my homework, I went for a walk","Having done my homework, I went out","Having finished my lessons, I went for a walk","Having finished my homework, I went outside"]],["Построенный 100 лет назад, этот мост до сих пор используется.","Built…",["Built 100 years ago, this bridge is still used","Built a hundred years ago, this bridge is still used","Built 100 years ago, the bridge is still used","Built a hundred years ago, the bridge is still used","Built 100 years ago, this bridge is still in use","Built a hundred years ago, this bridge is still in use"]],["Так как приближались экзамены, все нервничали.","With … coming/approaching",["With the exams coming, everyone was nervous","With the exams approaching, everyone was nervous","With exams coming, everyone was nervous","With exams approaching, everyone was nervous","With the exams coming up, everyone was nervous","With exams coming up, everyone was nervous"]]]},{"t":"Сослагательное наклонение: suggest that he go, It's essential that…","l":"C1","rule":"После глаголов требования и совета (suggest, recommend, insist, demand, request, propose, require) и выражений It is essential / important / vital / necessary that… в формальном английском ставится базовая форма глагола для всех лиц, без -s и без to: The coach insisted that he train every day. be остаётся be: It's vital that everyone be on time. Отрицание — not + глагол без do: I suggest that he not play tonight. В британском варианте часто используют should + глагол: …that he should train. Ошибки: that he to train ✗, that he doesn't play ✗ (в формальном стиле), suggest me to do ✗. Сюда же относится were в If I were you.","ex":[["The teacher suggested that Igor [take] the trial NMT test.","Учительница предложила, чтобы Игорь прошёл пробное НМТ."],["It's essential that every player [be] online by 7 p.m.","Важно, чтобы каждый игрок был онлайн к 19:00."],["Mum insisted that Oleg [not play] games before homework.","Мама настаивала, чтобы Олег не играл в игры до уроков."],["The coach demanded that the team [should arrive] early.","Тренер потребовал, чтобы команда приехала рано."],["The rules require that each streamer [follow] the community guidelines.","Правила требуют, чтобы каждый стример соблюдал правила сообщества."]],"quiz":[["The doctor recommended that Dad ___ more exercise.",["take","taking","to take"],0,"recommend that + подлежащее + базовая форма."],["It is vital that everyone ___ on time for the exam.",["to be","being","be"],2,"It is vital that … be."],["I suggest that he ___ the game until he finishes his essay.",["not play","no play","not to play"],0,"Отрицание в subjunctive — not + базовая форма."],["The teacher insisted that we ___ our phones off.",["switch","to switch","switching"],0,"insist that + базовая форма."],["It's important that Oleg ___ to bed early before the trip.",["to go","go","going"],1,"It's important that + базовая форма."],["The organisers demanded that the stream ___ immediately.",["be stopped","to be stopped","being stopped"],0,"Пассив в subjunctive — be + V3."],["My parents suggested that I ___ apply to a lyceum with a strong IT course.",["would","should","to"],1,"Британский вариант — should + глагол."],["The coach proposed that the team ___ a break.",["taken","to take","take"],2,"propose that + базовая форма."],["It is necessary that each student ___ an ID card.",["bringing","to bring","bring"],2,"It is necessary that + базовая форма."],["He requested that his name ___ from the list.",["removing","to be removed","be removed"],2,"Пассив: be + V3."],["Yura suggested ___ a new server.",["that create","to create","creating"],2,"suggest + -ing (или suggest that + подлежащее + глагол)."],["The rules require that every player ___ a fair-play agreement.",["sign","signing","to sign"],0,"require that + базовая форма."],["It's essential that you ___ not share your account.",["to","should","would"],1,"should not + глагол — британский вариант subjunctive."],["If I ___ you, I'd ask the teacher for help.",["be","were","am"],1,"If I were you — сослагательное were."]],"tr":[["Учитель предложил, чтобы мы повторили пассив.","suggested that we + глагол",["The teacher suggested that we revise the passive","The teacher suggested that we should revise the passive","The teacher suggested that we review the passive","The teacher suggested that we should review the passive","The teacher suggested we revise the passive","The teacher suggested revising the passive"]],["Важно, чтобы он был здесь.","It's important that he be",["It is important that he be here","It is important that he should be here","It is important for him to be here"]],["Мама настояла, чтобы я надел куртку.","insisted that I + глагол",["Mum insisted that I put on a jacket","Mum insisted that I wear a jacket","Mum insisted that I should put on a jacket","Mum insisted that I should wear a jacket","Mom insisted that I put on a jacket","Mom insisted that I wear a jacket"]],["Врач рекомендовал, чтобы Олег не ел сладкое.","not + глагол",["The doctor recommended that Oleg not eat sweets","The doctor recommended that Oleg should not eat sweets","The doctor recommended that Oleg not eat sweet things","The doctor recommended that Oleg should not eat sweet things"]]]},{"t":"Связки к НМТ: due to, as a result, moreover, so that, even if","l":"B2","rule":"Связки различаются грамматикой. После because, as, since — целое предложение (because it was raining), а после because of, due to, owing to — существительное или -ing (because of the rain). Therefore, consequently, as a result, moreover, furthermore, in addition, on the other hand обычно начинают новое предложение и отделяются запятой. Цель: in order to / so as to + глагол, so that + подлежащее + can/could/will. even if — «даже если» (условие), even though — «хотя» (это факт). as well as — «а также», после него -ing или существительное. Ошибки: because of it was late ✗, in order to I can ✗, Moreover в значении «но» ✗.","ex":[["The match was postponed [due to] technical problems.","Матч перенесли из-за технических проблем."],["The servers were overloaded. [As a result], nobody could log in.","Серверы были перегружены. В результате никто не мог зайти."],["This laptop is light. [Moreover], it runs all my games smoothly.","Этот ноутбук лёгкий. Более того, на нём плавно идут все мои игры."],["I turned on subtitles [so that] Oleg could understand the film.","Я включил субтитры, чтобы Олег мог понять фильм."],["I'll finish the level [even if] it takes all evening.","Я пройду уровень, даже если на это уйдёт весь вечер."]],"quiz":[["The stream was cancelled ___ the streamer was ill.",["because of","because","due to"],1,"Дальше целое предложение — because."],["We couldn't play outside ___ the heavy rain.",["although","because of","because"],1,"Дальше существительное — because of."],["The game has great graphics. ___, the story is weak.",["Moreover","As a result","On the other hand"],2,"Противопоставление — On the other hand."],["I saved some money ___ buy a new mouse.",["so that","in order to","because"],1,"Цель + глагол — in order to."],["Speak louder ___ everyone can hear you.",["in order to","due to","so that"],2,"Цель + подлежащее + can — so that."],["___ he had trained hard, he lost in the first round.",["Even though","Even if","Because"],0,"Тренировался — это факт: even though («хотя»)."],["I'm going to the party ___ it rains.",["even if","even though","due to"],0,"Условие (может пойти дождь) — even if."],["The flight was delayed ___ bad weather.",["owing to","because","as"],0,"Дальше существительное — owing to."],["Our team practised every day. ___, we won the championship.",["Although","However","Consequently"],2,"Результат — Consequently."],["The new update adds new maps ___ fixing many bugs.",["as well as","moreover","and also"],0,"as well as + -ing."],["I didn't know the answer, ___ I skipped the question.",["moreover","so","because"],1,"Следствие внутри предложения — so."],["Cycling is good for your health. ___, it's cheaper than taking the bus.",["In addition","However","As a result"],0,"Добавление ещё одного плюса — In addition."],["He failed the test ___ not revising.",["so that","because","due to"],2,"Дальше -ing — due to."],["___ being tired, Igor finished his project.",["Although","Despite","Because of"],1,"Несмотря на + -ing — Despite."]],"tr":[["Матч отменили из-за дождя.","because of / due to",["The match was cancelled because of the rain","The match was cancelled due to the rain","The match was cancelled owing to the rain","The match was canceled because of the rain","The match was canceled due to the rain","The match was cancelled because of rain"]],["Я встал рано, чтобы успеть на автобус.","in order to / so as to",["I got up early in order to catch the bus","I got up early to catch the bus","I got up early so as to catch the bus","I got up early so that I could catch the bus","I woke up early to catch the bus","I got up early in order not to miss the bus"]],["Я пойду, даже если будет холодно.","even if",["I will go even if it is cold","I will go even if it gets cold","I am going even if it is cold","I will go even if it is cold outside"]],["Серверы упали. В результате турнир перенесли.","As a result",["The servers crashed. As a result, the tournament was postponed","The servers went down. As a result, the tournament was postponed","The servers crashed. As a result, the tournament was moved","The servers went down. As a result, the tournament was moved","The servers crashed. As a result, the tournament was rescheduled","The servers went down. As a result, the tournament was rescheduled"]]]},{"t":"Итоговое повторение B2+/C1 к НМТ","l":"C1","rule":"Перед НМТ проверь главные «ловушки». 1) Времена: Past Perfect — для предыстории в прошлом, Present Perfect — с since/for и без точного времени. 2) После if, when, unless, as long as, as soon as — настоящее время вместо будущего. 3) Инверсия: Had I known…, Not until … did…, Little did I know… 4) Сложный пассив: to have been done, being done. 5) Глаголы + -ing/to: regret doing, suggest doing, refuse to do, accuse sb of doing. 6) Модальные: can't have + V3, must be + -ing. Всегда читай всё предложение: подсказки — в словах времени и в смысле.","ex":[["[Had I known] about the bug, I [wouldn't have updated] the game.","Если бы я знал о баге, я бы не обновлял игру."],["[Little did] Oleg [know] that his brother [had hidden] the remote.","Олег и не подозревал, что брат спрятал пульт."],["You'll lose your progress [unless] you [save] it.","Ты потеряешь прогресс, если не сохранишь его."],["The new map is said [to have been designed] by fans.","Говорят, что новую карту создали фанаты."],["He [can't have seen] the message — his phone [had died] by then.","Он не мог видеть сообщение — его телефон к тому времени разрядился."]],"quiz":[["I ___ at this school since 2020.",["study","have studied","studied"],1,"since + период до сейчас — Present Perfect."],["When I arrived, the stream ___ already ended.",["has","had","was"],1,"Закончился раньше моего прихода — Past Perfect."],["I'll call you as soon as I ___ home.",["got","get","will get"],1,"После as soon as — Present Simple вместо будущего."],["Not until I read the rules ___ my mistake.",["did I see","I saw","saw I"],0,"Not until … did + подлежащее + глагол."],["She accused me ___ her password.",["for stealing","to steal","of stealing"],2,"accuse sb of + -ing."],["This castle is believed ___ in the 15th century.",["to have built","to be built","to have been built"],2,"Пассив о прошлом — to have been + V3."],["He ___ have finished already — he only started five minutes ago.",["needn't","mustn't","can't"],2,"Невозможно — can't have + V3."],["There's ___ juice left — can you buy more?",["hardly any","plenty of","a few"],0,"Почти нет — hardly any; juice неисчисляемое."],["The more you read, ___ your vocabulary becomes.",["the richer","the richest","richer"],0,"the + сравнительная, the + сравнительная."],["___ you need more time, ask the examiner.",["Were","Had","Should"],2,"Инверсия первого типа — Should you…"],["I regret ___ to her — she was really upset.",["not to listen","not listening","to not listen"],1,"Сожаление о прошлом — regret (not) + -ing."],["He suggested ___ the trial test together.",["us to do","doing","to do"],1,"suggest + -ing."],["All I want ___ to pass the NMT with a high score.",["is","are","it is"],0,"All I want is…"],["___ by the noise, Oleg couldn't sleep.",["Having disturbed","Disturbing","Disturbed"],2,"Олегу мешал шум (пассив) — V3."]],"tr":[["Если бы я не опоздал, я бы увидел начало.","Had I not / If I hadn't",["Had I not been late, I would have seen the beginning","If I had not been late, I would have seen the beginning","Had I not been late, I would have seen the start","If I had not been late, I would have seen the start"]],["Говорят, что он выиграл турнир.","He is said to have won",["He is said to have won the tournament","It is said that he won the tournament","It is said that he has won the tournament","They say he won the tournament","They say that he won the tournament","People say that he won the tournament"]],["Я учу английский уже пять лет.","Present Perfect (Continuous)",["I have been learning English for five years","I have been studying English for five years","I have learnt English for five years","I have learned English for five years","I have studied English for five years","I have been learning English for 5 years"]],["Он отрицал, что взял мой телефон.","deny + -ing",["He denied taking my phone","He denied having taken my phone","He denied that he had taken my phone","He denied that he took my phone"]]]},{"t":"Словообразование C1: существительные (-ance, -ship, -hood, -al, -ure, -th)","l":"C1","rule":"В НМТ часто нужно превратить глагол или прилагательное в существительное. Полезные суффиксы: -ance/-ence (perform → performance, patient → patience), -ship (friend → friendship, leader → leadership), -hood (child → childhood), -al (arrive → arrival, refuse → refusal), -ure (fail → failure, please → pleasure), -age (store → storage). Запомни слова с изменением корня: long → length, strong → strength, deep → depth, high → height, proud → pride. Типичные ошибки: *arrivement, *failness, *performation, *deepness вместо depth.","ex":[["Our team's [performance] in the final was amazing.","Выступление нашей команды в финале было потрясающим."],["Minecraft brings back memories of my [childhood].","Minecraft напоминает мне о детстве."],["The [arrival] of the new update made the servers slow.","Выход нового обновления замедлил серверы."],["Real [friendship] means helping each other before the NMT.","Настоящая дружба — это помогать друг другу перед НМТ."],["The [strength] of the last Cuphead boss surprised everyone.","Сила последнего босса в Cuphead всех удивила."]],"quiz":[["Everyone was waiting for the ___ of the new phone in the shops.",["arriving","arrival","arrivement"],1,"arrive → arrival (-al). *Arrivement не существует."],["Failing one test is not a ___ — it's a lesson.",["failure","failness","fail"],0,"fail → failure (-ure). Нужно существительное после a."],["Esports players need great ___ to stay calm in the final.",["patience","patient","patiency"],0,"patient → patience (-ence)."],["Oleg loves stories about my ___ in the village.",["childness","childship","childhood"],2,"child → childhood — детство (-hood)."],["The team captain showed real ___ during the tournament.",["leadership","leadhood","leaderness"],0,"leader → leadership (-ship) — лидерство."],["We need more cloud ___ for all our game videos.",["storement","storage","storance"],1,"store → storage (-age) — хранилище."],["Her ___ to help us was a big surprise.",["refuse","refusal","refusement"],1,"refuse → refusal (-al) — отказ."],["What's the ___ of the bridge in the game? It looks huge.",["longness","length","long"],1,"long → length — корень меняется."],["Playing with friends gives me a lot of ___.",["pleased","pleasement","pleasure"],2,"please → pleasure (-ure) — удовольствие."],["The ___ of the lake is about ten metres.",["depth","deepth","deep"],0,"deep → depth: «ee» превращается в «e»."],["Earning his own money gave Ilya more ___ from his parents.",["independent","independently","independence"],2,"После more + from нужно существительное: independence."],["What's the ___ of the tallest building on the GTA map?",["highness","height","high"],1,"high → height — высота."],["There's a big ___ between our scores this time.",["differ","different","difference"],2,"После a big нужно существительное: difference."],["Igor felt great ___ when he passed the mock test.",["pride","proud","proudly"],0,"proud → pride — гордость."]],"tr":[["Его выступление на турнире было лучшим.","performance",["His performance at the tournament was the best","His performance in the tournament was the best","His performance at the tournament was the best one"]],["Дружба важнее победы.","friendship",["Friendship is more important than winning","Friendship is more important than victory","Friendship is more important than a victory"]],["Неудача — это часть обучения.","failure",["Failure is part of learning","Failure is a part of learning","Failure is part of studying","A failure is part of learning"]],["Какая длина этой трассы?","length",["What is the length of this track","What is the length of this road","What is the length of this route","How long is this track"]]]},{"t":"Словообразование C1: прилагательные, наречия и приставки mis-, over-, under-, re-, out-","l":"C1","rule":"Прилагательные образуются суффиксами -ive (create → creative), -ous (danger → dangerous), -able/-ible (rely → reliable, response → responsible), -ic (energy → energetic), -al (history → historical). Наречие = прилагательное + -ly (careful → carefully), а после -ic — -ally (basic → basically). Приставки меняют смысл: mis- (неправильно: misunderstand), over- (слишком: overestimate), under- (недо-: underestimate), re- (снова: rewrite), out- (превзойти: outplay). Всегда проверяй смысл предложения: если он отрицательный, нужна приставка (unreliable, irresponsible). Типичные ошибки: *basicly, *responsable.","ex":[["Minecraft is a really [creative] game.","Minecraft — по-настоящему творческая игра."],["This old laptop is not very [reliable].","Этот старый ноутбук не очень надёжный."],["Cuphead is [incredibly] hard but [visually] beautiful.","Cuphead невероятно сложная, но визуально красивая."],["Don't [underestimate] Oleg — he's a fast learner.","Не недооценивай Олега — он быстро учится."],["Our team [outplayed] the favourites in the final.","Наша команда переиграла фаворитов в финале."]],"quiz":[["Oleg is very ___ — he draws his own Minecraft skins.",["creatively","creative","creation"],1,"После very и be — прилагательное: creative."],["Driving too fast on the city map is ___ — you crash all the time.",["danger","dangerous","dangerously"],1,"После is — прилагательное: dangerous (-ous)."],["My brother is too young to be ___ for the house keys.",["responsibility","responsibly","responsible"],2,"be responsible for — отвечать за. Пишется -ible."],["___, the game is about building and surviving.",["Basically","Basic","Basicly"],0,"basic → basically (после -ic добавляем -ally)."],["This router is ___ — the internet keeps disconnecting.",["reliable","unreliable","reliability"],1,"Смысл отрицательный (интернет всё время отключается) → unreliable."],["Sorry, I ___ the question and gave the wrong answer.",["overunderstood","misunderstood","ununderstood"],1,"mis- = неправильно: misunderstand."],["Don't ___ the final boss — he's much stronger than he looks.",["underestimate","reestimate","overestimate"],0,"Он сильнее, чем кажется → не недооценивай: underestimate."],["The streamer reacted very ___ when he won.",["emotional","emotionally","emotion"],1,"Описывает глагол reacted → наречие emotionally."],["The new graphics look ___ realistic.",["incredibly","incredulous","incredible"],0,"Перед прилагательным realistic — наречие incredibly."],["Our teacher asked us to ___ the essay because it was too short.",["miswrite","rewrite","outwrite"],1,"re- = снова: rewrite — переписать."],["The team trained hard and ___ their rivals in every round.",["misplayed","outplayed","overplayed"],1,"out- = превзойти: outplay — переиграть."],["The museum has a lot of ___ documents about our city.",["history","historical","historically"],1,"Перед существительным — прилагательное: historical."],["Grandma is still very ___ — she walks five kilometres a day.",["energy","energetic","energetically"],1,"energy → energetic (-ic) — энергичный."],["Igor answered the questions ___ and got 195 points.",["confidence","confidently","confident"],1,"Описывает глагол answered → наречие confidently."]],"tr":[["Эта игра очень творческая.","creative",["This game is very creative","The game is very creative","This game is really creative"]],["Никогда не недооценивай своего младшего брата.","underestimate",["Never underestimate your younger brother","Never underestimate your little brother","Do not underestimate your younger brother","Do not underestimate your little brother"]],["Я неправильно понял задание.","misunderstand",["I misunderstood the task","I misunderstood the assignment","I misunderstood the exercise","I have misunderstood the task"]],["Графика невероятно красивая.","incredibly",["The graphics are incredibly beautiful","The graphics is incredibly beautiful","The graphics look incredibly beautiful","Graphics are incredibly beautiful"]]]},{"t":"Коллокации: pay, catch, have, take, keep, break","l":"B2","rule":"Многие слова работают только в паре с определённым глаголом — это коллокации, и в НМТ их часто проверяют. Запомни пары: pay — attention, a visit, a compliment; catch — a cold, a bus, someone's attention; have — a go, fun, a look; take — part in, place, a break, a risk, advantage of; keep — a promise, a secret, calm, in touch; break — a record, a promise, the rules. Типичные ошибки русскоязычных: *make attention (pay attention), *do a photo (take a photo), *make a break (take/have a break), *give a visit (pay a visit).","ex":[["Please [pay attention] to the timer in this level.","Пожалуйста, обращай внимание на таймер на этом уровне."],["Oleg [caught a cold] after playing in the snow.","Олег простудился после игры в снегу."],["The tournament will [take place] next Saturday.","Турнир пройдёт в следующую субботу."],["Can you [keep a secret]? I've found a hidden room in Minecraft.","Умеешь хранить секреты? Я нашёл тайную комнату в Minecraft."],["This speedrunner has just [broken the world record].","Этот спидраннер только что побил мировой рекорд."]],"quiz":[["Igor always ___ attention in English lessons.",["pays","does","makes"],0,"pay attention — обращать внимание."],["Hurry up or we won't ___ the last bus!",["pay","catch","keep"],1,"catch a bus — успеть на автобус."],["The final of ompetition will take place on Friday","The contest will take place on Friday","The competition takes place on Friday","The competition is going to take place on Friday","The tournament will take place on Friday"]]]},{"t":"Предлоги после существительных: reason for, solution to, increase in","l":"B2","rule":"После многих существительных нужен определённый предлог, и часто он не совпадает с русским. reason for (причина), но cause of; solution to / answer to / key to (решение — to, а не of!); increase / rise / decrease / fall in (рост чего-то — in); effect / influence / impact on; interest in; damage to; demand for; difference between; attitude to/towards; advantage of. Типичные ошибки: *solution of the problem, *reason of, *increase of the number, *influence to.","ex":[["What's the [reason for] the server crash?","Какая причина падения сервера?"],["I finally found the [solution to] this puzzle level.","Я наконец нашёл решение этого уровня-головоломки."],["There has been an [increase in] the number of players.","Количество игроков выросло."],["Video games can have a positive [effect on] reaction speed.","Видеоигры могут положительно влиять на скорость реакции."],["What's the [difference between] these two consoles?","Какая разница между этими двумя консолями?"]],"quiz":[["There's no easy solution ___ this maths problem.",["to","of","for"],0,"solution to — решение задачи."],["What was the reason ___ your absence yesterday?",["to","of","for"],2,"reason for — причина чего-то."],["There was a sharp increase ___ the number of streamers last year.",["at","in","of"],1,"increase in something — рост чего-то."],["Too much screen time can have a bad effect ___ your sleep.",["on","to","at"],0,"effect on — влияние на."],["Igor has a real interest ___ game design.",["for","to","in"],2,"interest in — интерес к."],["The storm caused serious damage ___ the school roof.",["on","to","at"],1,"damage to — ущерб чему-то."],["What's the difference ___ Minecraft Java and Bedrock?",["from","among","between"],2,"difference between A and B."],["There's a huge demand ___ cheap gaming laptops.",["for","on","of"],0,"demand for — спрос на."],["One advantage ___ online lessons is that you can stay at home.",["of","at","in"],0,"advantage of something — преимущество чего-то."],["His attitude ___ homework has changed this year.",["for","about","towards"],2,"attitude to/towards — отношение к."],["Do you know the answer ___ question 5?",["of","on","to"],2,"answer to a question."],["A bad internet connection was the main cause ___ our defeat.",["of","to","for"],0,"cause of (но reason for!)."],["There was a sudden fall ___ temperature last night.",["on","of","in"],2,"fall in — падение чего-то."],["The coach has a great influence ___ young players.",["at","to","on"],2,"influence on — влияние на."]],"tr":[["Какая причина этой ошибки?","reason for / cause of",["What is the reason for this mistake","What is the reason for this error","What is the cause of this mistake","What is the cause of this error"]],["Я нашёл решение этой проблемы.","solution to",["I found the solution to this problem","I have found the solution to this problem","I found a solution to this problem","I have found a solution to this problem"]],["Игры влияют на наше настроение.","have an effect on",["Games have an effect on our mood","Games have an influence on our mood","Games have an impact on our mood","Video games have an effect on our mood","Games affect our mood"]],["Был большой рост количества игроков.","increase in",["There was a big increase in the number of players","There was a huge increase in the number of players","There has been a big increase in the number of players","There was a large increase in the number of players"]]]},{"t":"Слова-путаницы 1: lose/loose, affect/effect, rise/raise, lie/lay","l":"B2","rule":"lose (lost, lost) — терять или проигрывать, а loose — свободный, болтающийся. affect — глагол «влиять» (It affects me), effect — существительное «эффект, влияние» (It has an effect on me). rise (rose, risen) — подниматься самому, без дополнения (Prices rise), raise (raised) — поднимать что-то (raise your hand, raise money). lie (lay, lain) — лежать, lay (laid, laid) — класть что-то (lay the table). Ловушка: lay — это ещё и прошедшее время от lie: Yesterday I lay on the sofa.","ex":[["If you [lose] this match, you'll drop to silver rank.","Если проиграешь этот матч, опустишься в серебряный ранг."],["My jeans are too [loose] — I need a belt.","Мои джинсы слишком свободные — нужен ремень."],["Music [affects] my mood — it has a big [effect] on me.","Музыка влияет на моё настроение — она сильно на меня действует."],["The number of players [rose] after the developers [raised] the prize money.","Число игроков выросло после того, как разработчики увеличили призовые."],["I [lay] on the bed while Mum [laid] the table.","Я лежал на кровати, пока мама накрывала на стол."]],"quiz":[["Don't ___ your password — write it somewhere safe.",["lost","lose","loose"],1,"lose — терять (глагол). loose — прилагательное."],["This screw is ___; the controller might fall apart.",["lose","lost","loose"],2,"loose — расшатанный, свободный."],["Noise in the room can ___ your concentration.",["affect","effect","effective"],0,"После can нужен глагол: affect."],["The update had a strange ___ on the game's speed.",["effect","affect","affection"],0,"После a strange нужно существительное: effect."],["In winter the sun ___ at about 7 a.m.",["rises","rose up","raises"],0,"Солнце поднимается само, без дополнения → rises."],["The school wants to ___ money for new computers.",["rise","arise","raise"],2,"raise money — собирать деньги (поднимать что-то)."],["Please ___ your phone on the desk before the test.",["lain","lie","lay"],2,"Класть что-то → lay."],["I'm tired — I'm going to ___ down for half an hour.",["lie","laid","lay"],0,"lie down — прилечь (без дополнения)."],["Yesterday Oleg ___ on the carpet and watched cartoons.",["laid","lay","lied"],1,"Прошедшее от lie (лежать) — lay. Lied — «врал»."],["The hen has ___ three eggs this morning.",["laid","lay","lain"],0,"lay eggs — нести яйца; V3 от lay — laid."],["Our team ___ the final 2–3.",["loosed","lost","loose"],1,"lose → lost (проиграли)."],["The number of players has ___ by 40% since the update.",["rose","risen","raised"],1,"Число растёт само: rise → risen (V3 после has)."],["If you have a question, ___ your hand.",["rise","raise","arise"],1,"Поднять руку — raise your hand."],["Climate change ___ millions of people.",["is effect","effects","affects"],2,"Нужен глагол «влияет» → affects."]],"tr":[["Не теряй время!","lose",["Do not lose time","Do not lose your time","Don't lose time"]],["Стресс влияет на сон.","affect / have an effect on",["Stress affects sleep","Stress affects your sleep","Stress affects our sleep","Stress has an effect on sleep","Stress has an effect on our sleep"]],["Подними руку, если ты готов.","raise",["Raise your hand if you are ready","Put up your hand if you are ready","Put your hand up if you are ready"]],["Вчера я весь день лежал в кровати.","lie — lay",["Yesterday I lay in bed all day","I lay in bed all day yesterday","Yesterday I was lying in bed all day","I was lying in bed all day yesterday","Yesterday I lay in bed the whole day","I lay in bed the whole day yesterday"]]]},{"t":"Слова-путаницы 2: borrow/lend, economic/economical, sensible/sensitive, actually","l":"B2","rule":"borrow — брать на время (borrow something FROM someone), lend — давать на время (lend something TO someone / lend me something). economic — экономический (связанный с экономикой страны), economical — экономный (тратит мало). sensible — разумный, sensitive — чувствительный, ранимый; actually — «на самом деле» (а не «актуально»), currently — «сейчас», especially — «особенно». Типичная ошибка: *Can you borrow me your charger? → Can you lend me your charger? / Can I borrow your charger?","ex":[["Can I [borrow] your charger?","Можно взять твой зарядник?"],["Could you [lend] me 50 hryvnias until ive","sensible","sensibly"],1,"Неразумно → not sensible."]],"tr":[["Можно взять у тебя ручку?","borrow",["Can I borrow your pen","Could I borrow your pen","May I borrow your pen"]],["Одолжи мне свой зарядник, пожалуйста.","lend me",["Lend me your charger please","Please lend me your charger","Could you lend me your charger please","Can you lend me your charger please"]],["Это разумное решение.","sensible",["It is a sensible decision","This is a sensible decision","That is a sensible decision","It is a sensible solution","This is a sensible solution"]],["На самом деле я не устал.","actually",["Actually I am not tired","I am actually not tired","In fact I am not tired"]]]},{"t":"Фразовые глаголы: учёба и игры","l":"B2","rule":"Фразовые глаголы для школы: hand in (сдать работу), catch up with (догнать), fall behind (отстать), figure out (разобраться), look up (найти в словаре), brush up on (освежить знания), fill in (заполнить). Для игр и компьютера: log in/out, level up, team up with (объединиться), run out of (закончиться), give up (сдаться), back up (сделать копию), set up (настроить). Если дополнение — местоимение, оно стоит в середине: look it up, hand it in (не *look up it). Трёхсловные глаголы не разделяются: catch up with, run out of, brush up on.","ex":[["Please [hand in] your essays by Friday.","Пожалуйста, сдайте эссе до пятницы."],["I was ill for a week, and now I need to [catch up with] my class.","Я болел неделю, и теперь мне нужно догнать класс."],["I couldn't [figure out] how to beat the last Cuphead boss.","Я не мог разобраться, как победить последнего босса в Cuphead."],["Let's [team up] with Ilya for the Minecraft build contest.","Давай объединимся с Максом для конкурса построек в Minecraft."],["Always [back up] your saves before an update.","Всегда делай копию сохранений перед обновлением."]],"quiz":[["If you don't know the word, look it ___ in the dictionary.",["out","after","up"],2,"look up — найти (в словаре); местоимение it в середине."],["I missed two weeks of school and fell ___.",["back","behind","down"],1,"fall behind — отстать."],["We've run ___ of time — let's finish the level tomorrow.",["away","off","out"],2,"run out of — закончиться."],["Don't ___ up! You're almost at the end of the level.",["give","make","take"],0,"give up — сдаваться."],["I need to brush up ___ my grammar before the NMT.",["with","for","on"],2,"brush up on — освежить знания."],["Did you hand ___ your homework yesterday?",["in","away","off"],0,"hand in — сдать работу."],["It took me an hour to figure ___ how the redstone circuit works.",["in","up","out"],2,"figure out — разобраться."],["My character ___ after I completed ten quests.",["levelled out","levelled down","levelled up"],2,"level up — повысить уровень."],["Can you help me set ___ my new gaming mouse?",["off","on","up"],2,"set up — настроить."],["Igor runs so fast — I can't catch up ___ him.",["with","to","on"],0,"catch up with someone — догнать кого-то."],["Remember to log ___ when you use the school computer.",["out","away","down"],0,"log out — выйти из аккаунта."],["Let's team ___ with the guys from 10-B.",["in","on","up"],2,"team up with — объединиться."],["Always back ___ your files to the cloud.",["down","up","off"],1,"back up — сделать резервную копию."],["The teacher told us to ___ in the missing words.",["do","make","fill"],2,"fill in — вписать, заполнить."]],"tr":[["Сдай свою работу до пятницы.","hand in",["Hand in your work by Friday","Hand your work in by Friday","Hand in your work before Friday","Hand your work in before Friday","Hand in your paper by Friday"]],["Я не могу разобраться в этой задаче.","figure out",["I cannot figure out this problem","I cannot figure this problem out","I cannot figure out this task","I cannot figure this task out","I can't figure out this problem"]],["Не сдавайся!","give up",["Do not give up","Never give up","Don't give up"]],["У нас закончилось время.","run out of",["We have run out of time","We ran out of time","We've run out of time"]]]},{"t":"Идиомы для подростков: piece of cake, hit the books, call it a day","l":"C1","rule":"Идиомы нельзя переводить слово в слово — их значение нужно просто запомнить. piece of cake — очень легко; hit the books — засесть за учёбу; break the ice — растопить лёд в общении; on the same page — думать одинаково; get the hang of — наловчиться; a game changer — то, что всё меняет; cost an arm and a leg — стоить очень дорого; under the weather — неважно себя чувствовать; call it a day — на сегодня хватит; once in a blue moon — очень редко; spill the beans — выдать секрет. Главная ошибка — менять слова: *piece of pie, *hit the book, *once in a blue sky.","ex":[["The first night in Minecraft survival is a [piece of cake].","Первая ночь в выживании Minecraft — проще простого."],["The NMT is in a month, so it's time to [hit the books].","До НМТ месяц, так что пора засесть за учебники."],["The new graphics card is a real [game changer].","Новая видеокарта — это то, что меняет всё."],["It took me a week to [get the hang of] Cuphead's parry move.","У меня ушла неделя, чтобы наловчиться делать парирование в Cuphead."],["We've been coding for six hours — let's [call it a day].","Мы программируем шесть часов — на сегодня хватит."]],"quiz":[["The test was a piece of ___ — I finished in 15 minutes.",["bread","cake","pie"],1,"a piece of cake — очень легко."],["This new laptop costs an arm and a ___.",["leg","foot","hand"],0,"cost an arm and a leg — стоить целое состояние."],["I'm feeling a bit under the ___, so I'll stay at home.",["sky","weather","rain"],1,"under the weather — неважно себя чувствовать."],["Exams are next week, so I really need to hit the ___.",["desk","books","notes"],1,"hit the books — засесть за учёбу."],["Ilya told a funny joke to break the ___ on the first day.",["silence","ice","wall"],1,"break the ice — разрядить обстановку."],["We go to the cinema once in a blue ___.",["moon","sky","sun"],0,"once in a blue moon — очень редко."],["Let's call it a ___ — we can finish the map tomorrow.",["stop","day","time"],1,"call it a day — закончить на сегодня."],["I've made my offer; now the ball is in your ___.",["hands","court","field"],1,"the ball is in your court — теперь решать тебе."],["After a week of practice, I got the ___ of driving in GTA.",["hand","catch","hang"],2,"get the hang of — наловчиться."],["Before we start the project, let's make sure we're all on the same ___.",["page","side","line"],0,"on the same page — понимать друг друга, думать одинаково."],["Cloud saving was a real game ___ for console players.",["maker","changer","winner"],1,"a game changer — то, что всё меняет."],["Igor was over the ___ when he got 195 points.",["top","moon","sky"],1,"over the moon — на седьмом небе. Over the top — «чересчур»."],["I'm all ___ — tell me what happened!",["hands","eyes","ears"],2,"I'm all ears — я весь внимание."],["Don't spill the ___ — the new map is a secret!",["milk","peas","beans"],2,"spill the beans — выдать секрет."]],"tr":[["Этот тест был проще простого.","piece of cake",["This test was a piece of cake","The test was a piece of cake"]],["Мне нужно засесть за учебники.","hit the books",["I need to hit the books","I have to hit the books","I must hit the books"]],["Этот телефон стоит целое состояние.","cost an arm and a leg",["This phone costs an arm and a leg","The phone costs an arm and a leg"]],["Я сегодня неважно себя чувствую.","under the weather",["I am feeling under the weather today","I feel under the weather today","Today I feel under the weather","Today I am feeling under the weather","I am under the weather today"]]]},{"t":"Геймерская лексика в контексте: release, patch, glitch, beat a game","l":"B2","rule":"Многие игровые слова пришли в русский из английского, но в английском у них точное употребление. release / come out (выйти), patch / update (обновление), bug / glitch (ошибка, глюк), lag (задержка — неисчисляемое: a lot of lag), respawn (возродиться), checkpoint, open world, side quest, speed n you [send] me a [screenshot] of the error?","Можешь прислать мне скриншот ошибки?"],["All my photos are stored in the [cloud].","Все мои фото хранятся в облаке."]],"quiz":[["I found the answer ___ the internet.",["at","in","on"],2,"on the internet — в интернете."],["First you need to ___ for a free account.",["sign up","log in","log out"],0,"sign up for an account — зарегистрироваться."],["I ___ my gameplay video to YouTube yesterday.",["downloaded","uploaded","unloaded"],1,"Загрузить в сеть → upload."],["This ___ is very expensive.",["software","softwares","a software"],0,"software — неисчисляемое."],["Could you give me some ___ about the course?",["informations","information","an information"],1,"information — неисчисляемое."],["My phone is dying — where's my ___?",["charge","charging","charger"],2,"charger — зарядное устройство."],["Don't forget to ___ your password every few months.",["exchange","chance","change"],2,"change a password — сменить пароль."],["The app keeps crashing — try to ___ it and install it again.",["deinstall","uninstall","disinstall"],1,"uninstall — удалить программу."],["I'm ___ now — text me.",["in line","on line","online"],2,"online — в сети."],["I sent the essay as an ___ to the email.",["attachment","attach","attaching"],0,"attachment — вложение."],["My parents limit my ___ time to two hours a day.",["monitor","display","screen"],2,"screen time — время за экраном."],["The ___ is stored on secure servers.",["a data","datas","data"],2,"data — неисчисляемое, без -s и a."],["Never ___ your password with anyone.",["share","split","divide"],0,"share something with someone — делиться."],["Click on the gear icon to open the ___.",["sets","settings","setters"],1,"settings — настройки."]],"tr":[["Я скачал новую версию игры.","download",["I downloaded the new version of the game","I have downloaded the new version of the game","I downloaded a new version of the game","I have downloaded a new version of the game"]],["Зарегистрируйся на сайте.","sign up",["Sign up on the website","Sign up on the site","Register on the website","Register on the site","Sign up for the website"]],["Я нашёл это в интернете.","on the internet",["I found it on the internet","I found this on the internet","I found it online","I found this online"]],["Пришли мне скриншот.","send",["Send me a screenshot","Send me the screenshot","Please send me a screenshot"]]]},{"t":"Мнение, согласие и несогласие: In my view, I couldn't agree more","l":"B2","rule":"Выразить мнение: In my opinion, … / In my view, … / Personally, I think… / As far as I'm concerned, … (не *According to me!). Согласие: I totally agree with you / That's a good point / I couldn't agree more (= полностью согласен). Вежливое несогласие: I see your point, but… / I'm not sure about that / I'm afraid I disagree. agree — это глагол, поэтому *I am agree и *I am not agree — грубые ошибки: I agree / I don't agree / I disagree. Предлоги: agree WITH a person, agree TO do something.","ex":[["[In my opinion], Minecraft is the best game for creativity.","По-моему, Minecraft — лучшая игра для творчества."],["[I couldn't agree more] — online lessons are tiring.","Полностью согласен — онлайн-уроки утомляют."],["[I see your point, but] esports is still a real sport.","Я понимаю твою точку зрения, но киберспорт — это всё же настоящий спорт."],["[As far as I'm concerned], homework should be shorter.","Как по мне, домашка должна быть короче."],["I [totally agree with] you about the new update.","Я полностью согласен с тобой насчёт нового обновления."]],"quiz":[["I ___ with you — the game is too expensive.",["am agree","agree","agreeing"],1,"agree — глагол, без am."],["___, Cuphead is harder than any other game.",["In my opinion","On my opinion","According to me"],0,"In my opinion. *According to me — ошибка."],["I ___ — I think esports is a real sport.",["am disagree","not agree","disagree"],2,"I disagree / I don't agree."],["I couldn't agree ___! Homework at weekends is a bad idea.",["more","
