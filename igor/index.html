<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Английский для Игоря</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fffaf2; --card: #ffffff; --fg: #1d1b26; --muted: #6b6878; --line: #ece4d6;
  --accent: #2563eb; --accent-soft: #e0e9ff; --accent-fg: #ffffff;
  --ok: #1f9d55; --ok-soft: #e3f6ea; --bad: #d64545; --bad-soft: #fde8e8; --star: #f5a524; --hl: #fff1c2;
  --f: "Nunito", system-ui, sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15141b; --card: #1f1e27; --fg: #f1eff7; --muted: #a29fb3; --line: #33313f;
  --accent-soft: #172446; --ok: #4cc77f; --ok-soft: #173326; --bad: #f07070; --bad-soft: #3a1d1d; --hl: #3b3417; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15141b; --card: #1f1e27; --fg: #f1eff7; --muted: #a29fb3; --line: #33313f;
  --accent-soft: #172446; --ok: #4cc77f; --ok-soft: #173326; --bad: #f07070; --bad-soft: #3a1d1d; --hl: #3b3417; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.top b { font-size: 1.1rem; font-weight: 900; }
.stars { font-weight: 800; color: var(--star); white-space: nowrap; }
h1 { font-size: 1.7rem; font-weight: 900; margin: 18px 0 4px; line-height: 1.2; }
h2 { font-size: 1.2rem; font-weight: 800; margin: 26px 0 10px; display: flex; gap: 8px; align-items: center; }
.muted { color: var(--muted); } .small { font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.rule { background: var(--accent-soft); border: 0; }
.rule b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
.exl { display: grid; gap: 8px; margin-top: 10px; }
.exl > div { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: start; }
.exl .tr, .tr { color: var(--muted); font-size: .92rem; }
mark { background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 800; }
button { font: inherit; cursor: pointer; }
.say { border: 0; background: var(--accent-soft); color: var(--accent); width: 36px; height: 36px; border-radius: 50%; font-size: 1rem; flex: none; }
.btn { border: 0; background: var(--accent); color: var(--accent-fg); padding: 12px 20px; border-radius: 14px; font-weight: 800; font-size: 1rem; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.grid-w { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.wcard { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 14px 10px; }
.wcard .emo { font-size: 2.4rem; line-height: 1; min-height: 1em; }
.wcard .en { font-weight: 900; font-size: 1.15rem; }
.wcard .ex { font-size: .85rem; color: var(--muted); }
.q { display: grid; gap: 10px; }
.q-text { font-weight: 700; font-size: 1.05rem; }
.gap { display: inline-block; min-width: 3em; border-bottom: 3px solid var(--accent); text-align: center; color: var(--accent); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button, .chip { border: 2px solid var(--line); background: var(--card); color: var(--fg); padding: 9px 16px; border-radius: 99px; font-weight: 700; }
.opts button:hover:not(:disabled), .chip:hover { border-color: var(--accent); }
.right { background: var(--ok-soft) !important; border-color: var(--ok) !important; color: var(--ok) !important; }
.wrong { background: var(--bad-soft) !important; border-color: var(--bad) !important; color: var(--bad) !important; }
.expl { font-size: .9rem; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match .col { display: grid; gap: 8px; align-content: start; }
.match button { border: 2px solid var(--line); background: var(--card); color: var(--fg); padding: 10px; border-radius: 12px; font-weight: 700; min-height: 48px; }
.match button.sel { border-color: var(--accent); background: var(--accent-soft); }
.match button.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); opacity: .7; }
.match button.shake { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.build-line { min-height: 52px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.build-pool { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.used { visibility: hidden; }
textarea { font: inherit; width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); color: var(--fg); resize: vertical; }
textarea.ok { border-color: var(--ok); background: var(--ok-soft); }
.res { padding: 10px 12px; border-radius: 12px; background: var(--bg); display: grid; gap: 4px; }
.read-text { font-size: 1.08rem; line-height: 1.75; }
.gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 2px 14px; font-size: .92rem; }
.gloss span { color: var(--muted); }
.cloze-text { font-size: 1.05rem; line-height: 1.8; }
.cloze-text .gp { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--accent); text-align: center; font-weight: 800; color: var(--accent); }
.weeks { display: grid; gap: 10px; max-height: 360px; overflow: auto; }
.wk-h { font-weight: 800; } .wk-h span { color: var(--muted); font-weight: 600; font-size: .9rem; }
.days { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.days button { min-width: 50px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--fg); font-weight: 800; }
.days button.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.days button[aria-pressed="true"] { border-color: var(--accent); }
.progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.hero { display: grid; gap: 10px; margin-top: 14px; }
.finish { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 22px 16px; }
.finish .big { font-size: 3rem; }
details summary { cursor: pointer; font-weight: 800; }
.tiny-say { display: inline-flex; vertical-align: middle; }
@media (max-width: 420px) { h1 { font-size: 1.45rem; } .grid-w { grid-template-columns: repeat(2, 1fr); } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="top"><div class="top-in"><b>🚀 English · Игорь</b><span class="stars" id="stars">⭐ 0</span></div></div>
<main class="wrap">
  <div class="hero">
    <h1 id="hello"></h1>
    <p class="muted" id="sub"></p>
    <div class="progress" aria-hidden="true"><i id="pbar" style="width:0%"></i></div>
    <p class="small muted" id="ptext"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ghost" id="report">📤 Отчёт для мамы</button><button type="button" class="btn ghost" id="th-open">📘 Теория: времена</button><button type="button" class="btn ghost" id="tn-open">⏱ Какое это время?</button><button type="button" class="btn ghost" id="st-open">📖 Истории про нас</button></div>
    <div id="th" class="stack" hidden></div>
    <div id="tn" class="stack" hidden></div>
    <div id="st" class="stack" hidden></div>
    <details class="card"><summary>Все уроки по неделям</summary><div class="weeks" id="weeks"></div></details>
  </div>
  <div id="lesson"></div>
</main>
<script>
const DATA = {"topics":[{"t":"to be и have got: повторение","l":"A2","rule":"Глагол to be: I am, he/she/it is, we/you/they are; отрицание — am not / isn't / aren't, вопрос — Is he…? Are you…? Have got = «у меня есть»: I/you/we/they have got, he/she/it has got. Отрицание: haven't got / hasn't got, вопрос: Have you got…? Has she got…?","ex":[["My brother Oleg [is] ten years old.","Моему брату Олегу десять лет."],["We [are] in the same class at the lyceum.","Мы в одном классе в лицее."],["I [have got] a new laptop.","У меня есть новый ноутбук."],["[Has] your friend [got] a PlayStation?","У твоего друга есть PlayStation?"],["I [am not] hungry, thanks.","Я не голоден, спасибо."]],"quiz":[["My maths teacher ___ very strict.",["is","are","am"],0,"Teacher — он/она (3-е лицо ед. ч.), значит is."],["Oleg and I ___ brothers.",["is","am","are"],2,"Oleg and I = we, поэтому are."],["I ___ fourteen years old.",["is","am","are"],1,"С I всегда используется am."],["___ you ready for the test?",["Are","Is","Am"],0,"С you используется are, в вопросе он стоит первым."],["My friend ___ got a new bike.",["have","has","is"],1,"He/she + has got."],["We ___ got physics on Monday.",["has","are","have"],2,"We + have got."],["___ your sister got a phone?",["Has","Have","Is"],0,"Вопрос с she: Has she got…?"],["Kharkiv ___ a big city in Ukraine.",["are","is","am"],1,"Kharkiv = it, поэтому is."],["They ___ at home now. They are at school.",["isn't","aren't","not"],1,"They + are not = aren't."],["I haven't got a dog, but I ___ got a cat.",["has","am","have"],2,"I + have got."],["___ it cold outside today?",["Is","Are","Has"],0,"Погода: it is cold, в вопросе Is it…?"],["Oleg ___ got any homework today.",["haven't","hasn't","isn't"],1,"Отрицание с he: hasn't got."],["Where ___ my headphones?",["is","are","am"],1,"Headphones — множественное число, поэтому are."],["Have you got a calculator? — Yes, I ___.",["have","am","got"],0,"Краткий ответ на Have you got…? — Yes, I have."]],"tr":[["У меня есть младший брат.","have got / have",["I have got a younger brother","I have a younger brother","I have got a little brother","I have a little brother"]],["Мой друг не дома.","is not",["My friend is not at home","My friend is not home"]],["У тебя есть зарядка?","Have you got…? / Do you have…?",["Have you got a charger","Do you have a charger"]],["Наш учитель физики очень добрый.","is",["Our physics teacher is very kind","Our physics teacher is very nice"]]]},{"t":"Present Simple: привычки и факты","l":"A2","rule":"Present Simple — привычки, расписания и факты. Формула: I/you/we/they + V; he/she/it + V-s/-es (plays, watches, goes). Отрицание: don't / doesn't + V; вопрос: Do / Does + подлежащее + V? После doesn't и does окончание -s не ставится. Сигналы: every day, usually, often, always, on Mondays.","ex":[["I [get up] at seven every day.","Я встаю в семь каждый день."],["Oleg [watches] cartoons after school.","Олег смотрит мультики после школы."],["My dad [doesn't drink] coffee.","Мой папа не пьёт кофе."],["[Do] you [play] football on Saturdays?","Ты играешь в футбол по субботам?"],["Water [boils] at 100 degrees.","Вода кипит при 100 градусах."]],"quiz":[["My brother ___ his teeth twice a day.",["brush","brushes","brushing"],1,"He + V-es: brushes."],["We ___ physics three times a week.",["have","has","having"],0,"We + have (без -s)."],["She ___ like horror films.",["don't","isn't","doesn't"],2,"Отрицание с she: doesn't + V."],["___ your dad work in Kharkiv?",["Do","Does","Is"],1,"Вопрос с he/she: Does + V."],["I ___ play chess. I prefer football.",["don't","doesn't","not"],0,"Отрицание с I: don't + V."],["The lesson ___ at 8:30.",["start","starts","is start"],1,"Lesson = it, поэтому starts."],["Oleg ___ to bed at nine o'clock.",["go","going","goes"],2,"He + goes (go → goes)."],["Where ___ you usually do your homework?",["do","does","are"],0,"Вопрос с you: do."],["My friends ___ YouTube videos every evening.",["watches","watch","watching"],1,"Friends = they, без окончания -s."],["The Earth ___ around the Sun.",["goes","go","going"],0,"Научный факт, it + goes."],["Does Max ___ English?",["speaks","speak","speaking"],1,"После does глагол без -s."],["My mum ___ breakfast for us every morning.",["make","making","makes"],2,"She + makes."],["Our teacher never ___ late.",["comes","come","coming"],0,"He/she + comes."],["What time ___ the bus leave?",["do","is","does"],2,"Bus = it, вопрос с does."]],"tr":[["Я играю в футбол по субботам.","Present Simple, on Saturdays",["I play football on Saturdays","On Saturdays I play football","I play soccer on Saturdays","On Saturdays I play soccer"]],["Олег не любит математику.","doesn't + V",["Oleg does not like maths","Oleg does not like math","Oleg does not like mathematics"]],["Ты часто смотришь YouTube?","Do you often…?",["Do you often watch YouTube","Do you watch YouTube often"]],["Моя мама работает в больнице.","she works",["My mum works in a hospital","My mom works in a hospital","My mother works in a hospital","My mum works at a hospital","My mom works at a hospital","My mother works at a hospital"]]]},{"t":"Present Continuous: что происходит сейчас","l":"A2","rule":"Present Continuous — действие происходит прямо сейчас или в текущий период. Формула: am / is / are + V-ing. Отрицание: am not / isn't / aren't + V-ing; вопрос: Are you + V-ing? Сигналы: now, right now, at the moment, Look!, Listen!, this week.","ex":[["I [am doing] my maths homework now.","Я сейчас делаю домашку по математике."],["Look! Oleg [is climbing] the tree.","Смотри! Олег лезет на дерево."],["We [are not playing] online at the moment.","Мы сейчас не играем онлайн."],["[Are] you [listening] to me?","Ты меня слушаешь?"],["This week our class [is preparing] for the olympiad.","На этой неделе наш класс готовится к олимпиаде."]],"quiz":[["Be quiet! The baby ___.",["sleeps","is sleeping","sleep"],1,"Be quiet! — действие сейчас: is sleeping."],["I ___ a new game right now.",["am downloading","download","downloads"],0,"Right now → am + V-ing."],["They ___ football at the moment.",["play","plays","are playing"],2,"At the moment → are playing."],["Look! It ___.",["is snowing","snows","snow"],0,"Look! → действие сейчас: is snowing."],["What ___ you doing now?",["do","are","is"],1,"You + are + V-ing."],["Oleg isn't ___ his homework. He is playing.",["do","does","doing"],2,"После isn't нужен V-ing."],["Listen! Somebody ___ the piano.",["is playing","plays","play"],0,"Listen! → is playing."],["My friends ___ waiting for me outside.",["is","are","am"],1,"Friends = they → are."],["___ she studying for the test now?",["Does","Do","Is"],2,"Вопрос в Present Continuous: Is she + V-ing?"],["We ___ not watching TV at the moment.",["are","do","is"],0,"We + are not + V-ing."],["I am ___ a message to my friend.",["writeing","writing","write"],1,"Write → writing (буква e выпадает)."],["The students ___ an experiment in the lab right now.",["doing","are doing","does"],1,"Right now → are + V-ing."],["Why ___ Oleg crying?",["are","does","is"],2,"Oleg = he → is crying."],["This month I ___ to swim.",["am learning","learn","learns"],0,"Текущий период (this month) → am learning."]],"tr":[["Я сейчас делаю домашнее задание.","am + V-ing",["I am doing my homework now","I am doing homework now","I am doing my homework right now","I am doing homework right now","Now I am doing my homework"]],["Олег сейчас спит.","is + V-ing",["Oleg is sleeping now","Oleg is sleeping right now","Now Oleg is sleeping","Oleg is asleep now"]],["Что ты сейчас делаешь?","What are you…?",["What are you doing now","What are you doing right now"]],["Мы сейчас не смотрим телевизор.","are not + V-ing",["We are not watching TV now","We are not watching TV right now","We are not watching TV at the moment","We are not watching television now"]]]},{"t":"Present Simple или Continuous? Глаголы состояния","l":"A2","rule":"Present Simple — привычки и факты (usually, every day), Present Continuous — то, что происходит сейчас (now, at the moment). Глаголы состояния обычно не ставятся в Continuous: like, love, hate, want, need, know, understand, believe, prefer, belong, seem. Правильно: I know, а не I am knowing.","ex":[["I usually [walk] to school, but today I [am taking] the bus.","Обычно я хожу в школу пешком, но сегодня еду на автобусе."],["I [know] the answer!","Я знаю ответ!"],["Oleg [wants] a new phone.","Олег хочет новый телефон."],["What [are] you [doing]? — I [am reading] a comic.","Что ты делаешь? — Читаю комикс."],["This book [belongs] to my teacher.","Эта книга принадлежит моему учителю."]],"quiz":[["I ___ what you mean.",["am understanding","understand","understands"],1,"Understand — глагол состояния, не используется в Continuous."],["Every Sunday we ___ our grandma.",["visit","are visiting","visits"],0,"Every Sunday — привычка, Present Simple."],["Shh! Dad ___ on the phone.",["talks","talk","is talking"],2,"Shh! — сейчас, Present Continuous."],["Oleg ___ pizza very much.",["is liking","likes","like"],1,"Like — глагол состояния: likes."],["Do you ___ any help with your project?",["need","needing","needs"],0,"После do — глагол без окончаний."],["She usually ___ jeans, but today she is wearing a dress.",["is wearing","wears","wear"],1,"Usually — привычка: wears."],["Right now I ___ on a difficult physics problem.",["work","works","am working"],2,"Right now → am working."],["This phone ___ to my brother.",["belongs","is belonging","belong"],0,"Belong — глагол состояния: belongs."],["How often ___ you go to the gym?",["are","do","does"],1,"How often — привычка, вопрос с do."],["We can't go out. It ___ heavily.",["rains","rain","is raining"],2,"Сейчас идёт дождь → is raining."],["I ___ this song. It's terrible!",["hate","am hating","hates"],0,"Hate — глагол состояния: I hate."],["My friend ___ in Lviv, but this month he is staying in Kyiv.",["is living","lives","live"],1,"Постоянное место жительства — Present Simple: lives."],["Why ___ you laughing?",["do","is","are"],2,"Laughing → Present Continuous: are you laughing."],["I ___ you. You are right.",["believe","am believing","believes"],0,"Believe — глагол состояния."]],"tr":[["Я знаю его номер.","know — без -ing",["I know his number","I know his phone number"]],["Обычно я хожу в школу пешком.","usually + Present Simple",["I usually walk to school","Usually I walk to school","I usually go to school on foot","Usually I go to school on foot"]],["Сейчас идёт дождь.","It is + V-ing",["It is raining now","It is raining right now","Now it is raining","It is raining at the moment"]],["Олег хочет собаку.","want — без -ing",["Oleg wants a dog"]]]},{"t":"Past Simple: правильные глаголы","l":"A2","rule":"Past Simple — законченное действие в прошлом. Правильные глаголы: V + -ed (play → played, study → studied, stop → stopped). Отрицание: didn't + V, вопрос: Did + подлежащее + V? — после did глагол без -ed. Сигналы: yesterday, last week, ago, in 2020.","ex":[["I [played] football with my friends yesterday.","Вчера я играл в футбол с друзьями."],["We [watched] a film last night.","Вчера вечером мы смотрели фильм."],["Oleg [didn't tidy] his room.","Олег не убрал свою комнату."],["[Did] you [finish] the project?","Ты закончил проект?"],["Two years ago we [moved] to a new flat.","Два года назад мы переехали в новую квартиру."]],"quiz":[["Yesterday I ___ for the physics test.",["study","studied","studyed"],1,"Study → studied (y после согласной → ied)."],["We ___ a great match last Sunday.",["watched","watch","watches"],0,"Last Sunday → Past Simple: watched."],["She ___ call me last night.",["doesn't","wasn't","didn't"],2,"Отрицание в Past Simple: didn't + V."],["___ you enjoy the trip?",["Do","Were","Did"],2,"Вопрос в Past Simple: Did + V."],["Yesterday the bus ___ near my school.",["stoped","stopped","stopping"],1,"Stop → stopped (удвоение p)."],["Did Oleg ___ his room?",["tidy","tidied","tidies"],0,"После did — глагол в начальной форме."],["I ___ my friend ten minutes ago.",["text","am texting","texted"],2,"Ago → Past Simple: texted."],["We ing"]],["Что ты делал в 10 часов?","were you + V-ing",["What were you doing at 10 o'clock","What were you doing at ten o'clock","What were you doing at 10","What were you doing at ten"]],["В полночь мы не спали.","were not + V-ing",["We were not sleeping at midnight","At midnight we were not sleeping","At midnight, we were not sleeping"]],["Олег смотрел мультики (был в процессе).","was + V-ing",["Oleg was watching cartoons"]]]},{"t":"Past Simple vs Past Continuous: when / while","l":"A2+","rule":"Длинное фоновое действие — Past Continuous, короткое, которое его прервало, — Past Simple. When + короткое действие: I was sleeping when the phone rang. While + длинное действие: While I was walking home, I met Max. Действия одно за другим — оба в Past Simple. During + существительное: during the lesson.","ex":[["I [was doing] my homework when Oleg [came] in.","Я делал уроки, когда вошёл Олег."],["While we [were playing] football, it [started] to rain.","Пока мы играли в футбол, начался дождь."],["My phone [rang] while I [was having] a shower.","Мой телефон зазвонил, пока я был в душе."],["When the teacher [came] in, everybody [stopped] talking.","Когда вошёл учитель, все замолчали."],["What [were] you [doing] when the lights [went] out?","Что ты делал, когда погас свет?"]],"quiz":[["I was walking home when I ___ my old friend.",["was meeting","met","meet"],1,"Короткое действие, прервавшее процесс, — Past Simple."],["While Oleg ___ TV, I was cooking.",["were watching","was watching","is watching"],1,"Длинное действие с while: was + V-ing."],["I fell asleep ___ the film.",["while","during","when"],1,"Перед существительным — during."],["We were playing football when it ___ to rain.",["was starting","starts","started"],2,"Короткое действие после when — Past Simple."],["___ I was reading, my brother was playing games.",["While","During","Then"],0,"While + процесс (подлежащее + глагол)."],["What were you doing when I ___ you?",["called","was calling","call"],0,"Короткое действие е и неисчисляемые: some/any/much/many","l":"A2","rule":"Исчисляемые существительные (apple, friend) имеют множественное число, неисчисляемые (water, money, homework, information, advice) — нет. Some — в утверждениях и просьбах, any — в вопросах и отрицаниях. Many — с исчисляемыми, much — с неисчисляемыми (особенно в вопросах и отрицаниях), a lot of — с любыми. How many…? / How much…?","ex":[["We have [a lot of] homework today.","Сегодня у нас много домашки."],["There aren't [any] eggs in the fridge.","В холодильнике нет яиц."],["How [much] money have you got?","Сколько у тебя денег?"],["I have [some] good news!","У меня хорошие новости!"],["How [many] friends came to your party?","Сколько друзей пришло на твою вечеринку?"]],"quiz":[["There isn't ___ milk left.",["some","any","many"],1,"В отрицании — any."],["How ___ apples do you need?",["many","much","any"],0,"Apples — исчисляемые: How many."],["I don't have ___ free time on weekdays.",["many","much","a"],1,"Time — неисчисляемое: much."],["Can I have ___ water, please?",["some","many","a"],0,"В просьбе с неисчисляемым — some."],["There are ___ students in our class.",["much","a lot of","any"],1,"В утверждении с исчисляемыми — a lot of."],["How ___ does this game cost?",["many","any","much"],2,"Деньги/цена: How much."],["She gave me some good ___.",["advices","advice","an advice"],1,"Advice — неисчисляемое, без -s и без an."],["We haven't got ___ bread.",["any","some","many"],0,"Отрицание + неисчисляемое: any."],["Is there ___ juice in the fridge?",["many","a","any"],2,"В вопросе — any."],["Our teacher gave us too ___ homework.",["many","much","lots"],1,"Homework — неисчисляемое: too much."],["I have got ___ new games on my laptop.",["some","any","much"],0,"Утверждение + исчисляемые во мн. ч.: some."],["There ___ a lot of information on this website.",["are","is","be"],1,"Information — неисчисляемое, глагол в ед. ч.: is."],["How many ___ are there in your family?",["people","person","peoples"],0,"Множественное число от person — people."],["I need ___ money to buy a new phone case.",["a","many","some"],2,"Money — неисчисляемое: some money."]],"tr":[["У меня нет денег.","any / no",["I do not have any money","I have not got any money","I have no money","I do not have money","I have not got money"]],["Сколько у тебя друзей в классе?","How many",["How many friends do you have in your class","How many friends have you got in your class","How many friends do you have in class","How many friends have you got in class"]],["В холодильнике есть молоко?","Is there any…?",["Is there any milk in the fridge","Is there milk in the fridge"]],["У нас много домашнего задания.","a lot of / lots of",["We have a lot of homework","We have got a lot of homework","We have lots of homework","We have got lots of homework"]]]},{"t":"Артикли a / an / the","l":"A2","rule":"A / an — один из многих, упоминаем впервые: a перед согласным звуком, an перед гласным звуком (an apple, an hour). The — конкретный, уже известный или единственный в своём роде (the Sun, the best). Без артикля: мн. число и неисчисляемые в общем смысле (I like music), виды спорта, приёмы пищи, большинство стран и городов (play chess, have breakfast, in Poland).","ex":[["I have [a] cat and [a] dog. [The] cat is black.","У меня есть кот и собака. Кот чёрный."],["Oleg wants to be [an] astronaut.","Олег хочет быть космонавтом."],["[The] Moon goes around [the] Earth.","Луна вращается вокруг Земли."],["I love [music] and [maths].","Я люблю музыку и математику."],["Can you open [the] window, please?","Можешь открыть окно, пожалуйста?"]],"quiz":[["My dad is ___ engineer.",["a","an","the"],1,"Engineer начинается с гласного звука: an."],["I saw a film yesterday. ___ film was really funny.",["A","An","The"],2,"Фильм уже упоминали — the."],["Oleg has got ___ new bike.",["a","an","—"],0,"Один из многих, new начинается с согласного: a."],["___ Sun is a star.",["A","The","—"],1,"Солнце одно — the Sun."],["We usually have ___ breakfast at seven.",["a","t l be able to drive","I will be able to drive soon"]]]},{"t":"must / have to / mustn't / don't have to","l":"A2+","rule":"Must — обязанность по мнению говорящего или правило (I must study more). Have to / has to — обязанность из-за обстоятельств; в прошлом — had to. Mustn't — нельзя, запрет. Don't have to — не обязательно, нет необходимости. Вопрос: Do you have to…?","ex":[["I [must] finish this project tonight.","Я должен закончить этот проект сегодня вечером."],["We [have to] wear a uniform at our lyceum.","В нашем лицее мы должны носить форму."],["You [mustn't] use your phone during the test.","Нельзя пользоваться телефоном во время контрольной."],["Tomorrow is Saturday, so I [don't have to] get up early.","Завтра суббота, так что мне не нужно рано вставать."],["Oleg [had to] stay at home because he was ill.","Олегу пришлось остаться дома, потому что он болел."]],"quiz":[["It's Sunday, so I ___ go to school.",["mustn't","don't have to","have to"],1,"Нет необходимости — don't have to."],["You ___ smoke here. It's forbidden.",["mustn't","don't have to","have to"],0,"Запрет — mustn't."],["Yesterday I ___ help my dad in the garage.",["must","had to","have to"],1,"В прошлом — had to."],["My sister ___ to get up at six for work.",["has","have","must"],0,"She + has to."],["You ___ bring food. There will be pizza at the party.",["mustn't","don't have to","doesn't have to"],1,"Не обязательно — don't have to (с you)."],["Does Oleg ___ do homework every day?",["has to","have to","must"],1,"После does — have to."],["Students ___ cheat in exams.",["mustn't","don't have to","doesn't have to"],0,"Запрет — mustn't."],["I ___ remember to call grandma tonight!",["mustn't","don't have to","must"],2,"Обязанность, которую чувствую сам, — must."],["We ___ wear a uniform at our school. We can wear what we want.",["have to","don't have to","mustn't"],1,"Можно что угодно — не обязательно: don't have to."],["Did you ___ wait long for the bus?",["must","have to","had to"],1,"После did — have to."],["He ___ to study hard if he wants to win the olympiad.",["have","has","must"],1,"He + has to."],["Drivers ___ stop at a red light.",["must","mustn't","don't have to"],0,"Правило — must."],["Last year we ___ to move to another city.",["have","must","had"],2,"В прошлом — had to."],["You ___ touch the cables! It's dangerous.",["don't have to","must","mustn't"],2,"Опасно — запрет: mustn't."]],"tr":[["Я должен закончить проект.","must / have to",["I must finish the project","I have to finish the project","I must finish my project","I have to finish my project","I have got to finish the project","I have got to finish my project"]],["Тебе не обязательно идти.","do not have to",["You do not have to go","You do not need to go","You need not go"]],["Тебе нельзя здесь играть.","must not",["You must not play here","You cannot play here","You can not play here"]],["Вчера Олегу пришлось остаться дома.","had to",["Yesterday Oleg had to stay at home","Oleg had to stay at home yesterday","Yesterday Oleg had to stay home","Oleg had to stay home yesterday"]]]},{"t":"should: советы","l":"A2","rule":"Should + V — совет или мнение, как правильно поступить: You should sleep more. Отрицание: shouldn't — не стоит: You shouldn't eat so much sugar. Вопрос: Should I…? — Стоит ли мне…? Should мягче, чем must, и после него глагол без to.","ex":[["You [should] go to bed earlier.","Тебе стоит ложиться спать раньше."],["You [shouldn't] play games all night.","Не стоит играть всю ночь."],["[Should] I tell the teacher?","Мне стоит сказать учителю?"],["Oleg [should] eat more vegetables.","Олегу стоит есть больше овощей."],["We [should] start preparing for the NMT now.","Нам стоит начать готовиться к НМТ уже сейчас."]],"quiz":[["You look tired. You ___ get some rest.",["should","shouldn't","should to"],0,"Совет отдохнуть — should."],["You ___ eat so many sweets. It's bad for your teeth.",["should","shouldn't","should not to"],1,"Вредно — не стоит: shouldn't."],["Should I ___ him a message?",["sending","to send","send"],2,"После should — V без to."],["He ___ study more if he wants good marks.",["shoulds","should","should to"],1,"Should не меняется и стоит без to."],["What ___ I wear to the party?",["does","am","should"],2,"Просьба о совете — What should I…?"],["You shouldn't ___ at your phone while crossing the road.",["look","looking","to look"],0,"После shouldn't — V."],["It's cold. You ___ wear a hat.",["shouldn't","should","should to"],1,"Холодно — совет надеть шапку: should."],["Do you think I ___ buy this phone?",["ought","should","shall to"],1,"Совет — should + V."],["Students ___ talk during the exam.",["shouldn't","should","should not to"],0,"На экзамене не стоит разговаривать."],["You ___ see this film. It's amazing!",["shouldn't","should to","should"],2,"Фильм отличный — совет: should."],["___ we take an umbrella?",["Should","Does","Are"],0,"Вопрос-совет — Should we…?"],["Oleg ___ go to bed so late. He has school tomorrow.",["should","shouldn't","should to"],1,"Завтра школа — не стоит: shouldn't."],["You should ___ your teacher for help.",["asking","ask","asked"],1,"После should — V."],["I think you ___ apologise to your friend.",["should to","shoulds","should"],2,"Правильная форма — should + V."]],"tr":[["Тебе стоит больше спать.","should",["You should sleep more","You should get more sleep"]],["Тебе не стоит есть столько сладкого.","should not",["You should not eat so many sweets","You should not eat so much sugar","You should not eat so much candy","You should not eat so much sweet food"]],["Мне стоит позвонить ему?","Should I…?",["Should I call him","Should I phone him","Should I ring him"]],["Олегу стоит больше читать.","should",["Oleg should read more"]]]},{"t":"Местоимения: me/him, my/mine","l":"A2","rule":"Объектные местоимения стоят после глагола или предлога: me, you, him, her, it, us, them (Call me!). Притяжательные прилагательные — перед существительным: my, your, his, her, its, our, their (my phone). Притяжательные местоимения заменяют существительное: mine, yours, his, hers, ours, theirs (This phone is mine). Its = «его/её» о предмете, it's = it is.","ex":[["Can you help [me] with this problem?","Можешь помочь мне с этой задачей?"],["This laptop isn't [mine]. It's [Oleg's].","Этот ноутбук не мой. Он Олега."],["I like Anna. I often talk to [her].","Мне нравится Аня. Я часто с ней разговариваю."],["Is this bag [yours]?","Это твоя сумка?"],["The dog is wagging [its] tail.","Собака виляет хвостом."]],"quiz":[["Max is my friend. I play football with ___.",["he","him","his"],1,"После предлога — объектная форма: him."],["This pen isn't ___. My pen is blue.",["mine","my","me"],0,"Без существительного — mine."],["Our teacher gave ___ a lot of homework.",["we","our","us"],2,"После глагола — us."],["Is this your phone? — No, it's not ___.",["my","mine","me"],1,"В конце без существительного — mine."],["The cat is eating ___ food.",["its","it's","it"],0,"Притяжательное для предмета/животного — its."],["These are Oleg's toys. They are ___.",["him","his","he's"],1,"Его (без существительного) — his."],["Anna and Kate are here. Can you see ___?",["their","they","them"],2,"После глагола — them."],["Is that bag ___, Anna?",["your","yours","you"],1,"Без существительного — yours."],["My parents love ___ new car.",["their","theirs","them"],0,"Перед существительным — their."],["This house is ___. We bought it last year.",["our","us","ours"],2,"Без существительного — ours."],["Give ___ the ball, Oleg!",["I","me","my"],1,"После глагола — me."],["Kate lost ___ keys.",["her","hers","she"],0,"Перед существительным — her."],["Whose headphones are these? — They're ___.",["her","hers","she"],1,"Без существительного — hers."],["I can't find my charger. Can I use ___?",["yours","your","you"],0,"Вместо your charger — yours."]],"tr":[["Этот ноутбук мой.","mine",["This laptop is mine"]],["Позвони мне завтра.","me",["Call me tomorrow","Phone me tomorrow","Give me a call tomorrow"]],["Это не его телефон, а её.","his / hers",["It is not his phone it is hers","It is not his phone, it is hers","This is not his phone it is hers","This is not his phone, it is hers","It is not his phone but hers","It is not his phone, but hers","This is not his phone but hers","This is not his phone, but hers"]],["Мы видели их в парке.","them",["We saw them in the park","We saw them at the park"]]]},{"t":"Вопросы и вопросительные слова","l":"A2","rule":"Порядок слов в вопросе: вопросительное слово + вспомогательный глагол + подлежащее + основной глагол: Where do you live? What are you doing? When did he come? Вопросительные слова: what, who, where, when, why, how, which, whose, how many / how much, how often, how long. Вопрос к подлежащему (Who…? What…?) — без do/does/did: Who called you?","ex":[["[Where do] you [live]?","Где ты живёшь?"],["[What are] you [watching]?","Что ты смотришь?"],["[Who ate] my sandwich?","Кто съел мой бутерброд?"],["[How often do] you [go] to the gym?","Как часто ты ходишь в спортзал?"],["[Whose] phone is this?","Чей это телефон?"]],"quiz":[["___ do you live? — In Kharkiv.",["Where","When","What"],0,"Где? — Where."],["___ is your birthday? — In May.",["Where","When","Who"],1,"Когда? — When."],["Where ___ Oleg go yesterday?",["did","does","was"],0,"Yesterday → did."],["___ called you last night?",["Who did","Who","Whom"],1,"Вопрос к подлежащему — без did."],["___ jacket is this? — It's Max's.",["Whose","Who","Who's"],0,"Чей? — Whose."],["___ do you go swimming? — Twice a week.",["How long","How often","How much"],1,"Как часто? — How often."],["___ are you crying? — Because I lost my phone.",["Why","What","How"],0,"Почему? — Why."],["What ___ you doing at the moment?",["are","do","is"],0,"Present Continuous: are you doing."],["___ brothers or sisters have you got?",["How long","How much","How many"],2,"Исчисляемые — How many."],["___ does the film last? — Two hours.",["How often","How many","How long"],2,"Как долго? — How long."],["What time ___ the lesson start?",["does","do","is"],0,"Lesson = it → does."],["___ colour do you prefer, red or blue?",["Which","Who","Whose"],0,"Выбор из вариантов — Which."],["How ___ is this T-shirt? — 300 hryvnias.",["many","much","long"],1,"Цена — How much."],["Where ___ you yesterday?",["were","was","did"],0,"You + were."]],"tr":[["Где ты живёшь?","Where do…?",["Where do you live"]],["Кто съел мой бутерброд?","Who + V (без did)",["Who ate my sandwich","Who has eaten my sandwich"]],["Как часто ты играешь в футбол?","How often do…?",["How often do you play football","How often do you play soccer"]],["Почему ты опоздал?","Why were…?",["Why were you late","Why are you late","Why did you come late"]]]},{"t":"Глагол + -ing или to + глагол","l":"A2+","rule":"После enjoy, finish, stop, mind, can't stand, practise — глагол с -ing: I enjoy playing chess. После want, need, decide, hope, plan, learn, promise, would like — to + глагол: I want to win. После like, love, hate можно и -ing, и to: I like playing / I like to play. После предлогов (at, about, of, for, before, after) — всегда -ing: good at drawing.","ex":[["I [enjoy playing] chess with my dad.","Мне нравится играть в шахматы с папой."],["Oleg [wants to become] a YouTuber.","Олег хочет стать ютубером."],["We [decided to go] to the park.","Мы решили пойти в парк."],["I'm good at [solving] logic problems.","Я хорошо решаю логические задачи."],["[Stop talking] and listen!","Хватит болтать, слушай!"]],"quiz":[["I enjoy ___ to music.",["listen","to listen","listening"],2,"После enjoy — V-ing."],["Oleg wants ___ a dog.",["having","to have","have"],1,"После want — to + V."],["We decided ___ a film.",["to watch","watching","watch"],0,"После decide — to + V."],["She is good at ___.",["to draw","drawing","draw"],1,"После предлога at — V-ing."],["Have you finished ___ your essay?",["writing","to write","write"],0,"После finish — V-ing."],["I hope ___ the olympiad.",["winning","win","to win"],2,"После hope — to + V."],["My friend can't stand ___ in the rain.",["walk","walking","walked"],1,"После can't stand — V-ing."],["Would you like ___ some tea?",["to have","having","have"],0,"После would like — to + V."],["Do you mind ___ the window?",["to open","opening","open"],1,"После mind — V-ing."],["I'm learning ___ the guitar.",["to play","play","playing"],0,"После learn — to + V."],["Stop ___ noise! I'm trying to sleep.",["make","making","made"],1,"Stop + V-ing — перестать делать."],["They plan ___ to Lviv in summer.",["travelling","to travel","travel"],1,"После plan — to + V."],["Thank you for ___ me.",["help","to help","helping"],2,"После предлога for — V-ing."],["He promised ___ late again.",["not being","to not being","not to be"],2,"Promise + not to + V."]],"tr":[["Я люблю играть в шахматы.","like + -ing / to",["I like playing chess","I like to play chess","I love playing chess","I love to play chess"]],["Олег хочет стать футболистом.","want to",["Oleg wants to become a footballer","Oleg wants to be a footballer","Oleg wants to become a football player","Oleg wants to be a football player","Oleg wants to become a soccer player","Oleg wants to be a soccer player"]],["Мы решили остаться дома.","decide to",["We decided to stay at home","We decided to stay home"]],["Я закончил делать уроки.","finish + -ing",["I finished doing my homework","I have finished doing my homework","I finished doing homework","I have finished doing homework"]]]},{"t":"used to: как было раньше","l":"A2+","rule":"Used to + V — привычки и состояния в прошлом, которых сейчас больше нет: I used to play with toy cars. Отрицание: didn't use to + V; вопрос: Did you use to + V? (после did — use без d). Для настоящего used to не используется — говорим I usually + V.","ex":[["I [used to] be afraid of the dark.","Раньше я боялся темноты."],["Oleg [used to] cry a lot when he was a baby.","Олег много плакал, когда был малышом."],["We [used to] live in a different district of Kharkiv.","Раньше мы жили в другом районе Харькова."],["I [didn't use to] like vegetables, but now I do.","Раньше я не любил овощи, а теперь люблю."],["[Did] you [use to] play with LEGO?","Ты раньше играл в LEGO?"]],"quiz":[["When I was little, I ___ watch cartoons every morning.",["use to","used to","using to"],1,"В утверждении — used to."],["Did you ___ have long hair?",["use to","used to","using to"],0,"После did — use to (без d)."],["My dad used to ___ football.",["playing","played","play"],2,"Used to + V."],["I didn't ___ like maths, but now I love it.",["used to","use to","uses to"],1,"После didn't — use to."],["There ___ be a cinema here, but now it's a shop.",["used to","use to","uses to"],0,"Утверждение — used to."],["Oleg ___ sleep with a teddy bear, but he doesn't now.",["is used to","used to","uses to"],1,"Прошлая привычка — used to + V."],["We ___ to go to the sea every summer when I was small.",["were used","use","used"],2,"Used to + V."],["___ your parents use to live in Kyiv?",["Were","Did","Do"],1,"Вопрос: Did … use to…?"],["I used to ___ a lot of sweets.",["eat","eating","ate"],0,"Used to + V."],["She ___ wear glasses, but now she wears contact lenses.",["uses to","use to","used to"],2,"Утверждение — used to."],["My grandpa didn't use to ___ a mobile phone.",["having","had","have"],2,"Use to + V."],["Where did you ___ go on holiday as a child?",["use to","used to","uses to"],0,"После did — use to."],["This park ___ to be much bigger.",["use","used","uses"],1,"Утверждение — used to."],["Did Max use to ___ at our school?",["study","studied","studying"],0,"Use to + V."]],"tr":[["Раньше я боялся собак.","used to",["I used to be afraid of dogs","I used to be scared of dogs","I used to fear dogs"]],["Олег раньше не любил суп.","did not use to",["Oleg did not use to like soup","Oleg used not to like soup","Oleg never used to like soup"]],["Ты раньше жил в Харькове?","Did you use to…?",["Did you use to live in Kharkiv","Did you use to live in Kharkov"]],["Раньше здесь был парк.","There used to be",["There used to be a park here"]]]},{"t":"First Conditional: если…, то…","l":"A2+","rule":"First Conditional — реальное условие в будущем: If + Present Simple, … will + V. If it rains, we will stay at home. В части с if will НЕ ставится (не if it will rain!). Части можно поменять местами: We will stay at home if it rains (тогда без запятой). После when, as soon as — тоже Present Simple.","ex":[["If you [study] hard, you [will pass] the NMT.","Если будешь усердно учиться, сдашь НМТ."],["If it [rains], we [won't play] football.","Если пойдёт дождь, мы не будем играть в футбол."],["I [will call] you if I [finish] early.","Я тебе позвоню, если закончу рано."],["If Oleg [is] good, Mum [will buy] him ice cream.","Если Олег будет хорошо себя вести, мама купит ему мороженое."],["What [will] you [do] if you [win] the olympiad?","Что ты будешь делать, если выиграешь олимпиаду?"]],"quiz":[["If it ___ sunny tomorrow, we will go to the beach.",["is","will be","was"],0,"После if — Present Simple."],["If you don't hurry, you ___ the bus.",["miss","will miss","missed"],1,"Результат — will + V."],["I'll tell you if I ___ any news.",["will hear","heard","hear"],2,"После if — Present Simple."],["If Oleg ___ his homework, he can't play games.",["won't do","doesn't do","didn't do"],1,"После if — Present Simple: doesn't do."],["We ___ late if we don't leave now.",["are","were","will be"],2,"Результат — will be."],["If you ___ me, I will help you.",["ask","will ask","asked"],0,"После if — Present Simple."],["She will be angry if you ___ her.",["won't call","didn't call","don't call"],2,"После if — Present Simple: don't call."],["What will you do if it ___?",["will rain","rains","rained"],1,"После if — Present Simple: rains."],["If I get a good mark, my parents ___ happy.",["will be","were","be"],0,"Результат — will be."],["I won't go out if the weather ___ bad.",["will be","is","was"],1,"После if — Present Simple: is."],["If Max ___ the final, he will get a medal.",["win","wins","will win"],1,"He + wins (Present Simple)."],["You ___ sick if you eat all those sweets.",["felt","will feel","feeling"],1,"Результат — will + V."],["If we ___ the train, we will take a taxi.",["miss","will miss","missed"],0,"После if — Present Simple."],["I will buy a new laptop if I ___ enough money.",["saved","will save","save"],2,"После if — Present Simple."]],"tr":[["Если пойдёт дождь, мы останемся дома.","If + Present, will",["If it rains we will stay at home","If it rains, we will stay at home","If it rains we will stay home","If it rains, we will stay home","We will stay at home if it rains","We will stay home if it rains"]],["Если ты мне поможешь, я куплю тебе пиццу.","If + Present, will",["If you help me I will buy you a pizza","If you help me, I will buy you a pizza","If you help me I will buy you pizza","If you help me, I will buy you pizza","I will buy you a pizza if you help me","I will buy you pizza if you help me"]],["Я позвоню тебе, если опоздаю.","will … if + Present",["I will call you if I am late","I will phone you if I am late","If I am late I will call you","If I am late, I will call you"]],["Что ты будешь делать, если выиграешь?","What will you do if…?",["What will you do if you win"]]]},{"t":"Present Perfect Continuous: как долго?","l":"B1","rule":"Present Perfect Continuous показывает действие, которое началось в прошлом и продолжается до сих пор (или только что закончилось, и виден результат). Формула: have/has + been + V-ing. Сигнальные слова: for (в течение), since (с какого-то момента), How long…?, all day, lately, recently. Глаголы состояния (know, like, want, believe) в этом времени не используются: I have known him for years.","ex":[["I [have been learning] English for five years.","Я учу английский уже пять лет."],["Oleg [has been playing] Minecraft since lunch.","Олег играет в Minecraft с обеда."],["We [have been waiting] for the bus for twenty minutes.","Мы ждём автобус уже двадцать минут."],["I'm tired because I [have been preparing] for the olympiad all day.","Я устал, потому что весь день готовился к олимпиаде."],["How long [have you been watching] this YouTube channel?","Как долго ты смотришь этот YouTube-канал?"]],"quiz":[["I ___ maths problems for three hours, and my head hurts.",["solve","have been solving","am solving"],1,"Действие длится уже три часа (for three hours) — Present Perfect Continuous."],["Oleg ___ computer games since 10 o'clock.",["is playing","played","has been playing"],2,"Since 10 o'clock — действие началось в прошлом и продолжается: has been + V-ing."],["How long ___ for the bus?",["are you waiting","have you been waiting","do you wait"],1,"How long + действие до сих пор — have you been waiting."],["I ___ Max since the first grade.",["am knowing","have known","have been knowing"],1,"Know — глагол состояния, он не используется в Continuous, поэтому Present Perfect."],["Your hands are dirty. What have you ___ doing?",["been","being","be"],0,"Формула have + been + V-ing: What have you been doing?"],["We have been training ___ two hours.",["for","since","during"],0,"For + период времени (two hours)."],["They have been building the new stadium ___ last spring.",["ago","for","since"],2,"Since + точка отсчёта (last spring)."],["It ___ all morning, so the football pitch is wet.",["is raining","has been raining","rains"],1,"Длительное действие до сих пор с видимым результатом (поле мокрое)."],["My brother ___ hard for his English test lately.",["is study","has been studying","studies"],1,"Lately — сигнал Present Perfect Continuous."],["I ___ three chapters of the book today.",["have been reading","have read","am reading"],1,"Когда указано количество результата (три главы), нужен Present Perfect Simple."],["Sorry I'm late! ___ long?",["Are you wait","Do you wait","Have you been waiting"],2,"Вопрос о длительности ожидания до момента речи — Present Perfect Continuous."],["Dad has been working in this company ___ 2019.",["for","since","from"],1,"С годом (точкой начала) используем since."],["Ira ___ the guitar for two years, and she plays really well now.",["has been learning","is learning","learns"],0,"For two years + до сих пор — has been learning."],["How long has your sister ___ vlogs?",["been making","making","make"],0,"После has в этом времени идёт been + V-ing."]],"tr":[["Я жду тебя уже полчаса.","have been + V-ing, for",["I have been waiting for you for half an hour","I have been waiting for you for thirty minutes"]],["Олег играет в футбол с утра.","has been + V-ing, since",["Oleg has been playing football since the morning","Oleg has been playing football since morning"]],["Как долго ты учишь английский?","How long have you been…",["How long have you been learning English","How long have you been studying English"]],["Мы готовимся к олимпиаде с сентября.","have been preparing, since",["We have been preparing for the olympiad since September","We have been preparing for the Olympiad since September"]]]},{"t":"Past Perfect: что случилось раньше","l":"B1","rule":"Past Perfect показывает действие, которое произошло раньше другого действия в прошлом («предпрошедшее»). Формула: had + V3 (третья форма глагола) для всех лиц. Сигнальные слова: before, after, already, just, by the time, when, never…before. Пример: When I came, the film had already started (фильм начался раньше, чем я пришёл).","ex":[["When I got to the stadium, the match [had already started].","Когда я добрался до стадиона, матч уже начался."],["I [had never seen] the sea before that trip.","До той поездки я никогда не видел море."],["Oleg was upset because he [had lost] his headphones.","Олег расстроился, потому что потерял наушники."],["By the time Mum came home, we [had cleaned] the kitchen.","К тому времени, как мама пришла домой, мы убрали кухню."],["After I [had finished] my homework, I went out with friends.","После того как я закончил домашку, я пошёл гулять с друзьями."]],"quiz":[["When we arrived at the cinema, the film ___.",["has already started","already started","had already started"],2,"Фильм начался раньше нашего прихода — Past Perfect."],["By the time the teacher came in, we ___ the test.",["have finished","had finished","finish"],1,"By the time + прошлое — действие завершилось раньше: had + V3."],["I couldn't log in because I ___ my password.",["have forgotten","had forgotten","forget"],1,"Забыл пароль раньше, чем пытался войти — had forgotten."],["She had never ___ snow before she moved to Lviv.",["saw","see","seen"],2,"После had нужна третья форма: seen."],["After he ___ breakfast, he ran to the lyceum.",["has had","had had","have"],1,"Сначала завтрак, потом бег — had had (had + V3 от have)."],["Max was hungry because he ___ anything since the morning.",["hadn't eaten","didn't eat","doesn't eat"],0,"Since в рассказе о прошлом требует Past Perfect."],["I realised that I ___ my phone at home.",["had left","leave","have left"],0,"Оставил телефон раньше, чем понял это — had left."],["When Dad got home, Oleg ___ to bed.",["had already gone","has gone","goes"],0,"Олег лёг раньше, чем папа пришёл — had already gone."],["The bus ___ by the time I got to the stop.",["has left","leaves","had left"],2,"By the time I got… — автобус ушёл раньше: had left."],["Before the olympiad, I ___ hundreds of problems.",["solve","had solved","have solved"],1,"До события в прошлом — Past Perfect."],["Had you ever ___ to Poland before that trip?",["been","be","was"],0,"Had + V3: been."],["Nobody knew where Oleg ___ his game controller.",["has put","puts","had put"],2,"Положил раньше, чем его искали — had put."],["We were late. The lesson ___ ten minutes earlier.",["begins","has begun","had begun"],2,"Урок начался раньше момента в прошлом — had begun."],["The game was over. Our team ___ 3:0.",["loses","had lost","has lost"],1,"Результат, полученный до момента в прошлом, — had lost."]],"tr":[["Когда я пришёл, урок уже начался.","had already + V3",["When I came, the lesson had already started","When I came, the lesson had already begun","When I arrived, the lesson had already started","When I arrived, the lesson had already begun","When I came the lesson had already started","When I came the lesson had already begun","When I arrived the lesson had already started","When I arrived the lesson had already begun"]],["Я понял, что забыл ключи дома.","realised + had + V3",["I realised that I had forgotten my keys at home","I realised that I had left my keys at home","I realised I had forgotten my keys at home","I realised I had left my keys at home","I realized that I had forgotten my keys at home","I realized that I had left my keys at home","I realized I had forgotten my keys at home","I realized I had left my keys at home","I understood that I had forgotten my keys at home","I understood that I had left my keys at home","I understood I had forgotten my keys at home","I understood I had left my keys at home"]],["Олег был грустным, потому что потерял мяч.","had lost",["Oleg was sad because he had lost his ball","Oleg was sad because he had lost the ball"]],["Матч уже закончился, когда мы включили телевизор.","had already + V3",["The match had already finished when we turned on the TV","The match had already finished when we switched on the TV","The match had already finished when we turned the TV on","The match had already finished when we switched the TV on","The match had already ended when we turned on the TV","The match had already ended when we switched on the TV","The match had already ended when we turned the TV on","The match had already ended when we switched the TV on"]]]},{"t":"Zero и First Conditional + when, unless, as soon as","l":"B1","rule":"Zero conditional — общие истины и законы природы: If + Present Simple, Present Simple (If you heat ice, it melts). First conditional — реальная ситуация в будущем: If + Present Simple, will + V. После if, when, unless (= if not), as soon as, before, after, until в придаточном НЕ ставим will — используем Present Simple. Unless = «если не»: Unless you hurry, you will be late.","ex":[["If you [heat] water to 100°C, it [boils].","Если нагреть воду до 100°C, она кипит."],["If it [rains] tomorrow, we [will play] FIFA instead of football.","Если завтра будет дождь, мы будем играть в FIFA вместо футбола."],["I [will call] you as soon as I [get] home.","Я позвоню тебе, как только доберусь домой."],["[Unless] you practise, you won't win the olympiad.","Если ты не будешь тренироваться, ты не выиграешь олимпиаду."],["When Oleg [finishes] his homework, he [will watch] cartoons.","Когда Олег закончит домашку, он будет смотреть мультики."]],"quiz":[["If you mix blue and yellow, you ___ green.",["got","had got","get"],2,"Общий факт — zero conditional: Present Simple в обеих частях."],["If it ___ tomorrow, we will stay at home.",["rained","will rain","rains"],2,"После if в first conditional — Present Simple, не will."],["I'll text you as soon as I ___ the results.",["got","get","will get"],1,"После as soon as о будущем — Present Simple."],["___ you study, you won't pass the NMT.",["Unless","If","When"],0,"Unless = if not: если не будешь учиться, не сдашь."],["If you ___ water to zero degrees, it freezes.",["will cool","cooled","cool"],2,"Закон природы — zero conditional, Present Simple."],["We won't start the game until everyone ___.",["came","will come","comes"],2,"После until о будущем — Present Simple."],["If Oleg eats too many sweets tonight, he ___ a stomachache.",["will have","has had","had"],0,"Реальное будущее следствие — will + V."],["Unless you hurry now, you ___ the bus.",["will miss","missed","miss"],0,"Главная часть first conditional — will + V."],["When I ___ older, I will study in Kyiv.",["will be","was","am"],2,"После when о будущем — Present Simple: am."],["If you don't charge your phone, it ___ off soon.",["has switched","switched","will switch"],2,"Следствие в будущем — will switch."],["Before you ___ the lyceum, have breakfast.",["will leave","leave","left"],1,"После before — Present Simple, даже если речь о будущем."],["You can't play online ___ you have internet.",["when","if","unless"],2,"Unless = если не: без интернета играть онлайн нельзя."],["What will you do if you ___ the competition?",["win","won","will win"],0,"После if — Present Simple."],["Plants die if they ___ water.",["didn't get","don't get","won't get"],1,"Общая истина — zero conditional, Present Simple."]],"tr":[["Если завтра будет солнечно, мы пойдём в парк.","If + Present Simple, will + V",["If it is sunny tomorrow, we will go to the park","We will go to the park if it is sunny tomorrow","If it is sunny tomorrow we will go to the park"]],["Я позвоню тебе, как только приду домой.","as soon as + Present Simple",["I will call you as soon as I come home","I will call you as soon as I get home","I will phone you as soon as I come home","I will phone you as soon as I get home","I will ring you as soon as I come home","I will ring you as soon as I get home"]],["Если ты не будешь учиться, ты не сдашь экзамен.","Unless / If … not",["Unless you study, you will not pass the exam","If you do not study, you will not pass the exam","You will not pass the exam unless you study","You will not pass the exam if you do not study","Unless you study you will not pass the exam","If you do not study you will not pass the exam"]],["Если нагреть лёд, он тает.","zero conditional",["If you heat ice, it melts","Ice melts if you heat it","If you heat ice it melts"]]]},{"t":"Second Conditional: если бы (сейчас)","l":"B1","rule":"Second conditional — нереальная или маловероятная ситуация в настоящем или будущем: If + Past Simple, would + V. С глаголом be в придаточном для всех лиц обычно используют were: If I were you, I would… (совет «на твоём месте»). Вместо would можно could/might. В части с if никогда не ставим would.","ex":[["If I [had] a million dollars, I [would buy] a gaming PC for every friend.","Если бы у меня был миллион долларов, я бы купил игровой ПК каждому другу."],["If I [were] you, I [would revise] for the test.","На твоём месте я бы повторил материал к контрольной."],["What [would] you [do] if you [met] Messi?","Что бы ты сделал, если бы встретил Месси?"],["If Oleg [didn't play] games all evening, he [would sleep] better.","Если бы Олег не играл в игры весь вечер, он бы лучше спал."],["We [would go] swimming every day if we [lived] near the sea.","Мы бы ходили плавать каждый день, если бы жили у моря."]],"quiz":[["If I ___ a dog, I would walk it every day.",["have","had","would have"],1,"Нереальное условие — If + Past Simple."],["If I were you, I ___ to the teacher.",["talked","will talk","would talk"],2,"Совет If I were you… требует would + V."],["If she ___ more time, she would learn Japanese.",["had","has","would have"],0,"В части с if — Past Simple, не would."],["What would you do if you ___ the lottery?",["won","win","would win"],0,"Second conditional: if + Past Simple (won)."],["If I ___ rich, I would travel around the world.",["will be","were","am"],1,"С be в second conditional используем were."],["He ___ better marks if he did his homework.",["gets","will get","would get"],2,"Главная часть — would + V."],["If we lived in Kyiv, we ___ visit Grandma every weekend.",["will","can","could"],2,"В главной части возможно could (= would be able to)."],["If Oleg ___ so noisy, I could concentrate.",["isn't","wasn't","won't be"],1,"Нереальное настоящее — Past Simple (wasn't/weren't)."],["I would help you if I ___ the answer.",["knew","had known","know"],0,"Настоящее нереальное — Past Simple: knew."],["If I ___ you, I wouldn't post that photo.",["am","were","was being"],1,"Устойчивая фраза совета: If I were you."],["Would you be happy if your team ___ the cup?",["won","will win","wins"],0,"Второе условие: if + Past Simple."],["If there ___ no internet, life would be boring.",["is","were","will be"],1,"Нереальная ситуация — were."],["She wouldn't be so tired if she ___ to bed earlier.",["would go","goes","went"],2,"В части с if — Past Simple: went."],["If I could fly, I ___ to school in five minutes.",["get","would get","will get"],1,"Главная часть — would + V."]],"tr":[["Если бы у меня было больше времени, я бы играл в футбол каждый день.","If + Past Simple, would + V",["If I had more time, I would play football every day","I would play football every day if I had more time","If I had more time I would play football every day"]],["На твоём месте я бы не волновался.","If I were you…",["If I were you, I would not worry","I would not worry if I were you","If I were you I would not worry"]],["Что бы ты сделал, если бы выиграл миллион?","What would you do if…",["What would you do if you won a million","What would you do if you won a million dollars"]],["Если бы я знал ответ, я бы тебе сказал.","knew / would tell",["If I knew the answer, I would tell you","I would tell you if I knew the answer","If I knew the answer I would tell you"]]]},{"t":"Third Conditional: если бы (в прошлом)","l":"B1","rule":"Third conditional — фантазия или сожаление о прошлом, которое уже нельзя изменить: If + had + V3, would have + V3. Пример: If I had studied, I would have passed (но я не учил и не сдал). Отрицание: If I hadn't overslept, I wouldn't have been late. Вместо would have можно could have / might have.","ex":[["If I [had studied] harder, I [would have passed] the test.","Если бы я учил усерднее, я бы сдал контрольную."],["If we [had left] earlier, we [wouldn't have missed] the train.","Если бы мы вышли раньше, мы бы не опоздали на поезд."],["Our team [would have won] if Max [hadn't missed] the penalty.","Наша команда выиграла бы, если бы Макс не промахнулся с пенальти."],["If Oleg [had listened] to Mum, he [wouldn't have got] lost.","Если бы Олег послушал маму, он бы не потерялся."],["What [would] you [have done] if you [had been] there?","Что бы ты сделал, если бы был там?"]],"quiz":[["If I had known about the party, I ___.",["will come","would have come","would come"],1,"Прошлое нереальное — would have + V3."],["If you ___ the alarm, you wouldn't have overslept.",["had set","would set","set"],0,"В части с if — had + V3."],["She would have won the olympiad if she ___ that mistake.",["hadn't made","didn't make","wouldn't make"],0,"Третий тип: if + hadn't + V3."],["If it hadn't rained yesterday, we ___ football.",["would play","would have played","had played"],1,"Вчера (прошлое) — would have played."],["If I had saved money, I ___ the new console last month.",["could have bought","could buy","can buy"],0,"Прошлое: could have + V3."],["They ___ the bus if they had run faster.",["would have caught","caught","would catch"],0,"Третий тип — would have + V3."],["If Oleg had listened to the coach, he ___ that mistake.",["wouldn't have made","won't make","wouldn't make"],0,"Результат в прошлом — wouldn't have made."],["If we ___ the map, we wouldn't have got lost.",["had taken","have taken","took"],0,"If + had + V3."],["If you had told me earlier, I ___ you.",["would have helped","helped","will help"],0,"Главная часть третьего типа — would have + V3."],["If the teacher hadn't helped us, we ___ the project on time.",["wouldn't finish","didn't finish","wouldn't have finished"],2,"Прошлое нереальное — wouldn't have finished."],["I would have called you if my phone ___ dead.",["wouldn't be","wasn't","hadn't been"],2,"If + hadn't been (Past Perfect)."],["If he had trained more, he ___ the race.",["wins","might have won","may win"],1,"Возможный результат в прошлом — might have + V3."],["If I ___ that video, I wouldn't have known the answer.",["hadn't watched","didn't watch","haven't watched"],0,"If + hadn't + V3."],["If you had asked me, I would have ___ you my notes.",["give","given","gave"],1,"После would have — третья форма: given."]],"tr":[["Если бы я встал раньше, я бы не опоздал.","If + had + V3, would have + V3",["If I had got up earlier, I would not have been late","If I had woken up earlier, I would not have been late","I would not have been late if I had got up earlier","I would not have been late if I had woken up earlier","If I had got up earlier I would not have been late","If I had woken up earlier I m","The phones must be turned off during the exam"]]]},{"t":"Косвенная речь: утверждения (said, told)","l":"B1","rule":"Косвенная речь передаёт чужие слова. После said/told время сдвигается «на шаг назад»: Present Simple → Past Simple, Present Continuous → Past Continuous, Present Perfect и Past Simple → Past Perfect, will → would, can → could. Меняются местоимения и слова времени/места: now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there. Say something (to somebody), но tell somebody something.","ex":[["Max said that he [was] tired.","Макс сказал, что устал."],["The teacher told us that the test [would be] on Friday.","Учитель сказал нам, что контрольная будет в пятницу."],["Oleg said he [had lost] his phone.","Олег сказал, что потерял телефон."],["Mum said she [couldn't] come to the match.","Мама сказала, что не сможет прийти на матч."],["Anna told me that she [was learning] Spanish.","Аня сказала мне, что учит испанский."]],"quiz":[["'I am tired.' → Max said that he ___ tired.",["were","was","has been"],1,"Present Simple (am) сдвигается в Past Simple (was)."],["'I will help you.' → She said that she ___ help me.",["shall","would","must"],1,"Will в косвенной речи меняется на would."],["'I can swim.' → He said that he ___ swim.",["may","could","should"],1,"Can → could."],["'We are playing FIFA.' → They said they ___ FIFA.",["had been play","played","were playing"],2,"Present Continuous → Past Continuous."],["'I lost my keys.' → Dad said he ___ his keys.",["has lost","loses","had lost"],2,"Past Simple → Past Perfect."],["She ___ me that she was busy.",["spoke","said","told"],2,"Tell + кому (me) + что; say без дополнения-человека."],["He ___ to me that he liked the film.",["said","told","talked"],0,"Say to somebody; told to me — ошибка."],["A week ago Kate said: 'I saw him yesterday.' → Kate said she had seen him ___.",["tomorrow","the day before","yesterday"],1,"Yesterday → the day before."],["Last month Ann said: 'I'll ca  to + V",["My mum asked me not to be late","My mom asked me not to be late","Mum asked me not to be late","Mom asked me not to be late","My mother asked me not to be late"]],["Учитель сказал нам выключить телефоны.","told us to + V",["The teacher told us to switch off our phones","The teacher told us to switch off the phones","The teacher told us to turn off our phones","The teacher told us to turn off the phones","The teacher told us to switch our phones off","The teacher told us to turn our phones off"]],["Я попросил Олега помочь мне.","asked + to + V",["I asked Oleg to help me"]]]},{"t":"Relative clauses: who, which, that, whose, where","l":"B1","rule":"Относительные местоимения связывают части предложения: who — о людях, which — о предметах и животных, that — о людях и предметах (в определяющих придаточных без запятых), whose — «чей», where — «где» (о месте), when — «когда» (о времени). Если местоимение — дополнение, его можно опустить: The game (that) I bought is great. В придаточных с запятыми (дополнительная информация) that не используется: Kharkiv, which is…","ex":[["The girl [who] sits next to me is from Kharkiv.","Девочка, которая сидит рядом со мной, из Харькова."],["This is the game [which] I told you about.","Это игра, о которой я тебе рассказывал."],["I have a friend [whose] dad is a famous footballer.","У меня есть друг, чей папа — известный футболист."],["That's the café [where] we celebrated my birthday.","Это кафе, где мы праздновали мой день рождения."],["Physics is the subject [that] I like most.","Физика — предмет, который мне нравится больше всего."]],"quiz":[["The boy ___ won the olympiad is in my class.",["who","where","which"],0,"О человеке — who."],["This is the phone ___ I bought last week.",["whose","which","who"],1,"О предмете — which."],["I know a girl ___ brother plays for Metalist.",["who","whose","which"],1,"Чей брат — whose."],["This is the park ___ we play football.",["where","who","which"],0,"О месте, где что-то происходит, — where."],["Do you remember the day ___ we met?",["who","where","when"],2,"О времени — when."],["Kharkiv, ___ is the second largest city in Ukraine, has many universities.",["that","which","where"],1,"После запятой о предмете — which, that нельзя."],["The teacher ___ helped me is very kind.",["who","whose","which"],0,"О человеке — who."],["That's the man ___ car was stolen.",["who","whose","whom"],1,"Чья машина — whose."],["The video ___ Oleg made got 1000 views.",["who","whose","which"],2,"О предмете (видео) — which."],["The city ___ I was born is very green.",["where","which","when"],0,"Место — where (I was born there)."],["My friend Max, ___ lives next door, loves chess.",["that","who","which"],1,"После запятой о человеке — who."],["I need a friend ___ I can trust.",["which","who","where"],1,"О человеке — who."],["This is the book ___ cover I designed.",["whose","which","who"],0,"Чья обложка — whose (можно и о предметах)."],["2020 was the year ___ my brother started school.",["which","when","where"],1,"О времени (год) — when."]],"tr":[["Это девочка, которая выиграла олимпиаду.","who/that",["This is the girl who won the olympiad","This is the girl that won the olympiad","She is the girl who won the olympiad","She is the girl that won the olympiad"]],["Это игра, которую я купил вчера.","which/that или без местоимения",["This is the game which I bought yesterday","This is the game that I bought yesterday","This is the game I bought yesterday"]],["У меня есть друг, чей папа — пилот.","whose",["I have a friend whose dad is a pilot","I have a friend whose father is a pilot","I have got a friend whose dad is a pilot","I have got a friend whose father is a pilot"]],["Это парк, где мы играем в футбол.","where",["This is the park where we play football"]]]},{"t":"Might, may, could: возможно","l":"B1","rule":"Might, may, could + V (инфинитив без to) выражают возможность в настоящем или будущем: «может быть», «возможно». May звучит чуть увереннее, might/could — менее уверенно. Отрицание: might not / may not («возможно, не…»). Важно: couldn't означает «не мог / невозможно», а не «возможно, не». Примеры: It might rain later. He may not come today.","ex":[["Take an umbrella — it [might rain] later.","Возьми зонт — позже может пойти дождь."],["Max [may come] to the match, but he isn't sure.","Макс, возможно, придёт на матч, но он не уверен."],["This type of problem [could be] on the NMT.","Такой тип задачи может быть на НМТ."],["Oleg [might not want] to go — he's tired.","Олег, возможно, не захочет идти — он устал."],["Where's my phone? It [could be] in my bag.","Где мой телефон? Он может быть в рюкзаке."]],"quiz":[["Take a jacket. It ___ get cold in the evening.",["mustn't","needn't","might"],2,"Возможность в будущем — might."],["I'm not sure, but Max ___ be at home.",["can't","may","has to"],1,"Not sure — неуверенное предположение: may."],["He might ___ to the party.",["to come","comes","come"],2,"После might — инфинитив без to."],["I'm not sure. I ___ not go to the cinema tonight.",["don't","might","am"],1,"Возможно, не пойду — might not."],["Where is Oleg? — He ___ be in his room, I'm not sure.",["must","has","could"],2,"Неуверенное предположение — could."],["It ___ snow tomorrow — the forecast isn't clear.",["is","may","does"],1,"Возможность — may + V."],["This answer ___ be correct, but let's check.",["needs","might","mustn't"],1,"Возможно, верно — might be."],["We ___ go to Lviv in summer, but we haven't decided yet.",["might","will","must"],0,"Ещё не решили — только возможность: might."],["She may ___ the answer.",["knowing","know","knows"],1,"После may — инфинитив без to."],["Don't wait for me, I ___ be late.",["may","have","must"],0,"Возможно опоздаю — may be late."],["Our team ___ win the cup this year — we have good players.",["has","could","is"],1,"Возможность — could + V."],["Maybe he's busy. = He ___ busy.",["might","is might","might be"],2,"Might + be + прилагательное."],["Perhaps it will rain. = It ___ rain.",["does","may","is"],1,"Perhaps it will = it may."],["He ___ not like this game, so ask him first.",["doesn't","isn't","may"],2,"Возможно, не понравится — may not like."]],"tr":[["Возможно, завтра пойдёт дождь.","might/may + V",["It might rain tomorrow","It may rain tomorrow","It could rain tomorrow","Tomorrow it might rain","Tomorrow it may rain","Tomorrow it could rain"]],["Олег, может быть, дома.","might be",["Oleg might be at home","Oleg may be at home","Oleg could be at home","Oleg might be home","Oleg may be home","Oleg could be home"]],["Возможно, я не приду на тренировку.","might not",["I might not come to the training","I might not come to training","I may not come to the training","I may not come to training","I might not come to the practice","I might not come to practice","I may not come to the practice","I may not come to practice"]],["Наша команда может выиграть кубок.","could/might + V",["Our team could win the cup","Our team might win the cup","Our team may win the cup","Our team can win the cup"]]]},{"t":"Must / can't: наверняка и не может быть","l":"B1","rule":"Must + V — уверенный вывод «наверняка, должно быть» (почти 100% «да»): He must be tired — he trained all day. Can't + V — уверенный вывод «не может быть» (почти 100% «нет»): That can't be Oleg — he's at school. Для вывода «нет» не используем mustn't! О прошлом: must have + V3 (наверное, сделал), can't have + V3 (не мог сделать).","ex":[["You've been playing for five hours — you [must be] tired.","Ты играешь пять часов — ты, должно быть, устал."],["That [can't be] Max — he's in Poland now.","Это не может быть Макс — он сейчас в Польше."],["Oleg is smiling — he [must have got] a good mark.","Олег улыбается — он, наверное, получил хорошую оценку."],["She [can't have finished] the test already — it started two minutes ago.","Она не могла уже закончить тест — он начался две минуты назад."],["The lights are off. They [must be] asleep.","Свет выключен. Они, должно быть, спят."]],"quiz":[["He has won three olympiads. He ___ be very clever.",["can't","mustn't","must"],2,"Уверенный вывод «да» — must."],["That ___ be true! I saw him five minutes ago.",["can't","should","must"],0,"Уверенный вывод «нет» — can't."],["You haven't eaten all day. You ___ be hungry.",["must","mustn't","can't"],0,"Логичный вывод «наверняка» — must."],["This ___ be Oleg's bag — he has a blue one, and this is red.",["must","can't","mustn't"],1,"Не может быть — can't."],["The ground is wet. It ___ have rained last night.",["can't","mustn't","must"],2,"Вывод о прошлом — must have + V3."],["She ___ have seen the film — it hasn't come out yet.",["should","must","can't"],2,"Невозможно в прошлом — can't have + V3."],["Max isn't answering — it's 2 a.m. He ___ be sleeping.",["can't","mustn't","must"],2,"В 2 ночи — наверняка спит: must."],["That ___ be the teacher — she's on holiday in Spain.",["can't","might","must"],0,"Она в Испании — это точно не она: can't."],["You must ___ joking!",["to be","being","be"],2,"Must + be + V-ing: must be joking."],["He can't have ___ all the pizza — there were ten slices!",["eaten","ate","eat"],0,"Can't have + V3."],["Ira got 200 points on the NMT. She ___ have studied a lot.",["must","can't","mustn't"],0,"Вывод о прошлом «наверняка» — must have."],["The phone is ringing, but nobody answers. They ___ be at home.",["can't","should","must"],0,"Никто не отвечает — их не может быть дома: can't."],["I'm sure he is Italian. = He ___ be Italian.",["must","can't","might"],0,"I'm sure = must."],["I'm sure it isn't Oleg's phone. = It ___ be Oleg's phone.",["can't","must","mustn't"],0,"Уверенное «нет» — can't (не mustn't)."]],"tr":[["Ты, должно быть, устал.","must be",["You must be tired"]],["Это не может быть правдой.","can't be",["That cannot be true","That can not be true","This cannot be true","This can not be true","It cannot be true","It can not be true"]],["Он, должно быть, дома.","must be",["He must be at home","He must be home"]],["Олег, должно быть, забыл о тренировке.","must have + V3",["Oleg must have forgotten about the training","Oleg must have forgotten about the practice","Oleg must have forgotten about training","Oleg must have forgotten about practice"]]]},{"t":"Should have / shouldn't have: сожаление и критика","l":"B1","rule":"Should have + V3 — сожаление или критика о прошлом: «следовало (бы) сделать, но не сделал». Shouldn't have + V3 — «не следовало делать, но сделал». Примеры: I should have revised for the test (я не повторил — жаль). You shouldn't have stayed up so late. Для советов о настоящем и будущем используем should + V.","ex":[["I [should have revised] for the test — I got a bad mark.","Мне следовало повторить материал — я получил плохую оценку."],["You [shouldn't have eaten] so much pizza.","Тебе не стоило есть так много пиццы."],["We [should have left] earlier — now we're late.","Нам следовало выйти раньше — теперь мы опаздываем."],["Oleg [shouldn't have played] games until midnight.","Олегу не следовало играть в игры до полуночи."],["You [should have told] me about the party!","Тебе следовало рассказать мне о вечеринке!"]],"quiz":[["I failed the test. I ___ more.",["shouldn't have studied","should study","should have studied"],2,"Сожаление о прошлом — should have + V3."],["My stomach hurts. I ___ so many sweets.",["should have eaten","should eat","shouldn't have eaten"],2,"Сделал зря — shouldn't have + V3."],["You should have ___ me! I would have helped.",["called","call","calling"],0,"После should have — V3."],["We missed the bus. We ___ earlier.",["should left","shouldn't have left","should have left"],2,"Надо было выйти раньше — should have left."],["He's tired now. He ___ up so late.",["didn't should stay","should have stayed","shouldn't have stayed"],2,"Зря не спал допоздна — shouldn't have stayed."],["You ___ that photo online — now everyone is laughing.",["should have posted","not should post","shouldn't have posted"],2,"Не надо было выкладывать — shouldn't have posted."],["It was a great concert. You ___ with u
