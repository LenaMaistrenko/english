:[["What is the text mainly about?",["The writer's experience at a new lyceum","How to make friends online","Why history is the best subject","The writer's old school"],0],["Who helped the writer on the first day?",["Andrii","a teacher","his brother","the headmaster"],0],["Why does the writer find history difficult?",["There are many dates to remember","The teacher is very strict","The lessons are too long","He doesn't like reading"],0],["The word 'fair' in the text is closest in meaning to",["treating people equally and correctly","very beautiful","light in colour","easy and simple"],0]]},{"t":"A Day Without My Phone","l":"A2","text":"Last week our class teacher gave us an unusual challenge: spend one whole day without a phone. I thought it would be easy, but it wasn't. In the morning I woke up late because my alarm is on my phone. At breakfast I wanted to check the football results, but I couldn't. On the way to school I felt strange without music in my ears. However, the afternoon was better. Instead of watching videos, I played basketball with my neighbour and read half of a science fiction book. In the evening I even talked to my parents for an hour. By the end of the day I realised that I use my phone too much. Now I leave it in another room when I do my homework.","g":[["challenge","задание, вызов"],["alarm","будильник"],["results","результаты"],["However","однако"],["Instead of","вместо (того чтобы)"],["realised","понял, осознал"]],"q":[["Why did the writer wake up late?",["His alarm is on his phone","He went to bed very late","He was ill","His parents forgot to wake him"],0],["What did he do in the afternoon?",["He played basketball and read a book","He watched videos","He listened to music","He did homework with friends"],0],["Which is TRUE according to the text?",["The morning was harder than the afternoon","The writer found the challenge very easy","The teacher took the writer's phone","He did not talk to his parents"],0],["What did the writer change after the challenge?",["He leaves his phone in another room during homework","He stopped using his phone completely","He bought a new alarm clock","He reads books every evening"],0]]},{"t":"Football in the Park","l":"A2","text":"Every Saturday morning my friends and I meet in the park to play football. There are about ten of us, and we split into two teams. We don't have a real pitch, so we use our jackets as goalposts. Last Saturday was special. A man was watching our game for a long time. After the match he came up to us and said that he was a coach at a local youth club. He invited three of us, including me, to a training session on Tuesday. I was so excited that I could not sleep on Monday night. The training was much harder than our games in the park. We ran a lot and practised passing for an hour. The coach said I need to improve my fitness, but he wants me to come again next week.","g":[["split into","разделиться на"],["pitch","футбольное поле"],["goalposts","штанги ворот"],["coach","тренер"],["invited","пригласил"],["improve","улучшить"],["fitness","физическая форма"]],"q":[["What do the boys use as goalposts?",["their jackets","their bags","two trees","plastic bottles"],0],["Who was the man watching the game?",["a coach at a local youth club","a park worker","the father of one of the boys","a famous footballer"],0],["How did the writer feel before the training?",["very excited","bored","angry","calm and relaxed"],0],["What does the writer need to improve, according to the coach?",["his fitness","his passing","his shooting","his English"],0]]},{"t":"A Weekend in Lviv","l":"A2","text":"Last spring our class went on a school trip to Lviv. We travelled by train, and the journey took about seven hours. Lviv is one of the most beautiful cities in Ukraine. Its old town is full of narrow streets, old churches and small coffee shops. On the first day, our guide took us to Market Square, where we saw the famous town hall. Some of us climbed to the top of its tower. The view was amazing! In the evening we visited a chocolate workshop and watched how sweets are made. On the second day it rained, so we went to a museum instead of walking around the city. I bought a magnet for my mum and some chocolate for my little brother. I would love to go back to Lviv one day.","g":[["journey","поездка, путешествие"],["narrow","узкие"],["guide","экскурсовод"],["town hall","ратуша"],["tower","башня"],["view","вид"],["workshop","мастерская"]],"q":[["How did the class travel to Lviv?",["by train","by bus","by plane","by car"],0],["What did they do on the first evening?",["They visited a chocolate workshop","They climbed the tower","They went to a museum","They bought magnets"],0],["Why did they go to a museum on the second day?",["Because it was raining","Because the guide was ill","Because the old town was closed","Because they were tired"],0],["What did the writer buy for his brother?",["some chocolate","a magnet","a book","a toy"],0]]},{"t":"My YouTube Channel","l":"A2","text":"Two years ago I started a YouTube channel about video games. At first only my friends watched it, and I had just twelve subscribers. I recorded my videos on an old laptop, and the sound quality was terrible. My cousin, who studies film at university, gave me some useful advice. He told me to plan every video before recording and to keep it short. He also lent me a microphone. Slowly, my channel grew. Now I have more than two thousand subscribers. I upload one video every week, usually on Friday evening. It is not easy to find time because I also have a lot of homework. Sometimes people leave rude comments, but I try to ignore them. My parents agree that I can continue as long as my marks stay good.","g":[["subscribers","подписчики"],["recorded","записывал"],["advice","совет"],["lent","одолжил"],["upload","выкладываю, загружаю"],["rude","грубые"],["ignore","игнорировать"]],"q":[["How many subscribers did he have at first?",["twelve","two thousand","two hundred","twenty"],0],["How did his cousin help him?",["He gave advice and lent him a microphone","He bought him a new laptop","He recorded videos with him","He answered rude comments"],0],["When does he usually upload videos?",["on Friday evening","every day","on Sunday morning","twice a week"],0],["What condition do his parents give?",["His marks must stay good","He must stop after one year","He can upload videos only in summer","He must not read comments"],0]]},{"t":"At the Animal Shelter","l":"A2","text":"Last summer I spent two weeks volunteering at an animal shelter near my home. The shelter looks after about forty dogs and twenty cats that have no owners. My job was to feed the animals, clean their cages and take the dogs for walks. The work was harder than I expected. I had to get up at seven every morning, and cleaning the cages was not pleasant at all. However, I loved spending time with the animals. One small dog, Bublyk, was very shy at first. He was afraid of people and hid in the corner of his cage. After a few days he started to wag his tail when he saw me. By the end of my second week, a young family adopted him. I felt a little sad, but mostly I was happy for him.","g":[["volunteering","волонтёрство, работа волонтёром"],["shelter","приют"],["owners","хозяева"],["cages","клетки, вольеры"],["pleasant","приятный"],["shy","застенчивый, пугливый"],["adopted","взяла к себе (приютила)"]],"q":[["Which was NOT part of the writer's job?",["taking cats to the vet","feeding the animals","cleaning the cages","walking the dogs"],0],["Why did Bublyk hide at first?",["He was afraid of people","He was ill","He was hungry","He didn't like other dogs"],0],["What happened at the end of the second week?",["A family adopted Bublyk","The shelter closed","The writer adopted a cat","Bublyk ran away"],0],["How did the writer feel at the end?",["a little sad but mostly happy","very angry","bored","only sad"],0]]},{"t":"The Science Fair","l":"A2","text":"Every year our lyceum organises a science fair, and this year I decided to take part with my friend Maks. Our project was a small machine that waters plants automatically. We used a cheap microcontroller, a sensor that measures how wet the soil is, and a little water pump. When the soil becomes too dry, the sensor sends a signal and the pump switches on. Building it took us almost a month. The most difficult part was writing the program, because our first version watered the plant every five minutes and almost killed it with too much water! On the day of the fair, many students and teachers came to our table and asked questions. We didn't win first prize, but the judges gave us a special award for the most useful idea.","g":[["take part","принять участие"],["automatically","автоматически"],["sensor","датчик"],["soil","почва, земля"],["pump","насос"],["judges","судьи, жюри"],["award","награда"]],"q":[["What did the machine do?",["It watered plants automatically","It measured air temperature","It cleaned the classroom","It fed pets"],0],["What was the most difficult part of the project?",["writing the program","buying the pump","finding a partner","building the box"],0],["What was wrong with the first version?",["It watered the plant too often","It never switched on","It was too expensive","The sensor broke"],0],["Which is TRUE according to the text?",["They received a special award","They won first prize","They built the machine in one day","Nobody was interested in their project"],0]]},{"t":"Learning to Cook","l":"A2","text":"Until last year I couldn't cook anything except instant noodles. Then my mum started working late twice a week, and I had to make dinner for myself and my younger brother. At first I was worried. My first attempt, a simple omelette, was a disaster: I added too much salt and burnt the bottom. My brother refused to eat it. So I started watching cooking videos online and following easy recipes step by step. I learned how to cook pasta, make soup and even bake banana bread. Now my brother says my pasta is better than Mum's, although I think he only says that to get extra dessert. Cooking has taught me to be patient and organised. I also understand now how much work my parents do every day.","g":[["except","кроме"],["attempt","попытка"],["disaster","катастрофа, полный провал"],["refused","отказался"],["recipes","рецепты"],["step by step","шаг за шагом"],["patient","терпеливый"]],"q":[["Why did the writer start cooking?",["His mum began working late twice a week","He wanted to become a chef","His school had cooking classes","His brother asked him to"],0],["What went wrong with the omelette?",["It was too salty and burnt","It was too sweet","It was not cooked at all","It was too small"],0],["How did he learn to cook?",["by watching videos and following recipes","by taking lessons at school","from his grandmother","from his brother"],0],["The word 'patient' in the text means",["able to wait calmly without getting angry","ill and in hospital","very fast","easily angry"],0]]},{"t":"Gaming: Good or Bad?","l":"A2","text":"Many adults think that video games are a waste of time, but I don't completely agree. I play games for about an hour a day, usually in the evening after my homework. Some games, especially strategy games, make me think carefully and plan ahead. Online team games teach me to communicate and cooperate with other players. I have also improved my English, because most of the players on my server speak it. Of course, games have disadvantages too. If you play for too long, you can get headaches, sleep badly and forget about real friends. Last winter I played until midnight almost every day, and my marks at school got worse. Since then I have had a simple rule: no games after ten o'clock and never before my homework is done.","g":[["waste of time","пустая трата времени"],["plan ahead","планировать наперёд"],["cooperate","сотрудничать, действовать сообща"],["disadvantages","недостатки"],["headaches","головные боли"],["got worse","ухудшились"],["rule","правило"]],"q":[["What is the writer's opinion about games?",["They have both advantages and disadvantages","They are a complete waste of time","They are only good for adults","They are bad for everyone"],0],["How have games helped his English?",["Most players on his server speak English","He plays games in English lessons","His teacher recommended games","He reads game magazines"],0],["What happened last winter?",["His marks got worse","He stopped playing games","He won a tournament","He made new friends at school"],0],["What is his rule now?",["No games after ten and not before homework","No games at weekends","Only one game a week","Play only with real friends"],0]]},{"t":"My First Part-Time Job","l":"A2","text":"This summer I got my first part-time job. My uncle has a small café near the river, and he needed help because many tourists come in July and August. I worked four hours a day, five days a week. My main tasks were washing dishes, cleaning tables and sometimes taking orders. In the beginning I made a lot of mistakes. Once I brought a customer tea instead of coffee, and another time I dropped a whole tray of glasses. Luckily, my uncle was patient with me. Gradually I became faster and more confident, and I even learned to talk politely to foreign tourists in English. With the money I earned, I bought new headphones and saved the rest for a laptop. The job was tiring, but I'm proud of myself.","g":[["part-time job","подработка, работа на неполный день"],["dishes","посуда"],["orders","заказы"],["customer","клиент, посетитель"],["tray","поднос"],["confident","уверенный"],["earned","заработал"]],"q":[["Why did the uncle need help?",["Many tourists come in summer","He was ill","He opened a second café","His waiter left"],0],["How many hours a day did the writer work?",["four","five","eight","two"],0],["Which mistake did the writer make?",["He brought tea instead of coffee","He forgot to lock the café","He gave the wrong change","He broke the coffee machine"],0],["What did he do with the money?",["He bought headphones and saved the rest","He bought a laptop at once","He gave it all to his uncle","He spent it all on games"],0]]},{"t":"Marie Curie","l":"A2","text":"Marie Curie was born in Warsaw in 1867. At that time, women in Poland were not allowed to study at university, so she moved to Paris, where she studied physics and mathematics. She was very poor and often had little to eat, but she worked extremely hard. In Paris she met Pierre Curie, a scientist, and they married in 1895. Together they studied radioactivity and discovered two new elements, polonium and radium. In 1903 Marie became the first woman to win a Nobel Prize. Eight years later she won a second Nobel Prize, this time in chemistry. She is still the only person to win Nobel Prizes in two different sciences. Unfortunately, nobody knew then how dangerous radiation was, and her long work with it damaged her health.","g":[["allowed","разрешено"],["poor","бедная"],["married","поженились"],["discovered","открыли"],["elements","элементы"],["chemistry","химия"],["damaged","подорвала, повредила"]],"q":[["Why did Marie Curie move to Paris?",["Women couldn't study at university in Poland","She wanted to meet Pierre","Her family lived there","She got a job there"],0],["What did Marie and Pierre discover?",["polonium and radium","electricity","X-rays","oxygen"],0],["When did she win her second Nobel Prize?",["in 1911","in 1903","in 1895","in 1867"],0],["Which is TRUE according to the text?",["She won Nobel Prizes in two different sciences","She was born in Paris","She was rich as a student","She knew that radiation was dangerous"],0]]},{"t":"A Friend Far Away","l":"A2","text":"Last year my best friend Dmytro moved to Canada with his family. We had known each other since we were six, so it was hard to say goodbye. At first I thought our friendship would end. There is a seven-hour time difference between Ukraine and Canada, so when I come home from school, he is still having breakfast. But we found a solution. Every Sunday at five in the afternoon, my time, we play an online game together and talk on a video call. He tells me about his new school, where students can choose many of their subjects. I tell him news about our old classmates. Dmytro's English is now much better than mine, so he sometimes helps me with my homework. Next summer he is going to visit Ukraine, and I can't wait to see him.","g":[["friendship","дружба"],["time difference","разница во времени"],["solution","решение (проблемы)"],["video call","видеозвонок"],["classmates","одноклассники"],["can't wait","не могу дождаться"]],"q":[["What is the main idea of the text?",["Two friends keep in touch across a long distance","Why Dmytro's family moved to Canada","Differences between schools in Ukraine and Canada","How to learn English quickly"],0],["When do the friends talk?",["every Sunday afternoon","every morning","after school every day","only in summer"],0],["What is Dmytro usually doing when the writer comes home from school?",["having breakfast","sleeping","sitting in lessons","playing football"],0],["How does Dmytro help the writer?",["with his English homework","with football training","with physics","with money"],0]]},{"t":"The Man Who Built the Helicopter","l":"B1","text":"Igor Sikorsky was born in Kyiv in 1889. As a child, he read the novels of Jules Verne and dreamed about flying machines. While he was a student at the Kyiv Polytechnic Institute, he tried to build a helicopter, but the engines of that time were too weak, and his machines could not lift off. Instead of giving up, he turned to aeroplanes. In 1913 he built one of the first four-engine aircraft in the world. A few years later he emigrated to the United States, where he started his own company with very little money. For years he struggled, but he never forgot his childhood dream. Finally, in 1939, his VS-300 helicopter took off successfully. It became the model for most modern helicopters. Today, Sikorsky helicopters are used to rescue people, put out fires and carry patients to hospitals.","g":[["novels","романы"],["engines","двигатели"],["lift off","оторваться от земли, взлететь"],["giving up","сдаваться"],["emigrated","эмигрировал"],["struggled","боролся с трудностями"],["rescue","спасать"]],"q":[["Why did Sikorsky's first helicopters fail?",["The engines were too weak","He had no money","The government stopped him","He was too young to fly"],0],["What did he do after his first failures?",["He built aeroplanes instead","He stopped working on flying machines","He moved to France","He started writing novels"],0],["The phrase 'giving up' is closest in meaning to",["stopping trying","taking off","continuing","building"],0],["Which is TRUE according to the text?",["His VS-300 helicopter flew successfully in 1939","He was born in the United States","He built his first helicopter in 1913","His company was rich from the start"],0]]},{"t":"Plastic in the Ocean","l":"B1","text":"Every year, millions of tonnes of plastic end up in the world's oceans. Much of it comes from things we use only once, such as bottles, bags and straws. Plastic does not disappear; instead, it slowly breaks into tiny pieces called microplastics. Sea animals often mistake these pieces for food. Turtles, for example, sometimes eat plastic bags because they look like jellyfish. Scientists have even found microplastics in fish that people eat. The problem may seem too big for one person to solve, but small actions add up. In our class, we decided to stop buying bottled water and to bring reusable bottles instead. We also organised a clean-up day by the river and collected forty bags of rubbish in three hours. If every school did something similar, the difference would be enormous.","g":[["end up","оказываются, попадают"],["disappear","исчезать"],["tiny","крошечные"],["add up","складываются, накапливаются"],["reusable","многоразовые"],["rubbish","мусор"],["enormous","огромная"]],"q":[["What are microplastics?",["tiny pieces of broken plastic","a new type of bottle","small sea animals","plastic bags"],0],["Why do turtles sometimes eat plastic bags?",["The bags look like jellyfish","The turtles are very hungry","The bags taste good","The bags are colourful"],0],["The word 'enormous' in the text means",["very big","very small","dangerous","unnecessary"],0],["What did the writer's class do?",["They organised a clean-up and used reusable bottles","They built a recycling factory","They wrote to the government","They stopped eating fish"],0]]},{"t":"My First Olympiad","l":"B1","text":"In October I took part in the regional physics olympiad for the first time. My teacher suggested it after I solved a difficult problem that nobody else in the class could solve. Preparing was hard work. For two months I stayed after lessons twice a week, and my teacher gave me problems from previous years. Some of them took me more than an hour. I also watched online lectures by university professors and kept a notebook of useful formulas. On the day of the olympiad, I was so nervous that my hands were shaking. There were five problems and four hours to solve them. I managed to solve three completely and part of the fourth. When the results came out, I had taken fifth place out of sixty participants. It wasn't a prize, but it gave me the confidence to try again next year.","g":[["regional","областная"],["suggested","предложил"],["previous","предыдущих"],["formulas","формулы"],["managed to","сумел, смог"],["participants","участники"],["confidence","уверенность"]],"q":[["Why did the teacher suggest the olympiad?",["The writer solved a problem nobody else could","The writer asked to take part","His parents wanted it","He had the best marks in all subjects"],0],["How many problems did he solve completely?",["three","four","five","two"],0],["What place did he take?",["fifth","first","third","sixtieth"],0],["How did the result make him feel?",["confident enough to try again","disappointed and ready to give up","angry with his teacher","bored with physics"],0]]},{"t":"Kharkiv, a City of Students","l":"B1","text":"Kharkiv, in the north-east of Ukraine, is the country's second-largest city. It is often called a city of students because it has dozens of universities and colleges. Kharkiv University, founded in 1804, is one of the oldest in Eastern Europe, and several Nobel Prize winners studied or worked there. The city is also famous for Freedom Square, one of the largest city squares in Europe, and for Gorky Park, where families come to relax at weekends. Kharkiv has a strong engineering tradition: tractors, planes and turbines have been designed and produced here for many years. In 1932, physicists in Kharkiv were among the first in the world to split the atomic nucleus. Today the city is known for its IT companies and its energetic young people, who love music, sport and new ideas.","g":[["north-east","северо-восток"],["dozens","десятки"],["founded","основан"],["square","площадь"],["relax","отдыхать"],["designed","разрабатывались, проектировались"],["energetic","энергичные"]],"q":[["Why is Kharkiv called a city of students?",["It has dozens of universities and colleges","Students built the city","It has the largest school in Europe","Most people there are under twenty"],0],["When was Kharkiv University founded?",["in 1804","in 1932","in 1904","in 1832"],0],["Which of these is NOT mentioned in the text?",["a famous football stadium","Freedom Square","Gorky Park","IT companies"],0],["The word 'dozens' in the text means",["many","very few","exactly two","none"],0]]},{"t":"How Social Media Changes Us","l":"B1","text":"Most teenagers today spend several hours a day on social media. Platforms like Instagram and TikTok help us stay in touch with friends, follow our hobbies and discover new music. However, psychologists warn that they can also affect our mood. When we constantly see photos of other people's perfect holidays and perfect bodies, we start to compare ourselves with them and may feel that our own lives are boring. Another problem is that apps are designed to keep us scrolling. Every new like gives the brain a small reward, so it becomes difficult to stop. Experts recommend a few simple habits: turn off notifications, don't use your phone in bed, and follow accounts that teach you something useful. Social media is a tool, and like any tool, it can be used well or badly.","g":[["stay in touch","поддерживать связь"],["warn","предупреждают"],["affect","влиять"],["mood","настроение"],["compare","сравнивать"],["reward","награда, поощрение"],["notifications","уведомления"]],"q":[["What is the main idea of the text?",["Social media has both benefits and risks","Teenagers should delete all apps","Instagram is better than TikTok","Psychologists use social media a lot"],0],["Why can social media make us feel our lives are boring?",["We compare ourselves with other people's perfect photos","Apps show only sad news","Friends stop talking to us","We have no time for hobbies"],0],["Why is it difficult to stop scrolling?",["Every like gives the brain a small reward","The phone battery lasts a long time","Videos are very long","Notifications are turned off"],0],["Which of these do experts recommend?",["turning off notifications","using your phone in bed","following as many accounts as possible","posting every day"],0]]},{"t":"English Camp in the Mountains","l":"B1","text":"Last July I spent three weeks at an English language camp in the Carpathian Mountains. There were about eighty teenagers from different parts of Ukraine and a few volunteer teachers from Britain and Canada. The main rule of the camp was simple: speak only English, even during meals. For the first few days this was really tiring, and I often had to use gestures when I didn't know a word. Lessons took place in the mornings, but they were very different from school. Instead of grammar exercises, we did projects, debates and even made a short film. In the afternoons we went hiking, swam in a cold mountain lake or played volleyball. By the end of the camp I noticed that I had started thinking in English. I also made friends from Odesa, Dnipro and Chernivtsi, and we still chat every day.","g":[["camp","лагерь"],["gestures","жесты"],["took place","проходили"],["debates","дебаты"],["hiking","пешие походы"],["noticed","заметил"],["chat","общаемся, переписываемся"]],"q":[["What was the main rule of the camp?",["Speak only English","Don't use phones","Go to bed early","Do grammar exercises every day"],0],["Why were the first days tiring?",["Speaking only English was difficult","The lessons were too long","The weather was very hot","He had to walk a lot"],0],["How were the lessons different from school?",["They included projects, debates and a film","They took place in the evening","They were only about grammar","They were taught in Ukrainian"],0],["What change did the writer notice by the end?",["He had started thinking in English","He had forgotten some Ukrainian words","He wanted to become a teacher","He had stopped using his phone"],0]]},{"t":"Who Invented the Internet?","l":"B1","text":"Many people believe the internet was invented by one person, but in fact it was developed by many scientists over several decades. In the late 1960s, the US government funded a project called ARPANET, which connected computers at a few universities. Its aim was to allow researchers to share information quickly. In the 1970s, Vint Cerf and Bob Kahn created a set of rules, called TCP/IP, that let different networks communicate with each other. This is why they are often called the fathers of the internet. However, the internet only became popular with ordinary people in the 1990s, after the British scientist Tim Berners-Lee invented the World Wide Web. He created a system of web pages connected by links and decided not to patent it, so anyone could use it for free.","g":[["invented","изобретён"],["decades","десятилетия"],["funded","финансировало"],["aim","цель"],["researchers","исследователи"],["ordinary","обычные"],["patent","запатентовать"]],"q":[["What is the main idea of the text?",["The internet was created by many people step by step","Tim Berners-Lee invented the internet alone","ARPANET was a failure","The internet is free because of the government"],0],["What was the aim of ARPANET?",["to help researchers share information quickly","to sell computers","to create video games","to connect people's homes"],0],["Why are Cerf and Kahn called the fathers of the internet?",["They created rules that let networks communicate","They funded ARPANET","They invented the World Wide Web","They built the first computer"],0],["What did Tim Berners-Lee decide?",["not to patent the Web","to sell the Web","to work for the government","to close ARPANET"],0]]},{"t":"Odesa by the Sea","l":"B1","text":"Odesa is a large port city on the Black Sea coast in the south of Ukraine. It was founded in 1794 and quickly grew into an important trading centre. People from many countries, including Greeks, Italians, Jews and French, settled there, and this mixture of cultures gave Odesa its unique character. People from Odesa are famous for their sense of humour; the city even holds a humour festival every year on the first of April. One of Odesa's best-known symbols is the Potemkin Stairs, a giant staircase with 192 steps leading down towards the sea. The Odesa Opera House, built at the end of the nineteenth century, is considered one of the most beautiful theatres in Europe. In summer, thousands of tourists come to enjoy the beaches, the warm sea and the city's lively atmosphere.","g":[["coast","побережье"],["trading","торговый"],["settled","поселились"],["unique","уникальный"],["sense of humour","чувство юмора"],["staircase","лестница"],["lively","оживлённая"]],"q":[["Which is TRUE according to the text?",["People from many countries settled in Odesa","Odesa was founded in 1894","The Potemkin Stairs have 92 steps","The Opera House was built in the twentieth century"],0],["What happens in Odesa on the first of April?",["a humour festival","a music festival","a sea festival","the Opera House's birthday"],0],["The word 'settled' in the text means",["came to live permanently","visited for a short time","sailed away","argued"],0],["What gave Odesa its unique character?",["the mixture of cultures","the warm sea","the Opera House","the beaches"],0]]},{"t":"Should Homework Be Banned?","l":"B1","text":"In some countries, schools have reduced or even stopped giving homework to younger students. Supporters of this idea argue that children already spend six or seven hours at school and need time to rest, play sports and be with their families. They also point out that homework can be unfair, because some students have quiet rooms and helpful parents, while others don't. On the other hand, many teachers believe that homework is necessary. Practising at home helps students remember new material and develop independence. In my opinion, the answer is somewhere in the middle. Homework should be short and meaningful, not just copying exercises from a textbook. For example, our physics teacher sometimes asks us to film a simple experiment at home, which is both useful and fun. Quality is more important than quantity.","g":[["reduced","сократили"],["Supporters","сторонники"],["argue","утверждают"],["unfair","несправедливой"],["independence","самостоятельность"],["meaningful","осмысленным"],["quantity","количество"]],"q":[["Why can homework be unfair, according to its critics?",["Some students have better conditions at home","Teachers give too much of it","It is always too difficult","Parents do it for their children"],0],["What do many teachers believe?",["Homework helps students remember new material","Homework should be banned","Students should study at night","Textbooks are useless"],0],["What is the writer's opinion?",["Homework should be short and meaningful","Homework should be banned completely","Students need more homework","Only physics needs homework"],0],["The word 'quantity' in the text means",["amount","quality","speed","difficulty"],0]]},{"t":"Electric Cars","l":"B1","text":"Electric cars are becoming more common on the roads of Ukraine and the rest of the world. Unlike traditional cars, they don't burn petrol or diesel, so they don't produce exhaust fumes in the city. This makes the air cleaner and the streets quieter. Electric cars are also cheaper to run, because charging a battery costs less than filling a tank. However, they still have some disadvantages. They are usually more expensive to buy, and in some areas there are not enough charging stations. Long journeys need careful planning, as charging can take from twenty minutes to several hours. Critics also note that producing batteries requires rare metals and a lot of energy. Engineers are working hard to make batteries cheaper, lighter and easier to recycle. Many experts predict that in twenty years most new cars will be electric.","g":[["Unlike","в отличие от"],["petrol","бензин"],["exhaust fumes","выхлопные газы"],["tank","бак"],["rare","редкие"],["recycle","перерабатывать"],["predict","прогнозируют"]],"q":[["Why do electric cars make city air cleaner?",["They don't produce exhaust fumes","They are quieter","They are smaller","They use rare metals"],0],["Which disadvantage is mentioned in the text?",["They are more expensive to buy","They are very noisy","They are slow","They can't travel long distances at all"],0],["What are engineers trying to do?",["make batteries cheaper, lighter and easier to recycle","build more petrol stations","make cars faster","find new rare metals"],0],["What do many experts predict?",["Most new cars will be electric in twenty years","Electric cars will disappear","Petrol will become cheaper","Batteries will not change"],0]]},{"t":"Leonardo: Artist and Engineer","l":"B1","text":"Most people know Leonardo da Vinci as the painter of the Mona Lisa, but he was much more than an artist. Born in Italy in 1452, Leonardo was curious about everything around him. He filled thousands of notebook pages with drawings and ideas about anatomy, water, light and machines. He designed a flying machine with wings like a bat, a diving suit and even a mechanical knight that could move its arms. Interestingly, he wrote most of his notes in mirror writing, from right to left. Many of his inventions were never built, because the technology of his time was not advanced enough. Centuries later, engineers built models from his drawings and discovered that several of them actually worked. Leonardo shows that art and science are not opposites but can support each other.","g":[["curious","любознательный"],["anatomy","анатомия"],["wings","крылья"],["diving suit","водолазный костюм"],["mirror writing","зеркальное письмо"],["advanced","развитой, передовой"],["opposites","противоположности"]],"q":[["What is the main idea of the text?",["Leonardo was both an artist and an inventor","The Mona Lisa is the most famous painting","Leonardo built hundreds of machines","Mirror writing was popular in Italy"],0],["Why were many of his inventions never built?",["The technology of his time was not advanced enough","He didn't have enough money","He lost his notebooks","Nobody was interested in them"],0],["How did Leonardo write most of his notes?",["from right to left","in a secret number code","only in Latin","only with pictures"],0],["What did engineers discover centuries later?",["Several of his designs actually worked","None of his designs worked","He had copied other inventors","His notebooks were fake"],0]]},{"t":"A First Aid Course","l":"B1","text":"Last month our lyceum invited a paramedic to teach a basic first aid course to students in years nine and ten. At first some of my classmates thought it would be boring, but in the end everyone agreed it was one of the most useful lessons of the year. We learned what to do if someone faints, how to treat minor burns and cuts, and how to help a person who is choking. The most important part of the course was learning CPR, which helps keep a person alive when their heart stops. We practised on special dummies, pressing hard and fast on the chest about a hundred times per minute. The paramedic explained that in an emergency the first few minutes are critical, and that a calm person who knows what to do can save a life. At the end, each of us received a certificate.","g":[["paramedic","фельдшер, парамедик"],["faints","теряет сознание"],["minor","незначительные, лёгкие"],["choking","подавился, задыхается"],["dummies","манекены"],["emergency","экстренная ситуация"],["certificate","сертификат"]],"q":[["What did some students think at first?",["The course would be boring","It would be dangerous","It would be too difficult","It would be too short"],0],["Which of these is NOT mentioned in the text?",["how to treat a broken leg","what to do if someone faints","how to treat burns","how to help a choking person"],0],["How fast should you press on the chest during CPR?",["about a hundred times per minute","about ten times per minute","as slowly as possible","once every few seconds"],0],["The word 'critical' in the text means",["extremely important","dangerous","boring","unkind"],0]]},{"t":"Why Teenagers Need Sleep","l":"B1","text":"Teenagers are often told that they are lazy because they find it hard to get up in the morning. However, scientists say this is not about laziness. During adolescence, the body's internal clock changes, and the brain starts producing the sleep hormone melatonin later in the evening. As a result, many teenagers don't feel sleepy until eleven or even midnight. At the same time, they need eight to ten hours of sleep a night. When school starts early, many students simply don't get enough rest. Lack of sleep affects concentration, memory and mood, and it can even make people more likely to get ill. Some schools in the USA have moved the start of lessons to half past eight or later, and they have reported better attendance and results. Meanwhile, experts advise teenagers to avoid screens for an hour before bed.","g":[["lazy","ленивые"],["adolescence","подростковый возраст"],["internal clock","внутренние (биологические) часы"],["Lack of","нехватка"],["concentration","концентрация внимания"],["attendance","посещаемость"],["avoid","избегать"]],"q":[["According to scientists, why do teenagers find it hard to get up early?",["Their internal clock changes","They are lazy","They play games all night","They eat too late"],0],["How much sleep do teenagers need?",["eight to ten hours","about six hours","five to seven hours","twelve hours"],0],["What happened in schools that started lessons later?",["Attendance and results improved","Students slept in class","Teachers complained","Nothing changed"],0],["Which is TRUE according to the text?",["Lack of sleep can affect memory","Melatonin is produced in the morning","Screens help teenagers fall asleep","Teenagers need less sleep than adults"],0]]},{"t":"A Ukrainian in Space","l":"B1","text":"In November 1997, Leonid Kadenyuk became the first astronaut of independent Ukraine. He flew into space on board the American Space Shuttle Columbia as part of an international crew of six. Kadenyuk was born in 1951 in a small village in the Chernivtsi region. From childhood he dreamed of flying, and after school he became a pilot and later a test pilot. He trained for many years before he got his chance to go into space. During the mission, which lasted about sixteen days, he carried out biological experiments, studying how plants grow in zero gravity. The results helped scientists understand how to grow food on long space journeys. After returning to Earth, Kadenyuk worked in the Ukrainian parliament and spoke to students across the country, encouraging them to study science. Today schools and streets in Ukraine are named after him.","g":[["crew","экипаж"],["region","область"],["test pilot","лётчик-испытатель"],["carried out","проводил"],["zero gravity","невесомость"],["parliament","парламент"],["encouraging","вдохновляя, побуждая"]],"q":[["Which is TRUE according to the text?",["Kadenyuk flew on an American shuttle","He was the only person on board","He was born in Kyiv","He flew into space in 2007"],0],["What did he study in space?",["how plants grow in zero gravity","distant stars","how people sleep","the weather on Earth"],0],["Why were his experiments important?",["They helped scientists understand how to grow food in space","They found water on the Moon","They made shuttles faster","They proved that plants can't grow in space"],0],["What did he do after returning to Earth?",["He worked in parliament and spoke to students","He became a teacher in his village","He flew into space again","He started writing novels"],0]]},{"t":"Learning to Code","l":"B1","text":"When I was twelve, I wrote my first program: a simple game in Scratch where a cat chased a mouse. Since then programming has become my main hobby. Last year I moved to Python, a language that is popular because its code is easy to read. I learned mostly from free online courses, and whenever I got stuck, I searched for answers on forums. At first I tried to memorise every command, but I soon realised that real programmers constantly look things up. What matters more is learning to break a big problem into small steps. My biggest project so far is a Telegram bot for my class that reminds everyone about homework deadlines and tests. Around twenty classmates use it every day. Of course, it still has bugs, and fixing them sometimes takes longer than writing new features. Next year I would like to try developing a mobile app.","g":[["memorise","запомнить, выучить наизусть"],["got stuck","застревал, не знал, что делать дальше"],["forums","форумы"],["look things up","искать информацию, справляться"],["deadlines","сроки сдачи"],["bugs","ошибки в программе, баги"],["features","функции"]],"q":[["Why is Python popular, according to the text?",["Its code is easy to read","It is the newest language","It is only for games","It was created by Telegram"],0],["What did the writer soon realise?",["Real programmers often look things up","He had to memorise every command","Forums are useless","Scratch is better than Python"],0],["What does his Telegram bot do?",["It reminds classmates about deadlines and tests","It plays games","It translates texts","It finds bugs in other programs"],0],["The phrase 'got stuck' in the text means",["could not continue","got bored","finished quickly","got angry"],0]]},{"t":"The Real Cost of Fast Fashion","l":"B1","text":"Clothes have never been cheaper than they are today. Big brands release new collections almost every week, and many young people buy T-shirts or jeans that they wear only a few times. This trend is called fast fashion, and it has a hidden cost for the planet. Producing a single cotton T-shirt can require around 2,700 litres of water, which is enough for one person to drink for over two years. Factories also release chemicals into rivers, and millions of tonnes of clothes end up in landfills every year. What can teenagers do? First, buy less and choose better quality. Second, give old clothes a second life by swapping them with friends, selling them online or donating them to charity. Finally, learn to repair simple things, like a missing button. Being fashionable doesn't have to harm the environment.","g":[["release","выпускают"],["hidden","скрытая"],["cotton","хлопковая"],["landfills","свалки"],["swapping","обмениваясь"],["donating","отдавая, жертвуя"],["repair","чинить"]],"q":[["What is fast fashion?",["buying cheap clothes often and wearing them only a few times","making clothes by hand","clothes for sport","expensive designer clothes"],0],["How much water can one cotton T-shirt need?",["around 2,700 litres","around 270 litres","around 27 litres","around 27,000 litres"],0],["Which of these is NOT suggested in the text?",["buying new c const $ = id => document.getElementById(id);

function rng32(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sshuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function trBase(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'")
    .replace(/\bcan't\b/g, "cannot").replace(/\bcan not\b/g, "cannot").replace(/\bwon't\b/g, "will not").replace(/\bshan't\b/g, "shall not")
    .replace(/n't\b/g, " not").replace(/'m\b/g, " am").replace(/'re\b/g, " are").replace(/'ve\b/g, " have").replace(/'ll\b/g, " will")
    .replace(/\bo'clock\b/g, "oclock").replace(/[.,!?;:"«»()—–]/g, " ").replace(/ - /g, " ").replace(/\s+/g, " ").trim();
}
function trForms(s) { let out = [trBase(s)]; [[/'s\b/g, [" is", " has"]], [/'d\b/g, [" would", " had"]]].forEach(([re, subs]) => { out = out.flatMap(x => x.search(re) >= 0 ? subs.map(r => x.replace(re, r)) : [x]); }); return out.map(x => x.replace(/'/g, "")); }
const DAYS = ["понедельник", "вторник", "среда", "четверг", "пятница"];

/* ---------- сборка уроков (одинаково для приложения и PDF) ---------- */
let LESSONS = null;
function buildLessons() {
  if (LESSONS) return LESSONS;
  const C = DATA.cfg, T = DATA.topics, W = C.weeks;
  LESSONS = [];
  if (C.mode === "kid") {           // 1 тема в неделю (Олег)
    for (let w = 1; w <= W; w++) {
      const tp = T[w - 1], prev = T.slice(0, w - 1);
      for (let d = 1; d <= 5; d++) {
        const n = (w - 1) * 5 + d, rnd = rng32(n * 7919 + 11), L = { n, w, d, topics: [tp] };
        const oldWords = prev.flatMap(t => t.words);
        if (d < 5) {
          L.kind = d === 1 ? "new" : "practice";
          L.words = tp.words.slice((d - 1) * 3, d * 3);
          L.match = L.words.concat(sshuffle(d === 1 ? oldWords : tp.words.slice(0, (d - 1) * 3).concat(oldWords.slice(-6)), rnd).slice(0, 2));
          if (L.match.length < 5) L.match = L.match.concat(sshuffle(tp.words.filter(x => !L.match.includes(x)), rnd).slice(0, 5 - L.match.length));
          L.listen = sshuffle(tp.words.slice(0, d * 3), rnd).slice(0, 3);
          const qs = tp.quiz, qi = [[0, 5], [5, 10], [10, 14], null][d - 1];
          L.quiz = qi ? qs.slice(qi[0], qi[1]) : [];
          if (L.quiz.length < 5) L.quiz = L.quiz.concat(sshuffle(d === 4 && prev.length ? prev.flatMap(t => t.quiz) : qs.filter(x => !L.quiz.includes(x)), rnd).slice(0, 5 - L.quiz.length));
          L.build = d < 4 ? tp.build.slice((d - 1) * 2, d * 2) : sshuffle(prev.length ? prev.flatMap(t => t.build) : tp.build, rnd).slice(0, 2);
        } else {
          L.kind = "review";
          L.match = sshuffle(tp.words, rnd).slice(0, 6);
          L.quiz = sshuffle(tp.quiz, rnd).slice(0, 3).concat(sshuffle(prev.length ? prev.flatMap(t => t.quiz) : tp.quiz, rnd).slice(0, 2));
          L.read = DATA.reads[w - 1] || null;
          L.build = sshuffle(tp.build, rnd).slice(0, 1);
        }
        LESSONS.push(L);
      }
    }
  } else {                          // 2 темы в неделю (Игорь)
    for (let w = 1; w <= W; w++) {
      const A = T[(w - 1) * 2], B = T[(w - 1) * 2 + 1], ws = DATA.words[w - 1] ? DATA.words[w - 1].words : [];
      for (let d = 1; d <= 5; d++) {
        const n = (w - 1) * 5 + d, rnd = rng32(n * 7919 + 11), L = { n, w, d };
        if (d < 5) {
          const tp = d % 2 ? A : B; L.topics = [tp]; L.kind = d <= 2 ? "new" : "practice";
          L.words = ws.slice((d - 1) * 5, d * 5);
          L.match = L.words;
          L.quiz = d <= 2 ? tp.quiz.slice(0, 7) : tp.quiz.slice(7, 14);
          L.tr = d <= 2 ? tp.tr.slice(0, 2) : tp.tr.slice(2, 4);
          if (d === 3) L.read = DATA.reads[w - 1] || null;
        } else {
          L.topics = [A, B]; L.kind = "review";
          L.match = sshuffle(ws, rnd).slice(0, 6);
          L.quiz = sshuffle(A.quiz, rnd).slice(0, 3).concat(sshuffle(B.quiz, rnd).slice(0, 3));

}
if (typeof module !== "undefined") module.exports = { buildLessons, rng32, sshuffle, setData: d => { globalThis.DATA_ = d; } };

/* ---------- интерфейс ---------- */
if (typeof document !== "undefined" && DATA) {
  const C = DATA.cfg;
  let cur = store.get("cur", 1), done = store.get("done", {}), stars = store.get("stars", 0);
  const addStar = k => { stars += k; store.set("stars", stars); $("stars").textContent = "⭐ " + stars; };
  const KIND = { new: "Новая тема", practice: "Тренировка", review: "Пятница: повторение" };
  function header() {
    const Ls = buildLessons(), nd = Object.keys(done).length;
    $("stars").textContent = "⭐ " + stars;
    $("hello").textContent = C.hello;
    $("sub").textContent = C.sub;
    $("pbar").style.width = Math.round(100 * nd / Ls.length) + "%";
    $("ptext").textContent = `Пройдено уроков: ${nd} из ${Ls.length}`;
    $("weeks").innerHTML = Array.from({ length: C.weeks }, (_, i) => i + 1).map(w => {
      const ws = Ls.filter(L => L.w === w), tt = C.mode === "kid" ? `${ws[0].topics[0].emoji || ""} ${ws[0].topics[0].t}` : `${ws[0].topics[0].t} · ${ws[1].topics[0].t}`;
      return `<div><div class="wk-h">Неделя ${w} <span>${esc(tt)}</span></div><div class="days">${ws.map(L => `<button type="button" data-l="${L.n}" class="${done[L.n] ? "done" : ""}" aria-pressed="${L.n === cur}">${L.n}${done[L.n] ? "✓" : ""}</button>`).join("")}</div></div>`;
    }).join("");
    document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { cur = +b.dataset.l; store.set("cur", cur); header(); show(); $("lesson").scrollIntoView({ block: "start" }); });
  }
  function quizHtml(items, pre, seedBase) {
    return items.map(([q, opts, ok, why], i) => {
      const order = sshuffle(opts.map((o, j) => j), rng32(seedBase + i));
      return `<div class="card q" data-ok="${ok}"><div class="q-text">${i + 1}. ${esc(q).replace("___", '<span class="gap">?</span>')}</div>
        <div class="opts">${order.map(j => `<button type="button" id="${pre}-${i}-${j}" data-j="${j}">${esc(opts[j])}</button>`).join("")}</div>${why ? `<div class="expl" hidden>${esc(why)}</div>` : ""}</div>`;
    }).join("");
  }
  function bindQuiz(root) {
    root.querySelectorAll(".q:not(.lq)").forEach(qe => qe.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      const ok = +qe.dataset.ok;
      qe.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.j === ok) x.classList.add("right"); });
      if (+b.dataset.j !== ok) b.classList.add("wrong"); else addStar(1);
      const g = qe.querySelector(".gap"); if (g) g.textContent = qe.querySelector(`button[data-j="${ok}"]`).textContent;
      const e = qe.querySelector(".expl"); if (e) e.hidden = false;
    }));
  }
  function matchGame(box, pairs, seed) {
    const rnd = rng32(seed), left = sshuffle(pairs.map((p, i) => i), rnd), right = sshuffle(pairs.map((p, i) => i), rnd);
    box.innerHTML = `<div class="match"><div class="col">${left.map(i => `<button type="button" data-side="l" data-i="${i}">${C.emoji && pairs[i][2] ? pairs[i][2] + " " : ""}${esc(pairs[i][0])}</button>`).join("")}</div>
      <div class="col">${right.map(i => `<button type="button" data-side="r" data-i="${i}">${esc(pairs[i][1])}</button>`).join("")}</div></div><p class="small muted" data-msg>Нажми слово слева, потом его перевод справа.</p>`;
    let sel = null, left_ = pairs.length;
    box.querySelectorAll("button").forEach(b => b.onclick = () => {
      if (b.classList.contains("done")) return;
      if (b.dataset.side === "l") { box.querySelectorAll('[data-side="l"]').forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b; speak(pairs[+b.dataset.i][0]); return; }
      if (!sel) return;
      if (sel.dataset.i === b.dataset.i) { sel.classList.replace("sel", "done"); b.classList.add("done"); sel = null; addStar(1); if (--left_ === 0) box.querySelector("[data-msg]").textContent = "Отлично! Все пары найдены 🎉"; }
      else { b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 350); }
    });
  }
  function listenGame(box, words, all, seed) {
    const rnd = rng32(seed);
    box.innerHTML = words.map((w, i) => {
      const opts = sshuffle([w].concat(sshuffle(all.filter(x => x !== w), rng32(seed + i)).slice(0, 2)), rng32(seed * 3 + i));
      return `<div class="card q lq" data-ok="${esc(w[0])}"><div class="q-text">${i + 1}. Послушай ${sayBtn(w[0])} и выбери слово</div><div class="opts">${opts.map(o => `<button type="button" data-w="${esc(o[0])}">${C.emoji && o[2] ? o[2] + " " : ""}${esc(o[0])}</button>`).join("")}</div></div>`;
    }).join("");
    box.querySelectorAll(".q").forEach(qe => qe.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
      qe.querySelectorAll("[data-w]").forEach(x => { x.disabled = true; if (x.dataset.w === qe.dataset.ok) x.classList.add("right"); });
      if (b.dataset.w !== qe.dataset.ok) b.classList.add("wrong"); else addStar(1);
    }));
  }
  function buildGame(box, items, seed) {
    box.innerHTML = items.map(([en, ru], i) => {
      const toks = en.replace(/[.!?]$/, "").split(/\s+/), mark = en.match(/[.!?]$/) ? en.slice(-1) : "";
      let sh = sshuffle(toks.map((t, k) => k), rng32(seed + i)); if (toks.length > 1 && sh.every((v, k) => v === k)) sh = sh.reverse();
      return `<div class="card stack" data-b="${i}" data-ans="${esc(toks.join(" "))}" data-mark="${esc(mark)}"><div><b>${i + 1}. ${esc(ru)}</b></div><div class="build-line"></div>
        <div class="build-pool">${sh.map(k => `<button type="button" class="chip" data-k="${k}">${esc(toks[k])}</button>`).join("")}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-chk>Проверить</button><button type="button" class="btn ghost" data-clr>Заново</button></div><div class="res" hidden></div></div>`;
    }).join("");
    box.querySelectorAll("[data-b]").forEach(c => {
      const line = c.querySelector(".build-line"), res = c.querySelector(".res");
      c.querySelectorAll(".build-pool .chip").forEach(ch => ch.onclick = () => {
        if (ch.classList.contains("used")) return; ch.classList.add("used");
        const t = document.createElement("button"); t.type = "button"; t.className = "chip"; t.textContent = ch.textContent; t.dataset.k = ch.dataset.k;
        t.onclick = () => { t.remove(); ch.classList.remove("used"); }; line.appendChild(t);
      });
      c.querySelector("[data-clr]").onclick = () => { line.innerHTML = ""; c.querySelectorAll(".build-pool .chip").forEach(x => x.classList.remove("used")); res.hidden = true; };
      c.querySelector("[data-chk]").onclick = () => {
        const got = [...line.children].map(x => x.textContent).join(" "), ok = got === c.dataset.ans;
        res.hidden = false; res.innerHTML = ok ? `<b style="color:var(--ok)">✓ Верно! ${sayBtn(c.dataset.ans)}</b>` : `<b style="color:var(--bad)">Пока не так.</b><span>Правильно: ${esc(c.dataset.ans + c.dataset.mark)} ${sayBtn(c.dataset.ans)}</span>`;
        if (ok && !c.dataset.got) { c.dataset.got = 1; addStar(2); speak(c.dataset.ans); }
      };
    });
  }
  function trGame(box, items) {
    box.innerHTML = items.map(([ru, hint, ans], i) => `<div class="card stack" data-t="${i}"><div><b>${i + 1}. ${esc(ru)}</b> <span class="small muted">(${esc(hint)})</span></div>
      <textarea rows="2" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Напиши по-английски"></textarea>
      <div><button type="button" class="btn">Проверить</button></div><div class="res" hidden></div></div>`).join("");
    box.querySelectorAll("[data-t]").forEach(c => {
      const it = items[+c.dataset.t], ta = c.querySelector("textarea"), res = c.querySelector(".res");
      c.querySelector(".btn").onclick = () => {
        const v = ta.value.trim(); if (!v) { ta.focus(); return; }
        const f = trForms(v), ok = it[2].some(a => trForms(a).some(x => f.includes(x)));
        res.hidden = false; res.innerHTML = `<b style="color:var(${ok ? "--ok" : "--muted"})">${ok ? "✓ Верно!" : "Сравни с вариантом — если смысл тот же, засчитывай себе"}</b>${it[2].slice(0, 2).map(a => `<span>${sayBtn(a)} ${esc(a)}</span>`).join("")}`;
        if (ok && !c.dataset.got) { c.dataset.got = 1; ta.classList.add("ok"); addStar(2); }
      };
    });
  }
  function readHtml(r, L, pre) {
    let html = esc(r.text);
    r.g.forEach(([en, ru]) => { html = html.replace(new RegExp("\\b(" + en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "i"), `<mark title="${esc(ru)}">$1</mark>`); });
    return `<div class="card stack"><div style="display:flex;gap:8px;align-items:center"><b>${esc(r.t)}</b><span class="small muted">${r.l}</span></div>
      <div><button type="button" class="btn ghost" data-say="${esc(r.text)}">🔊 Послушать текст</button></div><p class="read-text" style="margin:0">${html}</p>
      <div class="gloss">${r.g.map(([en, ru]) => `<div><b>${esc(en)}</b> — <span>${esc(ru)}</span></div>`).join("")}</div></div>
      <div class="stack">${quizHtml(r.q.map(([q, o, ok]) => [q, o, ok, ""]), pre, L.n * 97)}</div>`;
  }
  function clozeHtml(cz, L) {
    let txt = esc(cz.text); for (let k = 1; k <= 5; k++) txt = txt.replace(`(${k})___`, `<span class="gp" id="cz-${k}">(${k})</span>`);
    return `<div class="card stack"><b>${esc(cz.t)}</b><p class="cloze-text" style="margin:0">${txt}</p></div>
      <div class="stack">${cz.gaps.map((opts, i) => { const order = sshuffle(opts.map((o, j) => j), rng32(L.n * 53 + i)); return `<div class="card q" data-ok="0" data-gap="${i + 1}"><div class="q-text">Пропуск ${i + 1}</div><div class="opts">${order.map(j => `<button type="button" data-j="${j}">${esc(opts[j])}</button>`).join("")}</div></div>`; }).join("")}</div>`;
  }
  function show() {
    const L = buildLessons()[cur - 1]; if (!L) return;
    const tps = L.topics, s = [];
    let k = 0; const H = t => `<h2>${++k}. ${t}</h2>`;
    s.push(`<h1 style="margin-top:28px">Урок ${L.n} ${C.mode === "kid" ? tps[0].emoji || "" : ""}</h1><p class="muted">Неделя ${L.w} · ${DAYS[L.d - 1]} · ${KIND[L.kind]} · ≈ 15 минут</p>`);
    s.push(H(L.kind === "review" && tps.length > 1 ? "Правила недели" : "Правило") + tps.map(tp => `<div class="card rule"><b>${esc(tp.t)}</b><span>${esc(tp.rule)}</span>
      <div class="exl">${tp.ex.slice(0, L.kind === "new" ? 5 : 3).map(([en, ru]) => `<div>${sayBtn(en)}<div><div>${hl(en)}</div><div class="tr">${esc(ru)}</div></div></div>`).join("")}</div></div>`).join(""));
    if (L.words && L.words.length) s.push(H("Новые слова") + `<div class="grid-w">${L.words.map(w => C.mode === "kid"
      ? `<div class="card wcard"><div class="emo">${w[2] || ""}</div><div class="en">${esc(w[0])}</div>${sayBtn(w[0])}<div>${esc(w[1])}</div><div class="ex">${hl(w[3] || "")}</div></div>`
      : `<div class="card wcard"><div class="en">${esc(w[0])}</div>${sayBtn(w[0])}<div>${esc(w[1])}</div><div class="ex">${hl(w[2] || "")}</div></div>`).join("")}</div>`);

    if (L.quiz && L.quiz.length) s.push(H("Тест") + `<div class="stack" id="g-quiz">${quizHtml(L.quiz, "q", L.n * 31)}</div>`);
    if (L.build && L.build.length) s.push(H("Собери предложение") + `<div class="stack" id="g-build"></div>`);
    if (L.tr && L.tr.length) s.push(H("Переведи на английский") + `<div class="stack" id="g-tr"></div>`);
    if (L.read) s.push(H(C.mode === "kid" ? "Читаем историю" : "Чтение (как на НМТ)") + `<div class="stack" id="g-read">${readHtml(L.read, L, "r")}</div>`);
    if (L.cloze) s.push(H("Use of English (как на НМТ)") + `<p class="muted small">Выбери правильное слово для каждого пропуска.</p><div class="stack" id="g-cloze">${clozeHtml(L.cloze, L)}</div>`);

      <button type="button" class="btn" id="fin">${done[L.n] ? "К следующему уроку →" : "Урок пройден ✓ (+5 ⭐)"}</button>${cur > 1 ? `<button type="button" class="btn ghost" id="prev">← предыдущий урок</button>` : ""}</div>`);
    $("lesson").innerHTML = s.join("");

    if (L.match && L.match.length) matchGame($("g-match"), L.match.map(w => C.mode === "kid" ? [w[0], w[1], w[2]] : [w[0], w[1]]), L.n * 13);
    bindQuiz($("lesson"));
    if (L.build && L.build.length) buildGame($("g-build"), L.build, L.n * 19);
    if (L.tr && L.tr.length) trGame($("g-tr"), L.tr);
    if (L.cloze) $("g-cloze").querySelectorAll(".q").forEach(qe => qe.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      const g = $("cz-" + qe.dataset.gap); if (g) g.textContent = L.cloze.gaps[+qe.dataset.gap - 1][0];
    })));
    $("fin").onclick = () => { if (!done[L.n]) { done[L.n] = 1; store.set("done", done); addStar(5); } if (cur < buildLessons().length) { cur++; store.set("cur", cur); } header(); show(); $("lesson").scrollIntoView({ block: "start" }); };
    const p = $("prev"); if (p) p.onclick = () => { cur--; store.set("cur", cur); header(); show(); $("lesson").scrollIntoView({ block: "start" }); };
  }
  header(); show();
  (async () => { try { if (window.claude && window.claude.use) { const t = await window.claude.use("tts"); if (t) { TTS = t; if (!canSpeak) show(); } } } catch (e) {} })();
}
