 \"The Brave Guinea Pigs\".","g":[["competition","соревнование"],["didn't care","нам было всё равно"],["practised","тренировались"],["protect","защищать"],["gems","кристаллы"]],"q":[["What was the name of Oleg's team?",["The Guinea Pigs","The Brawlers","5-B"],0],["Why did they practise only one hour?",["Mum doesn't let Oleg play more","the game was broken","they were tired"],0],["What was Oleg's job in the team?",["to collect the gems","to attack","to protect"],0],["Why did the other children stop laughing?",["the team played well and reached the final","the team changed its name","the teacher told them to stop"],0]]},{"t":"Very Old Computers","l":"A2","text":"One day we went to Poltava to visit a computer museum. I thought all computers were small and fast, like my tablet. But in the museum there were very old computers. Some of them were as big as a cupboard! There were computers with no mouse and screens with only green letters. My brother Igor read the signs and explained everything to me. The best part was that we could play some old games. The pictures were made of big squares, and the sound was \"beep-beep\". I played a game with a little tennis ball, and I beat Igor! Mum said, \"When I was a child, these computers were new.\" I couldn't believe it!","g":[["cupboard","шкаф"],["screens","экраны"],["explained","объяснял"],["squares","квадраты"],["beat","обыграл"]],"q":[["Where is the computer museum?",["in Poltava","in Kharkiv","in Berlin"],0],["How big were some old computers?",["as big as a cupboard","as small as a phone","as big as a house"],0],["Who explained everything to Oleg?",["Igor","a guide","Dad"],0],["Why couldn't Oleg believe Mum?",["the computers looked too old to be new in her childhood","Mum never used computers","Mum was joking about the games"],0]],"me":1},{"t":"Football in the Rain","l":"A2","text":"Every Thursday we have football training after school. Last Thursday it was raining heavily, and I was sure the coach would cancel the training. But he only said, \"Real footballers play in any weather!\" So we played. The ball was heavy and the grass was very slippery. Ilya ran for the ball, slid on the wet grass and stopped in a big puddle. He was brown from head to toe! Everybody laughed, and Ilya laughed too. Then Zhenya tried to kick the ball, but he kicked the water instead, and it splashed into the coach's face. After training we looked like mud monsters. When I came home, Mum looked at me and said only one word: \"Bathroom!\" My football boots are still drying on the balcony.","g":[["heavily","сильно"],["cancel","отменить"],["slippery","скользкий"],["slid","поскользнулся"],["mud","грязь"]],"q":[["What did Oleg think about the training?",["the coach would cancel it","it would be very easy","it would start late"],0],["What happened to Ilya?",["he slid into a puddle","he scored three goals","he lost his boots"],0],["What did Zhenya kick by mistake?",["water","the coach","Ilya's bag"],0],["Why did Mum say \"Bathroom!\"?",["Oleg was very dirty","the bath was ready","she wanted to clean it"],0]]},{"t":"Halushky in Poltava","l":"A2","text":"Poltava is a beautiful city, and we often went there on Saturdays. First we usually walked in Peremoha Park. There were big trees, flowers and lots of people with dogs. Then we went to the pedestrian street. There are no cars there, so you can walk in the middle of the street. We looked at the shops and listened to street musicians. Then we went to a café to eat halushky. Halushky are soft pieces of dough in soup or with sour cream. Poltava is famous for them! There is even a monument to halushky in the city. I took a photo next to it, and I pretended to eat a giant halushka.","g":[["pedestrian street","пешеходная улица"],["in the middle","посередине"],["dough","тесто"],["sour cream","сметана"],["pretended","притворился"]],"q":[["Where did they walk first?",["in Peremoha Park","in Sofiyivka Park","on the beach"],0],["Why can you walk in the middle of the pedestrian street?",["there are no cars","it is very wide","it is closed at night"],0],["What is Poltava famous for?",["halushky","pizza","pretzels"],0],["What did Oleg do near the monument?",["he pretended to eat a giant halushka","he climbed on it","he bought a toy"],0]],"photo":"24.jpg","me":1},{"t":"The Shy One","l":"A2","text":"Our guinea pig Lusha is very shy. When people come into my room, she runs into her little wooden house and doesn't come out. Klusha is different. She is brave and always comes to the door of the cage. I wanted to make Lusha a little braver, so I read about guinea pigs on the internet. The website said, \"Be quiet, be patient, and use food.\" So every evening I sat next to the cage and didn't move. I put a piece of cucumber on my hand and waited. For five days Lusha didn't come. On the sixth day she put her nose out of her house. On the eighth day she took the cucumber from my hand! Now she eats from my hand every evening. But when Igor comes in, she still hides.","g":[["wooden","деревянный"],["braver","смелее"],["patient","терпеливый"],["cucumber","огурец"],["hides","прячется"]],"q":[["What does Lusha do when people come in?",["runs into her house","comes to the door","starts to whistle"],0],["What did the website say to use?",["food","toys","music"],0],["When did Lusha first take food from Oleg's hand?",["on the eighth day","on the first day","on the sixth day"],0],["What can we understand about Lusha and Igor?",["Lusha doesn't trust Igor yet","Lusha loves Igor most","Igor feeds Lusha every day"],0]]},{"t":"Clay Toys in Opishnia","l":"B1","text":"Last spring we went on an excursion to Opishnia. It is a small town, but it is called the pottery capital of Ukraine. People there have made pots, plates and toys from clay for hundreds of years. We visited the National Museum of Ukrainian Pottery. There were huge clay pots and funny clay animals: lions, horses and even a dragon. Then we went to a workshop. A potter showed us his potter's wheel. The wheel turned fast, and in his hands the clay became a jug. Then I tried it. My pot fell down twice! On the third try I made a small bowl. Now it is on my shelf, and Murka likes to sniff it.","g":[["pottery","гончарство, керамика"],["clay","глина"],["workshop","мастерская"],["potter's wheel","гончарный круг"],["shelf","полка"]],"q":[["What is Opishnia called?",["the pottery capital of Ukraine","the capital of football","the city of halushky"],0],["What animals did Oleg see in the museum?",["clay lions, horses and a dragon","real horses","cats and dogs"],0],["What did Oleg make on the third try?",["a small bowl","a big jug","a clay lion"],0],["Where is Oleg's bowl now?",["on his shelf","in the museum","in the kitchen"],0]],"photo":"22.jpg","me":1},{"t":"The Mystery of the Missing Socks","l":"B1","text":"For two weeks, my socks had been disappearing. Every morning one sock from a pair was missing. Mum thought I was losing them at school, but I knew I wasn't. So Ilya and I decided to investigate. We put Igor's old phone on the bookshelf and left it filming all night. In the morning we watched the video together. At three o'clock something moved in the dark. It was Klusha! She had opened the door of the cage with her teeth, which nobody knew she could do. While Lusha was sleeping, Klusha was carrying my socks one by one into a corner behind the wardrobe. When we moved the wardrobe, we found eleven socks, two pencils and a lot of hay. It turned out she was building a warm nest. Now the cage has a stronger lock, and Klusha has her own old sock to sleep on.","g":[["disappearing","исчезали"],["investigate","расследовать"],["filming","снимая на видео"],["wardrobe","шкаф"],["It turned out","Оказалось"]],"q":[["How long had Oleg's socks been disappearing?",["for two weeks","for two days","for a year"],0],["How did the boys find out what was happening?",["they filmed the room at night","they asked Igor","they stayed awake all night"],0],["What was Lusha doing while Klusha was taking the socks?",["sleeping","helping her","eating hay"],0],["Why was Klusha collecting socks?",["she was building a warm nest","she wanted to play with Oleg","she was hungry"],0]]},{"t":"A Week in Dnipro","l":"A2","text":"In May 2024 we spent a week in Dnipro. The city has the same name as the river. The river Dnipro is very, very wide. When I stood on the bank, I could hardly see the other side! The city has a very long embankment. We walked along it every evening. There were fountains, cafés and people on bikes and scooters. Igor and I rented scooters and rode a long way. Mum walked behind us and said, \"Not so fast!\" We counted the bridges over the river and saw lots of boats. We also visited a museum about life in the Soviet Union. I sat on an old motorbike, and we saw old machines that sold fizzy water! One evening the sky was pink and orange, and the water was pink too. It was so beautiful that I didn't want to go home.","g":[["wide","широкий"],["hardly","едва"],["embankment","набережная"],["rented","взяли напрокат"],["bridges","мосты"]],"q":[["How long did the family stay in Dnipro?",["a week","a day","a month"],0],["Why could Oleg hardly see the other side?",["the river is very wide","it was dark","there was fog"],0],["What did the boys rent?",["scooters","a boat","bikes"],0],["What colour was the sky one evening?",["pink and orange","grey","green"],0]],"photo":["dnipro1.jpg","dnipro2.jpg","dnipro3.jpg"],"me":1},{"t":"The Invention Fair","l":"B1","text":"Every spring our school holds an invention fair, and this year Zhenya and I decided to take part. We had been thinking about our idea for weeks when Zhenya suddenly said, \"What about a machine that feeds the guinea pigs when we're at school?\" We used a plastic box, a small motor from an old toy and a timer. When the timer clicks at twelve o'clock, the motor turns and some food falls into a bowl. Igor helped us with the electric part, but he promised not to do everything for us. On the day of the fair, the judges were walking past our table when the timer clicked by mistake, and food flew all over the floor. We were so embarrassed! But one judge laughed and said, \"If it works this well, the guinea pigs will be very happy.\" We didn't win first prize, but we got a special prize for the funniest invention.","g":[["take part","участвовать"],["timer","таймер"],["judges","судьи"],["by mistake","случайно"],["embarrassed","смущённые"]],"q":[["What was the machine for?",["feeding the guinea pigs","cleaning the cage","opening doors"],0],["What did Igor promise?",["not to do everything for them","to win the prize","to buy a new motor"],0],["What happened when the judges were walking past?",["the food flew onto the floor","the motor broke","the guinea pigs escaped"],0],["How did the judge feel about the accident?",["amused","angry","bored"],0]]},{"t":"My Trip to Kyiv","l":"B1","text":"Kyiv is the capital of Ukraine, and I visited it with Mum and Igor. First we went on the metro. The escalator was so long! I counted to one hundred, and we were still going down. Then we walked along Khreshchatyk. It is the main street of Kyiv, and it is very wide. After that we went to the Lavra. It is a very old monastery with golden domes. The domes shone in the sun. From the hills we looked down at the river Dnipro. We saw it in Dnipro city too, but here it looked different, with green islands. In the evening my legs hurt, but I was happy. I want to visit Kyiv again.","g":[["capital","столица"],["escalator","эскалатор"],["main street","главная улица"],["golden domes","золотые купола"],["shone","сияли, блестели"]],"q":[["What is Kyiv?",["the capital of Ukraine","a small village","a river"],0],["Why did Oleg count to one hundred?",["the escalator was very long","he was bored on the bus","he was playing a game with Igor"],0],["What is the Lavra?",["an old monastery","a museum of computers","a park with ponds"],0],["What did Oleg see from the hills?",["the river Dnipro","the sea","mountains"],0]],"photo":["kyiv1.jpg","kyiv2.jpg"],"me":1},{"t":"If I Lived on Mars","l":"B1","text":"Our English teacher asked us to write a story called \"If I lived on Mars\". At first I had no ideas, so I asked Igor, who has read lots of books about space. He told me that a day on Mars is only forty minutes longer than on Earth, but a year there lasts almost two of our years. \"So if you lived on Mars, you would have a birthday only every two years,\" he said. That was terrible news! I also learned that Mars is very cold and the sky there is pinkish. In my story I wrote: \"If I lived on Mars, I would wear a spacesuit all the time. I would grow potatoes in a glass house and ride a robot dog across the red sand. I would miss Mum, Igor and the guinea pigs, so I would call them every evening.\" The teacher has already read my story to the class twice.","g":[["lasts","длится"],["terrible","ужасный"],["pinkish","розоватый"],["spacesuit","скафандр"],["miss","скучать"]],"q":[["Why did Oleg ask Igor for help?",["Igor has read lots of books about space","Igor has been to Mars","Igor is an English teacher"],0],["How long is a year on Mars?",["almost two Earth years","forty minutes","exactly one Earth year"],0],["Why was it \"terrible news\" for Oleg?",["he would have fewer birthdays","Mars is very hot","he can't grow potatoes"],0],["What can we guess about the teacher's opinion of the story?",["she liked it very much","she thought it was too short","she didn't read it"],0]]},{"t":"A Parrot Called Arnoldets?","l":"A2","text":"One day we went to the bird market in Kharkiv. We wanted to buy a parrot. There were lots of parrots, but they were very loud. Then I saw a small guinea pig with brown and white fur. He looked at me, and I said, \"Mum, this is our parrot!\" Everybody laughed, and we took him home. We called him Arnoldets. Arnoldets travelled a lot with us. He went to Supruniivka with us, and even to Dnipro and Kyiv in a little box. Then we bought him a friend. But the friend was a girl! Soon she had three tiny babies. We gave the babies and their mum to a kind family, and Arnoldets stayed with us.","g":[["guinea pig","морская свинка"],["fur","шерсть, мех"],["travelled","путешествовал"],["a friend","друга"],["tiny","крошечные"]],"q":[["What did the family want to buy at the market?",["a parrot","a cat","a guinea pig"],0],["Why did they not buy a parrot?",["Oleg chose a guinea pig","the parrots were too expensive","the market was closed"],0],["Where did Arnoldets travel?",["to the village, Dnipro and Kyiv","to Italy","to Turkey"],0],["What was the surprise about Arnoldets's friend?",["she was a girl and had babies","she was a rabbit","she could talk"],0]],"photo":["28.jpg","pig-babies.jpg"],"me":1},{"t":"Snowed In at Zhenya's","l":"B1","text":"Last January I was staying at Zhenya's flat for the weekend when a huge snowstorm started. By Sunday morning the snow had covered the cars completely, and the buses weren't running. Mum called and said, \"You'll have to stay there until Monday.\" At first we were excited, but by lunchtime the electricity had gone off too. No computer, no TV, no Minecraft! Zhenya's brother Yura found some candles and an old board game about dinosaurs. We had never played it before, but it was surprisingly fun. Then Yura taught us how to make shadow animals on the wall with our hands. I made a rabbit, and Zhenya made a very scary T-rex. In the evening we were sitting under blankets and telling stories when the lights suddenly came back on. We all looked at each other, and nobody wanted to switch on the computer.","g":[["snowstorm","метель"],["completely","полностью"],["electricity","электричество"],["candles","свечи"],["shadow","тень"]],"q":[["Why couldn't Oleg go home on Sunday?",["the buses weren't running because of snow","Zhenya didn't let him","Mum was away"],0],["What happened by lunchtime?",["the electricity went off","the snow melted","Mum arrived"],0],["Who taught the boys to make shadow animals?",["Yura","Igor","Zhenya's mum"],0],["Why did nobody want to switch on the computer?",["they were enjoying their evening without it","the computer was broken","it was too late"],0]]},{"t":"Friends Come to Visit","l":"A2","text":"Last summer my friend Zhenya and his big brother Yura came to visit us in the village. Our friend Ilya came too. Zhenya is my age, and Yura is in Igor's class. We played football all afternoon. Igor and Yura were one team, and Zhenya, Ilya and I were the other team. We were smaller, but we were faster! The score was five to five. Then it started to rain, so we ran into the house. Mum made pancakes, and we played board games. Murka hid under the sofa because there were so many people. In the evening she came out and sat on Zhenya's knees. Zhenya said, \"Murka is my friend now!\"","g":[["my age","моего возраста"],["team","команда"],["score","счёт"],["board games","настольные игры"],["hid","спряталась"]],"q":[["Who is in Igor's class?",["Yura","Zhenya","Ilya"],0],["What was the score of the football match?",["five to five","three to one","zero to zero"],0],["Why did Murka hide under the sofa?",["there were so many people","she was hungry","it was raining"],0],["What did they do when it started to rain?",["ate pancakes and played board games","played football in the rain","went to Poltava"],0]],"me":1},{"t":"The Day Klusha Became Famous","l":"B1","text":"One afternoon I was filming Klusha while she was eating a long piece of grass. Suddenly she started to dance: she jumped up, turned in the air and landed again. This is called \"popcorning\", and guinea pigs do it when they are very happy. Igor said the video was so funny that I should put it on his channel. In the first hour it was watched by ten people, mostly our friends. By the next morning it had been seen by more than five thousand people! Hundreds of comments were written, in English, Polish and even Japanese. One girl from Canada asked if Klusha had a sister. I posted a photo of Lusha hiding in her house, and people loved her too. Now our teacher calls Klusha \"the star of the class\". Klusha, of course, doesn't know she is famous. She only cares about grass.","g":[["landed","приземлилась"],["mostly","в основном"],["had been seen","было просмотрено"],["comments","комментарии"],["cares about","интересуется"]],"q":[["What is \"popcorning\"?",["a happy jump that guinea pigs do","a type of food","a video game"],0],["How many people had seen the video by the next morning?",["more than five thousand","ten","one hundred"],0],["What did a girl from Canada want to know?",["if Klusha had a sister","where Oleg lives","what Klusha eats"],0],["What does the last sentence show about Klusha?",["fame doesn't matter to her","she is tired of grass","she wants more videos"],0]]},{"t":"Brawlers and a Lost Cow","l":"A2","text":"Igor and I love computer games. When we were younger, we played Brawl Stars on our tablets. We always wanted to know who had more brawlers. It was very important for us! Sometimes Mum played for us as a bonus, so we could get a new brawler faster. Thank you, Mum! Then we started to play Minecraft. At first we lived on a small island. We built a cosy little house, and we had a cow. We gave her food every day and we loved her. But one day the cow disappeared! We looked for her everywhere, but we never found her. We were so sad about our cow! Now we have new games, but I still remember our island, our little house and our lost cow.","g":[["tablets","планшеты"],["brawlers","бойцы (персонажи в Brawl Stars)"],["island","остров"],["cosy","уютный"],["disappeared","исчезла, пропала"]],"q":[["What did the boys play on their tablets?",["Brawl Stars","Minecraft","chess"],0],["Why did Mum sometimes play Brawl Stars?",["to help the boys get a new brawler faster","because she loved the game","to win a prize"],0],["What did they have on their Minecraft island?",["a little house and a cow","a big castle and a dragon","a car and a road"],0],["How did they feel when the cow disappeared?",["very sad","happy","angry with Mum"],0]],"me":1},{"t":"Igor and the Ender Dragon","l":"B1","text":"Igor has been playing Minecraft for six years, but he had never beaten the Ender Dragon. \"I've always been too busy building things,\" he explained. So one Saturday we decided to do it together. We had been preparing for three days: we collected diamonds, made armour and found the portal to the End. When we finally jumped through it, everything was dark and full of tall black towers. On top of the towers there were crystals that heal the dragon. \"If we don't destroy the crystals first, we'll never win,\" Igor said. I shot them with my bow while he protected me with his shield. Then the dragon flew down, and we attacked together. It took us almost an hour. When the dragon finally exploded into purple light, Mum came in and asked why we were screaming. Igor was too happy to answer, so he just hugged her.","g":[["beaten","победил"],["armour","броня"],["portal","портал"],["heal","лечат"],["shield","щит"]],"q":[["Why had Igor never beaten the dragon?",["he was always busy building","he was afraid of it","he didn't have the game"],0],["What did the crystals do?",["healed the dragon","opened the portal","gave them diamonds"],0],["What did Oleg use to destroy the crystals?",["a bow","a sword","a shield"],0],["Why didn't Igor answer Mum?",["he was too excited","he was angry with her","he didn't hear her"],0]]},{"t":"Lusha and Klusha","l":"A2","text":"This summer our old guinea pig Arnoldets died. We were very sad, and the house was too quiet without him. We still remember how he whistled when he heard the fridge. After some time Mum said, \"Let's find two new friends.\" Now we have two guinea pigs, Lusha and Klusha. They are very different. Klusha is brave. She runs around the cage and comes to say hello to everyone. Lusha is shy. She sits in her little house and hides when we come near. But they both love water! They fight over the water bottle all the time. Sometimes they pull it out of its holder, and the water goes everywhere. Then I have to clean the cage again!","g":[["died","умер"],["whistled","свистел"],["brave","смелая"],["shy","застенчивая"],["holder","держатель"]],"q":[["How did the family feel when Arnoldets died?",["very sad","angry","happy"],0],["Who is brave?",["Klusha","Lusha","Murka"],0],["What does Lusha do when people come near?",["she hides in her little house","she runs to them","she whistles"],0],["Why does Oleg have to clean the cage again?",["the water bottle falls out and the water goes everywhere","Murka gets into the cage","the guinea pigs eat too much"],0]],"photo":"klusha.jpg","me":1},{"t":"Mum's Secret Talent","l":"B1","text":"Mum works at home on her computer, so I thought I knew everything about her. But last week I found out something surprising. Ilya and I were trying to fix my old bicycle, which had been standing on the balcony for two years. The chain had fallen off, and we couldn't put it back however hard we tried. We were about to give up when Mum came out with a cup of tea. She looked at the bike, put down her cup and fixed the chain in two minutes! Then she checked the brakes and pumped up the tyres. Ilya's mouth was wide open. \"Where did you learn that?\" I asked. Mum smiled. \"When I was your age, I had a bike that was always broken. If I hadn't learned to fix it, I would never have ridden anywhere.\" Now, whenever something breaks in our house, we ask Mum first.","g":[["found out","узнал"],["chain","цепь"],["give up","сдаться"],["brakes","тормоза"],["tyres","шины"]],"q":[["How long had the bike been on the balcony?",["two years","two weeks","two months"],0],["What was wrong with the bike?",["the chain had fallen off","it had no wheels","it was too small"],0],["How did Ilya feel when Mum fixed the bike?",["very surprised","bored","angry"],0],["Why did Mum learn to fix bikes?",["her bike was always broken when she was a child","she worked in a bike shop","Igor taught her"],0]]}],"photos":[{"img":"01 function sshuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function trBase(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'")
    .replace(/\bcan't\b/g, "cannot").replace(/\bcan not\b/g, "cannot").replace(/\bwon't\b/g, "will not").replace(/\bshan't\b/g, "shall not")

          L.listen = sshuffle(tp.words.slice(0, d * 3), rnd).slice(0, 3);

          L.quiz = qi ? qs.slice(qi[0], qi[1]) : [];
          if (L.quiz.length < 5) L.quiz = L.quiz.concat(sshuffle(d === 4 && prev.length ? prev.flatMap(t => t.quiz) : qs.filter(x => !L.quiz.includes(x)), rnd).slice(0, 5 - L.quiz.length));

        if (d < 5) {

  /* --- дополнительное чтение: «истории про нас» вперемешку с новыми текстами (Олег — среда с 25-й недели, Игорь — вторник) --- */

  const PH = DATA.photos || [];

      const g = $("cz-" + qe.dataset.gap); if (g) g.textContent = L.cloze.gaps[+qe.dataset.gap - 1][0];
    })));
    $("fin").onclick = () => { const first = !done[L.n]; if (first) { done[L.n] = 1; store.set("done", done); addStar(5); cheer("done"); if (C.mode !== "kid") confetti(); else { setTreats(treats() + 3); setTimeout(() => klBubble("Thank you! +3 🍎 for me! Yummy! 😋", 3000, "dance"), 3400); } sendReport(true); } if (cur < buildLessons().length) { cur++; store.set("cur", cur); } header(); show(); $("lesson").scrollIntoView({ block: "start" }); };
    const p = $("prev"); if (p) p.onclick = () => { cur--; store.set("cur", cur); header(); show(); $("lesson").scrollIntoView({ block: "start" }); };
  }
  /* --- тренажёр «Какое это время?» (вне уроков; времена открываются по мере прохождения) --- */
  let tnRound = 0;
  function tnShow() {
    const box = $("tn"), TN = DATA.tname; if (!TN) return;
    const wk = Math.max(1, Math.ceil(Math.max(cur, ...Object.keys(done).map(Number), 1) / 5));
    const open = Object.keys(TN.tenses).filter(k => TN.tenses[k][1] <= wk);
    const pool = TN.items.filter(it => open.includes(it[1]));
    if (open.length < 2) {
      const next = Object.values(TN.tenses).map(t => t[1]).sort((a, b) => a - b)[1];
      box.innerHTML = `<div class="card"><b>⏱ Какое это время?</b><p class="muted small" style="margin:6px 0 0">Тренажёр откроется, когда ты пройдёшь два времени — примерно с недели ${next}. Пока учи уроки!</p></div>`; return;
    }
    const rnd = rng32(Date.now() % 1e9), nOpt = C.mode === "kid" ? 3 : 4;
    const qs = sshuffle(pool, rnd).slice(0, 6).map(([q, k, why]) => {
      const others = sshuffle(open.filter(x => x !== k), rnd).slice(0, nOpt - 1);
      return [q, [TN.tenses[k][0], ...others.map(x => TN.tenses[x][0])], 0, why];
    });
    tnRound++;
    box.innerHTML = `<div class="card rule"><b>⏱ Какое это время?</b><span>Глагол выделен. Выбери время — после ответа будет подсказка.</span>
      <div class="exl">${open.map(k => `<div><span>•</span><div><b style="display:inline;font-size:1rem">${esc(TN.tenses[k][0])}</b> — <span class="tr">${esc(TN.tenses[k][2])}</span></div></div>`).join("")}</div></div>
      ${quizHtml(qs, "tn" + tnRound, tnRound * 101)}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="tn-more">Ещё 6 вопросов</button><button type="button" class="btn ghost" id="tn-close">Закрыть</button></div>`;
    bindQuiz(box);
    $("tn-more").onclick = () => { tnShow(); box.scrollIntoView({ block: "start" }); };
    $("tn-close").onclick = () => { box.hidden = true; };
  }
  /* --- справочник «Теория: времена» --- */
  function thShow() {
    const box = $("th"), TN = DATA.tname; if (!TN || !TN.theory) return;
    const wk = Math.max(1, Math.ceil(Math.max(cur, ...Object.keys(done).map(Number), 1) / 5));
    const keys = Object.keys(TN.tenses).sort((a, b) => TN.tenses[a][1] - TN.tenses[b][1]);
    const fmt = t => esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    box.innerHTML = `<div class="card rule"><b>📘 Теория: времена</b><span>Нажми на время, чтобы открыть правило. Новые времена появляются, когда ты доходишь до них в уроках.</span></div>` +
      keys.map(k => {
        const [name, w] = TN.tenses[k], th = TN.theory[k];
        if (w > wk) return `<div class="card muted small">🔒 <b>${esc(name)}</b> — откроется на неделе ${w}</div>`;
        return `<details class="card"><summary>${esc(name)} <span class="muted small" style="font-weight:600">— ${esc(th.use)}</span></summary>
          <div class="stack" style="margin-top:10px">
            <div class="res">${th.f.map(x => `<div style="font-weight:700">${fmt(x)}</div>`).join("")}</div>
            <div class="small"><b>Слова-подсказки:</b> <span class="muted">${esc(th.m)}</span></div>
            <div class="exl">${th.ex.map(([en, ru]) => `<div>${sayBtn(en)}<div><div>${hl(en)}</div><div class="tr">${esc(ru)}</div></div></div>`).join("")}</div>
            <div class="small">💡 ${esc(th.tip)}</div></div></details>`;
      }).join("") + `<div><button type="button" class="btn ghost" id="th-close">Закрыть</button></div>`;
    $("th-close").onclick = () => { box.hidden = true; };
  }
  $("th-open").onclick = () => { const b = $("th"); b.hidden = !b.hidden; if (!b.hidden) { thShow(); b.scrollIntoView({ block: "start" }); } };
  if (!DATA.tname || !DATA.tname.theory) $("th-open").hidden = true;
  $("tn-open").onclick = () => { const b = $("tn"); b.hidden = !b.hidden; if (!b.hidden) { tnShow(); b.scrollIntoView({ block: "start" }); } };
  if (!DATA.tname) $("tn-open").hidden = true;
  /* --- «Истории про нас»: личные тексты вне уроков --- */
  const ST = DATA.stories || [], stDone = store.get("stories", {});
  function stList() {
    $("st").innerHTML = `<div class="card stack"><b>📖 Истории про нас</b><span class="small muted">${C.mode === "kid" ? "Истории про тебя, Игоря и ваши поездки. Прочитай, ответь на вопросы, прочитай вслух и перескажи!" : "Тексты про твои места и поездки. Читай, отвечай, читай вслух и пересказывай."}</span>
      <div class="stack">${ST.map((r, i) => `<button type="button" class="btn ghost" data-st="${i}" style="text-align:left">${stDone[r.t] ? "✅" : "📄"} ${esc(r.t)} <span class="small muted">${esc(r.l)}</span></button>`).join("")}</div></div>`;
    $("st").querySelectorAll("[data-st]").forEach(b => b.onclick = () => stOpen(+b.dataset.st));
  }
  function stOpen(i) {
    const r = ST[i]; if (typeof LIVE !== "undefined" && LIVE) LIVE.stop(); $("st").hidden = true;
    $("lesson").innerHTML = `<h1 style="margin-top:28px">📖 ${esc(r.t)}</h1><p class="muted">История ${i + 1} из ${ST.length} · ${esc(r.l)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button type="button" class="btn ghost" data-stback>← К уроку ${cur}</button></div>
      <div class="stack" id="g-read">${readHtml(r, { n: 900 + i }, "s" + i)}</div>
      <div class="card finish"><div class="big">${stDone[r.t] ? "✅" : "📖"}</div><b>${stDone[r.t] ? "Эту историю ты уже прочитал" : "Прочитал и пересказал? Молодец!"}</b>
        <button type="button" class="btn" data-stfin>${stDone[r.t] ? (i + 1 < ST.length ? "Следующая история →" : "К уроку →") : "Готово ✓ (+5 ⭐)"}</button>
        <button type="button" class="btn ghost" data-stback>← К уроку ${cur}</button></div>`;
    bindQuiz($("lesson")); rdBind(r);
    $("lesson").querySelectorAll("[data-stback]").forEach(b => b.onclick = () => { show(); $("lesson").scrollIntoView({ block: "start" }); });
    $("lesson").querySelector("[data-stfin]").onclick = () => {
      if (!stDone[r.t]) { stDone[r.t] = 1; store.set("stories", stDone); addStar(5); stList(); stOpen(i); return; }
      if (i + 1 < ST.length) stOpen(i + 1); else show();
      $("lesson").scrollIntoView({ block: "start" });
    };
    $("lesson").scrollIntoView({ block: "start" });
  }
  if (C.mode === "kid") { $("wd-open").hidden = false; $("wd-open").onclick = () => { const b = $("wd"); b.hidden = !b.hidden; if (!b.hidden) { wardrobe(); b.scrollIntoView({ block: "start" }); } }; }
  $("pl-open").onclick = () => { const b = $("pl"); b.hidden = !b.hidden; if (!b.hidden) { placement(); b.scrollIntoView({ block: "start" }); } };
  $("st-open").onclick = () => { const b = $("st"); b.hidden = !b.hidden; if (!b.hidden) { stList(); b.scrollIntoView({ block: "start" }); } };
  if (!ST.length) $("st-open").hidden = true;
  header(); show();
  $("report").onclick = sendReport;
  (async () => { try { if (window.claude && window.claude.use) { const [t, d, smp] = await Promise.all([window.claude.use("tts"), window.claude.use("dictation"), window.claude.use("sample")]); if (t) TTS = t; if (d) DICT = d; if (smp) SAMPLE = smp; if (t || d) show(); } } catch (e) {} })();
}
</script>
<script>(function(){const b=document.getElementById("theme-btn");if(!b)return;const set=t=>{document.documentElement.dataset.theme=t;b.textContent=t==="light"?"🌙":"☀️";try{localStorage.setItem("kids-theme",t)}catch(e){}};set(document.documentElement.dataset.theme||"light");b.onclick=()=>set(document.documentElement.dataset.theme==="light"?"dark":"light");})()</script></body>
