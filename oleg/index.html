esigning the towers","writing the message"],0],["Why might Mum be angry?",["Oleg has played longer than usual","the castle is ugly","Igor broke the computer"],0]]},{"t":"If I Were Invisible","l":"B1","text":"Yesterday our teacher gave us an unusual homework task: \"Write what you would do if you were invisible for one day.\" At first I had lots of ideas. If I were invisible, I would go to a big football stadium and watch the match for free. I would even sit on the bench next to the players! I would also visit a robot factory, because they never let kids in. But then I started thinking more carefully. If nobody could see me, Mum wouldn't know where I was, and she would be really worried. Murka would be scared of footsteps without a person. And it would be very lonely if my friends couldn't see me at break. So in the end I wrote: \"If I were invisible, I would use my power for only one hour, and then I would want to be visible again.\" Later I asked Igor what he would do. \"Easy,\" he said. \"I'd hide from my little brother!\"","g":[["unusual","необычное"],["for free","бесплатно"],["bench","скамейка (запасных)"],["lonely","одиноко"],["visible","видимым"]],"q":[["Why would Oleg visit a robot factory?",["kids are never allowed in","his Dad works there","Igor asked him to"],0],["Why did Oleg change his mind about being invisible all day?",["he thought about Mum, Murka and his friends","the teacher didn't like the idea","he was afraid of robots"],0],["How long would Oleg like to be invisible in the end?",["only one hour","one whole day","forever"],0],["What does Igor's answer show?",["he is joking about his little brother","he is afraid of Oleg","he didn't understand the task"],0]]},{"t":"The Robot Guide","l":"B1","text":"Last week our class went to the science museum. In the main hall there was a huge model of the International Space Station. Our guide was a friendly robot called Nova. \"The real station was built in space, piece by piece,\" Nova explained. \"The parts were made in different countries and were carried up by rockets. Today it is visited by astronauts from all over the world.\" We learnt that the astronauts' food is packed in special bags and that water is cleaned and used again and again. \"Right now, a new space telescope is being built,\" Nova said. \"It will be launched in a few years.\" At the end, I asked Nova who had made her. \"I was built by students from School Number 5,\" she answered. That's my school! When I got home, Igor smiled. \"Did you meet Nova?\" he asked. \"I programmed her voice.\"","g":[["piece by piece","по частям"],["carried up","подняты (наверх)"],["packed","упакована"],["again and again","снова и снова"],["launched","запущен"]],"q":[["How did the parts of the station get into space?",["they were carried up by rockets","they were built on the Moon","Nova flew them there"],0],["What happens to water on the station?",["it is cleaned and used again","it is thrown away","it is brought from Earth every day"],0],["What is being built right now?",["a new space telescope","a new museum","a new robot guide"],0],["Why was Oleg surprised at the end?",["his brother had helped to make Nova","Nova knew his name","Nova stopped working"],0]]},{"t":"The New Boy","l":"B1","text":"On Monday a new boy came to our class. His name was Leo, and he looked very shy. The teacher asked me to show him the school. At first Leo didn't say much, but then he started asking questions. He asked where the canteen was and whether the food was good. He wanted to know which teacher was the strictest and if we played football at break. I told him that we played every day and asked if he wanted to join us. He said yes. Then he asked me a strange question: he asked if I had a grey cat with a white tail. I was so surprised! I asked him how he knew. Leo laughed. \"We've just moved into the flat next to yours,\" he explained. \"Your cat has been visiting our balcony every evening. Yesterday she ate my sandwich!\"","g":[["shy","застенчивым"],["canteen","столовая"],["strictest","самый строгий"],["join us","присоединиться к нам"],["moved into","переехали в"]],"q":[["What did the teacher ask Oleg to do?",["show Leo the school","sit next to Leo","help Leo with maths"],0],["What did Leo want to know about break?",["if they played football","where the toilets were","when break started"],0],["Why was Oleg surprised?",["Leo knew about his cat","Leo was very tall","Leo spoke three languages"],0],["What can we guess about Murka?",["she likes visiting the neighbours","she is Leo's cat now","she is afraid of Leo"],0]]},{"t":"Tracks in the Snow","l":"B1","text":"During the winter holidays we visited Grandma in her village. On the first morning, Igor and I found strange tracks in the fresh snow behind the house. \"They must be a fox's,\" said Igor. \"There are lots of foxes in the forest.\" I looked closer. The tracks were small and round, and I couldn't see any claws. \"It can't be a fox,\" I said. \"Foxes and dogs leave claws in their tracks. Cats don't.\" \"Then it might be a neighbour's cat,\" Igor suggested. We followed the tracks to the old shed. Something was moving inside, and we could hear a quiet sound. Igor slowly opened the door. Two green eyes looked at us from a box of old blankets. It was Murka! She must have hidden in our luggage before the trip. Mum had asked our neighbour to feed her while we were away. \"I must call him right now,\" Mum laughed, \"before he starts looking for her!\"","g":[["fresh snow","свежий снег"],["claws","когти"],["suggested","предположил"],["shed","сарай"],["luggage","багаж"]],"q":[["Why did Igor think the tracks were a fox's?",["there are many foxes in the forest","he saw a fox","Grandma told him"],0],["How did Oleg know it wasn't a fox?",["there were no claws in the tracks","the tracks were too big","foxes don't live near the village"],0],["How did Murka probably get to the village?",["in the family's luggage","on a bus","with the neighbour"],0],["Why did Mum want to call the neighbour quickly?",["he might worry and look for Murka","she wanted to say happy holidays","he had Grandma's keys"],0]]},{"t":"The Impossible Boss","l":"B1","text":"There is a boss in Cuphead that I call \"the Impossible One\". He is so fast that I can never dodge his attacks, and his music is such a scary tune that Murka runs out of the room. Last week I tried to beat him thirty-seven times. Thirty-seven! I was so frustrated that I almost threw the controller. Igor said I wasn't patient enough. \"You're too angry to think,\" he told me. \"Watch his moves first.\" But Igor couldn't beat him either. On Sunday evening Mum came into the room. \"What's this game? It looks like an old cartoon,\" she said. She had never played a video game in her life. \"Can I try?\" We gave her the controller and laughed. Ten minutes later we weren't laughing any more. Mum had beaten the boss on her second attempt. \"It's just like dancing,\" she said, and went to make tea.","g":[["dodge","увернуться от"],["tune","мелодия"],["frustrated","раздосадован"],["controller","джойстик (контроллер)"],["attempt","попытка"]],"q":[["Why does Murka run out of the room?",["the boss music is scary","Oleg shouts at her","the screen is too bright"],0],["What advice did Igor give?",["watch the boss's moves first","play faster","give up and play another game"],0],["Why did the boys stop laughing?",["Mum was much better than they expected","Murka broke the controller","the game stopped working"],0],["What can we guess about Mum?",["she has a good sense of rhythm","she plays games every night","she didn't like the game"],0]]},{"t":"The Lemon Volcano","l":"B1","text":"The day before the science fair, Igor helped me to build a paper volcano. The plan was simple: you put baking soda inside, add vinegar, and the \"lava\" bubbles out. \"Remember to bring the vinegar tomorrow,\" Igor said. Of course, I forgot to put it in my bag. At school I suddenly remembered seeing a lemon in my lunch box. \"Lemon juice is an acid too,\" I thought. \"Maybe I should try using it.\" When the judges came to my table, I squeezed the lemon into the volcano. At first nothing happened. Everyone stopped talking and looked at me. Then the mixture started to fizz, and pink foam poured out. I had also added a little red paint for colour! The judges loved it. I didn't win first prize, but I got a special prize for \"the bravest experiment\". I will never forget seeing their faces.","g":[["science fair","научная ярмарка"],["baking soda","пищевая сода"],["acid","кислота"],["squeezed","выжал"],["fizz","шипеть"]],"q":[["What did Oleg forget?",["to bring the vinegar","to build the volcano","his lunch box"],0],["What did he try using instead?",["lemon juice","water","orange juice"],0],["Why did everyone stop talking?",["they were waiting to see what would happen","the judges asked them to","the volcano fell over"],0],["Why did Oleg get a special prize?",["he tried something new and it worked","his volcano was the biggest","Igor helped the judges"],0]]},{"t":"This Time Tomorrow","l":"B1","text":"Our holiday starts tomorrow! Our flight leaves at seven in the morning, so we're leaving home at four. I can't believe that this time tomorrow I will be lying on the beach! I have a long list of plans. I'm going to learn to dive, and Igor is going to try surfing. Mum says she will be reading her book all week and won't be cooking at all. My suitcase is ready: swimming shorts, sunscreen, goggles and my favourite cap. Igor is still packing. \"I'll be ready in five minutes,\" he says, for the third time. In the evening Mum checks the boarding passes on her phone one more time. Suddenly she goes quiet. Then she starts to laugh. \"Boys,\" she says, \"you can unpack your swimming shorts. Our flight is next Saturday, not tomorrow!\" Igor looks at me. \"Well,\" he says, \"at least I'll have enough time to pack now.\"","g":[["this time tomorrow","завтра в это время"],["suitcase","чемодан"],["packing","собирает вещи"],["boarding passes","посадочные талоны"],["unpack","распаковать"]],"q":[["Why are they leaving home at four?",["their flight is early in the morning","Igor wants to see the sunrise","the airport closes at five"],0],["What is Mum going to do on holiday?",["read her book","learn to dive","cook every day"],0],["What do the words \"for the third time\" tell us about Igor?",["he is slow at packing","he is very fast","he has packed three bags"],0],["What was the problem?",["the flight was a week later","the flight was cancelled","Mum lost the boarding passes"],0]]},{"t":"The Escape Room","l":"B1","text":"For my birthday, Mum booked an escape room for our family. The rules were simple: we had sixty minutes to find the key, or we would lose. The room had been designed like a spaceship. By the time we had solved the first puzzle, twenty minutes had passed. \"If I were the captain, I'd hide the key somewhere obvious,\" said Igor. We tried opening every box, but the last lock needed a four-digit code. \"It might be a date,\" I said. \"It can't be a phone number — that would be too long.\" We had been searching for fifty minutes when I remembered seeing a photo of a cat on the captain's desk. Under the photo it said: \"Born: 12.03\". I typed 1203, and the door opened! Later the manager asked how we had guessed it. Mum smiled. \"Our cat Murka was born on the same day,\" she said. \"Oleg never forgets it.\"","g":[["booked","забронировала"],["designed","оформлена"],["obvious","очевидное"],["four-digit code","четырёхзначный код"],["guessed","угадали"]],"q":[["How long did the family have to find the key?",["sixty minutes","fifty minutes","twenty minutes"],0],["Why did Oleg think the code couldn't be a phone number?",["a phone number would be too long","there was no phone in the room","Igor said so"],0],["What helped Oleg find the code?",["a photo of a cat with a date","a note from Mum","a hint from the manager"],0],["Why did Oleg notice the date so quickly?",["it was the same as Murka's birthday","it was his own birthday","he had been to this room before"],0]]}],"words":[],"cloze":[],"tname":{"tenses":{"ps":["Present Simple",10,"Обычно, всегда, каждый день: I play / he plays"],"pc":["Present Continuous",17,"Прямо сейчас: am / is / are + -ing"],"pas":["Past Simple",22,"Было в прошлом: was / were, played, went"],"gt":["be going to",25,"Планы: am / is / are going to + глагол"],"pp":["Present Perfect",34,"Уже, когда-нибудь: have / has + 3-я форма"],"fs":["Future Simple (will)",35,"Будущее, обещание: will + глагол"],"pac":["Past Continuous",38,"Был в процессе в прошлом: was / were + -ing"]},"items":[["I [play] football every Saturday.","ps","every Saturday — каждую субботу, это привычка → Present Simple."],["My cat [likes] fish.","ps","likes — с окончанием -s (my cat = it). Это факт → Present Simple."],["We [go] to school at eight.","ps","Каждый день в одно время → Present Simple."],["Igor [reads] books in the evening.","ps","reads с -s (Igor = he). Обычно так делает → Present Simple."],["I [don't like] soup.","ps","don't + глагол → отрицание в Present Simple."],["[Does] your mum [work]?","ps","Does + глагол → вопрос в Present Simple."],["Oleg always [brushes] his teeth.","ps","always — всегда → Present Simple."],["Look! The dog [is running]!","pc","Look! — смотри, прямо сейчас → Present Continuous: is + -ing."],["I [am drawing] a robot now.","pc","now — сейчас; am + -ing → Present Continuous."],["Mum [is cooking] dinner at the moment.","pc","at the moment — в данный момент → Present Continuous."],["Shh! The baby [is sleeping].","pc","Тише! Это происходит сейчас → Present Continuous."],["They [are playing] in the park.","pc","are + -ing → Present Continuous."],["What [are] you [doing]?","pc","Что ты делаешь (сейчас)? are + -ing → Present Continuous."],["It [is raining] outside.","pc","Дождь идёт сейчас → Present Continuous."],["I [was] at the zoo yesterday.","pas","was + yesterday (вчера) → Past Simple."],["We [played] chess last night.","pas","played — окончание -ed; last night → Past Simple."],["Oleg [went] to the cinema on Sunday.","pas","went — прошедшая форма go → Past Simple."],["My friends [were] at my party.","pas","were — прошедшее от are → Past Simple."],["I [didn't watch] TV yesterday.","pas","didn't + глагол, yesterday → Past Simple."],["[Did] you [see] the film?","pas","Did + глагол → вопрос в Past Simple."],["Igor [had] pizza for lunch.","pas","had — прошедшая форма have → Past Simple."],["Two years ago we [lived] in Italy.","pas","ago — назад → Past Simple."],["I [am going to visit] Grandma tomorrow.","gt","am going to + глагол — мой план → be going to."],["We [are going to buy] a new ball.","gt","are going to — план → be going to."],["Look at the clouds! It [is going to rain].","gt","Видно, что сейчас будет дождь → be going to."],["Oleg [is going to be] a pilot.","gt","Мечта, план на будущее → be going to."],["What [are] you [going to do] on Saturday?","gt","are you going to …? — спрашиваем о планах → be going to."],["I [have] never [been] to London.","pp","have + been, never — никогда → Present Perfect."],["[Have] you ever [seen] a whale?","pp","Have you ever …? — опыт → Present Perfect."],["Oh no! I [have lost] my pencil!","pp","have + lost (3-я форма) — результат сейчас → Present Perfect."],["Igor [has] just [finished] his homework.","pp","has + just — только что → Present Perfect."],["I [will help] you, Mum!","fs","will + глагол — обещание → Future Simple."],["I think it [will be] sunny tomorrow.","fs","I think … will — думаю, будет → Future Simple."],["Maybe we [will go] to the sea next summer.","fs","maybe … will — может быть → Future Simple."],["Don't worry, I [won't forget].","fs","won't = will not → Future Simple."],["I [was sleeping] at ten o'clock last night.","pac","was + -ing, at ten last night → Past Continuous."],["We [were playing] when Dad came home.","pac","were + -ing, процесс, и тут пришёл папа → Past Continuous."],["The sun [was shining] yesterday morning.","pac","was + -ing — что происходило в прошлом → Past Continuous."]],"theory":{"ps":{"use":"Что бывает обычно, всегда, каждый день; факты; расписание.","f":["+ I / you / we / they play · he / she / it play**s**","− I don't play · he doesn't play","? Do you play? · Does he play?"],"m":"always, usually, often, sometimes, never, every day, on Mondays","ex":[["I [play] football every Saturday.","Я играю в футбол каждую субботу."],["Igor [reads] a lot.","Игорь много читает."],["[Does] Oleg [like] Minecraft?","Олегу нравится Minecraft?"]],"tip":"С he / she / it добавляй -s: he plays, she watches. После does — без -s: Does he play?"},"pc":{"use":"Что происходит прямо сейчас или в этот период.","f":["+ I am playing · he is playing · they are playing","− I'm not playing · he isn't playing","? Are you playing? · Is he playing?"],"m":"now, right now, at the moment, Look!, Listen!, today, this week","ex":[["Look! The dog [is running].","Смотри! Собака бежит."],["I [am building] a house in Minecraft now.","Я сейчас строю дом в Minecraft."],["What [are] you [doing]?","Что ты делаешь?"]],"tip":"Не бывает без am / is / are: не «I playing», а I am playing. Глаголы like, know, want обычно без -ing."},"pas":{"use":"Что было и закончилось в прошлом (вчера, в прошлом году).","f":["+ I played · I went (неправильные — 2-я форма)","− I didn't play / didn't go","? Did you play? · Did you go?"],"m":"yesterday, last week, last year, ago, in 2020, when I was little","ex":[["We [watched] a film yesterday.","Мы вчера смотрели фильм."],["Oleg [went] to the park.","Олег ходил в парк."],["[Did] you [finish] the level?","Ты прошёл уровень?"]],"tip":"После did / didn't глагол снова простой: Did you go? (не went). was / were — прошедшее от to be."},"gt":{"use":"План, который уже решён; будущее, которое видно по признакам.","f":["+ I am going to buy · he is going to play","− I'm not going to buy","? Are you going to buy…?"],"m":"tomorrow, next summer, Look!, (уже решил)","ex":[["I [am going to visit] Grandma tomorrow.","Завтра я поеду к бабушке."],["Look at the clouds! It [is going to rain].","Смотри на тучи! Сейчас пойдёт дождь."],["What [are] you [going to do] on Saturday?","Что ты собираешься делать в субботу?"]],"tip":"Решил заранее — going to. Решил прямо сейчас — will."},"pp":{"use":"Опыт («когда-нибудь») и результат сейчас (уже, только что, ещё не).","f":["+ I have played · he has played (3-я форма)","− I haven't played · he hasn't played","? Have you ever played? · Has he finished?"],"m":"ever, never, already, just, yet, so far, for, since","ex":[["I [have] never [been] to London.","Я никогда не был в Лондоне."],["Igor [has] just [finished] his homework.","Игорь только что сделал уроки."],["[Have] you ever [beaten] this boss?","Ты когда-нибудь побеждал этого босса?"]],"tip":"Если есть точное время в прошлом (yesterday, last week, ago) — это Past Simple, а не Present Perfect."},"fs":{"use":"Будущее: прогноз, обещание, решение прямо сейчас.","f":["+ I will help (I'll help)","− I won't help (= will not)","? Will you help me?"],"m":"tomorrow, next week, I think…, maybe, probably, I promise","ex":[["I [will help] you, Mum!","Я помогу тебе, мама!"],["I think it [will be] sunny.","Думаю, будет солнечно."],["It's cold. I['ll close] the window.","Холодно. Я закрою окно."]],"tip":"После when / if / as soon as о будущем — НЕ will: When I get home, I'll call you."},"pac":{"use":"Что происходило в какой-то момент в прошлом (был в процессе).","f":["+ I / he was playing · we / they were playing","− I wasn't playing · they weren't playing","? Were you playing? · Was he playing?"],"m":"at 5 o'clock yesterday, while, when (и тут что-то случилось)","ex":[["I [was sleeping] at ten last night.","Вчера в десять я спал."],["We [were playing] when Dad came home.","Мы играли, когда пришёл папа."],["While Igor [was cooking], I [was cleaning].","Пока Игорь готовил, я убирал."]],"tip":"Длинное действие — was/were + -ing, короткое, которое его прервало, — Past Simple: I was playing when the phone rang."}}},"stories":[{"t":"Alf and Dashka","l":"A2","text":"Before Igor and I were born, Mum and Dad had a dog and a cat. The dog was a Dalmatian called Alf. He was white with black spots, and he loved walks more than anything. Alf was very funny: he thought that only Dalmatians were real dogs! Other dogs were not interesting for him at all. One winter day Alf pulled the lead so hard that Mum fell into a big puddle. She was wearing a long warm coat, and she got wet from head to toe! But the walk had only just started, so she laughed and kept walking. The cat was called Dashka. She was small and white, and she was afraid of everybody. She lived in her own room. One day Mum looked under the chest of drawers and found a whole bucket of poo! Dashka had a secret toilet there!","g":[["Dalmatian","далматинец"],["spots","пятна"],["lead","поводок"],["puddle","лужа"],["chest of drawers","комод"]],"q":[["What kind of dog was Alf?",["a Dalmatian","a poodle","a husky"],0],["What did Alf think about other dogs?",["only Dalmatians were real dogs","all dogs were his friends","other dogs were dangerous"],0],["What did Mum do after she fell into the puddle?",["she kept walking","she went home","she cried"],0],["What did Mum find under the chest of drawers?",["Dashka's secret toilet","Alf's toys","Dad's keys"],0]],"photo":["alf1.jpg","dashka1.jpg","alf2.jpg"]},{"t":"Mimika Bela","l":"A2","text":"Before I was born, Mum and Dad bought their first car. It was a white Audi A6. Igor was only one and a half years old, and he called the car Mimika Bela. He loved it very much and did not want other people to sit in it! Every evening Mum told Igor a fairy tale about the car. Dad came to a big car shop. There were many different cars there. But in the far corner he saw a sad little car. Nobody wanted to buy it, and it was crying. Dad bought the car, repaired it and made it better than all the other cars. Now Mimika Bela loves our family and drives us everywhere. Igor listened to this story every night and then fell asleep with a smile.","g":[["fairy tale","сказка"],["far corner","дальний угол"],["crying","плакала"],["repaired","починил"],["fell asleep","засыпал"]],"q":[["How old was Igor when the family bought the car?",["one and a half","five","ten"],0],["Why didn't anybody buy the little car in the fairy tale?",["it was sad and in the far corner","it was too expensive","it was red"],0],["What did Dad do with the car?",["he repaired it and made it better","he sold it","he painted it blue"],0],["How did Igor feel about Mimika Bela?",["he loved it very much","he was afraid of it","he didn't like it"],0]],"photo":"mimika.jpg"},{"t":"Igor's Secret Language","l":"A2","text":"When my brother Igor was little, he had his own language. Milk was \"klema\", butter was \"klyama\", and pasta was \"kukulkony\". The metro was \"svintidlya\", and a bulldozer was a \"glyuglozer\". Igor called himself \"Lyalyalyok\". Nobody taught him these words! The funniest thing was animals. When Mum asked, \"What does a cat say?\", Igor said, \"Meow!\" A dog? \"Woof-woof!\" But a bear? Igor started to speak very fast: \"Guglguglguglguglgugl!\" Everybody laughed. When Igor was five, he became Superherolion. He growled at everyone! Superherolion came to us from the planet Levyaniki. Igor also had a friend, Kolazhuk the beetle. Kolazhuk came from India. Why India? Nobody knows!","g":[["language","язык"],["butter","масло"],["bear","медведь"],["growled","рычал"],["beetle","жук"]],"q":[["What was \"klema\" in Igor's language?",["milk","butter","pasta"],0],["What did Igor say when Mum asked about a bear?",["Guglguglgugl!","Meow!","Woof-woof!"],0],["Where did Superherolion come from?",["the planet Levyaniki","India","Kharkiv"],0],["Why did everybody laugh?",["Igor's words were very funny","Igor fell down","the cat danced"],0]],"photo":["igor-small1.jpg","igor-small2.jpg"]},{"t":"Odin, Dva!","l":"A2","text":"When Igor was a baby, he cried all the time. Mum says he was very loud! But when I was born, I was a quiet baby. I didn't cry. I just grunted, sniffed and sometimes farted. Mum laughed a lot. My favourite person was my big brother Igor. When I saw him, I smiled at once. When I started to talk, my first words were \"Odin, dva!\" It means \"one, two\" in Russian. What did I want to say? It was easy: \"Buy two things, one for me and one for Igor!\" If Mum bought one ice cream, I said \"Odin, dva!\" If she bought one toy, I said \"Odin, dva!\" again. I always wanted to share with my brother.","g":[["quiet","тихий"],["grunted","кряхтел"],["sniffed","сопел"],["at once","сразу"],["share","делиться"]],"q":[["Who cried a lot when he was a baby?",["Igor","Oleg","Dad"],0],["What did baby Oleg do instead of crying?",["he grunted and sniffed","he sang songs","he shouted"],0],["What did \"Odin, dva!\" mean?",["buy one for Oleg and one for Igor","count to ten","go to the shop"],0],["What can we say about little Oleg?",["he loved his brother and wanted to share","he didn't like Igor","he wanted everything for himself"],0]],"photo":["oleg-baby.jpg","mum-kids-2016.jpg"]},{"t":"Viompa and Luizon","l":"A2","text":"When I was little, I spoke well, much better than Igor at my age. But I always mixed up one word: I called chocolate \"kosholad\"! Once we were repairing our flat. It was very noisy every day. One evening I started to cry and said angrily, \"How long will this VIOMP go on?\" Everybody laughed, and after that Mum often called me Viompa instead of Oleg. Igor has a funny nickname too. When he was in the first class, he came home from school very upset. The teacher said to the whole class that his classmate Luiza had a beautiful name. But she didn't say anything about Igor's name! So Mum started to call him Luizon, as a joke. Now we are Viompa and Luizon!","g":[["mixed up","путал"],["repairing","делали ремонт"],["noisy","шумно"],["nickname","прозвище"],["upset","расстроенный"]],"q":[["What did Oleg call chocolate?",["kosholad","chokolad","klema"],0],["Why did Oleg cry during the repairs?",["it was too noisy for a long time","he hurt his hand","he wanted chocolate"],0],["Why was Igor upset after school?",["the teacher praised Luiza's name, not his","he got a bad mark","he lost his bag"],0],["Are Viompa and Luizon real names?",["no, they are funny family nicknames","yes, they are the boys' real names","they are names of pets"],0]]},{"t":"Football in Kharkiv","l":"A2","text":"Our home city is Kharkiv. It is a big city with many parks and two football stadiums. The biggest one is Metalist, and the football club has the same name. When I was very little, Mum took me and my brother Igor to football matches at the Serp i Molot stadium. I don't remember a lot, but Igor told me the story. I wore a yellow and blue scarf and sat on Mum's knees. When a player scored a goal, everybody jumped and shouted, and I shouted too. Then I got hungry and ate a big bun with sausage. Igor says I watched the bun more than the ball! Now I love football, and I want to go to a big match again.","g":[["stadiums","стадионы"],["remember","помнить"],["scarf","шарф"],["scored a goal","забил гол"],["shouted","кричали"]],"q":[["What is the name of the biggest stadium in Kharkiv?",["Metalist","Serp i Molot","Kemer"],0],["Who took the boys to football matches?",["Mum","Igor","a teacher"],0],["What did Oleg eat at the match?",["a bun with sausage","an ice cream","a pizza"],0],["Why does Igor say Oleg watched the bun more than the ball?",["Oleg was hungry and liked the food","Oleg did not like football","the ball was too small"],0]],"photo":"01.jpg"},{"t":"Snow in Berlin","l":"A2","text":"When I was about four, our family flew from Kharkiv to Berlin. It was winter, and it was my first time on a plane. I sat next to the window and looked at the white clouds. In Berlin it was cold and grey, but the city was very beautiful. There were Christmas lights everywhere. We walked a lot, and my brother Igor was eight, so he walked fast. My legs got tired, and Mum carried me. We drank hot chocolate in a small café and ate a big pretzel. We stayed in Berlin for a week. I still have a photo of me in a red hat near a big tree with lights.","g":[["flew","летели, полетели"],["plane","самолёт"],["clouds","облака"],["got tired","устали"],["carried","несла"]],"q":[["How did the family get to Berlin?",["by plane","by train","by car"],0],["What season was it?",["winter","summer","spring"],0],["Why did Mum carry Oleg?",["his legs got tired","he was asleep","it was raining"],0],["How long did the family stay in Berlin?",["a week","a month","two days"],0]],"photo":"03.jpg"},{"t":"A Hotel in Kemer","l":"A2","text":"In 2021 we went on holiday to Kemer, in Turkey. I went with Mum, Dad and my brother Igor. Our hotel was very big, and it had three swimming pools! There were tall green mountains behind the hotel and the blue sea in front of it. Every morning we went to the buffet. I took pancakes, watermelon and too much chocolate cake. Mum laughed at my plate. In the afternoon Igor and I swam in the pool and jumped into the water. In the evening there was animation for children. We danced and played games, and I won a small toy. The sea was warm, but the stones on the beach were hot. It was a great holiday!","g":[["swimming pools","бассейны"],["mountains","горы"],["buffet","шведский стол"],["plate","тарелка"],["won","выиграл"]],"q":[["Where is Kemer?",["in Turkey","in Italy","in Ukraine"],0],["What was behind the hotel?",["mountains","a forest","a big city"],0],["Why did Mum laugh at Oleg's plate?",["he took too much cake","his plate was empty","he dropped it"],0],["What did Oleg win in the evening?",["a small toy","a medal","a ball"],0]],"photo":"k1.jpg"},{"t":"Three Months in Pisa","l":"A2","text":"In 2022 Mum, my brother Igor and I lived in Italy for three months. We lived in a city called Pisa. Pisa is famous for its Leaning Tower. The tower is very old, and it isn't straight. On my first day I said, \"Mum, the tower is falling!\" Mum laughed and said, \"It has looked like that for hundreds of years.\" We took a funny photo: I \"held\" the tower with my hands. I learned some Italian words: \"ciao\" means \"hi\", and \"grazie\" means \"thank you\". Every Sunday we ate pizza, and after that we bought gelato. Gelato is Italian ice cream. My favourite was strawberry. Igor always chose chocolate.","g":[["famous","знаменитый"],["Leaning Tower","Падающая башня"],["straight","прямой"],["held","держал"],["chose","выбирал"]],"q":[["How long did the family live in Italy?",["three months","one week","two years"],0],["What did Oleg think on his first day?",["the tower was falling","the tower was new","the tower was very small"],0],["What does \"grazie\" mean?",["thank you","hi","goodbye"],0],["What gelato did Igor like?",["chocolate","strawberry","lemon"],0]],"photo":"09.jpg"},{"t":"The Park of Sofia","l":"A2","text":"In the summer of 2022 we came back to Ukraine and lived in Uman. Uman has a very beautiful park. It is called Sofiyivka. Mum told us its story. A long time ago, a rich count made this park as a present for his wife. Her name was Sofia, so the park has her name too. We walked there almost every weekend. There are big ponds with ducks, and there are waterfalls and old stone caves. My favourite place was the underground river. We sat in a boat and went through a dark tunnel. It was cool and a little scary, but very exciting. I fed the ducks with bread, and Igor took lots of photos.","g":[["present","подарок"],["wife","жена"],["ponds","пруды"],["underground river","подземная река"],["fed","кормил"]],"q":[["Where is Sofiyivka Park?",["in Uman","in Kharkiv","in Pisa"],0],["Why is the park called Sofiyivka?",["the count's wife was called Sofia","it was built by Sofia","Sofia is the name of the river"],0],["What was Oleg's favourite place?",["the underground river","the ponds","the café"],0],["How did they go through the tunnel?",["in a boat","on foot","by bike"],0]],"photo":"17.jpg"},{"t":"Our Teacher Masha","l":"A2","text":"When we lived in Uman, an English teacher came to our home. Her name was Masha. She was young, kind and very clever. She worked at a local school, and after school she taught Igor and me. Masha helped me a lot. I learned to read in English when I was only six, before I even went to school! Masha always praised Igor too. I loved Masha very much. Every time she came, I gave her a present. Sometimes it was Love Is chewing gum, sometimes the little comic wrappers from the gum, and sometimes my drawing. Masha always smiled and said thank you. Now we live in another place, and we miss Masha a lot. I hope she reads this story one day!","g":[["local","местный"],["praised","хвалила"],["chewing gum","жвачка"],["wrappers","фантики, обёртки"],["miss","скучать"]],"q":[["Where did Masha teach the boys?",["at their home in Uman","in Pisa","online"],0],["What could Oleg do at the age of six?",["read in English","drive a car","speak Italian"],0],["What did Oleg give Masha?",["gum, gum wrappers and drawings","flowers and books","nothing"],0],["How does the family feel about Masha now?",["they miss her","they don't remember her","they are angry with her"],0]]},{"t":"Zuban, Olen and Petr","l":"A2","text":"In Uman we had some dog friends. Two of them were Zuban and Olen. They were always together, like best friends. But my favourite dog was Petr. He lived near the playground with the big ship. Petr was huge, but he was very kind. He loved to dig holes everywhere. In winter he did a very funny thing. When there was ice on the river, Petr barked at it! Then he went into the cold water, bit the ice and threw the pieces onto the bank. Igor and I watched him and laughed. We thought Petr was the most amazing dog in the world!","g":[["playground","детская площадка"],["huge","огромный"],["dig holes","копать ямы"],["barked","лаял"],["bank","берег (реки)"]],"q":[["Which two dogs were best friends?",["Zuban and Olen","Petr and Kernes","Alf and Dashka"],0],["Where did Petr live?",["near the playground with the ship","in their house","at the school"],0],["What did Petr do with the ice?",["he bit it and threw it onto the bank","he slept on it","he was afraid of it"],0],["What kind of dog was Petr?",["huge but kind","small and angry","old and lazy"],0]]},{"t":"Our New Village","l":"A2","text":"In 2023 we moved to Supruniivka, a village near Poltava. At first I was a bit sad, because I didn't know anybody. But the village was very green and quiet. There were apple trees, a little river and lots of chickens. In the morning I could hear a rooster: \"Cock-a-doodle-doo!\" Our cat Murka liked the village too. She sat in the sun all day and watched the birds. Soon I made new friends, and we rode our bikes on the long roads. In autumn Mum and I picked apples, and Mum made a big apple pie. Igor helped too, but he ate more apples than he picked!","g":[["moved","переехали"],["quiet","тихий"],["rooster","петух"],["made new friends","нашёл новых друзей"],["picked apples","собирали яблоки"]],"q":[["Where did the family move in 2023?",["to a village near Poltava","to Kyiv","to Pisa"],0],["Why was Oleg sad at first?",["he didn't know anybody","he lost his bike","Murka ran away"],0],["What did Murka do all day?",["sat in the sun","caught fish","slept in the car"],0],["What did Mum make in autumn?",["an apple pie","halushky","a cake with chocolate"],0]],"photo":"29.jpg"},{"t":"Torn Throat and Kernes","l":"A2","text":"In Supruniivka, a village near Poltava, we rented a house. Arnoldets lived with us, but other animals came too! A street cat came to our yard. She was very scary and ugly, so we called her Rvanaya Glotka. It means \"Torn Throat\"! We felt sorry for her, so we fed her and bought her Leopold cat food. But then she became too cheeky. One day she climbed onto the dryer with our clean clothes! And she had a skin disease. So we had to send her away. At the playground there were two dogs. One was big, and the other one was called Kernes. Kernes looked like a dachshund: long body and short legs!","g":[["rented","снимали (в аренду)"],["yard","двор"],["ugly","уродливый"],["fed","кормили"],["cheeky","наглый"]],"q":[["Why did they call the cat Torn Throat?",["she looked very scary and ugly","she sang loudly","she was very small"],0],["What did the family buy for the cat?",["Leopold cat food","a new house","a toy mouse"],0],["Why did they send the cat away?",["she climbed onto the clean clothes and was ill","she ate Arnoldets' food","she bit Igor"],0],["What did Kernes look like?",["a dachshund","a Dalmatian","a big wolf"],0]]},{"t":"Very Old Computers","l":"A2","text":"One day we went to Poltava to visit a computer museum. I thought all computers were small and fast, like my tablet. But in the museum there were very old computers. Some of them were as big as a cupboard! There were computers with no mouse and screens with only green letters. My brother Igor read the signs and explained everything to me. The best part was that we could play some old games. The pictures were made of big squares, and the sound was \"beep-beep\". I played a game with a little tennis ball, and I beat Igor! Mum said, \"When I was a child, these computers were new.\" I couldn't believe it!","g":[["cupboard","шкаф"],["screens","экраны"],["explained","объяснял"],["squares","квадраты"],["beat","обыграл"]],"q":[["Where is the computer museum?",["in Poltava","in Kharkiv","in Berlin"],0],["How big were some old computers?",["as big as a cupboard","as small as a phone","as big as a house"],0],["Who explained everything to Oleg?",["Igor","a guide","Dad"],0],["Why couldn't Oleg believe Mum?",["the computers looked too old to be new in her childhood","Mum never used computers","Mum was joking about the games"],0]]},{"t":"Halushky in Poltava","l":"A2","text":"Poltava is a beautiful city, and we often went there on Saturdays. First we usually walked in Peremoha Park. There were big trees, flowers and lots of people with dogs. Then we went to the pedestrian street. There are no cars there, so you can walk in the middle of the street. We looked at the shops and listened to street musicians. Then we went to a café to eat halushky. Halushky are soft pieces of dough in soup or with sour cream. Poltava is famous for them! There is even a monument to halushky in the city. I took a photo next to it, and I pretended to eat a giant halushka.","g":[["pedestrian street","пешеходная улица"],["in the middle","посередине"],["dough","тесто"],["sour cream","сметана"],["pretended","притворился"]],"q":[["Where did they walk first?",["in Peremoha Park","in Sofiyivka Park","on the beach"],0],["Why can you walk in the middle of the pedestrian street?",["there are no cars","it is very wide","it is closed at night"],0],["What is Poltava famous for?",["halushky","pizza","pretzels"],0],["What did Oleg do near the monument?",["he pretended to eat a giant halushka","he climbed on it","he bought a toy"],0]],"photo":"24.jpg"},{"t":"Clay Toys in Opishnia","l":"B1","text":"Last spring we went on an excursion to Opishnia. It is a small town, but it is called the pottery capital of Ukraine. People there have made pots, plates and toys from clay for hundreds of years. We visited the National Museum of Ukrainian Pottery. There were huge clay pots and funny clay animals: lions, horses and even a dragon. Then we went to a workshop. A potter showed us his potter's wheel. The wheel turned fast, and in his hands the clay became a jug. Then I tried it. My pot fell down twice! On the third try I made a small bowl. Now it is on my shelf, and Murka likes to sniff it.","g":[["pottery","гончарство, керамика"],["clay","глина"],["workshop","мастерская"],["potter's wheel","гончарный круг"],["shelf","полка"]],"q":[["What is Opishnia called?",["the pottery capital of Ukraine","the capital of football","the city of halushky"],0],["What animals did Oleg see in the museum?",["clay lions, horses and a dragon","real horses","cats and dogs"],0],["What did Oleg make on the third try?",["a small bowl","a big jug","a clay lion"],0],["Where is Oleg's bowl now?",["on his shelf","in the museum","in the kitchen"],0]],"photo":"22.jpg"},{"t":"A Week in Dnipro","l":"A2","text":"In May 2024 we spent a week in Dnipro. The city has the same name as the river. The river Dnipro is very, very wide. When I stood on the bank, I could hardly see the other side! The city has a very long embankment. We walked along it every evening. There were fountains, cafés and people on bikes and scooters. Igor and I rented scooters and rode a long way. Mum walked behind us and said, \"Not so fast!\" We counted the bridges over the river and saw lots of boats. We also visited a museum about life in the Soviet Union. I sat on an old motorbike, and we saw old machines that sold fizzy water! One evening the sky was pink and orange, and the water was pink too. It was so beautiful that I didn't want to go home.","g":[["wide","широкий"],["hardly","едва"],["embankment","набережная"],["rented","взяли напрокат"],["bridges","мосты"]],"q":[["How long did the family stay in Dnipro?",["a week","a day","a month"],0],["Why could Oleg hardly see the other side?",["the river is very wide","it was dark","there was fog"],0],["What did the boys rent?",["scooters","a boat","bikes"],0],["What colour was the sky one evening?",["pink and orange","grey","green"],0]],"photo":["dnipro1.jpg","dnipro2.jpg","dnipro3.jpg"]},{"t":"My Trip to Kyiv","l":"B1","text":"Kyiv is the capital of Ukraine, and I visited it with Mum and Igor. First we went on the metro. The escalator was so long! I counted to one hundred, and we were still going down. Then we walked along Khreshchatyk. It is the main street of Kyiv, and it is very wide. After that we went to the Lavra. It is a very old monastery with golden domes. The domes shone in the sun. From the hills we looked down at the river Dnipro. We saw it in Dnipro city too, but here it looked different, with green islands. In the evening my legs hurt, but I was happy. I want to visit Kyiv again.","g":[["capital","столица"],["escalator","эскалатор"],["main street","главная улица"],["golden domes","золотые купола"],["shone","сияли, блестели"]],"q":[["What is Kyiv?",["the capital of Ukraine","a small village","a river"],0],["Why did Oleg count to one hundred?",["the escalator was very long","he was bored on the bus","he was playing a game with Igor"],0],["What is the Lavra?",["an old monastery","a museum of computers","a park with ponds"],0],["What did Oleg see from the hills?",["the river Dnipro","the sea","mountains"],0]],"photo":["kyiv1.jpg","kyiv2.jpg"]},{"t":"A Parrot Called Arnoldets?","l":"A2","text":"One day we went to the bird market in Kharkiv. We wanted to buy a parrot. There were lots of parrots, but they were very loud. Then I saw a small guinea pig with brown and white fur. He looked at me, and I said, \"Mum, this is our parrot!\" Everybody laughed, and we took him home. We called him Arnoldets. Arnoldets travelled a lot with us. He went to Supruniivka with us, and even to Dnipro and Kyiv in a little box. Then we bought him a friend. But the friend was a girl! Soon she had three tiny babies. We gave the babies and their mum to a kind family, and Arnoldets stayed with us.","g":[["guinea pig","морская свинка"],["fur","шерсть, мех"],["travelled","путешествовал"],["a friend","друга"],["tiny","крошечные"]],"q":[["What did the family want to buy at the market?",["a parrot","a cat","a guinea pig"],0],["Why did they not buy a parrot?",["Oleg chose a guinea pig","the parrots were too expensive","the market was closed"],0],["Where did Arnoldets travel?",["to the village, Dnipro and Kyiv","to Italy","to Turkey"],0],["What was the surprise about Arnoldets's friend?",["she was a girl and had babies","she was a rabbit","she could talk"],0]],"photo":["28.jpg","pig-babies.jpg"]},{"t":"Friends Come to Visit","l":"A2","text":"Last summer my friend Zhenya and his big brother Yura came to visit us in the village. Our friend Ilya came too. Zhenya is my age, and Yura is in Igor's class. We played football all afternoon. Igor and Yura were one team, and Zhenya, Ilya and I were the other team. We were smaller, but we were faster! The score was five to five. Then it started to rain, so we ran into the house. Mum made pancakes, and we played board games. Murka hid under the sofa because there were so many people. In the evening she came out and sat on Zhenya's knees. Zhenya said, \"Murka is my friend now!\"","g":[["my age","моего возраста"],["team","команда"],["score","счёт"],["board games","настольные игры"],["hid","спряталась"]],"q":[["Who is in Igor's class?",["Yura","Zhenya","Ilya"],0],["What was the score of the football match?",["five to five","three to one","zero to zero"],0],["Why did Murka hide under the sofa?",["there were so many people","she was hungry","it was raining"],0],["What did they do when it started to rain?",["ate pancakes and played board games","played football in the rain","went to Poltava"],0]]},{"t":"Brawlers and a Lost Cow","l":"A2","text":"Igor and I love computer games. When we were younger, we played Brawl Stars on our tablets. We always wanted to know who had more brawlers. It was very important for us! Sometimes Mum played for us as a bonus, so we could get a new brawler faster. Thank you, Mum! Then we started to play Minecraft. At first we lived on a small island. We built a cosy little house, and we had a cow. We gave her food every day and we loved her. But one day the cow disappeared! We looked for her everywhere, but we never found her. We were so sad about our cow! Now we have new games, but I still remember our island, our little house and our lost cow.","g":[["tablets","планшеты"],["brawlers","бойцы (персонажи в Brawl Stars)"],["island","остров"],["cosy","уютный"],["disappeared","исчезла, пропала"]],"q":[["What did the boys play on their tablets?",["Brawl Stars","Minecraft","chess"],0],["Why did Mum sometimes play Brawl Stars?",["to help the boys get a new brawler faster","because she loved the game","to win a prize"],0],["What did they have on their Minecraft island?",["a little house and a cow","a big castle and a dragon","a car and a road"],0],["How did they feel when the cow disappeared?",["very sad","happy","angry with Mum"],0]]},{"t":"Lusha and Klusha","l":"A2","text":"This summer our old guinea pig Arnoldets died. We were very sad, and the house was too quiet without him. We still remember how he whistled when he heard the fridge. After some time Mum said, \"Let's find two new friends.\" Now we have two guinea pigs, Lusha and Klusha. They are very different. Klusha is brave. She runs around the cage and comes to say hello to everyone. Lusha is shy. She sits in her little house and hides when we come near. But they both love water! They fight over the water bottle all the time. Sometimes they pull it out of its holder, and the water goes everywhere. Then I have to clean the cage again!","g":[["died","умер"],["whistled","свистел"],["brave","смелая"],["shy","застенчивая"],["holder","держатель"]],"q":[["How did the family feel when Arnoldets died?",["very sad","angry","happy"],0],["Who is brave?",["Klusha","Lusha","Murka"],0],["What does Lusha do when people come near?",["she hides in her little house","she runs to them","she whistles"],0],["Why does Oleg have to clean the cage again?",["the water bottle falls out and the water goes everywhere","Murka gets into the cage","the guinea pigs eat too much"],0]],"photo":"klusha.jpg"}],"storyline":[{"t":"Alf and Dashka","l":"A2","text":"Before Igor and I were born, Mum and Dad had a dog and a cat. The dog was a Dalmatian called Alf. He was white with black spots, and he loved walks more than anything. Alf was very funny: he thought that only Dalmatians were real dogs! Other dogs were not interesting for him at all. One winter day Alf pulled the lead so hard that Mum fell into a big puddle. She was wearing a long warm coat, and she got wet from head to toe! But the walk had only just started, so she laughed and kept walking. The cat was called Dashka. She was small and white, and she was afraid of everybody. She lived in her own room. One day Mum looked under the chest of drawers and found a whole bucket of poo! Dashka had a secret toilet there!","g":[["Dalmatian","далматинец"],["spots","пятна"],["lead","поводок"],["puddle","лужа"],["chest of drawers","комод"]],"q":[["What kind of dog was Alf?",["a Dalmatian","a poodle","a husky"],0],["What did Alf think about other dogs?",["only Dalmatians were real dogs","all dogs were his friends","other dogs were dangerous"],0],["What did Mum do after she fell into the puddle?",["she kept walking","she went home","she cried"],0],["What did Mum find under the chest of drawers?",["Dashka's secret toilet","Alf's toys","Dad's keys"],0]],"photo":["alf1.jpg","dashka1.jpg","alf2.jpg"],"me":1},{"t":"The Paper Rocket","l":"A2","text":"On Saturday Ilya came to my house with a big idea. \"Let's build a rocket!\" he said. We took an empty plastic bottle, some paper, tape and scissors. Ilya cut out three wings, and I painted the rocket red and yellow. We called it \"Klusha One\" because my brave guinea pig likes to run fast. Then we went to the yard. Igor showed us how to pump air into the bottle with a bicycle pump. We counted, \"Three, two, one... go!\" The rocket flew higher than the roof of the garage! Then it fell into a tree. Igor climbed up and got it back. \"Next time,\" said Ilya, \"we need a parachute!\"","g":[["empty","пустой"],["tape","скотч"],["wings","крылья"],["pump","насос"],["parachute","парашют"]],"q":[["What did the boys make the rocket from?",["a plastic bottle","a cardboard box","an old can"],0],["Why did they call it \"Klusha One\"?",["Klusha likes to run fast","Klusha made it","Klusha is red"],0],["Where did the rocket land?",["in a tree","on the roof","in the river"],0],["What does Ilya want to add next time?",["a parachute","more wings","a light"],0]]},{"t":"Mimika Bela","l":"A2","text":"Before I was born, Mum and Dad bought their first car. It was a white Audi A6. Igor was only one and a half years old, and he called the car Mimika Bela. He loved it very much and did not want other people to sit in it! Every evening Mum told Igor a fairy tale about the car. Dad came to a big car shop. There were many different cars there. But in the far corner he saw a sad little car. Nobody wanted to buy it, and it was crying. Dad bought the car, repaired it and made it better than all the other cars. Now Mimika Bela loves our family and drives us everywhere. Igor listened to this story every night and then fell asleep with a smile.","g":[["fairy tale","сказка"],["far corner","дальний угол"],["crying","плакала"],["repaired","починил"],["fell asleep","засыпал"]],"q":[["How old was Igor when the family bought the car?",["one and a half","five","ten"],0],["Why didn't anybody buy the little car in the fairy tale?",["it was sad and in the far corner","it was too expensive","it was red"],0],["What did Dad do with the car?",["he repaired it and made it better","he sold it","he painted it blue"],0],["How did Igor feel about Mimika Bela?",["he loved it very much","he was afraid of it","he didn't like it"],0]],"photo":"mimika.jpg","me":1},{"t":"Klusha's Big Walk","l":"A2","text":"Our guinea pigs, Lusha and Klusha, live in a cage in my room. One evening I forgot to close the door of the cage. In the morning Klusha was not there! Lusha was sitting in her little house, as usual. Mum, Igor and I looked everywhere: under the bed, behind the sofa and in the kitchen. Nothing! Then I had an idea. I took a carrot and said, \"Klusha, breakfast!\" We heard a happy whistle from Igor's room. Klusha was sitting in his slipper! She looked very proud. Igor laughed, \"She wanted to see my room.\" Now I always check the door of the cage twice.","g":[["cage","клетка"],["forgot","забыл"],["as usual","как обычно"],["whistle","свист"],["slipper","тапок"]],"q":[["Why did Klusha get out?",["Oleg forgot to close the cage","Igor opened the cage","the cage broke"],0],["Where was Lusha in the morning?",["in her little house","under the bed","in the kitchen"],0],["How did Oleg find Klusha?",["he called her with a carrot","he followed her footprints","the cat found her"],0],["What does Oleg do now?",["he checks the cage door twice","he keeps Klusha in a box","he gives Klusha to Igor"],0]]},{"t":"Igor's Secret Language","l":"A2","text":"When my brother Igor was little, he had his own language. Milk was \"klema\", butter was \"klyama\", and pasta was \"kukulkony\". The metro was \"svintidlya\", and a bulldozer was a \"glyuglozer\". Igor called himself \"Lyalyalyok\". Nobody taught him these words! The funniest thing was animals. When Mum asked, \"What does a cat say?\", Igor said, \"Meow!\" A dog? \"Woof-woof!\" But a bear? Igor started to speak very fast: \"Guglguglguglguglgugl!\" Everybody laughed. When Igor was five, he became Superherolion. He growled at everyone! Superherolion came to us from the planet Levyaniki. Igor also had a friend, Kolazhuk the beetle. Kolazhuk came from India. Why India? Nobody knows!","g":[["language","язык"],["butter","масло"],["bear","медведь"],["growled","рычал"],["beetle","жук"]],"q":[["What was \"klema\" in Igor's language?",["milk","butter","pasta"],0],["What did Igor say when Mum asked about a bear?",["Guglguglgugl!","Meow!","Woof-woof!"],0],["Where did Superherolion come from?",["the planet Levyaniki","India","Kharkiv"],0],["Why did everybody laugh?",["Igor's words were very funny","Igor fell down","the cat danced"],0]],"photo":["igor-small1.jpg","igor-small2.jpg"],"me":1},{"t":"No School Today!","l":"A2","text":"When I woke up on Tuesday, everything outside was white. It snowed all night, and the snow was very deep. Then Mum's phone rang. It was a message from the school: \"No lessons today because of the snow.\" I jumped on my bed and shouted, \"Snow day!\" I put on my warm jacket, hat and gloves and ran outside. Ilya and Zhenya were already there. We built a huge snowman with a carrot nose and Igor's old scarf. Then we had a snowball fight. Zhenya was the best thrower, but I was the fastest runner. In the afternoon we drank hot chocolate. It was the best Tuesday ever!","g":[["deep","глубокий"],["message","сообщение"],["gloves","перчатки"],["snowball fight","игра в снежки"],["thrower","метатель"]],"q":[["Why were there no lessons?",["because of the snow","because the teacher was ill","because it was a holiday"],0],["What did the boys use for the snowman's nose?",["a carrot","a stone","a stick"],0],["Who was the best thrower?",["Zhenya","Oleg","Ilya"],0],["How did Oleg feel about the day?",["very happy","bored","tired and sad"],0]]},{"t":"Odin, Dva!","l":"A2","text":"When Igor was a baby, he cried all the time. Mum says he was very loud! But when I was born, I was a quiet baby. I didn't cry. I just grunted, sniffed and sometimes farted. Mum laughed a lot. My favourite person was my big brother Igor. When I saw him, I smiled at once. When I started to talk, my first words were \"Odin, dva!\" It means \"one, two\" in Russian. What did I want to say? It was easy: \"Buy two things, one for me and one for Igor!\" If Mum bought one ice cream, I said \"Odin, dva!\" If she bought one toy, I said \"Odin, dva!\" again. I always wanted to share with my brother.","g":[["quiet","тихий"],["grunted","кряхтел"],["sniffed","сопел"],["at once","сразу"],["share","делиться"]],"q":[["Who cried a lot when he was a baby?",["Igor","Oleg","Dad"],0],["What did baby Oleg do instead of crying?",["he grunted and sniffed","he sang songs","he shouted"],0],["What did \"Odin, dva!\" mean?",["buy one for Oleg and one for Igor","count to ten","go to the shop"],0],["What can we say about little Oleg?",["he loved his brother and wanted to share","he didn't like Igor","he wanted everything for himself"],0]],"photo":["oleg-baby.jpg","mum-kids-2016.jpg"],"me":1},{"t":"A Minecraft Gift","l":"A2","text":"Mum's birthday is in March. Last year I didn't have money for a present, so I had an idea. I built Mum a house in Minecraft! It had a big garden with flowers, because Mum loves flowers. There was a kitchen with a cake on the table and a pool on the roof. I even made a small room for two guinea pigs. It took me three evenings. Igor helped me with the lights, because they were difficult. On her birthday I gave Mum my laptop and said, \"Welcome to your new house!\" Mum walked around the house for a long time. She smiled and said, \"This is the best house in the world.\"","g":[["present","подарок"],["pool","бассейн"],["took me","заняло у меня"],["lights","освещение"],["walked around","обошла"]],"q":[["Why did Oleg build a house in Minecraft?",["he didn't have money for a present","Mum asked him","it was homework"],0],["What was on the roof?",["a pool","a garden","a cake"],0],["Who helped Oleg with the lights?",["Igor","Ilya","Mum"],0],["Did Mum like the present?",["yes, very much","no, not at all","she didn't see it"],0]]},{"t":"Viompa and Luizon","l":"A2","text":"When I was little, I spoke well, much better than Igor at my age. But I always mixed up one word: I called chocolate \"kosholad\"! Once we were repairing our flat. It was very noisy every day. One evening I started to cry and said angrily, \"How long will this VIOMP go on?\" Everybody laughed, and after that Mum often called me Viompa instead of Oleg. Igor has a funny nickname too. When he was in the first class, he came home from school very upset. The teacher said to the whole class that his classmate Luiza had a beautiful name. But she didn't say anything about Igor's name! So Mum started to call him Luizon, as a joke. Now we are Viompa and Luizon!","g":[["mixed up","путал"],["repairing","делали ремонт"],["noisy","шумно"],["nickname","прозвище"],["upset","расстроенный"]],"q":[["What did Oleg call chocolate?",["kosholad","chokolad","klema"],0],["Why did Oleg cry during the repairs?",["it was too noisy for a long time","he hurt his hand","he wanted chocolate"],0],["Why was Igor upset after school?",["the teacher praised Luiza's name, not his","he got a bad mark","he lost his bag"],0],["Are Viompa and Luizon real names?",["no, they are funny family nicknames","yes, they are the boys' real names","they are names of pets"],0]],"me":1},{"t":"Zhenya Scores","l":"A2","text":"Zhenya is my age. His big brother Yura is in Igor's class, so we often meet. Zhenya plays football every day, but he is not tall. Some boys in our team say, \"You're too small to be a striker.\" On Sunday we had a match against another school. The score was one-one, and there were only two minutes left. Suddenly I got the ball. I saw Zhenya near the goal and passed to him. Zhenya ran between two tall defenders, and... goal! Everybody shouted and jumped. After the match, the coach said, \"Size isn't important. Speed and brains are important.\" Zhenya smiled all the way home.","g":[["striker","нападающий"],["score","счёт"],["passed","передал (пас)"],["defenders","защитники"],["coach","тренер"]],"q":[["Why do some boys say Zhenya can't be a striker?",["he is small","he is slow","he is new"],0],["What was the score before the goal?",["one-one","two-one","nil-nil"],0],["Who passed the ball to Zhenya?",["Oleg","Yura","the coach"],0],["What does the coach think?",["speed and brains are more important than size","only tall players can score","Zhenya should play in defence"],0]]},{"t":"Football in Kharkiv","l":"A2","text":"Our home city is Kharkiv. It is a big city with many parks and two football stadiums. The biggest one is Metalist, and the football club has the same name. When I was very little, Mum took me and my brother Igor to football matches at the Serp i Molot stadium. I don't remember a lot, but Igor told me the story. I wore a yellow and blue scarf and sat on Mum's knees. When a player scored a goal, everybody jumped and shouted, and I shouted too. Then I got hungry and ate a big bun with sausage. Igor says I watched the bun more than the ball! Now I love football, and I want to go to a big match again.","g":[["stadiums","стадионы"],["remember","помнить"],["scarf","шарф"],["scored a goal","забил гол"],["shouted","кричали"]],"q":[["What is the name of the biggest stadium in Kharkiv?",["Metalist","Serp i Molot","Kemer"],0],["Who took the boys to football matches?",["Mum","Igor","a teacher"],0],["What did Oleg eat at the match?",["a bun with sausage","an ice cream","a pizza"],0],["Why does Igor say Oleg watched the bun more than the ball?",["Oleg was hungry and liked the food","Oleg did not like football","the ball was too small"],0]],"photo":"01.jpg","me":1},{"t":"Bones in the Classroom","l":"A2","text":"On Friday our teacher brought a big box to the classroom. \"Today we are going to be scientists,\" she said. In the box there was sand, and in the sand there were plastic dinosaur bones. We worked in groups of three. I was with Ilya and a girl called Sonya. We used small brushes, like real scientists. Slowly we found a head, a long neck and a lot of small bones. Ilya thought it was a T-rex, but Sonya said, \"No, look at the long neck. It ate plants!\" She was right. It was a Diplodocus. We put the bones together, and our dinosaur was almost one metre long!","g":[["scientists","учёные"],["sand","песок"],["brushes","кисточки"],["neck","шея"],["almost","почти"]],"q":[["What was in the box?",["sand with plastic bones","real dinosaur eggs","books about dinosaurs"],0],["Who was in Oleg's group?",["Ilya and Sonya","Zhenya and Igor","only Ilya"],0],["How did Sonya know it was not a T-rex?",["it had a long neck","it had big teeth","it was very small"],0],["What did the dinosaur eat?",["plants","fish","other dinosaurs"],0]]},{"t":"Snow in Berlin","l":"A2","text":"When I was about four, our family flew from Kharkiv to Berlin. It was winter, and it was my first time on a plane. I sat next to the window and looked at the white clouds. In Berlin it was cold and grey, but the city was very beautiful. There were Christmas lights everywhere. We walked a lot, and my brother Igor was eight, so he walked fast. My legs got tired, and Mum carried me. We drank hot chocolate in a small café and ate a big pretzel. We stayed in Berlin for a week. I still have a photo of me in a red hat near a big tree with lights.","g":[["flew","летели, полетели"],["plane","самолёт"],["clouds","облака"],["got tired","устали"],["carried","несла"]],"q":[["How did the family get to Berlin?",["by plane","by train","by car"],0],["What season was it?",["winter","summer","spring"],0],["Why did Mum carry Oleg?",["his legs got tired","he was asleep","it was raining"],0],["How long did the family stay in Berlin?",["a week","a month","two days"],0]],"photo":"03.jpg","me":1},{"t":"The Hardest Game","l":"A2","text":"Cuphead is a game with cartoon pictures, like old films. It looks cute, but it is very, very hard. You play as a little cup with a straw on his head. Ilya and I play it together. One evening we tried to beat a big angry flower. We lost twenty times! Ilya wanted to stop. \"This flower is impossible!\" he said. But I watched carefully and saw that the flower always attacks in the same order. \"Jump now, then go left!\" I said. On our twenty-first try we won! We shouted so loudly that Klusha ran into her house. Mum asked, \"What happened?\" \"We beat the flower!\" we answered.","g":[["cute","милый"],["straw","трубочка"],["beat","победить"],["attacks","атакует"],["try","попытка"]],"q":[["What does the hero of Cuphead look like?",["a little cup","a small robot","a red flower"],0],["How many times did the boys lose?",["twenty times","three times","once"],0],["What did Oleg notice about the flower?",["it attacks in the same order","it is afraid of water","it sleeps at night"],0],["Why did Klusha run into her house?",["the boys shouted loudly","Mum came in","she was hungry"],0]]},{"t":"A Hotel in Kemer","l":"A2","text":"In 2021 we went on holiday to Kemer, in Turkey. I went with Mum, Dad and my brother Igor. Our hotel was very big, and it had three swimming pools! There were tall green mountains behind the hotel and the blue sea in front of it. Every morning we went to the buffet. I took pancakes, watermelon and too much chocolate cake. Mum laughed at my plate. In the afternoon Igor and I swam in the pool and jumped into the water. In the evening there was animation for children. We danced and played games, and I won a small toy. The sea was warm, but the stones on the beach were hot. It was a great holiday!","g":[["swimming pools","бассейны"],["mountains","горы"],["buffet","шведский стол"],["plate","тарелка"],["won","выиграл"]],"q":[["Where is Kemer?",["in Turkey","in Italy","in Ukraine"],0],["What was behind the hotel?",["mountains","a forest","a big city"],0],["Why did Mum laugh at Oleg's plate?",["he took too much cake","his plate was empty","he dropped it"],0],["What did Oleg win in the evening?",["a small toy","a medal","a ball"],0]],"photo":"k1.jpg","me":1},{"t":"Igor's Robot Helper","l":"A2","text":"My brother Igor is fifteen, and he loves building things. Last month he made a small robot from an old toy car, a phone battery and a lot of wires. The robot can move, turn and stop in front of walls. Igor wanted it to help at home. First he tried to teach it to carry socks to the washing machine. But the robot took the socks to the guinea pigs' cage! Lusha was scared, but Klusha liked the socks and sat on them. Then Igor tried again. Now the robot brings me my slippers in the morning. It isn't fast, but it's my favourite robot in the world.","g":[["battery","батарейка"],["wires","провода"],["carry","нести"],["washing machine","стиральная машина"],["scared","испуганный"]],"q":[["How old is Igor?",["fifteen","ten","twelve"],0],["What did Igor make the robot from?",["an old toy car, a battery and wires","a box and paper","a new computer"],0],["Where did the robot take the socks?",["to the guinea pigs' cage","to the washing machine","to the kitchen"],0],["What does the robot do now?",["brings Oleg his slippers","cleans the room","feeds the guinea pigs"],0]]},{"t":"Three Months in Pisa","l":"A2","text":"In 2022 Mum, my brother Igor and I lived in Italy for three months. We lived in a city called Pisa. Pisa is famous for its Leaning Tower. The tower is very old, and it isn't straight. On my first day I said, \"Mum, the tower is falling!\" Mum laughed and said, \"It has looked like that for hundreds of years.\" We took a funny photo: I \"held\" the tower with my hands. I learned some Italian words: \"ciao\" means \"hi\", and \"grazie\" means \"thank you\". Every Sunday we ate pizza, and after that we bought gelato. Gelato is Italian ice cream. My favourite was strawberry. Igor always chose chocolate.","g":[["famous","знаменитый"],["Leaning Tower","Падающая башня"],["straight","прямой"],["held","держал"],["chose","выбирал"]],"q":[["How long did the family live in Italy?",["three months","one week","two years"],0],["What did Oleg think on his first day?",["the tower was falling","the tower was new","the tower was very small"],0],["What does \"grazie\" mean?",["thank you","hi","goodbye"],0],["What gelato did Igor like?",["chocolate","strawberry","lemon"],0]],"photo":"09.jpg","me":1},{"t":"The Volcano in the Kitchen","l":"A2","text":"Our science teacher gave us homework: \"Do an experiment at home and tell the class about it.\" Zhenya came to my house, and we decided to make a volcano. Mum gave us a plastic bottle, baking soda, vinegar, washing-up liquid and red food colouring. We put the bottle on a big tray and built a mountain around it from play dough. Then we put three spoons of soda into the bottle. Zhenya added the red colouring and some washing-up liquid. \"Now the vinegar!\" I said. Whoosh! Red foam came out of the top and ran down the mountain like lava. It was amazing! But we used too much vinegar, and the foam went over the tray and onto the floor. We cleaned the kitchen for half an hour. Mum wasn't angry. She took a video for the class.","g":[["experiment","опыт"],["baking soda","пищевая сода"],["vinegar","уксус"],["tray","поднос"],["foam","пена"]],"q":[["Why did the boys make a volcano?",["it was science homework","it was Mum's idea","they saw it on TV"],0],["What did they build the mountain from?",["play dough","sand","paper"],0],["Why did the foam go onto the floor?",["they used too much vinegar","the bottle broke","Klusha pushed the tray"],0],["Why did Mum take a video?",["for the class","to send to Dad","to put on the internet"],0]]},{"t":"The Park of Sofia","l":"A2","text":"In the summer of 2022 we came back to Ukraine and lived in Uman. Uman has a very beautiful park. It is called Sofiyivka. Mum told us its story. A long time ago, a rich count made this park as a present for his wife. Her name was Sofia, so the park has her name too. We walked there almost every weekend. There are big ponds with ducks, and there are waterfalls and old stone caves. My favourite place was the underground river. We sat in a boat and went through a dark tunnel. It was cool and a little scary, but very exciting. I fed the ducks with bread, and Igor took lots of photos.","g":[["present","подарок"],["wife","жена"],["ponds","пруды"],["underground river","подземная река"],["fed","кормил"]],"q":[["Where is Sofiyivka Park?",["in Uman","in Kharkiv","in Pisa"],0],["Why is the park called Sofiyivka?",["the count's wife was called Sofia","it was built by Sofia","Sofia is the name of the river"],0],["What was Oleg's favourite place?",["the underground river","the ponds","the café"],0],["How did they go through the tunnel?",["in a boat","on foot","by bike"],0]],"photo":"17.jpg","me":1},{"t":"The Roblox Obby","l":"A2","text":"An obby is a game in Roblox where you jump from one block to another and try not to fall. Ilya and I decided to make our own obby. Ilya was the designer, and I was the tester. Ilya made red blocks, moving blocks and even a block that disappears after two seconds. At the end there was a big golden trophy. I tried to finish it, but I fell into the lava again and again. \"It's too hard!\" I told him. \"Nobody will play it.\" Ilya changed some blocks and made the jumps shorter. After that, I finished it in five minutes. We put the game online, and the next day forty players had tried it! One player wrote, \"Cool obby, but where is the secret room?\" Now we are building a secret room.","g":[["designer","разработчик"],["tester","тестировщик"],["disappears","исчезает"],["trophy","кубок"],["online","в интернет"]],"q":[["What was Oleg's job?",["tester","designer","player number forty"],0],["What happened to one special block?",["it disappeared after two seconds","it turned into gold","it flew away"],0],["Why did Ilya change the blocks?",["the obby was too hard","the blocks were ugly","Mum asked him"],0],["Why are the boys building a secret room now?",["a player asked about it","Igor told them to","the game needed more lava"],0]]},{"t":"Our Teacher Masha","l":"A2","text":"When we lived in Uman, an English teacher came to our home. Her name was Masha. She was young, kind and very clever. She worked at a local school, and after school she taught Igor and me. Masha helped me a lot. I learned to read in English when I was only six, before I even went to school! Masha always praised Igor too. I loved Masha very much. Every time she came, I gave her a present. Sometimes it was Love Is chewing gum, sometimes the little comic wrappers from the gum, and sometimes my drawing. Masha always smiled and said thank you. Now we live in another place, and we miss Masha a lot. I hope she reads this story one day!","g":[["local","местный"],["praised","хвалила"],["chewing gum","жвачка"],["wrappers","фантики, обёртки"],["miss","скучать"]],"q":[["Where did Masha teach the boys?",["at their home in Uman","in Pisa","online"],0],["What could Oleg do at the age of six?",["read in English","drive a car","speak Italian"],0],["What did Oleg give Masha?",["gum, gum wrappers and drawings","flowers and books","nothing"],0],["How does the family feel about Masha now?",["they miss her","they don't remember her","they are angry with her"],0]],"me":1},{"t":"Eight Arms and Three Hearts","l":"A2","text":"Last week I read a book about animals of the sea, and now octopuses are my favourite animals. Did you know that an octopus has three hearts? It also has blue blood! An octopus has eight arms, and every arm can taste and touch things. When an octopus is in danger, it shoots black ink into the water and swims away. Octopuses are also very clever. In one zoo an octopus learned to open a jar with food inside. In another zoo an octopus left its tank at night, ate fish in the next tank and went back home! In the morning the workers didn't understand where the fish were. I told Igor all these facts at dinner. He listened and said, \"So the octopus is a thief, like Klusha with the carrots!\"","g":[["hearts","сердца"],["blood","кровь"],["taste","пробовать на вкус"],["ink","чернила"],["thief","вор"]],"q":[["How many hearts does an octopus have?",["three","one","eight"],0],["What does an octopus do when it is in danger?",["shoots black ink","changes into a fish","sleeps"],0],["Why didn't the zoo workers understand where the fish were?",["the octopus ate them at night and went back","the fish swam away","Igor took them"],0],["What does Igor think about Klusha?",["she steals carrots","she is very shy","she has eight legs"],0]]},{"t":"Zuban, Olen and Petr","l":"A2","text":"In Uman we had some dog friends. Two of them were Zuban and Olen. They were always together, like best friends. But my favourite dog was Petr. He lived near the playground with the big ship. Petr was huge, but he was very kind. He loved to dig holes everywhere. In winter he did a very funny thing. When there was ice on the river, Petr barked at it! Then he went into the cold water, bit the ice and threw the pieces onto the bank. Igor and I watched him and laughed. We thought Petr was the most amazing dog in the world!","g":[["playground","детская площадка"],["huge","огромный"],["dig holes","копать ямы"],["barked","лаял"],["bank","берег (реки)"]],"q":[["Which two dogs were best friends?",["Zuban and Olen","Petr and Kernes","Alf and Dashka"],0],["Where did Petr live?",["near the playground with the ship","in their house","at the school"],0],["What did Petr do with the ice?",["he bit it and threw it onto the bank","he slept on it","he was afraid of it"],0],["What kind of dog was Petr?",["huge but kind","small and angry","old and lazy"],0]],"me":1},{"t":"Who Ate the Sandwich?","l":"A2","text":"On Monday I made a big cheese sandwich for school and put it on the kitchen table. Then I went to brush my teeth. When I came back, the sandwich was gone! Only a few crumbs were on the plate. I decided to be a detective. Igor was in the shower, so it wasn't him. Mum was on the phone in the living room. The guinea pigs were in their cage, and they can't jump onto the table anyway. Then I saw something strange: there were crumbs on the floor, and they went to the window. The window was open! On the balcony a big grey crow was eating my sandwich. It looked at me and flew away with the last piece. Now I never leave food near an open window.","g":[["crumbs","крошки"],["detective","сыщик"],["anyway","всё равно"],["strange","странный"],["crow","ворона"]],"q":[["Where did Oleg leave the sandwich?",["on the kitchen table","in his bag","on the balcony"],0],["Why wasn't it Igor?",["he was in the shower","he was at school","he doesn't like cheese"],0],["What helped Oleg to solve the mystery?",["crumbs going to the window","a photo on Mum's phone","Klusha's whistle"],0],["Who ate the sandwich?",["a crow","Mum","Lusha"],0]]},{"t":"Our New Village","l":"A2","text":"In 2023 we moved to Supruniivka, a village near Poltava. At first I was a bit sad, because I didn't know anybody. But the village was very green and quiet. There were apple trees, a little river and lots of chickens. In the morning I could hear a rooster: \"Cock-a-doodle-doo!\" Our cat Murka liked the village too. She sat in the sun all day and watched the birds. Soon I made new friends, and we rode our bikes on the long roads. In autumn Mum and I picked apples, and Mum made a big apple pie. Igor helped too, but he ate more apples than he picked!","g":[["moved","переехали"],["quiet","тихий"],["rooster","петух"],["made new friends","нашёл новых друзей"],["picked apples","собирали яблоки"]],"q":[["Where did the family move in 2023?",["to a village near Poltava","to Kyiv","to Pisa"],0],["Why was Oleg sad at first?",["he didn't know anybody","he lost his bike","Murka ran away"],0],["What did Murka do all day?",["sat in the sun","caught fish","slept in the car"],0],["What did Mum make in autumn?",["an apple pie","halushky","a cake with chocolate"],0]],"photo":"29.jpg","me":1},{"t":"A Night Under the Stars","l":"A2","text":"In August we went to Grandma's village, far from the city lights. One night Igor woke me up. \"Come outside,\" he whispered. \"There's going to be a meteor shower.\" We took a blanket and lay on the grass behind the house. The sky was full of stars, more than I have ever seen in the city. Igor showed me the Big Dipper and the North Star. \"Sailors used it to find the way,\" he said. Then I saw a bright line across the sky. And another one! \"Those are meteors,\" Igor explained. \"They are small pieces of space rock. They burn when they fly into the air.\" We counted twenty-three meteors. I made a wish on every one. I can't tell you my wishes, but one of them was about a dog.","g":[["whispered","прошептал"],["meteor shower","звездопад"],["blanket","одеяло"],["sailors","моряки"],["made a wish","загадал желание"]],"q":[["Why were there more stars in the village?",["it was far from city lights","it was winter","Igor had a telescope"],0],["What did sailors use the North Star for?",["to find the way","to tell the time","to make wishes"],0],["What are meteors?",["small pieces of space rock","tiny planets","old satellites"],0],["What does Oleg probably want?",["a dog","a new phone","a bigger cage"],0]]},{"t":"Torn Throat and Kernes","l":"A2","text":"In Supruniivka, a village near Poltava, we rented a house. Arnoldets lived with us, but other animals came too! A street cat came to our yard. She was very scary and ugly, so we called her Rvanaya Glotka. It means \"Torn Throat\"! We felt sorry for her, so we fed her and bought her Leopold cat food. But then she became too cheeky. One day she climbed onto the dryer with our clean clothes! And she had a skin disease. So we had to send her away. At the playground there were two dogs. One was big, and the other one was called Kernes. Kernes looked like a dachshund: long body and short legs!","g":[["rented","снимали (в аренду)"],["yard","двор"],["ugly","уродливый"],["fed","кормили"],["cheeky","наглый"]],"q":[["Why did they call the cat Torn Throat?",["she looked very scary and ugly","she sang loudly","she was very small"],0],["What did the family buy for the cat?",["Leopold cat food","a new house","a toy mouse"],0],["Why did they send the cat away?",["she climbed onto the clean clothes and was ill","she ate Arnoldets' food","she bit Igor"],0],["What did Kernes look like?",["a dachshund","a Dalmatian","a big wolf"],0]],"me":1},{"t":"Brawl Stars Cup","l":"A2","text":"In our class there was a Brawl Stars competition. Every team had three players. I was in a team with Ilya and Zhenya. We called ourselves \"The Guinea Pigs\". Other teams laughed at our name, but we didn't care. Before the cup we practised every evening for one hour, because Mum doesn't let me play more. We decided that Zhenya would attack, Ilya would protect, and I would collect the gems. In the first game we won easily. The second game was really hard, but Ilya saved us in the last second. In the final we played against three boys from 5-B. They were very good, and we lost. But nobody laughed at our name any more. Now everyone at school calls us
