<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Английский для Олега</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fffaf2; --card: #ffffff; --fg: #1d1b26; --muted: #6b6878; --line: #ece4d6;
  --accent: #f06a12; --accent-soft: #ffe8d6; --accent-fg: #ffffff;
  --ok: #1f9d55; --ok-soft: #e3f6ea; --bad: #d64545; --bad-soft: #fde8e8; --star: #f5a524; --hl: #fff1c2;
  --f: "Nunito", system-ui, sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15141b; --card: #1f1e27; --fg: #f1eff7; --muted: #a29fb3; --line: #33313f;
  --accent-soft: #3a2414; --ok: #4cc77f; --ok-soft: #173326; --bad: #f07070; --bad-soft: #3a1d1d; --hl: #3b3417; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15141b; --card: #1f1e27; --fg: #f1eff7; --muted: #a29fb3; --line: #33313f;
  --accent-soft: #3a2414; --ok: #4cc77f; --ok-soft: #173326; --bad: #f07070; --bad-soft: #3a1d1d; --hl: #3b3417; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.top b { font-size: 1.1rem; font-weight: 900; }
.stars { font-weight: 800; color: var(--star); white-space: nowrap; }
h1 { font-size: 1.7rem; font-weight: 900; margin: 18px 0 4px; line-height: 1.2; }
h2 { font-size: 1.2rem; font-weight: 800; margin: 26px 0 10px; display: flex; gap: 8px; align-items: center; }
.muted { color: var(--muted); } .small { font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.rule { background: var(--accent-soft); border: 0; }
.rule b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
.exl { display: grid; gap: 8px; margin-top: 10px; }
.exl > div { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: start; }
.exl .tr, .tr { color: var(--muted); font-size: .92rem; }
mark { background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 800; }
button { font: inherit; cursor: pointer; }
.say { border: 0; background: var(--accent-soft); color: var(--accent); width: 36px; height: 36px; border-radius: 50%; font-size: 1rem; flex: none; }
.btn { border: 0; background: var(--accent); color: var(--accent-fg); padding: 12px 20px; border-radius: 14px; font-weight: 800; font-size: 1rem; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.grid-w { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.wcard { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 14px 10px; }
.wcard .emo { font-size: 2.4rem; line-height: 1; min-height: 1em; }
.wcard .en { font-weight: 900; font-size: 1.15rem; }
.wcard .ex { font-size: .85rem; color: var(--muted); }
.q { display: grid; gap: 10px; }
.q-text { font-weight: 700; font-size: 1.05rem; }
.gap { display: inline-block; min-width: 3em; border-bottom: 3px solid var(--accent); text-align: center; color: var(--accent); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button, .chip { border: 2px solid var(--line); background: var(--card); color: var(--fg); padding: 9px 16px; border-radius: 99px; font-weight: 700; }
.opts button:hover:not(:disabled), .chip:hover { border-color: var(--accent); }
.right { background: var(--ok-soft) !important; border-color: var(--ok) !important; color: var(--ok) !important; }
.wrong { background: var(--bad-soft) !important; border-color: var(--bad) !important; color: var(--bad) !important; }
.expl { font-size: .9rem; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match .col { display: grid; gap: 8px; align-content: start; }
.match button { border: 2px solid var(--line); background: var(--card); color: var(--fg); padding: 10px; border-radius: 12px; font-weight: 700; min-height: 48px; }
.match button.sel { border-color: var(--accent); background: var(--accent-soft); }
.match button.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); opacity: .7; }
.match button.shake { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.build-line { min-height: 52px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.build-pool { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.used { visibility: hidden; }
textarea { font: inherit; width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); color: var(--fg); resize: vertical; }
textarea.ok { border-color: var(--ok); background: var(--ok-soft); }
.res { padding: 10px 12px; border-radius: 12px; background: var(--bg); display: grid; gap: 4px; }
.read-text { font-size: 1.08rem; line-height: 1.75; }
.gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 2px 14px; font-size: .92rem; }
.gloss span { color: var(--muted); }
.cloze-text { font-size: 1.05rem; line-height: 1.8; }
.cloze-text .gp { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--accent); text-align: center; font-weight: 800; color: var(--accent); }
.weeks { display: grid; gap: 10px; max-height: 360px; overflow: auto; }
.wk-h { font-weight: 800; } .wk-h span { color: var(--muted); font-weight: 600; font-size: .9rem; }
.days { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.days button { min-width: 50px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--fg); font-weight: 800; }
.days button.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.days button[aria-pressed="true"] { border-color: var(--accent); }
.progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.hero { display: grid; gap: 10px; margin-top: 14px; }
.finish { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 22px 16px; }
.finish .big { font-size: 3rem; }
details summary { cursor: pointer; font-weight: 800; }
.tiny-say { display: inline-flex; vertical-align: middle; }
@media (max-width: 420px) { h1 { font-size: 1.45rem; } .grid-w { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

],["The Earth is a ___.",["planet","flower","star"],0,"Земля — это планета."],["___ cold yesterday? — Yes, it was.",["Were it","Was it","Is it"],1,"Вчера — прошлое: Was it…?"]],"build":[["I can swim and ride a bike.","Я умею плавать и кататься на велосипеде."],["Igor plays football every day.","Игорь каждый день играет в футбол."],["The cat is sleeping now.","Кошка сейчас спит."],["We went to the zoo yesterday.","Вчера мы ходили в зоопарк."],["I am going to read a book.","Я собираюсь почитать книгу."],["Look at the beautiful rainbow!","Посмотри на красивую радугу!"]]}],"reads":[{"t":"Hello!","l":"A1","text":"Hello! My name is Oleg. I am ten years old. This is my brother. His name is Igor. He is fourteen. We have a cat. Her name is Murka. She is three. One, two, three, four, five! I like numbers. Goodbye!","g":[["Hello","привет"],["My name is","меня зовут"],["years old","лет (о возрасте)"],["brother","брат"],["Goodbye","до свидания"]],"q":[["How old is Oleg?",["ten","five","fourteen"],0],["Who is Igor?",["Oleg's brother","Oleg's dad","a cat"],0],["What is the cat's name?",["Murka","Igor","Oleg"],0]]},{"t":"My Colours","l":"A1","text":"My bag is blue. My pen is red. Igor's bag is black. Our cat Murka is grey and white. The sky is blue and the sun is yellow. Is the grass green? Yes, it is! My favourite colour is green. Igor's favourite colour is black. What is your favourite colour?","g":[["blue","синий"],["red","красный"],["grey","серый"],["yellow","жёлтый"],["green","зелёный"],["favourite","любимый"]],"q":[["What colour is Oleg's bag?",["blue","black","red"],0],["What colour is Murka?",["grey and white","black","yellow"],0],["What is Oleg's favourite colour?",["green","black","red"],0]]},{"t":"My Family","l":"A1","text":"This is my family. My mum is kind. My dad is tall. My brother Igor is big and clever. I am Oleg. I am small, but I am fast. We have a cat. Her name is Murka. She is in our family too. I love my family!","g":[["family","семья"],["mum","мама"],["dad","папа"],["kind","добрый"],["tall","высокий"],["clever","умный"]],"q":[["Who is tall?",["Dad","Mum","Murka"],0],["Who is small and fast?",["Oleg","Igor","Dad"],0],["Is Igor clever?",["Yes, he is.","No, he isn't.","He is small."],0]]},{"t":"My School Bag","l":"A1","text":"This is my school bag. In my bag I have two books and three pencils. I have a ruler and a rubber. I have four pens: two blue pens and two red pens. Igor has five notebooks and a calculator. My bag is small, but Igor's bag is big. Books are heavy!","g":[["school bag","школьный рюкзак"],["pencils","карандаши"],["ruler","линейка"],["rubber","ластик"],["notebooks","тетради"],["heavy","тяжёлый"]],"q":[["How many pencils has Oleg got?",["three","two","four"],0],["What has Igor got?",["five notebooks and a calculator","two books and a ruler","four red pens"],0],["Whose bag is big?",["Igor's","Oleg's","Mum's"],0]]},{"t":"This and That","l":"A1","text":"Look! This is my ball. That is Igor's ball. This ball is red and that ball is white. These are my shoes. Those are Dad's shoes. Dad's shoes are very big! Is this your cap? No, it isn't. It is Igor's cap. And that is Murka on the sofa. She is asleep.","g":[["Look","смотри"],["This","это, этот"],["That","то, тот"],["These","эти"],["Those","те"],["asleep","спит, спящий"]],"q":[["What colour is Igor's ball?",["white","red","black"],0],["Whose shoes are very big?",["Dad's","Oleg's","Igor's"],0],["Where is Murka?",["on the sofa","in the bag","at school"],0]]},{"t":"My Robot","l":"A1","text":"I have got a robot. His name is Bob. Bob has got a big head and two small eyes. He has got four arms and two long legs. He hasn't got a nose. Igor has got a robot too. His robot has got one eye and three legs. Murka hasn't got a robot. She has got a long tail!","g":[["have got","у меня есть"],["head","голова"],["eyes","глаза"],["arms","руки"],["legs","ноги"],["tail","хвост"]],"q":[["How many arms has Bob got?",["four","two","three"],0],["Has Bob got a nose?",["No, he hasn't.","Yes, he has.","He has got two noses."],0],["What has Murka got?",["a long tail","a robot","four arms"],0]]},{"t":"What Can They Do?","l":"A1","text":"Our cat Murka can run and jump. She can climb a tree. But she can't swim! Dogs can swim. Birds can fly. Fish can swim, but they can't walk. I can run fast and I can swim. Igor can play the guitar. Can you play the guitar? I can't!","g":[["can","может, умеет"],["jump","прыгать"],["climb","лазить, залезать"],["swim","плавать"],["fly","летать"],["can't","не может, не умеет"]],"q":[["What can't Murka do?",["swim","jump","climb a tree"],0],["Who can play the guitar?",["Igor","Oleg","Murka"],0],["What can fish do?",["swim","walk","fly"],0]]},{"t":"Lunch Time","l":"A1","text":"Here is my lunch box. In it I have got a sandwich, an apple and an egg. Igor has got a banana, an orange and a big cookie. Murka has got a bowl of milk. Mum has got a cup of tea. Dad has got an ice cream. Is it a good lunch? Yes, it is!","g":[["lunch box","ланчбокс, контейнер для обеда"],["sandwich","бутерброд"],["egg","яйцо"],["orange","апельсин"],["a cup of tea","чашка чая"],["ice cream","мороженое"]],"q":[["What has Igor got?",["a banana, an orange and a big cookie","a sandwich, an apple and an egg","a cup of tea"],0],["Who has got a cup of tea?",["Mum","Dad","Murka"],0],["What has Dad got?",["an ice cream","an egg","a bowl of milk"],0]]},{"t":"I Like Pizza","l":"A1","text":"I like pizza. I don't like fish. But Igor likes fish! I like football and computer games. I don't like rainy days. Murka likes milk. She likes sleeping on my bed. She doesn't like water. Mum likes flowers. Dad likes cars. What do you like?","g":[["like","нравится, любить"],["don't like","не нравится"],["computer games","компьютерные игры"],["rainy","дождливый"],["sleeping","спать (сон)"],["flowers","цветы"]],"q":[["What doesn't Oleg like?",["fish","pizza","football"],0],["What does Murka like?",["sleeping on Oleg's bed","water","flowers"],0],["Who likes cars?",["Dad","Mum","Igor"],0]]},{"t":"My School Day","l":"A1","text":"I go to school every day. I walk to school with my friend Max. I sit next to Max in class. We read, write and count. At break we play football. I eat lunch at school. After school I do my homework. Then I play with Murka. Do you go to school? Do you play football at break?","g":[["every day","каждый день"],["walk","ходить пешком"],["next to","рядом с"],["break","перемена"],["homework","домашнее задание"]],"q":[["Who does Oleg walk to school with?",["his friend Max","Igor","Dad"],0],["What do they do at break?",["play football","read books","sleep"],0],["When does Oleg do his homework?",["after school","at break","in the morning"],0]]},{"t":"My Brother Igor","l":"A1","text":"My brother Igor is fourteen. He goes to a lyceum. He gets up at seven. He likes science and maths. He reads a lot. On Saturday he plays football with me. Igor wants to be an engineer. Mum works in an office. Dad cooks dinner on Sundays. His soup is very good!","g":[["lyceum","лицей"],["gets up","встаёт"],["science","естественные науки"],["wants","хочет"],["engineer","инженер"],["cooks","готовит"]],"q":[["When does Igor get up?",["at seven","at eight","at six"],0],["What does Igor want to be?",["an engineer","a teacher","a footballer"],0],["Who cooks dinner on Sundays?",["Dad","Mum","Igor"],0]]},{"t":"Mum's Questions","l":"A1","text":"Mum asks me questions every evening. Do you have homework? Yes, I do. Does Igor have homework? Yes, he does. He always has a lot! Do you want soup? No, I don't. I want pasta. Does Murka want fish? Yes, she does! Does Dad watch TV? No, he doesn't. He reads a book.","g":[["asks","спрашивает"],["questions","вопросы"],["always","всегда"],["a lot","много"],["want","хотеть"],["watch TV","смотреть телевизор"]],"q":[["What does Oleg want?",["pasta","soup","fish"],0],["Does Igor have homework?",["Yes, he does.","No, he doesn't.","No, he is."],0],["What does Dad do in the evening?",["He reads a book.","He watches TV.","He cooks pasta.     box.innerHTML = words.map((w, i) => {
      const opts = sshuffle([w].concat(sshuffle(all.filter(x => x !== w), rng32(seed + i)).slice(0, 2)), rng32(seed * 3 + i));
      return `<div class="card q lq" data-ok="${esc(w[0])}"><div class="q-text">${i + 1}. Послушай ${sayBtn(w[0])} и выбери слово</div><div class="opts">${opts.map(o => `<button type="button" data-w="${esc(o[0])}">${C.emoji && o[2] ? o[2] + " " : ""}${esc(o[0])}</button>`).join("")}</div></div>`;
    }).join("");
    box.querySelectorAll(".q").forEach(qe => qe.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
      qe.querySelectorAll("[data-w]").forEach(x => { x.disabled = true; if (x.dataset.w === qe.dataset.ok) x.classList.add("right"); });
      if (b.dataset.w !== qe.dataset.ok) b.classList.add("wrong"); else addStar(1);
    }));
  }
  function buildGame(box, items, seed) {
    box.innerHTML = items.map(([en, ru], i) => {
      const toks = en.replace(/[.!?]$/, "").split(/\s+/), mark = en.match(/[.!?]$/) ? en.slice(-1) : "";
      let sh = sshuffle(toks.map((t, k) => k), rng32(seed + i)); if (toks.length > 1 && sh.every((v, k) => v === k)) sh = sh.reverse();
      return `<div class="card stack" data-b="${i}" data-ans="${esc(toks.join(" "))}" data-mark="${esc(mark)}"><div><b>${i + 1}. ${esc(ru)}</b></div><div class="build-line"></div>
        <div class="build-pool">${sh.map(k => `<button type="button" class="chip" data-k="${k}">${esc(toks[k])}</button>`).join("")}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-chk>Проверить</button><button type="button" class="btn ghost" data-clr>Заново</button></div><div class="res" hidden></div></div>`;
    }).join("");
    box.querySelectorAll("[data-b]").forEach(c => {
      const line = c.querySelector(".build-line"), res = c.querySelector(".res");
      c.querySelectorAll(".build-pool .chip").forEach(ch => ch.onclick = () => {
        if (ch.classList.contains("used")) return; ch.classList.add("used");
        const t = document.createElement("button"); t.type = "button"; t.className = "chip"; t.textContent = ch.textContent; t.dataset.k = ch.dataset.k;
        t.onclick = () => { t.remove(); ch.classList.remove("used"); }; line.appendChild(t);
      });
      c.querySelector("[data-clr]").onclick = () => { line.innerHTML = ""; c.querySelectorAll(".build-pool .chip").forEach(x => x.classList.remove("used")); res.hidden = true; };
      c.querySelector("[data-chk]").onclick = () => {
        const got = [...line.children].map(x => x.textContent).join(" "), ok = got === c.dataset.ans;
        res.hidden = false; res.innerHTML = ok ? `<b style="color:var(--ok)">✓ Верно! ${sayBtn(c.dataset.ans)}</b>` : `<b style="color:var(--bad)">Пока не так.</b><span>Правильно: ${esc(c.dataset.ans + c.dataset.mark)} ${sayBtn(c.dataset.ans)}</span>`;
        if (ok && !c.dataset.got) { c.dataset.got = 1; addStar(2); speak(c.dataset.ans); }
      };
    });
  }
  function trGame(box, items) {
    box.innerHTML = items.map(([ru, hint, ans], i) => `<div class="card stack" data-t="${i}"><div><b>${i + 1}. ${esc(ru)}</b> <span class="small muted">(${esc(hint)})</span></div>
      <textarea rows="2" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Напиши по-английски"></textarea>
      <div><button type="button" class="btn">Проверить</button></div><div class="res" hidden></div></div>`).join("");
    box.querySelectorAll("[data-t]").forEach(c => {
      const it = items[+c.dataset.t], ta = c.querySelector("textarea"), res = c.querySelector(".res");
      c.querySelector(".btn").onclick = () => {
        const v = ta.value.trim(); if (!v) { ta.focus(); return; }
        const f = trForms(v), ok = it[2].some(a => trForms(a).some(x => f.includes(x)));
        res.hidden = false; res.innerHTML = `<b style="color:var(${ok ? "--ok" : "--muted"})">${ok ? "✓ Верно!" : "Сравни с вариантом — если смысл тот же, засчитывай себе"}</b>${it[2].slice(0, 2).map(a => `<span>${sayBtn(a)} ${esc(a)}</span>`).join("")}`;
        if (ok && !c.dataset.got) { c.dataset.got = 1; ta.classList.add("ok"); addStar(2); }
      };
    });
  }
  function readHtml(r, L, pre) {
    let html = esc(r.text);
    r.g.forEach(([en, ru]) => { html = html.replace(new RegExp("\\b(" + en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "i"), `<mark title="${esc(ru)}">$1</mark>`); });
    return `<div class="card stack"><div style="display:flex;gap:8px;align-items:center"><b>${esc(r.t)}</b><span class="small muted">${r.l}</span></div>
      <div><button type="button" class="btn ghost" data-say="${esc(r.text)}">🔊 Послушать текст</button></div><p class="read-text" style="margin:0">${html}</p>
      <div class="gloss">${r.g.map(([en, ru]) => `<div><b>${esc(en)}</b> — <span>${esc(ru)}</span></div>`).join("")}</div></div>
      <div class="stack">${quizHtml(r.q.map(([q, o, ok]) => [q, o, ok, ""]), pre, L.n * 97)}</div>`;
  }
  function clozeHtml(cz, L) {
    let txt = esc(cz.text); for (let k = 1; k <= 5; k++) txt = txt.replace(`(${k})___`, `<span class="gp" id="cz-${k}">(${k})</span>`);
    return `<div class="card stack"><b>${esc(cz.t)}</b><p class="cloze-text" style="margin:0">${txt}</p></div>
      <div class="stack">${cz.gaps.map((opts, i) => { const order = sshuffle(opts.map((o, j) => j), rng32(L.n * 53 + i)); return `<div class="card q" data-ok="0" data-gap="${i + 1}"><div class="q-text">Пропуск ${i + 1}</div><div class="opts">${order.map(j => `<button type="button" data-j="${j}">${esc(opts[j])}</button>`).join("")}</div></div>`; }).join("")}</div>`;
  }
  function show() {
    const L = buildLessons()[cur - 1]; if (!L) return;
    const tps = L.topics, s = [];
    let k = 0; const H = t => `<h2>${++k}. ${t}</h2>`;
    s.push(`<h1 style="margin-top:28px">Урок ${L.n} ${C.mode === "kid" ? tps[0].emoji || "" : ""}</h1><p class="muted">Неделя ${L.w} · ${DAYS[L.d - 1]} · ${KIND[L.kind]} · ≈ 15 минут</p>`);
    s.push(H(L.kind === "review" && tps.length > 1 ? "Правила недели" : "Правило") + tps.map(tp => `<div class="card rule"><b>${esc(tp.t)}</b><span>${esc(tp.rule)}</span>
      <div class="exl">${tp.ex.slice(0, L.kind === "new" ? 5 : 3).map(([en, ru]) => `<div>${sayBtn(en)}<div><div>${hl(en)}</div><div class="tr">${esc(ru)}</div></div></div>`).join("")}</div></div>`).join(""));
    if (L.words && L.words.length) s.push(H("Новые слова") + `<div class="grid-w">${L.words.map(w => C.mode === "kid"
      ? `<div class="card wcard"><div class="emo">${w[2] || ""}</div><div class="en">${esc(w[0])}</div>${sayBtn(w[0])}<div>${esc(w[1])}</div><div class="ex">${hl(w[3] || "")}</div></div>`
      : `<div class="card wcard"><div class="en">${esc(w[0])}</div>${sayBtn(w[0])}<div>${esc(w[1])}</div><div class="ex">${hl(w[2] || "")}</div></div>`).join("")}</div>`);
    if (L.listen) s.push(H("Послушай и выбери") + `<div class="stack" id="g-listen"></div>`);
    if (L.match && L.match.length) s.push(H("Найди пару") + `<div id="g-match"></div>`);
    if (L.quiz && L.quiz.length) s.push(H("Тест") + `<div class="stack" id="g-quiz">${quizHtml(L.quiz, "q", L.n * 31)}</div>`);
    if (L.build && L.build.length) s.push(H("Собери предложение") + `<div class="stack" id="g-build"></div>`);
    if (L.tr && L.tr.length) s.push(H("Переведи на английский") + `<div class="stack" id="g-tr"></div>`);
    if (L.read) s.push(H(C.mode === "kid" ? "Читаем историю" : "Чтение (как на НМТ)") + `<div class="stack" id="g-read">${readHtml(L.read, L, "r")}</div>`);
    if (L.cloze) s.push(H("Use of English (как на НМТ)") + `<p class="muted small">Выбери правильное слово для каждого пропуска.</p><div class="stack" id="g-cloze">${clozeHtml(L.cloze, L)}</div>`);
    s.push(`<div class="card finish"><div class="big">${done[L.n] ? "✅" : "🏁"}</div><b>${done[L.n] ? "Этот урок уже пройден" : "Всё сделал? Молодец!"}</b>
      <button type="button" class="btn" id="fin">${done[L.n] ? "К следующему уроку →" : "Урок пройден ✓ (+5 ⭐)"}</button>${cur > 1 ? `<button type="button" class="btn ghost" id="prev">← предыдущий урок</button>` : ""}</div>`);
    $("lesson").innerHTML = s.join("");
    if (L.listen) listenGame($("g-listen"), L.listen, L.topics[0].words, L.n * 17);
    if (L.match && L.match.length) matchGame($("g-match"), L.match.map(w => C.mode === "kid" ? [w[0], w[1], w[2]] : [w[0], w[1]]), L.n * 13);
    bindQuiz($("lesson"));
    if (L.build && L.build.length) buildGame($("g-build"), L.build, L.n * 19);
    if (L.tr && L.tr.length) trGame($("g-tr"), L.tr);
    if (L.cloze) $("g-cloze").querySelectorAll(".q").forEach(qe => qe.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      const g = $("cz-" + qe.dataset.gap); if (g) g.textContent = L.cloze.gaps[+qe.dataset.gap - 1][0];
    })));
    $("fin").onclick = () => { if (!done[L.n]) { done[L.n] = 1; store.set("done", done); addStar(5); } if (cur < buildLessons().length) { cur++; store.set("cur", cur); } header(); show(); $("lesson").scrollIntoView({ block: "start" }); };
    const p = $("prev"); if (p) p.onclick = () => { cur--; store.set("cur", cur); header(); show(); $("lesson").scrollIntoView({ block: "start" }); };
  }
  header(); show();
  (async () => { try { if (window.claude && window.claude.use) { const t = await window.claude.use("tts"); if (t) { TTS = t; if (!canSpeak) show(); } } } catch (e) {} })();
}
</script>
