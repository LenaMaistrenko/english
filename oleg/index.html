<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Английский для Олега</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fffaf2; --card: #ffffff; --fg: #1d1b26; --muted: #6b6878; --line: #ece4d6;
  --accent: #f06a12; --accent-soft: #ffe8d6; --accent-fg: #ffffff;
  --ok: #1f9d55; --ok-soft: #e3f6ea; --bad: #d64545; --bad-soft: #fde8e8; --star: #f5a524; --hl: #fff1c2;
  --f: "Nunito", system-ui, sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15141b; --card: #1f1e27; --fg: #f1eff7; --muted: #a29fb3; --line: #33313f;
  --accent-soft: #3a2414; --ok: #4cc77f; --ok-soft: #173326; --bad: #f07070; --bad-soft: #3a1d1d; --hl: #3b3417; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15141b; --card: #1f1e27; --fg: #f1eff7; --muted: #a29fb3; --line: #33313f;
  --accent-soft: #3a2414; --ok: #4cc77f; --ok-soft: #173326; --bad: #f07070; --bad-soft: #3a1d1d; --hl: #3b3417; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.top b { font-size: 1.1rem; font-weight: 900; }
.stars { font-weight: 800; color: var(--star); white-space: nowrap; }
h1 { font-size: 1.7rem; font-weight: 900; margin: 18px 0 4px; line-height: 1.2; }
h2 { font-size: 1.2rem; font-weight: 800; margin: 26px 0 10px; display: flex; gap: 8px; align-items: center; }
.muted { color: var(--muted); } .small { font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.rule { background: var(--accent-soft); border: 0; }
.rule b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
.exl { display: grid; gap: 8px; margin-top: 10px; }
.exl > div { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: start; }
.exl .tr, .tr { color: var(--muted); font-size: .92rem; }
mark { background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 800; }
button { font: inherit; cursor: pointer; }
.say { border: 0; background: var(--accent-soft); color: var(--accent); width: 36px; height: 36px; border-radius: 50%; font-size: 1rem; flex: none; }
.btn { border: 0; background: var(--accent); color: var(--accent-fg); padding: 12px 20px; border-radius: 14px; font-weight: 800; font-size: 1rem; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.grid-w { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.wcard { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 14px 10px; }
.wcard .emo { font-size: 2.4rem; line-height: 1; min-height: 1em; }
.wcard .en { font-weight: 900; font-size: 1.15rem; }
.wcard .ex { font-size: .85rem; color: var(--muted); }
.q { display: grid; gap: 10px; }
.q-text { font-weight: 700; font-size: 1.05rem; }
.gap { display: inline-block; min-width: 3em; border-bottom: 3px solid var(--accent); text-align: center; color: var(--accent); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button, .chip { border: 2px solid var(--line); background: var(--card); color: var(--fg); padding: 9px 16px; border-radius: 99px; font-weight: 700; }
.opts button:hover:not(:disabled), .chip:hover { border-color: var(--accent); }
.right { background: var(--ok-soft) !important; border-color: var(--ok) !important; color: var(--ok) !important; }
.wrong { background: var(--bad-soft) !important; border-color: var(--bad) !important; color: var(--bad) !important; }
.expl { font-size: .9rem; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match .col { display: grid; gap: 8px; align-content: start; }
.match button { border: 2px solid var(--line); background: var(--card); color: var(--fg); padding: 10px; border-radius: 12px; font-weight: 700; min-height: 48px; }
.match button.sel { border-color: var(--accent); background: var(--accent-soft); }
.match button.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); opacity: .7; }
.match button.shake { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.build-line { min-height: 52px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.build-pool { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.used { visibility: hidden; }
textarea { font: inherit; width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); color: var(--fg); resize: vertical; }
textarea.ok { border-color: var(--ok); background: var(--ok-soft); }
.res { padding: 10px 12px; border-radius: 12px; background: var(--bg); display: grid; gap: 4px; }
.read-text { font-size: 1.08rem; line-height: 1.75; }
.gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 2px 14px; font-size: .92rem; }
.gloss span { color: var(--muted); }
.cloze-text { font-size: 1.05rem; line-height: 1.8; }
.cloze-text .gp { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--accent); text-align: center; font-weight: 800; color: var(--accent); }
.weeks { display: grid; gap: 10px; max-height: 360px; overflow: auto; }
.wk-h { font-weight: 800; } .wk-h span { color: var(--muted); font-weight: 600; font-size: .9rem; }
.days { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.days button { min-width: 50px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--fg); font-weight: 800; }
.days button.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.days button[aria-pressed="true"] { border-color: var(--accent); }
.progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.hero { display: grid; gap: 10px; margin-top: 14px; }
.finish { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 22px 16px; }
.finish .big { font-size: 3rem; }
details summary { cursor: pointer; font-weight: 800; }
.tiny-say { display: inline-flex; vertical-align: middle; }
@media (max-width: 420px) { h1 { font-size: 1.45rem; } .grid-w { grid-template-columns: repeat(2, 1fr); } }
[hidden] { display: none !important; }

/* --- Клуша-талисман и анимации (Олег 2026-11-25: «как в Duolingo») --- */
#mascot{position:fixed;right:12px;bottom:12px;z-index:70;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
#mascot svg{width:110px;height:94px;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 3px 6px #0003);transform-origin:50% 100%}
#mascot .bub{pointer-events:none;background:var(--card);color:var(--fg);border:2px solid var(--accent);border-radius:16px 16px 4px 16px;padding:8px 12px;font-weight:700;max-width:220px;opacity:0;transform:translateY(8px) scale(.9);transition:.25s}
#mascot.talk .bub{opacity:1;transform:none}
#mascot.hop svg{animation:hop .6s ease}
#mascot.sad svg{animation:wob .5s ease}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) scaleY(.9)}80%{transform:translateY(-6px)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.wcard{animation:pop .45s ease both}.grid-w .wcard:nth-child(2){animation-delay:.08s}.grid-w .wcard:nth-child(3){animation-delay:.16s}.grid-w .wcard:nth-child(4){animation-delay:.24s}.grid-w .wcard:nth-child(5){animation-delay:.32s}
@keyframes pop{0%{opacity:0;transform:scale(.7) translateY(12px)}70%{transform:scale(1.05)}100%{opacity:1;transform:none}}
.opts button.right{animation:yes .5s ease}@keyframes yes{40%{transform:scale(1.15)}}
.opts button.wrong{animation:no .4s ease}@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:69;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.short{font-size:.85rem;color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.wcard,#mascot svg,.confetti,.opts button{animation:none!important}}

.fly{position:fixed;z-index:72;font-weight:800;color:#f0a500;pointer-events:none;animation:flyup 1s ease-out forwards;text-shadow:0 1px 2px #0003}
@keyframes flyup{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.stars.bump{animation:bump .5s ease}@keyframes bump{40%{transform:scale(1.45) rotate(-8deg)}}
.combo{position:fixed;left:50%;top:38%;z-index:73;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:900;color:#ff6a00;text-shadow:0 2px 0 #fff,0 4px 12px #0004;pointer-events:none;animation:combo 1.2s ease forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.levelup{position:fixed;inset:0;z-index:74;display:grid;place-items:center;background:#0006;animation:fadein .3s}
.levelup>div{background:var(--card);color:var(--fg);border-radius:22px;padding:22px 26px;text-align:center;max-width:320px;box-shadow:0 10px 40px #0005;animation:pop .5s ease}
.levelup .big{font-size:3rem}@keyframes fadein{from{opacity:0}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}.reveal.in{opacity:1;transform:none}
#mascot .eye{animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#mascot.idle svg{animation:wiggle 1.2s ease}@keyframes wiggle{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.fly,.combo,.reveal,#mascot .eye{animation:none!important;transition:none!important;opacity:1;transform:none}}

#mascot .m-sad,#mascot .tear{display:none}#mascot.sad .m-sad,#mascot.sad .tear{display:inline}#mascot.sad .m-happy{display:none}
#mascot.sad .tear{animation:drip 1s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(10px);opacity:0}}
#mascot.dance svg{animation:dance 1s ease-in-out 3}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translate(-8px,-14px) rotate(-12deg)}40%{transform:translate(0,0) rotate(0) scaleX(-1)}60%{transform:translate(8px,-14px) rotate(12deg) scaleX(-1)}80%{transform:translate(0,0) rotate(0)}}
#mascot .note{position:absolute;bottom:70px;font-size:1.4rem;pointer-events:none;animation:note 2.4s ease-out forwards}
@keyframes note{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-80px) rotate(20deg)}}
#mascot .kl-mute{pointer-events:auto;position:absolute;right:-4px;top:-8px;border:0;border-radius:50%;width:28px;height:28px;background:var(--card);box-shadow:0 1px 4px #0003;font-size:14px;cursor:pointer}
#mascot{position:fixed}

#mascot.chomp svg{animation:chomp .6s ease 2}@keyframes chomp{0%,100%{transform:scale(1)}50%{transform:scale(1.08,.92)}}
#lusha{position:fixed;left:-160px;bottom:12px;z-index:69;display:flex;flex-direction:column;align-items:flex-start;gap:2px;transition:left .7s cubic-bezier(.3,.7,.4,1);pointer-events:none}
#lusha.in{left:8px}#lusha svg{width:100px;height:95px;pointer-events:auto;cursor:pointer;transform:scaleX(-1);filter:drop-shadow(0 3px 6px #0003)}
#lusha .bub{background:var(--card);color:var(--fg);border:2px solid #e9a55f;border-radius:14px 14px 14px 4px;padding:6px 10px;font-weight:700;font-size:.9rem;opacity:0;transition:.25s;max-width:150px}
#lusha.talk .bub{opacity:1}
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("kids-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script></head>

    <div id="th" class="stack" hidden></div>

    <div id="st" class="stack" hidden></div>
    <div id="wd" class="stack" hidden></div>

</main>

ords":[["detective","детектив","🕵️","A good [detective] notices everything."],["clue","улика, подсказка","🔍","We found a [clue] under the sofa."],["mystery","тайна, загадка","❓","Who ate the cake? It's a [mystery]!"],["suspect","подозреваемый","🤨","Murka was our main [suspect]."],["footprint","след (ноги, лапы)","🐾","There was a muddy [footprint] on the floor."],["evidence","доказательства","📁","We need more [evidence] before we decide."],["crumbs","крошки","🍰","There were [crumbs] on Igor's T-shirt."],["solve","раскрыть, решить","💡","Can you [solve] this mystery?"],["notice","заметить","👀","Did you [notice] the open window?"],["disappear","исчезнуть","💨","The last cookie had [disappeared]."],["by the time","к тому времени, как","⏰","[By the time] I woke up, everyone had left."],["investigate","расследовать","","Let's [investigate] the kitchen!"]],"quiz":[["When I got to school, the lesson ___ already started.",["had","was","has"],0,"Урок начался ещё раньше, чем я пришёл, — had started."],["By the time Mum came home, we ___ the kitchen.",["were cleaned","have cleaned","had cleaned"],2,"К моменту в прошлом — had + 3-я форма: had cleaned."],["I couldn't play because I ___ my password.",["have forgotten","forget","had forgotten"],2,"Сначала забыл, потом не смог играть — Past Perfect: had forgotten."],["Igor was hungry because he ___ breakfast.",["hasn't had","not had","hadn't had"],2,"Отрицание Past Perfect — hadn't + 3-я форма (had)."],["___ you ever seen a real robot before that day?",["Did","Were","Had"],2,"before that day — раньше момента в прошлом: Had you ever seen…?"],["When we arrived at the cinema, the film had already ___.",["starting","start","started"],2,"После had — 3-я форма: started."],["After Murka ___ the fish, she fell asleep.",["had eaten","had ate","has eaten"],0,"had + eaten (3-я форма eat). ate — это 2-я форма."],["We realised that the hamster ___ from its cage.",["has escaped","had escaped","escapes"],1,"Сбежал раньше, чем мы поняли, — had escaped."],["I ___ my homework, so I went out to play football.",["finish","have finished","had finished"],2,"Сначала закончил, потом пошёл — had finished."],["When I came in, Igor ___ Minecraft, so I sat down and watched.",["has played","was playing","had played"],1,"Игра шла в тот момент, когда я вошёл, — Past Continuous: was playing."],["Yesterday I ___ a strange footprint in the garden.",["found","have found","had found"],0,"Просто событие вчера, без «ещё раньше» — Past Simple: found."],["She had never ___ a mystery so quickly.",["solved","solve","solving"],0,"had never + 3-я форма: solved."],["The cake was gone! Somebody ___ it.",["has been eating","ate already","had eaten"],2,"Съели раньше, чем мы заметили, — had eaten."],["I've ___ finished the book, so I can tell you the ending.",["ever","yet","just"],2,"Present Perfect: just — только что. yet — в вопросах и отрицаниях."]],"build":[["Igor had eaten the whole cake.","Игорь съел весь торт (ещё раньше)."],["The film had started before we arrived.","Фильм начался ещё до того, как мы пришли."],["I had never seen a robot before.","Я никогда раньше не видел робота."],["Had you finished your homework?","Ты (уже) закончил домашку?"],["We found a clue under the sofa.","Мы нашли улику под диваном."],["Murka had broken the vase.","Мурка (уже) разбила вазу."]]},{"t":"Present Perfect Continuous: have been doing","theme":"Большая стройка в Minecraft","emoji":"⛏️","rule":"Present Perfect Continuous = have/has been + глагол-ing. Говорит о действии, которое началось в прошлом и всё ещё продолжается: I have been building this castle for three days (строю уже три дня и ещё строю). She has been waiting since 5 o'clock. Вопрос: How long have you been playing? Отрицание: I haven't been sleeping well. Ещё так говорят, когда действие только что закончилось и виден результат: Why are you so dirty? — I've been digging in the garden. Сравни: I have built a castle (готово, важен результат или количество) — I have been building a castle (важен e has been waiting ___ 3 o'clock.",["for","since","from"],1,"Точка начала (3 o'clock) — since."],["We've been exploring the cave ___ an hour.",["for","during","since"],0,"Отрезок времени (an hour) — for."],["I ___ Ilya for five years. He's my best friend.",["have known","have been knowing","am knowing"],0,"know не ставим в -ing — have known."],["Look! I ___ my first diamond!",["have found","have been finding","has found"],0,"Разовое действие с результатом — Present Perfect: have found."],["It ___ all day. The ground is very wet.",["has been raining","is been raining","have been raining"],0,"it → has been raining."],["Murka ___ on my bed all morning.",["has been sleeping","has sleeping","have been sleeping"],0,"Murka = she → has been sleeping (не забываем been)."],["I ___ three houses this week.",["been built","have been building","have built"],2,"Указано количество (три дома) — важен результат: have built."],["Mum, I haven't ___ playing all day! I've been doing my homework!",["been","being","be"],0,"haven't been + -ing."],["Yesterday I ___ Minecraft for two hours.",["played","has played","have been playing"],0,"yesterday — закончившееся прошлое: Past Simple played."],["My eyes hurt because I ___ at the screen for too long.",["have been looking","had been look","am looking"],0,"Результат сейчас (глаза болят) — have been looking."]],"build":[["I have been building this castle for days.","Я строю этот замок уже несколько дней."],["How long have you been playing?","Сколько ты уже играешь?"],["Igor has been sleeping since lunch.","Игорь спит с обеда."],["It has been raining all morning.","Всё утро идёт дождь."],["We have been exploring the cave.","Мы исследовали пещеру (и ещё исследуем)."],["I haven't been waiting long.","Я жду недолго."]]},{"t":"If I were…, I would…: если бы","theme":"Если бы у меня была суперсила","emoji":"🦸","rule":"Second Conditional — нереальное или маловероятное условие сейчас или в будущем («если бы…, то бы…»). Схема: If + Past Simple, would + глагол. If I had a robot, it would do my homework (робота у меня нет — это мечта). С be обычно говорим were для всех: If I were you… (на твоём месте), If Igor were here… would часто сокращают: I'd, you'd, he'd. Отрицание: wouldn't. Вопрос: What would you do if you won a million? Вместо can в части с if — could: If I could fly… Сравни с First Conditional (реально возможно): If it rains, I will stay at home. Second Conditional (мечта или вряд ли): If I lived on the Moon, I would jump very high. Запомни: would НИКОГДА не ставим в часть с if!","ex":[["If I [had] a robot, it [would do] my homework.","Если бы у меня был робот, он бы делал мою домашку."],["If I [were] you, I [would] say sorry.","На твоём месте я бы извинился."],["What [would] you [do] if you [met] an alien?","Что бы ты сделал, если бы встретил инопланетянина?"],["If Murka [could] talk, she [would ask] for more fish.","Если бы Мурка умела говорить, она бы попросила ещё рыбы."],["If I [were] invisible, I [wouldn't tell] anyone.","Если бы я был невидимым, я бы никому не сказал."]],"words":[["superpower","суперсила","🦸","Which [superpower] would you choose?"],["invisible","невидимый","👻","If I were [invisible], I would visit a robot factory."],["wish","желание; желать","🌠","You have three [wishes]."],["million","миллион","💰","What would you buy with a [million] dollars?"],["alien","инопланетянин","👽","If I met an [alien], I would say hello."],["island","остров","🏝️","I would live on a small [island]."],["imagine","представлять, воображать","💭","[Imagine] that you can fly!"],["choose","выбирать","","It's hard to [choose] just one."],["rich","богатый","🤑","If we were [rich], we would travel a lot."],["magic","волшебный; волшебство","✨","I wish I had a [magic] wand."],["instead of","вместо","","I would fly [instead of] taking the bus."],["if I were you","на твоём месте","👉","[If I were you], I would ask Mum."]],"quiz":[["If I ___ a million dollars, I would buy an island.",["have","would have","had"],2,"Second Conditional: в части с if — Past Simple: had."],["If I were invisible, I ___ into the stadium for free.",["went","will go","would go"],2,"Во второй части — would + глагол."],["If I ___ you, I would tell Mum the truth.",["were","am","was being"],0,"If I were you — на твоём месте."],["What would you do if you ___ an alien in the garden?",["would see","saw","see"],1,"В части с if — Past Simple (saw), не would."],["If it rains tomorrow, we ___ at home.",["will stay","stayed","would stay"],0,"Вполне реально — First Conditional: will stay."],["If Murka could talk, she ___ 'More fish, please!'",["says","would say","will say"],1,"Кошки не говорят — мечта: would say."],["I ___ go to Mars if I were an astronaut.",["did","would","will"],1,"would + глагол — «бы»."],["If I ___ fly, I wouldn't need a bus.",["would can","could","can"],1,"can в части с if превращается в could."],["If Igor ___ more, he would be a better goalkeeper.",["trained","trains","would train"],0,"If + Past Simple: trained."],["She ___ be so tired if she went to bed earlier.",["won't","didn't","wouldn't"],2,"Отрицание во второй части — wouldn't."],["If you heat ice, it ___.",["would melt","melts","melted"],1,"Это факт, так бывает всегда, — Present Simple: melts."],["Where would you live if you ___ choose any place in the world?",["can","will","could"],2,"В части с if — could."],["If I had a superpower, I ___ choose invisibility.",["'d","'ll","'m"],0,"I'd = I would."],["I ___ to the seaside three times in my life.",["would be","were","have been"],2,"Опыт в жизни — Present Perfect: have been."]],"build":[["I would buy an island if I were rich.","Я бы купил остров, если бы был богатым."],["I would say sorry if I were you.","На твоём месте я бы извинился."],["What would you do with a million?","Что бы ты сделал с миллионом?"],["Murka would ask for fish if she could talk.","Мурка просила бы рыбу, если бы умела говорить."],["I would fly to Mars if I could.","Я бы полетел на Марс, если бы мог."],["We wouldn't need a bus if we had wings.","Нам не нужен был бы автобус, если бы у нас были крылья."]]},{"t":"Пассив: is being built, will be made","theme":"Космическая станция","emoji":"🚀","rule":"Passive (страдательный залог) = be в нужном времени + 3-я форма глагола. Важно ЧТО делают, а не КТО делает. Настоящее: The robots are made in Japan. Прошедшее: The station was built many years ago. Прямо сейчас, в процессе: A new rocket is being built (строится сейчас) — am/is/are being + 3-я форма. Present Perfect: The rocket has been launched (уже запущена). Будущее: The robot will be finished next week. С модальными: It can be seen from Earth. It must be cleaned. Кто сделал — через by: The game was made by a small team. Проверка: если подлежащее само делает действие — обычный залог (Astronauts eat special food). Если с ним что-то делают — пассив (Special food is eaten in space).","ex":[["A new rocket [is being built] right now.","Новая ракета строится прямо сейчас."],["The space station [was built] many years ago.","Космическую станцию построили много лет назад."],["The robot [will be finished] next week.","Робота закончат на следующей неделе."],["The astronauts [have been chosen].","Астронавтов уже выбрали."],["The station [can be seen] from Earth at night.","Станцию можно увидеть с Земли ночью."]],"words":[["launch","запуск; запускать","🚀","The rocket will be [launched] tomorrow."],["astronaut","астронавт","🧑‍🚀","The [astronauts] have been training for years."],["orbit","орбита","🛰️","The station moves in [orbit] around the Earth."],["satellite","спутник","📡","The first [satellite] was launched in 1957."],["gravity","гравитация, притяжение","🍎","There is almost no [gravity] on the station."],["oxygen","кислород","🫧","[Oxygen] is made from water."],["crew","экипаж","👨‍🚀","The [crew] has been chosen."],["engineer","инженер","🛠️","The robot was built by [engineers]."],["telescope","телескоп","🔭","A new [telescope] is being built."],["mission","миссия, полёт","🎯","The [mission] will last six months."],["spacesuit","скафандр","","Every [spacesuit] is checked before a walk."],["repair","ремонтировать","🔧","The solar panel must be [repaired]."]],"quiz":[["A new space station ___ right now.",["is building","has built","is being built"],2,"Станция сама не строит, её строят сейчас — is being built."],["The first satellite ___ in 1957.",["has launched","is launched","was launched"],2,"Год в прошлом + пассив — was launched."],["The crew ___ next month.",["are choosing","will be chosen","will choose"],1,"Экипаж выберут — будущее пассив: will be chosen."],["The rocket has ___ repaired.",["been","being","be"],0,"Present Perfect пассив: has been + 3-я форма."],["This telescope ___ by engineers from many countries.",["was making","was made","made"],1,"Есть by — его сделали: was made."],["Look! The robot ___ by Igor.",["painted","is painting","is being painted"],2,"Робота красят прямо сейчас (by Igor) — is being painted."],["The station can ___ from Earth at night.",["been seen","see","be seen"],2,"После can — be + 3-я форма: can be seen."],["English ___ all over the world.",["is speaking","is spoken","speaks"],1,"Язык сам не говорит — на нём говорят: is spoken."],["Our new school ___ yet.",["hasn't been finished","hasn't finished","didn't finish"],0,"Школу ещё не достроили (её) — hasn't been finished."],["Astronauts ___ special food in space.",["is eating","eat","are eaten"],1,"Астронавты сами едят — обычный залог: eat."],["Millions of games ___ every day.",["are playing","are played","play"],1,"В игры играют — пассив: are played."],["When I came in, Igor ___ the robot.",["has repaired","was repairing","was repaired"],1,"Игорь сам чинил в тот момент — Past Continuous: was repairing."],["The spacesuits must ___ before every mission.",["check","been checked","be checked"],2,"must + be + 3-я форма."],["I've ___ seen a real rocket launch.",["yet","never","ever"],1,"I've never seen — я никогда не видел."]],"build":[["A new rocket is being built.","Строится новая ракета."],["The station was built long ago.","Станцию построили давно."],["The robot will be finished tomorrow.","Робота закончат завтра."],["The astronauts have been chosen.","Астронавтов уже выбрали."],["It can be seen from Earth.","Это можно увидеть с Земли."],["This game was made by a small team.","Эту игру сделала маленькая команда."]]},{"t":"She asked if…: чужие вопросы","theme":"Новенький в классе","emoji":"🎤","rule":"Как пересказать чужой ВОПРОС. 1) Вопрос «да/нет» → asked if (или whether): «Do you like football?» → She asked if I liked football. 2) Вопрос со словом (where, what, how, why, when, who) → asked + это слово: «Where do you live?» → He asked where I lived. Главное: в пересказе НЕТ вопросительного порядка и НЕТ do/does/did! Сначала подлежащее, потом глагол: He asked where I lived (не where did I live). В конце — точка, а не знак вопроса. Время сдвигается назад, как в He said that…: like → liked, is → was, can → could, will → would, did/saw → had seen. Местоимения меняются: you → I, he, she. Похожие слова: wanted to know, wondered (интересовался). Просьбу или приказ пересказываем так: Mum told me to tidy my room.","ex":[["The teacher [asked if] I [liked] maths.","Учительница спросила, люблю ли я математику."],["Ilya [asked where] I [lived].","Макс спросил, где я живу."],["Mum [wanted to know what] we [were doing].","Мама хотела знать, что мы делаем."],["Igor [asked me if] I [could] help him.","Игорь спросил меня, могу ли я ему помочь."],["She [asked why] I [was] late.","Она спросила, почему я опоздал."]],"words":[["interview","интервью; брать интервью","🎤","The reporter [interviewed] our coach."],["reporter","репортёр","📰","The [reporter] asked how we had won."],["wonder","интересоваться, задаваться вопросом","🤔","I [wondered] where Leo was from."],["whether","ли","","She asked [whether] I had a pet."],["reply","отвечать; ответ","💬","He didn't [reply] to my message."],["curious","любопытный","🧐","Leo was very [curious] about our school."],["classmate","однокласс eat him!",["fight","have been fighting","had fight"],1,"Длится уже час — have been fighting."],["It was ___ a long game that we played it all weekend.",["so","too","such"],2,"such a long game that…"]],"build":[["The boss was so hard.","Босс был такой сложный."],["It was such a cool game.","Это была такая крутая игра."],["I am too tired to play.","Я слишком устал, чтобы играть."],["Igor is old enough to stay up late.","Игорь достаточно взрослый, чтобы ложиться поздно."],["We don't have enough coins.","У нас недостаточно монет."],["The level was so hard that I gave up.","Уровень был такой сложный, что я сдался."]]},{"t":"stop, remember, try: -ing или to?","theme":"Научная ярмарка","emoji":"🧪","rule":"Некоторые глаголы меняют смысл в зависимости от того, что идёт после них! stop + -ing — бросить, перестать делать: I stopped eating sweets (больше не ем). stop + to — остановиться, ЧТОБЫ сделать что-то другое: We stopped to buy water. remember + to — не забыть сделать (это нужно сделать): Remember to feed Murka! remember + -ing — помнить, что делал раньше: I remember visiting the zoo. forget + to — забыть сделать: I forgot to close the window. never forget + -ing — никогда не забыть случай из прошлого: I'll never forget seeing the ocean. try + to — стараться, пытаться (трудно, может не получиться): I tried to lift the box, but it was too heavy. try + -ing — попробовать как способ, эксперимент: Try pressing the red button.","ex":[["Igor [stopped playing] and went to bed.","Игорь перестал играть и пошёл спать."],["We [stopped to look] at the rainbow.","Мы остановились, чтобы посмотреть на радугу."],["[Remember to feed] Murka before school!","Не забудь покормить Мурку перед школой!"],["I [remember seeing] my first snow.","Я помню, как увидел свой первый снег."],["If the robot doesn't work, [try changing] the batteries.","Если робот не работает, попробуй поменять батарейки."]],"words":[["experiment","эксперимент, опыт","🧪","Our [experiment] worked!"],["battery","батарейка","🔋 the cat's name?",["Murka","Igor","Oleg"],0]]},{"t":"My Colours","l":"A1","text":"My bag is blue. My pen is red. Igor's bag is black. Our cat Murka is grey and white. The sky is blue and the sun is yellow. Is the grass green? Yes, it is! My favourite colour is green. Igor's favourite colour is black. What is your favourite colour?","g":[["blue","синий"],["red","красный"],["grey","серый"],["yellow","жёлтый"],["green","зелёный"],["favourite","любимый"]],"q":[["What colour is Oleg's bag?",["blue","black","red"],0],["What colour is Murka?",["grey and white","black","yellow"],0],["What is Oleg's favourite colour?",["green","black","red"],0]]},{"t":"My Family","l":"A1","text":"This is my family. My mum is kind. My dad is tall. My brother Igor is big and clever. I am Oleg. I am small, but I am fast. We have a cat. Her name is Murka. She is in our family too. I love my family!","g":[["family","семья"],["mum","мама"],["dad","папа"],["kind","добрый"],["tall","высокий"],["clever","умный"]],"q":[["Who is tall?",["Dad","Mum","Murka"],0],["Who is small and fast?",["Oleg","Igor","Dad"],0],["Is Igor clever?",["Yes, he is.","No, he isn't.","He is small."],0]]},{"t":"My School Bag","l":"A1","text":"This is my school bag. In my bag I have two books and three pencils. I have a ruler and a rubber. I have four pens: two blue pens and two red pens. Igor has five notebooks and a calculator. My bag is small, but Igor's bag is big. Books are heavy!","g":[["school bag","школьный рюкзак"],["pencils","карандаши"],["ruler","линейка"],["rubber","ластик"],["notebooks","тетради"],["heavy","тяжёлый"]],"q":[["How many pencils has Oleg got?",["three","two","four"],0],["What has Igor got?",["five notebooks and a calculator","two books and a ruler","four red pens"],0],["Whose bag is big?",["Igor's","Oleg's","Mum's"],0]]},{"t":"This and That","l":"A1","text":"Look! This is my ball. That is Igor's ball. This ball is red and that ball is white. These are my shoes. Those are Dad's shoes. Dad's shoes are very big! Is this your cap? No, it isn't. It is Igor's cap. And that is Murka on the sofa. She is asleep.","g":[["Look","смотри"],["This","это, этот"],["That","то, тот"],["These","эти"],["Those","те"],["asleep","спит, спящий"]],"q":[["What colour is Igor's ball?",["white","red","black"],0],["Whose shoes are very big?",["Dad's","Oleg's","Igor's"],0],["Where is Murka?",["on the sofa","in the bag","at school"],0]]},{"t":"My Robot","l":"A1","text":"I have got a robot. His name is Bob. Bob has got a big head and two small eyes. He has got four arms and two long legs. He hasn't got a nose. Igor has got a robot too. His robot has got one eye and three legs. Murka hasn't got a robot. She has got a long tail!","g":[["have got","у меня есть"],["head","голова"],["eyes","глаза"],["arms","руки"],["legs","ноги"],["tail","хвост"]],"q":[["How many arms has Bob got?",["four","two","three"],0],["Has Bob got a nose?",["No, he hasn't.","Yes, he has.","He has got two noses."],0],["What has Murka got?",["a long tail","a robot","four arms"],0]]},{"t":"What Can They Do?","l":"A1","text":"Our cat Murka can run and jump. She can climb a tree. But she can't swim! Dogs can swim. Birds can fly. Fish can swim, but they can't walk. I can run fast and I can swim. Igor can play the guitar. Can you play the guitar? I can't!","g":[["can","может, умеет"],["jump","прыгать"],["climb","лазить, залезать"],["swim","плавать"],["fly","летать"],["can't","не может, не умеет"]],"q":[["What can't Murka do?",["swim","jump","climb a tree"],0],["Who can play the guitar?",["Igor","Oleg","Murka"],0],["What can fish do?",["swim","walk","fly"],0]]},{"t":"Lunch Time","l":"A1","text":"Here is my lunch box. In it I have got a sandwich, an apple and an egg. Igor has got a banana, an orange and a big cookie. Murka has got a bowl of milk. Mum has got a cup of tea. Dad has got an ice cream. Is it a good lunch? Yes, it is!","g":[["lunch box","ланчбокс, контейнер для обеда"],["sandwich","бутерброд"],["egg","яйцо"],["orange","апельсин"],["a cup of tea","чашка чая"],["ice cream","мороженое"]],"q":[["What has Igor got?",["a banana, an orange and a big cookie","a sandwich, an apple and an egg","a cup of tea"],0],["Who has got a cup of tea?",["Mum","Dad","Murka"],0],["What has Dad got?",["an ice cream","an egg","a bowl of milk"],0]]},{"t":"I Like Pizza","l":"A1","text":"I like pizza. I don't like fish. But Igor likes fish! I like football and computer games. I don't like rainy days. Murka likes milk. She likes sleeping on my bed. She doesn't like water. Mum likes flowers. Dad likes cars. What do you like?","g":[["like","нравится, любить"],["don't like","не нравится"],["computer games","компьютерные игры"],["rainy","дождливый"],["sleeping","спать (сон)"],["flowers","цветы"]],"q":[["What doesn't Oleg like?",["fish","pizza","football"],0],["What does Murka like?",["sleeping on Oleg's bed","water","flowers"],0],["Who likes cars?",["Dad","Mum","Igor"],0]]},{"t":"My School Day","l":"A1","text":"I go to school every day. I walk to school with my friend Max. I sit next to Max in class. We read, write and count. At break we play football. I eat lunch at school. After school I do my homework. Then I play with Murka. Do you go to school? Do you play football at break?","g":[["every day","каждый день"],["walk","ходить пешком"],["next to","рядом с"],["break","перемена"],["homework","домашнее задание"]],"q":[["Who does Oleg walk to school with?",["his friend Max","Igor","Dad"],0],["What do they do at break?",["play football","read books","sleep"],0],["When does Oleg do his homework?",["after school","at break","in the morning"],0]]},{"t":"My Brother Igor","l":"A1","text":"My brother Igor is fourteen. He goes to a lyceum. He gets up at seven. He likes science and maths. He reads a lot. On Saturday he plays football with me. Igor wants to be an engineer. Mum works in an office. Dad cooks dinner on Sundays. His soup is very good!","g":[["lyceum","лицей"],["gets up","встаёт"],["science","естественные науки"],["wants","хочет"],["engineer","инженер"],["cooks","готовит"]],"q":[["When does Igor get up?",["at seven","at eight","at six"],0],["What does Igor want to be?",["an engineer","a teacher","a footballer"],0],["Who cooks dinner on Sundays?",["Dad","Mum","Igor"],0]]},{"t":"Mum's Questions","l":"A1","text":"Mum asks me questions every evening. Do you have homework? Yes, I do. Does Igor have homework? Yes, he does. He always has a lot! Do you want soup? No, I don't. I want pasta. Does Murka want fish? Yes, she does! Does Dad watch TV? No, he doesn't. He reads a book.","g":[["asks","спрашивает"],["questions","вопросы"],["always","всегда"],["a lot","много"],["want","хотеть"],["watch TV","смотреть телевизор"]],"q":[["What does Oleg want?",["pasta","soup","fish"],0],["Does Igor have homework?",["Yes, he does.","No, he doesn't.","No, he is."],0],["What does Dad do in the evening?",["He reads a book.","He watches TV.","He cooks pasta."],0]]},{"t":"My Day","l":"A1","text":"I wake up at seven o'clock. I wash my face and brush my teeth. Then I get dressed and have breakfast. I usually eat porridge. I leave home at eight. After school I have lunch and play outside. In the evening I do my homework and have a shower. I go to bed at nine.","g":[["wake up","просыпаться"],["brush my teeth","чистить зубы"],["get dressed","одеваться"],["breakfast","завтрак"],["porridge","каша"],["go to bed","ложиться спать"]],"q":[["What does Oleg usually eat for breakfast?",["porridge","pizza","soup"],0],["When does Oleg leave home?",["at eight","at seven","at nine"],0],["When does he go to bed?",["at nine","at eight","at ten"],0]]},{"t":"What Time Is It?","l":"A1","text":"What time is it? It's half past seven. Time for school! My lessons start at half past eight. The first lesson is English. At ten o'clock we have a long break. School finishes at one o'clock. Igor comes home at three o'clock. My football training is at quarter past four. Dinner is at six.","g":[["What time is it","который час"],["half past","половина (… тридцать)"],["start","начинаются"],["finishes","заканчивается"],["quarter past","четверть (пятнадцать минут) после"],["training","тренировка"]],"q":[["When do Oleg's lessons start?",["at half past eight","at half past seven","at ten o'clock"],0],["What is the first lesson?",["English","Maths","Football"],0],["When is football training?",["at quarter past four","at three o'clock","at six o'clock"],0]]},{"t":"Our Flat","l":"A1","text":"Our flat is not big. There is a living room, a kitchen, a bathroom and a bedroom. I share the bedroom with Igor. There are two beds in it. There is a desk near the window. There is a computer on the desk. There are many books on the shelf. There isn't a TV in our room.","g":[["flat","квартира"],["kitchen","кухня"],["bedroom","спальня"],["share","делить (с кем-то)"],["desk","письменный стол"],["shelf","полка"]],"q":[["Who does Oleg share his bedroom with?",["Igor","Mum","Murka"],0],["How many beds are there in the bedroom?",["two","one","three"],0],["What is on the desk?",["a computer","a TV","a cat"],0]]},{"t":"Where Is Murka?","l":"A1","text":"Where is Murka? She isn't on the sofa. She isn't under the table. Is she in the kitchen? No! Igor looks behind the door. I look in the wardrobe. Mum looks under the bed. Dad laughs. Look! Murka is in my school bag, between the books! She is asleep.","g":[["under","под"],["behind","за, позади"],["wardrobe","шкаф для одежды"],["between","между"],["laughs","смеётся"]],"q":[["Where is Murka?",["in Oleg's school bag","under the bed","behind the door"],0],["Who looks under the bed?",["Mum","Igor","Dad"],0],["What does Dad do?",["He laughs.","He looks in the wardrobe.","He sleeps."],0]]},{"t":"Ready for the Park","l":"A1","text":"It is Saturday morning. I am wearing my blue T-shirt and jeans. I am putting on my trainers because we are going to the park. Igor is wearing a black hoodie. Mum is wearing a red dress. Dad is looking for his cap. Where is it? Murka is sitting on Dad's cap!","g":[["wearing","одет в, носит (сейчас)"],["T-shirt","футболка"],["jeans","джинсы"],["trainers","кроссовки"],["hoodie","худи, толстовка с капюшоном"],["looking for","ищет"]],"q":[["What is Igor wearing?",["a black hoodie","a red dress","a blue T-shirt"],0],["What is Dad doing?",["looking for his cap","putting on his trainers","sitting on the sofa"],0],["Where is Murka sitting?",["on Dad's cap","on the sofa","in the park"],0]]},{"t":"Evening at Home","l":"A1","text":"It is seven o'clock in the evening. Everybody is at home. Mum is cooking dinner. Dad is fixing a lamp. Igor is doing his physics homework. He isn't playing games. Murka is playing with a ball. And me? I am writing this story! What are you doing now?","g":[["Everybody","все"],["cooking","готовит"],["fixing","чинит"],["lamp","лампа"],["physics","физика"],["writing","пишу"]],"q":[["What is Dad doing?",["fixing a lamp","cooking dinner","playing games"],0],["What is Igor doing?",["his physics homework","playing games","writing a story"],0],["Who is playing with a ball?",["Murka","Oleg","Igor"],0]]},{"t":"Four Seasons","l":"A1","text":"There are four seasons: winter, spring, summer and autumn. In winter it is cold and snowy. Igor and I make a snowman. In spring it is warm and sunny. In summer it is hot. We swim in the river. In autumn it is windy and rainy. My favourite season is summer. Igor likes winter.","g":[["seasons","времена года"],["cold","холодно"],["snowman","снеговик"],["warm","тепло"],["hot","жарко"],["windy","ветрено"]],"q":[["What do the boys make in winter?",["a snowman","a cake","a kite"],0],["What is the weather like in autumn?",["windy and rainy","hot","warm and sunny"],0],["What is Oleg's favourite season?",["summer","winter","autumn"],0]]},{"t":"Our Room","l":"A1","text":"This is our room. My bed is near the window. Igor's bed is near the door. My desk is small. His desk is big. Mum comes in. Her phone is ringing. Where is her phone? It is on my desk! Then our cat comes in. Her name is Murka. Her bowl is in the kitchen.","g":[["our","наш"],["near","возле, рядом с"],["His","его"],["Her","её"],["ringing","звонит"],["bowl","миска"]],"q":[["Where is Oleg's bed?",["near the window","near the door","in the kitchen"],0],["Whose desk is big?",["Igor's","Oleg's","Mum's"],0],["Where is Mum's phone?",["on Oleg's desk","in the kitchen","on Igor's bed"],0]]},{"t":"At the Shop","l":"A1","text":"Today Igor and I go to the shop. A football costs three hundred hryvnias. A comic book costs eighty hryvnias. A bottle of water costs twenty hryvnias. I have got one hundred hryvnias. I buy the comic book and a bottle of water. How much is that? It is one hundred! Igor buys the football.","g":[["shop","магазин"],["costs","стоит"],["hundred","сто"],["hryvnias","гривен"],["How much","сколько (стоит)"],["buy","покупаю"]],"q":[["How much is the comic book?",["eighty hryvnias","twenty hryvnias","three hundred hryvnias"],0],["What does Oleg buy?",["a comic book and a bottle of water","a football","two comic books"],0],["Who buys the football?",["Igor","Oleg","Dad"],0]]},{"t":"At the Zoo","l":"A1","text":"Yesterday was Sunday. The weather was sunny and warm. We were at the zoo. The animals were great. The monkeys were very funny. The lion was big but sleepy. Igor was hungry all day. Mum and Dad were tired in the evening. I wasn't tired. It was a good day!","g":[["Yesterday","вчера"],["zoo","зоопарк"],["funny","смешные"],["sleepy","сонный"],["hungry","голодный"],["tired","уставшие"]],"q":[["Where were they on Sunday?",["at the zoo","at school","at the shop"],0],["What were the monkeys like?",["very funny","sleepy","big and tired"],0],["Who was hungry all day?",["Igor","Oleg","Dad"],0]]},{"t":"My Goal","l":"A1","text":"Last Saturday I played football with my friends. We started at ten o'clock. I kicked the ball very hard and scored a goal! My team jumped and shouted. After the game I walked home. I cleaned my boots and watched a film with Igor. Mum cooked pancakes. I loved that day.","g":[["Last Saturday","в прошлую субботу"],["kicked","ударил"],["scored a goal","забил гол"],["shouted","кричали"],["cleaned","почистил"],["pancakes","блины"]],"q":[["When did the game start?",["at ten o'clock","at eight o'clock","at two o'clock"],0],["What did Oleg do after the game?",["He walked home.","He played computer games.","He went to the shop."],0],["What did Mum cook?",["pancakes","soup","a cake"],0]]},{"t":"Summer at the Sea","l":"A1","text":"Last summer we went to the sea. We took a train. I saw dolphins! Igor found a big shell. Dad made a sandcastle with me. Mum read a book under an umbrella. We ate ice cream every day. One day Igor swam very far, and Mum said, Come back! We came home happy.","g":[["went","поехали"],["took a train","поехали на поезде"],["saw","увидел"],["found","нашёл"],["shell","ракушка"],["sandcastle","замок из песка"]],"q":[["How did they travel to the sea?",["by train","by car","by plane"],0],["What did Igor find?",["a big shell","a dolphin","a book"],0],["Who read a book under an umbrella?",["Mum","Dad","Igor"],0]]},{"t":"Igor's Birthday","l":"A1","text":"Next Sunday is Igor's birthday. He is going to be fifteen. We are going to have a party. Mum is going to bake a big cake. Dad is going to buy balloons. I am going to make a card for Igor. His friends are going to come at four o'clock. We are going to play games and dance.","g":[["Next Sunday","в следующее воскресенье"],["birthday","день рождения"],["going to","собираться (что-то сделать)"],["bake","испечь"],["balloons","воздушные шарики"],["card","открытка"]],"q":[["How old is Igor going to be?",["fifteen","fourteen","ten"],0],["What is Dad going to buy?",["balloons","a cake","a card"],0],["When are Igor's friends going to come?",["at four o'clock","at five o'clock","at two o'clock"],0]]},{"t":"Bigger and Faster","l":"A1","text":"Igor is older than me. He is taller and stronger too. But I am faster than Igor! I always win when we run. Murka is smaller than our neighbour's dog, but she is cleverer. Dad's car is bigger than Mum's car, but Mum's car is newer. Which is better, football or computer games? For me, football is better!","g":[["older","старше"],["taller","выше"],["stronger","сильнее"],["faster","быстрее"],["smaller","меньше"],["better","лучше"]],"q":[["Who is faster?",["Oleg","Igor","the dog"],0],["Whose car is newer?",["Mum's","Dad's","the neighbour's"],0],["What is better for Oleg?",["football","computer games","running"],0]]},{"t":"Our Hobbies","l":"A1","text":"Everybody in my family has got a hobby. My hobby is football. I train three times a week. Igor's hobby is chess. He plays online and he often wins. Mum likes drawing. Dad loves fishing. And Murka's hobby is sleeping, of course! On Sundays we all ride our bikes in the park.","g":[["hobby","хобби, увлечение"],["three times a week","три раза в неделю"],["chess","шахматы"],["drawing","рисование"],["fishing","рыбалка"],["ride our bikes","кататься на велосипедах"]],"q":[["How often does Oleg train?",["three times a week","every day","once a week"],0],["What is Igor's hobby?",["chess","football","fishing"],0],["What does the family do on Sundays?",["They ride bikes in the park.","They go fishing.","They play chess."],0]]},{"t":"Mum's Morning Rules","l":"A1","text":"Here are Mum's rules for the morning. Get up at seven. Make your bed. Wash your hands and face. Don't play games before school! Eat your breakfast. Feed Murka. Take your school bag. Don't forget your lunch box! Close the door. Have a nice day!","g":[["rules","правила"],["Make your bed","застели кровать"],["Wash","помой"],["Don't play","не играй"],["Feed","покорми"],["forget","забудь"]],"q":[["What time do the boys get up?",["at seven","at eight","at six"],0],["What can't they do before school?",["play games","eat breakfast","feed Murka"],0],["Who do they feed?",["Murka","Dad","the dog"],0]]},{"t":"My Town","l":"A1","text":"Igor and I live in a small town. Our school is next to the park. There is a library opposite the school. I go there on Mondays. The supermarket is near our flat. There is a stadium behind the park. I play football there. The hospital is far from our home. My favourite place is the stadium!","g":[["town","город, городок"],["library","библиотека"],["opposite","напротив"],["supermarket","супермаркет"],["stadium","стадион"],["far from","далеко от"]],"q":[["Where is the school?",["next to the park","behind the stadium","opposite the hospital"],0],["When does Oleg go to the library?",["on Mondays","on Sundays","every day"],0],["What is Oleg's favourite place?",["the stadium","the library","the park"],0]]},{"t":"My Best Week","l":"A1","text":"Hello again! I am Oleg and I am ten. This week was great. On Monday I got a good mark in English. On Wednesday our team won a football match. On Friday Igor helped me with maths. Tomorrow we are going to visit Grandma. She makes the best pies in the world! Next week I want to learn more English words.","g":[["mark","оценка"],["won","выиграла"],["match","матч"],["helped","помог"],["Grandma","бабушка"],["pies","пирожки"]],"q":[["When did Oleg get a good mark in English?",["on Monday","on Wednesday","on Friday"],0],["Who helped Oleg with maths?",["Igor","Grandma","Mum"],0],["Who are they going to visit tomorrow?",["Grandma","Max","Igor's friends"],0]]},{"t":"Did You Cook?","l":"A2","text":"Yesterday Mum was at work, so Igor and I cooked dinner. Did we make pizza? No, we didn't. We made vegetable soup and a big salad. Igor cut the vegetables with a knife. I put plates, spoons and forks on the table. Did Mum like the soup? Yes, she did! But she didn't eat the salad. There was too much salt in it! Next time I will be more careful.","g":[["cooked","приготовили"],["didn't","не (в прошлом)"],["vegetables","овощи"],["knife","нож"],["plates","тарелки"]],"q":[["What did Oleg and Igor make?",["soup and salad","pizza","a cake"],0],["Who cut the vegetables?",["Igor","Oleg","Mum"],0],["Why didn't Mum eat the salad?",["There was too much salt in it.","She wasn't hungry.","She doesn't like vegetables."],0]]},{"t":"The Biggest and the Fastest","l":"A2","text":"Today our teacher told us about animals. The blue whale is the biggest animal in the world. The giraffe is the tallest. The cheetah is the fastest animal on land. The turtle is one of the slowest. Which animal is the cleverest? Maybe the dolphin! My favourite animal is the eagle. It can fly very high. Igor says the best animal is our cat Murka. But she is the laziest!","g":[["the biggest","самый большой"],["the tallest","самый высокий"],["the fastest","самый быстрый"],["the slowest","самых медленных"],["the laziest","самая ленивая"]],"q":[["Which animal is the tallest?",["the giraffe","the whale","the eagle"],0],["What is Oleg's favourite animal?",["the eagle","the dolphin","the turtle"],0],["What does Igor think about Murka?",["She is the best animal.","She is the fastest animal.","She is the biggest animal."],0]]},{"t":"Pancake Day","l":"A2","text":"Mum is making pancakes today. Have we got any eggs? Yes, we have got six eggs. Have we got any flour? Yes, but only a little. We haven't got much milk, and there isn't any sugar. So I am going to the shop. Mum gave me fifty hryvnias. I bought some milk, some sugar and two lemons. How many pancakes did we make? Twenty!","g":[["Have we got any","у нас есть"],["flour","мука"],["much","много (несчётное)"],["isn't any","нет (совсем)"],["How many","сколько (штук)"]],"q":[["What is Mum making?",["pancakes","soup","a salad"],0],["What isn't there at home?",["sugar","eggs","flour"],0],["How many pancakes did they make?",["twenty","six","fifty"],0]]},{"t":"Have You Ever Flown?","l":"A2","text":"My friend Max has been to many countries. He has been to Poland, Italy and Spain. He has flown on a plane ten times! Have I ever been abroad? Yes, I have. I have been to Italy. I have seen the sea and an old castle there. But I have never flown on a plane. We went to Italy by bus. Grandma has never seen a castle. One day I want to show her one!","g":[["has been","был, побывал"],["abroad","за границей"],["castle","замок"],["never","никогда"],["flown","летал"]],"q":[["How many times has Max flown on a plane?",["ten times","never","two times"],0],["How did Oleg go to Italy?",["by bus","by plane","by train"],0],["Who has never seen a castle?",["Grandma","Max","Oleg"],0]]},{"t":"My Birthday Promise","l":"A2","text":"My birthday is next Saturday. I will be eleven! I will invite five friends to my party. Mum will make a chocolate cake with eleven candles. Igor will decorate the room with balloons. Will it be sunny? I hope so. Then we will play football in the park. I promise I won't eat all the cake. I will share it with my guests!","g":[["birthday","день рождения"],["invite","пригласить"],["candles","свечи"],["decorate","украсить"],["won't","не буду"],["guests","гости"]],"q":[["How old will Oleg be?",["eleven","ten","five"],0],["What will Igor do?",["decorate the room","make a cake","buy candles"],0],["What does Oleg promise?",["He won't eat all the cake.","He will play chess.","He will get up early."],0]]},{"t":"When I Grow Up","l":"A2","text":"What job do I want? I want to be a pilot! A pilot has to study a lot. He must be calm and careful. He has to wear a uniform. Igor wants to be a doctor. Doctors have to work hard, and sometimes they must work at night. My friend Max wants to be a chef. He says chefs don't have to study maths. But Mum says every chef has to count!","g":[["job","работа"],["has to","должен"],["must","должен, обязан"],["uniform","форма"],["chef","повар"]],"q":[["What does Oleg want to be?",["a pilot","a doctor","a chef"],0],["Who wants to be a doctor?",["Igor","Max","Mum"],0],["What does Mum say?",["Every chef has to count.","Every chef must wear a uniform.","Every pilot works at night."],0]]},{"t":"How Often?","l":"A2","text":"I always get up at seven. I usually eat breakfast quickly because I am often late. I sometimes walk to school with Max. Max walks slowly, but he talks very loudly! At school I write carefully and I speak English well. After school I often play football. Igor never plays football. He usually reads quietly in his room. How often do you play sports?","g":[["always","всегда"],["usually","обычно"],["quickly","быстро"],["slowly","медленно"],["carefully","аккуратно"],["never","никогда"]],"q":[["What time does Oleg get up?",["at seven","at eight","at six"],0],["How does Max talk?",["very loudly","very quietly","very slowly"],0],["What does Igor usually do?",["He reads in his room.","He plays football.","He walks with Max."],0]]},{"t":"The Storm","l":"A2","text":"Last summer we were staying in a village. One evening I was playing in the field with Igor. Mum was reading on the path near the house. Suddenly the sky became black. We were running home when the storm started. There was loud thunder and bright lightning. We were sitting in the kitchen when the lights went off! Dad was laughing. We were scared, but it was fun too.","g":[["field","поле"],["storm","гроза"],["thunder","гром"],["lightning","молния"],["were running","бежали"]],"q":[["Where was the family last summer?",["in a village","at the sea","in a big city"],0],["What were Oleg and Igor doing?",["playing in the field","reading on the path","swimming in the lake"],0],["What happened in the kitchen?",["The lights went off.","Dad cooked dinner.","The cat came in."],0]]},{"t":"Igor Is Ill","l":"A2","text":"Igor is ill today. He has got a headache and a sore throat. He has also got a fever. Mum says he should stay in bed and rest. He shouldn't play computer games. Dad gives him some medicine and hot tea with lemon and honey. I tell Igor that he should eat more fruit. It is healthy and has got a lot of vitamins. Igor says I should stop talking!","g":[["headache","головная боль"],["sore throat","больное горло"],["fever","температура"],["should","стоит, следует"],["medicine","лекарство"],["healthy","полезный"]],"q":[["What is wrong with Igor?",["a headache and a fever","a toothache","a stomach ache"],0],["What shouldn't Igor do?",["play computer games","rest in bed","drink tea"],0],["What does Oleg tell Igor?",["He should eat more fruit.","He should go to school.","He should play football."],0]]},{"t":"A New Friend","l":"A2","text":"Last week a new boy came to our class. His name is Leo. On the first day he was very shy and nervous. He was sitting alone when I came to him. Did I say hello? Yes, I did! Now Leo is my friend. He is the cleverest boy in our class and he speaks English very well. Have you ever had a new friend like that? You should always be kind to new kids!","g":[["shy","стеснительный"],["nervous","взволнованный"],["was sitting","сидел"],["the cleverest","самый умный"],["kind","добрый"]],"q":[["What is the new boy's name?",["Leo","Max","Igor"],0],["How was Leo on the first day?",["shy and nervous","happy and loud","angry and lazy"],0],["What should we always do?",["be kind to new kids","be quiet in class","sit alone"],0]]},{"t":"Crafting Time","l":"A2","text":"It's Saturday, and Igor and I are playing Minecraft together. I have just crafted a new pickaxe, so now I can dig stone. Igor has already built a small wooden house near the river. \"Have you found any iron yet?\" he asks. \"No, I haven't found any yet,\" I answer. Then I go into a dark cave with some torches. Wow! I have just found diamonds! I put them in our chest. Igor is very happy. \"We have already collected so many things!\" he says. \"Now let's build a castle!\"","g":[["crafted","скрафтил, сделал"],["pickaxe","кирка"],["dig","копать"],["torches","факелы"],["chest","сундук"]],"q":[["What has Oleg just crafted?",["a new pickaxe","a house","a chest"],0],["Where is Igor's house?",["near the river","in a cave","on a mountain"],0],["What did Oleg find in the cave?",["diamonds","iron","wood"],0]]},{"t":"The Flower Boss","l":"A2","text":"Have you ever played Cuphead? It looks like an old cartoon, and the bosses are very funny. I got the game last month, and I have already beaten five bosses! But the flower boss is very difficult. Last week I tried ten times and lost all my lives every time. Yesterday Igor sat next to me. \"Jump earlier and watch the screen,\" he said. I tried again and... I won! I have never been so happy. Now I have collected lots of coins, and I want to buy a new power for Cuphead.","g":[["bosses","боссы"],["lost all my lives","потерял все жизни"],["earlier","раньше"],["won","выиграл"],["power","сила, суперспособность"]],"q":[["What does Cuphead look like?",["an old cartoon","a film","a comic"],0],["Who helped Oleg?",["Igor","Mum","a friend"],0],["When did Oleg beat the flower boss?",["yesterday","last week","last month"],0]]},{"t":"My Roblox World","l":"A2","text":"I have had a Roblox account since my last birthday. My nickname is BlockRocket. My brother Igor has played Roblox for four years, so he knows everything about it. Today I have been online since three o'clock. Igor joined my world at four. Together we have built a big obstacle course with lava, long jumps and secret doors. Ten players have tried it, but only two have finished it! Then Mum came in. \"How long have you played today?\" she asked. \"For two hours,\" I answered. \"OK, time for homework!\" Never mind — our world will wait for us.","g":[["account","аккаунт"],["nickname","ник"],["joined","присоединился"],["obstacle course","полоса препятствий"],["secret","секретный"]],"q":[["What is Oleg's nickname?",["BlockRocket","SuperOleg","LavaKing"],0],["How long has Igor played Roblox?",["for four years","since last birthday","for two hours"],0],["How many players have finished the course?",["two","ten","four"],0]]},{"t":"Our First Game","l":"A2","text":"Igor and I have a big plan. We are going to make our own game! It's going to be a platformer about a brave cat called Biscuit. Igor is going to write the code, and I'm going to design the levels and draw the characters. Yesterday we tested the first level. There was a funny bug: Biscuit walked through walls! \"Don't worry, I'll fix it,\" said Igor. I think our friends will love the game. And maybe one day millions of players will play it!","g":[["plan","план"],["design","придумывать, разрабатывать"],["bug","баг, ошибка"],["fix","исправить"],["millions","миллионы"]],"q":[["What is the game about?",["a brave cat","a robot","a racing car"],0],["Who is going to write the code?",["Igor","Oleg","Biscuit"],0],["What was the bug?",["The cat walked through walls.","The cat couldn't jump.","There was no sound."],0]]},{"t":"The First Night","l":"A2","text":"This is my new Minecraft world. The sun is going down. Igor says, \"If you don't build a shelter, the mobs will find you!\" So I quickly build a small house from wood. \"If a creeper comes near, it will explode,\" Igor says. \"And if a zombie sees you, it will follow you.\" I put torches all around my house, because if it is light, mobs won't come. Then I wait for sunrise. Finally, the sun comes up. I have survived my first night! If I play tomorrow, I will build a bigger house.","g":[["shelter","укрытие"],["explode","взорваться"],["follow","идти следом"],["sunrise","рассвет"],["survived","выжил"]],"q":[["What does Oleg build first?",["a small house from wood","a castle","a bridge"],0],["What does Oleg put around his house?",["torches","flowers","chests"],0],["What will Oleg build tomorrow?",["a bigger house","a tower","a farm"],0]]},{"t":"The Mountain Race","l":"A2","text":"Igor and I love racing games. Our favourite track is the Mountain Race. It is longer and more dangerous than the other tracks, but it is the most beautiful one too. There are snowy hills, a dark tunnel and twenty sharp turns. My car is red and fast, but Igor's car is more powerful. It was also more expensive — he saved coins for a month! Today we raced three times. I was the worst in the first race, but in the last race I was better than Igor. It was the most exciting race of my life!","g":[["track","трасса"],["dangerous","опасный"],["sharp turns","крутые повороты"],["powerful","мощный"],["saved","копил"]],"q":[["What is special about the Mountain Race?",["It is the most beautiful track.","It is the shortest track.","It is the easiest track."],0],["Whose car is more powerful?",["Igor's","Oleg's","Mum's"],0],["What happened in the last race?",["Oleg was better than Igor.","Oleg was the worst.","Igor won."],0]]},{"t":"Too High!","l":"A2","text":"Igor and I are playing a new platformer about a little mushroom hero. The first levels are too easy, so we go to World 5. There is a very big gap with spikes at the bottom. I jump, but my jump isn't long enough, and I fall. \"Use the double jump!\" says Igor. I try again, but I'm too slow. Then Igor finds a secret pipe. It takes us to a checkpoint on the other side of the gap! \"You're clever enough to be a game designer,\" I tell him. He just smiles.","g":[["gap","пропасть"],["spikes","шипы"],["bottom","дно"],["double jump","двойной прыжок"],["clever enough","достаточно умный"]],"q":[["Why do they go to World 5?",["The first levels are too easy.","They have lost all their lives.","Mum told them to."],0],["What does Igor find?",["a secret pipe","a gold coin","a mushroom"],0],["Where does the pipe take them?",["to a checkpoint on the other side","to World 1","to the boss"],0]]},{"t":"The Big Freeze","l":"A2","text":"Last Friday evening Igor and I were playing our favourite racing game. We were driving on the last lap, and I was winning! Suddenly the screen froze. While I was pressing all the buttons, Igor was laughing. \"It's lag,\" he said. Then the electricity went off. It was completely dark! While we were looking for a torch, our cat jumped on my knees. I screamed! When the lights came back, the game needed an update. We lost all our progress, but it was the funniest evening of the week.","g":[["lap","круг (в гонке)"],["froze","завис"],["went off","выключилось"],["knees","колени"],["progress","прогресс"]],"q":[["What were they playing?",["a racing game","Minecraft","Cuphead"],0],["What was Igor doing while Oleg was pressing the buttons?",["laughing","crying","sleeping"],0],["Who jumped on Oleg's knees?",["the cat","Igor","the dog"],0]]},{"t":"Level Up!","l":"A2","text":"When I started my new adventure game, my hero couldn't do anything special. He could only walk and jump. But I practised every day. At level 5 he was able to dig through walls. At level 10 I unlocked a magic shield. Now my hero can fly and teleport! Igor says that at level 30 I will be able to become invisible. \"Could you show me how?\" I asked him. \"Sorry, you have to find out yourself,\" he laughed. Real life is the same: last year I couldn't swim, but now I can!","g":[["adventure","приключение"],["dig through","прокопать насквозь"],["unlocked","открыл"],["invisible","невидимый"],["find out yourself","узнать самому"]],"q":[["What could the hero do at first?",["only walk and jump","fly","teleport"],0],["What did Oleg unlock at level 10?",["a magic shield","a new world","a car"],0],["What couldn't Oleg do last year?",["swim","read","type"],0]]},{"t":"Biome Trip","l":"A2","text":"Igor and I have explored seven biomes since Monday! First we visited the desert. It was too hot, and there was nothing there except cacti and sand. Then we found a jungle. It is more exciting than the desert because there are pandas, parrots and an old temple. While we were exploring the temple, Igor found a secret door. Behind it there was a chest with gold! Today we are going to visit the ice biome. If we go there, we will need lots of torches. I think it will be the most beautiful trip of all!","g":[["explored","исследовали"],["except","кроме"],["cacti","кактусы"],["secret door","секретная дверь"],["trip","путешествие"]],"q":[["How many biomes have they explored since Monday?",["seven","five","three"],0],["Why is the jungle more exciting than the desert?",["There are pandas, parrots and a temple.","It is very hot.","There is a lot of sand."],0],["Where are they going today?",["to the ice biome","to the desert","to the jungle"],0]]},{"t":"Before We Can Play","l":"A2","text":"In our family there are some rules. Before Igor and I can play games, we have to do our chores. I have to feed the cat and tidy my room. Igor has to take out the rubbish and wash the dishes. On school days our screen time is two hours. At the weekend we don't have to stop so early. But there is one rule we never break: we mustn't play at the table during dinner. Mum says, \"If you do your chores well, you'll get pocket money.\" I think that's a good deal!","g":[["rules","правила"],["chores","домашние дела"],["feed","кормить"],["break (a rule)","нарушать (правило)"],["deal","сделка, договор"]],"q":[["What does Oleg have to do?",["feed the cat and tidy his room","wash the dishes","take out the rubbish"],0],["When don't they have to stop playing early?",["at the weekend","on school days","on Monday"],0],["What mustn't they do?",["play at the table during dinner","feed the cat","tidy their rooms"],0]]},{"t":"Igor's Channel","l":"A2","text":"My brother Igor loves making videos. He has a small channel about building games. Every Saturday he streams for an hour, and I enjoy helping him. I'm good at building, so I build, and Igor talks to the viewers. Some viewers write really funny comments. Igor hates editing videos because it takes a long time, but he doesn't mind doing it. Last week we finished making a video about a giant robot. Now 300 people have watched it! Mum says, \"Stop looking at the numbers and go outside!\"","g":[["channel","канал"],["streams","стримит, ведёт трансляцию"],["viewers","зрители"],["editing","монтаж"],["giant","гигантский"]],"q":[["What is Igor's channel about?",["building games","racing","cooking"],0],["What does Igor hate doing?",["editing videos","streaming","building"],0],["How many people have watched the robot video?",["300","30","3000"],0]]},{"t":"Big Dreams","l":"A2","text":"What do you want to be in the future? I want to become a game designer. I would like to make a game about space dogs. Igor wants to be a programmer. Last month he decided to learn Python, and now he practises every evening. \"You need to learn maths too,\" he told me. So I decided to try harder at school. Next spring there is a game tournament for kids in our city. We hope to win it! But first, I need to remember to do my homework. I always forget to do it!","g":[["future","будущее"],["designer","дизайнер"],["decided","решил"],["try harder","стараться сильнее"],["tournament","турнир"]],"q":[["What game would Oleg like to make?",["a game about space dogs","a racing game","a game about cats"],0],["What did Igor decide to learn?",["Python","English","drawing"],0],["What does Oleg always forget to do?",["his homework","feed the cat","charge his tablet"],0]]},{"t":"Guess Who!","l":"A2","text":"Igor and I like playing a guessing game. One person describes a game character, and the other one guesses. Today it was my turn first. \"This is a creature which is green and very quiet. It's the character that every player is afraid of. It comes close and then... BOOM!\" \"A creeper!\" Igor shouted. Then Igor described a character. \"It's a man who lives in a village. He has a big nose, and he trades things for emeralds.\" \"A villager!\" I said. We both laughed. The person who wins gets the last cookie!","g":[["guessing game","угадайка"],["describes","описывает"],["turn","очередь"],["afraid of","боится"],["emeralds","изумруды"]],"q":[["What does the creeper do?",["It comes close and goes BOOM.","It trades things.","It flies."],0],["What does the villager have?",["a big nose","a green hat","wings"],0],["What does the winner get?",["the last cookie","a coin","a new game"],0]]},{"t":"The Game Quiz","l":"A2","text":"On Friday our class had a game quiz. Our teacher was the host. \"Minecraft has a creature called the Ender Dragon, doesn't it?\" she asked. \"Yes, it does!\" I said. One point for our team! The next question was harder: \"Cuphead's brother is called Mugman, isn't he?\" Nobody knew, so I guessed: \"Yes, he is!\" Correct again! In the last round the score was 9 to 9. \"Pac-Man is yellow, isn't he?\" \"Yes!\" shouted everybody. But our team answered first, so we won the prize: a big box of chocolates. Great day, wasn't it?","g":[["host","ведущий"],["point","очко"],["guessed","угадал наугад"],["round","раунд"],["score","счёт"]],"q":[["Who was the host?",["the teacher","Igor","Oleg"],0],["What is the name of Cuphead's brother?",["Mugman","Pac-Man","Steve"],0],["What was the prize?",["a box of chocolates","a new game","a book"],0]]},{"t":"The Pirate Map","l":"A2","text":"Last summer Igor and I found an old map in Grandma's house. Somebody drew a red X on it. \"There's something hidden in the garden!\" said Igor. We took a shovel and a compass. First we looked everywhere near the apple tree, but there was nothing there. Then I saw some footprints. \"Does anybody know about this map?\" I asked. \"Nobody,\" Igor answered. We dug under the old bench and found a box! Inside there wasn't any gold — just Dad's old toys and a note: \"Everybody needs an adventure!\"","g":[["shovel","лопата"],["compass","компас"],["everywhere","везде"],["footprints","следы"],["bench","скамейка"]],"q":[["Where did they find the map?",["in Grandma's house","at school","in a game"],0],["What did they find under the bench?",["a box","a pirate","a shovel"],0],["What was inside?",["Dad's old toys and a note","gold coins","a new map"],0]]},{"t":"What Did He Say?","l":"B1","text":"Yesterday our team played an online match against another class. Ilya was our captain. Before the match, he explained the strategy. He said that Igor and I would defend the base and the others would collect resources. During the game my microphone didn't work, so I sent a message to Ilya. He replied that he couldn't hear me, but he could read my messages. In the end we won! After the match, the other team's captain wrote that we were really good players. Mum asked what we were shouting about. I told her that we were the champions!","g":[["against","против"],["defend","защищать"],["resources","ресурсы"],["replied","ответил"],["champions","чемпионы"]],"q":[["Who was the captain?",["Ilya","Igor","Oleg"],0],["Why did Oleg send a message to Ilya?",["His microphone didn't work.","He was hungry.","He wanted to stop playing."],0],["What did the other team's captain write?",["that they were really good players","that they were too slow","that he was tired"],0]]},{"t":"How Is a Game Made?","l":"B1","text":"Have you ever wondered how a video game is made? First, an idea is created by a game designer. Then the characters are drawn by artists, and the music is written by composers. After that, thousands of lines of code are written by programmers. The game is tested many times, and lots of bugs are found and fixed. For example, Cuphead was drawn by hand, like old cartoons, and it took the team many years. Finally, the game is sold online, and it is played by kids everywhere — like me and Igor!","g":[["wondered","задумывался"],["artists","художники"],["composers","композиторы"],["lines of code","строки кода"],["tested","протестирована"]],"q":[["Who writes the code?",["programmers","artists","composers"],0],["How was Cuphead drawn?",["by hand","on a phone","by a robot"],0],["What happens to the bugs?",["They are found and fixed.","They are sold.","They are drawn."],0]]},{"t":"When I Was Little","l":"B1","text":"When I was a toddler, I used to sleep with a blue teddy bear. I don't do that any more! In kindergarten I used to be afraid of big dogs, and I didn't use to like soup. Things change. Igor says that when he was little, games used to look very simple, with big pixels and old-fashioned music. He used to play on Dad's old phone. Now we play on a computer, and the games look like films. But I still remember my first game: it was about a little frog who jumped over cars. I loved it!","g":[["toddler","малыш"],["any more","больше не"],["afraid of","боялся"],["pixels","пиксели"],["still","всё ещё"]],"q":[["What did Oleg use to sleep with?",["a blue teddy bear","a toy car","a cat"],0],["Where did Igor use to play games?",["on Dad's old phone","on a computer","on a tablet"],0],["What was Oleg's first game about?",["a little frog","a racing car","a robot"],0]]},{"t":"The Big Final","l":"B1","text":"Last Saturday Igor and I took part in a game tournament for kids. It was held in the school hall, and everybody came to watch. We had to win three matches to get to the final. Our opponents in the final were two girls who used to be champions. Before the game Igor said that he was nervous. \"Me too,\" I told him. \"But we have practised a lot, haven't we?\" The audience cheered for both teams. The match was really close, but in the end we won! The trophy was made of shiny metal. Mum said that she was very proud of us.","g":[["took part","участвовали"],["was held","проходил"],["opponents","соперники"],["close (match)","почти равный (матч)"],["shiny","блестящий"]],"q":[["Where was the tournament?",["in the school hall","online","in a park"],0],["Who were their opponents in the final?",["two girls","two boys","Ilya and his friend"],0],["What was the trophy made of?",["shiny metal","glass","wood"],0]]},{"t":"The Case of the Missing Cake","l":"B1","text":"On Sunday Mum baked a strawberry cream cake for Grandma's birthday and left it on the kitchen table. When I came back from football, I noticed that something terrible had happened: half of the cake had disappeared! There were crumbs on the floor and a tiny footprint next to the table. Igor was my first suspect, because he had eaten my cookies the week before. But when I asked him, he showed me his hands. They were clean, and he had been at the library all afternoon. Then I looked at the footprint more carefully. It was small and round, with four little toes. I followed the crumbs to the sofa, and there was Murka, fast asleep, with cream on her whiskers! By the time Mum came home, Igor and I had baked a new cake together. Grandma never found out.","g":[["noticed","заметил"],["crumbs","крошки"],["suspect","подозреваемый"],["whiskers","усы (у кошки)"],["found out","узнала"]],"q":[["Why did Oleg suspect Igor first?",["Igor had eaten his cookies before","Igor had cream on his face","Igor was in the kitchen"],0],["How did Oleg know that Igor didn't do it?",["his hands were clean and he had been at the library","Mum told him","Igor started to cry"],0],["Who really ate the cake?",["Murka","Igor","Grandma"],0],["Why did Grandma never find out?",["the boys had baked a new cake","Murka ate the whole cake","Mum didn't tell her about the party"],0]]},{"t":"The Secret Castle","l":"B1","text":"Mum is worried. \"Oleg, you have been sitting at the computer for three hours,\" she says. \"What have you been doing?\" \"Building,\" I answer, and I quickly close the window on the screen. The truth is that Igor and I have been working on a secret project since Monday. We have been building a huge castle in Minecraft, block by block. Igor has been collecting stone and wood, and I have been designing the towers. It has been really hard, because Mum usually lets us play for only one hour a day. My eyes are tired and my fingers hurt, but we have almost finished. Tomorrow is Mum's birthday. In the morning we are going to show her the castle. On the highest tower, in gold blocks, we have written: HAPPY BIRTHDAY, MUM! I really hope she won't be angry about the three hours.","g":[["secret project","секретный проект"],["block by block","блок за блоком"],["collecting","собирает"],["designing","придумываю, проектирую"],["highest","самой высокой"]],"q":[["Why did Oleg close the window on the screen?",["he didn't want Mum to see the castle","he had finished playing","the game stopped working"],0],["How long have the boys been working on the project?",["since Monday","for three hours","for a month"],0],["What has Igor been doing?",["collecting stone and wood","d
